 ומכאן שם המשפחה. בהלברשטט קיבל זכות ישיבה בזכות נישואיו עם בתו של הפרנס דוד וולף, והיה פרנס הקהילה. על המקומות של המשפחה, ראו מפה בכרטיס של אביו.", "flag": "שנות הלידה והפטירה לא ידועות בוודאות. לפי אאורבך (1866) נפטר בהלברשטט ב-1750. לפי WikiTree נולד בערך ב-1659 ונפטר בערך ב-1725, בלי מקור. אאורבך כתב שהוא בנו של אליה איגר, אבל Meyer (1938) מראה שהם היו אחים, שניהם בניו של מאיר גנסמן. שם אמו לא ידוע.", "src": "W. Meyer, \"Zur Geschichte der Familie Eger-Gans-Gansmann\", Jüdische Familienforschung 14 (1938), גיליונות 48–50, עמ' 889–896, 914–918, 940–943 (Compact Memory, הספרייה של אוניברסיטת פרנקפורט) · B. H. Auerbach, Geschichte der israelitischen Gemeinde Halberstadt (1866), עמ' 33 · WikiTree (Eger-203) · נבדק 23.11.2026 · S. Hock, \"Die Familien Prags\" (1892), עמ' 10, רשומה 7793 (Google Books), נבדק 24.11.2026 · JewishGen, \"Czech: Prague Old Jewish Cemetery\" (מבוסס על הוק ועל המפתח של פופר), נבדק 24.11.2026", "x": [["📜 מה ידוע עליו", "• בשנות ה-70 של המאה ה-17 הוא רשום, יחד עם אחיו אליה ובנימין, בין הסוחרים שבאו \"מאיגר\" ליריד של לייפציג (Freudenthal, \"Leipziger Meßgäste\").\n• 1686: מופיע לראשונה ברשימות היהודים של נסיכות הלברשטט.\n• 1688: ברשימת כל יהודי הלברשטט כתוב שקיבל את זכות הישיבה \"auf Grund seiner Verheiratung mit der Tochter des Halberstädter Vorstehers David Wolf\", כלומר \"בזכות נישואיו עם בתו של פרנס הלברשטט, דוד וולף\".\n• לפי Meyer, הוא זה שדאג לרשום את אחיו הבכור אליה בספר הזיכרון של הלברשטט."]]}, "g": [{"f": "g473", "c": "ספר הוק, עמ' 10: רשומות משפחת איגר בבית הקברות העתיק בפראג, ובהן 7793, מצבת מאיר בן ליב מהלברשטט (1703)"}, {"f": "g477", "c": "מפתח פופר לבית הקברות העתיק בפראג, עמ' 77: משפחת איגר. בשורה \"Maier S.v. Leb a. Halberstadt\": מאיר בן לייב מהלברשטט, חלקה L, מספר 1274"}]}, {"n": "רחל וולף איגר", "y": "–1717", "s": [{"k": "halberstadt", "r": "l", "t": [], "u": 0}], "c": {"n": "רחל וולף איגר (Rachel Wolf)", "rel": "אמו של רבי שמחה בונים איגר · אשתו של ר' יהודה ליב לוין איגר · בתו של דוד וולף", "b": "", "d": "1717", "place": "הלברשטט", "note": "אשתו של ר' יהודה ליב איגר (Levin Meier) מהלברשטט, ואמו של רבי שמחה בונים איגר. בתו של דוד וולף, פרנס הקהילה בהלברשטט. ליב איגר קיבל את זכות הישיבה בהלברשטט בזכות נישואיו איתה.", "flag": "שמה הפרטי \"רחל\" ושנת הפטירה 1717 הם לפי מסירת המשפחה ו-WikiTree בלבד. ברשימה מ-1688 היא נקראת רק \"בתו של דוד וולף\". אף מקור לא כותב במפורש שהיא אמו של שמחה בונים, אבל הנישואים היו לפני 1688, והוא נולד ב-1695.", "src": "W. Meyer, \"Zur Geschichte der Familie Eger-Gans-Gansmann\", Jüdische Familienforschung 14 (1938), גיליון 48, עמ' 896 (Compact Memory, הספרייה של אוניברסיטת פרנקפורט) · נבדק 23.11.2026 · WikiTree (Wolf-8044, Eger-203) · השם ושנת הפטירה: מסירת המשפחה, 3.11.2026", "x": [["📜 ברשימת יהודי הלברשטט, 1688", "ברשימה הרשמית של כל יהודי הלברשטט ומשפחותיהם משנת 1688 (הארכיון הממלכתי הפרוסי, Rep. 33 Nr. 120c), כפי שמביא אותה W. Meyer (1938):\n\"...daß Levin Meier dort das Schutzrecht erworben hat auf Grund seiner Verheiratung mit der Tochter des Halberstädter Vorstehers David Wolf.\"\nתרגום: \"...ש-Levin Meier [ליב איגר] קיבל שם את זכות הישיבה בזכות נישואיו עם בתו של פרנס הלברשטט, דוד וולף.\"\nליב איגר מופיע לראשונה ברשימות הלברשטט ב-1686."]]}, "g": []}, {"n": "ר' מרדכי מרגליות שלזינגר", "y": "1615–1683", "s": [{"k": "klosterneuburg", "r": "d", "t": ["1683 (תמ\"ג), נרצח בקלוסטרנויבורג (Klosterneuburg)"], "u": 0}], "c": {"n": "ר' מרדכי מרגליות (יפה) שלזינגר, \"הנרצח\"", "rel": "אביו של ר' אשר אנשיל גינז שלזינגר · סבו של ר' שמואל גינז שלזינגר", "b": "1615", "d": "1683 (תמ\"ג), נרצח בקלוסטרנויבורג (Klosterneuburg)", "place": "", "note": "בנו של ר' משה מרגליות שלזינגר. לפעמים נקרא מרגליות ולפעמים יפה, ונודע גם בשם מרכס שלזינגר (Marx Schlesinger). נרצח בשנת תמ\"ג בידי חיילים פולנים, בקלוסטרנויבורג (Klosterneuburg), בדרכו לניקלסבורג. המשפחה מתייחסת לרבי יהודה ליב מרגליות, ומשם לבעל הלבוש, רבי מרדכי יפה.", "flag": "השנים מ-Geni, עץ של גולשים. הקשר לר' אשר אנשיל מבלוג גנאלוגי שמסתמך על ספר משפחתי; את הספר עצמו לא ראינו.", "src": "בלוג \"תולדות ושורשים\" (\"רבי יהודה לייב מרגליות בעל הפרי תבואה\"), לפי \"מילי דאבות\" של ר' שמואל יפה שלזינגר · Geni (השנים) · מקום הרצח ונסיבותיו: מסירת המשפחה, 3.11.2026", "x": [["👩‍🦱 אשתו", "מלה, לבית סג\"ל הלוי. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "ר' אשר אנשיל גינז שלזינגר מאייזנשטט, לפי ספר היחוס \"מילי דאבות\". מופיע בכרטיס נפרד"]]}, "g": []}, {"n": "מלה מרגליות שלזינגר", "y": "1617–1650", "s": [{"k": "wien", "r": "ld", "t": ["ר\"ח אלול ת\"י (31.8.1650), וינה"], "u": 0}], "c": {"n": "מלה (Mella) מרגליות שלזינגר, לבית סג\"ל הלוי", "rel": "אמו של ר' אשר אנשיל גינז שלזינגר · אשתו של ר' מרדכי מרגליות", "b": "בערך 1617", "d": "ר\"ח אלול ת\"י (31.8.1650), וינה", "place": "וינה", "note": "אשתו של ר' מרדכי מרגליות (יפה) שלזינגר, \"הנרצח\", ובתו של ר' יעקב סג\"ל הלוי. נפטרה ביום רביעי, ראש חודש אלול ת\"י (31.8.1650), בגיל 33, ונקברה בבית הקברות היהודי העתיק בווינה (ווכשטיין, מצבה 381).", "flag": "לפי המצבה נפטרה בגיל 33, כלומר נולדה בערך ב-1617, וזה מתאים ל-Geni. מכיוון שנפטרה ב-1650, 84 שנה לפני פטירת ר' אשר אנשיל (1734), ייתכן שהוא בן מאשה אחרת של ר' מרדכי, או שאחת השנים שגויה.", "src": "B. Wachstein, \"Die Inschriften des alten Judenfriedhofes in Wien\", כרך 1 (1912), מצבה 381, עמ' 288–289 · מסירת המשפחה, 3.11.2026 · 9.11.2026", "x": [["🪦 המצבה בווינה (ווכשטיין, מצבה 381)", "\"פ\"ט וצפונה האשה חשובה והגונה, כל מעשיה עשת באמונה, ידיה פרשה לעני במתנה, הלכה לעולמה בשלשים ושלש שנה, מ' מעלא בת הר\"ר יעקב סג\"ל ז\"ל, אשת הנעלה הר\"ר מרדכי מרגליות. תנצב\"ה.\"\nווכשטיין מוסיף שמרדכי מרגליות הוא \"מרכס שלזינגר הידוע\", ראש הקהילה בזמן הגירוש. ברישום הפטירה של העירייה כתוב בטעות שהיא נקראה בלה ושהייתה בת 26, אבל על המצבה כתוב 33."]]}, "g": [{"f": "g198", "c": "מצבת מלה, בת יעקב הלוי, אשת מרדכי מרגליות · פרנקפורט, מס' 381"}]}, {"n": "ר' משה שמעון, סופר ונאמן", "y": "", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט (כנראה)"], "u": 1}], "c": {"n": "ר' משה שמעון, הסופר והנאמן של קהילת פרנקפורט", "rel": "אביו של ר' משה בן משה שמעון · סבו של ר' שמעון \"מן הנשר הזהב\"", "b": "", "d": "", "place": "פרנקפורט (כנראה)", "note": "אביו של ר' משה, הסופר והנאמן של פרנקפורט (נפטר 13.11.1687). ידוע רק משמו של בנו: על מצבת הבן (הורוביץ 1213) כתוב \"כהר\"ר משה בר משה שמעון סופר ונאמן\", ובכרטיס הרישום של הבן (אלה תולדות) כתוב: \"אביו: הסופר והנאמן משה שמעון\". כלומר גם הוא היה סופר ונאמן בקהילה.\nאין לו כרטיס רישום משלו בכרטיסי \"אלה תולדות\" (נבדקו השנים 1620–1709), והמצבה שלו לא שרדה (epidat). שם אשתו ושנות חייו לא ידועים.", "flag": "שנות חייו ושם אשתו לא ידועים. בכרטיס הרישום של כלתו פרומט הבן נקרא \"משה בן שמעון\", כנראה בקיצור. נבדק ב-24.11.2026: שמות הוריו לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "מצבת בנו: M. Horovitz (1901), עמ' 122–123, כתובת 1213 · כרטיס הרישום של בנו \"sōfēr Mōše, 13.11.1687\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1680–1689, עמ' 196 · נבדק 24.11.2026: אלה תולדות 1620–1709, epidat (פרנקפורט 1600–1720)", "x": [["📛 מי זה מי", "👴 משה שמעון: זה השם שלו, שני שמות יחד, כמו \"יוסף חיים\". היה סופר ונאמן בפרנקפורט.\n⬇️ הבן שלו:\n👨 משה: נפטר ב-1687. על המצבה שלו כתוב \"משה בר משה שמעון\". \"בר\" פירושו \"בן\", כלומר: משה, הבן של משה שמעון.\n⬇️ הבן שלו:\n👦 שמעון \"מן הנשר הזהב\": נפטר ב-1730.\n\nבכרטיס הרישום של פרומט, אשתו של משה, הוא נקרא בקיצור \"משה בן שמעון\".\n\n❓ איך הבן נקרא משה, כמו אביו? אצל יהודי אשכנז לא נותנים לתינוק את השם של אב חי. ההסבר הסביר (השערה, לא כתוב במקורות): משה שמעון נפטר לפני שבנו נולד, ולכן התינוק נקרא על שמו. אולי גם הנכד נקרא שמעון כדי להמשיך את החלק השני של השם. תאריך הפטירה של משה שמעון לא ידוע, ולכן אי אפשר לבדוק את זה."]]}, "g": []}, {"n": "משה סג\"ל", "y": "", "s": [{"k": "metz", "r": "l", "t": ["מץ (Metz)"], "u": 0}], "c": {"n": "משה סג\"ל, ממץ", "rel": "אביה של פרומט · סבו של ר' שמעון \"מן הנשר הזהב\"", "b": "", "d": "", "place": "מץ (Metz)", "note": "אביהן של פרומט ומינדלה. בכרטיסי הרישום של שתי בנותיו בפרנקפורט הוא רשום כ\"משה סג\"ל, במץ\", ועל המצבות שלהן כתוב \"בת משה סג\"ל ממיץ\". סג\"ל הם ראשי התיבות של \"סגן לוויה\", כינוי של משפחות לויים.", "flag": "שנות חייו לא ידועות. מלבד מסירת המשפחה הוא מופיע רק באוסף דופארק, בלי מקור. נבדק ב-19.11.2026: שמות הוריו לא נמצאו, ולכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום של בתו \"Frummet Leiter, dann Frau d. Mose sofer, 22.6.1691\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1690–1699, עמ' 49 · כרטיס הרישום של בתו \"Mindle aus Metz, 29.4.1696\": שם, עמ' 212 · המצבות: M. Horovitz (1901), עמ' 127, כתובת 1262, ועמ' 138, כתובת 1366 · מסירת המשפחה, 3.11.2026 · אוסף דופארק (Alexander Duparc Collection, dutchjewry.org)", "x": [["👨‍👩‍👧 בנותיו", "• פרומט, אשת הסופר ר' משה בן שמעון. נפטרה ב-22.6.1691 (כ\"ה בסיון תנ\"א). על המצבה שלה (הורוביץ 1262): \"מרת פרומט בת משה סג\"ל ממיץ\". מופיעה בכרטיס נפרד\n• מינדלה ממץ. נפטרה ב-29.4.1696 (כ\"ז בניסן תנ\"ו). כנראה לא נישאה (העורך כתב עם סימן שאלה). על המצבה שלה (הורוביץ 1366): \"מינדלה בת משה סג\"ל מק\"ק מיץ\". בפנקס הקבורה היא \"קרובת משפחה של שמעון סופר\", כלומר דודתו. נקברה ליד יוטה, אשת ליב לייטר."], ["🔎 מה לא נמצא", "• שנות חייו, שם אשתו ושמות הוריו.\n• מקור עליו מקהילת מץ. הארכיון של הקהילה וספר הזיכרון שלה לא סרוקים בגישה פתוחה."]]}, "g": [{"f": "g433", "c": "כרטיס הרישום של מינדלה ממץ, בת משה סג\"ל, נפטרה 29.4.1696"}, {"f": "g434", "c": "ספר הורוביץ, עמ' 138: כתובת 1366, מצבת מינדלה בת משה סג\"ל מק\"ק מיץ (1696)"}, {"f": "g431", "c": "כרטיס הרישום של פרומט, אשת יוזל לייטר ואחר כך אשת הסופר משה, בת משה סג\"ל ממץ, נפטרה 22.6.1691"}, {"f": "g432", "c": "ספר הורוביץ, עמ' 127: כתובת 1262, מצבת פרומט אשת ר' משה סופר, בת משה סג\"ל ממיץ (1691)"}]}, {"n": "ר' יצחק לייטרסדורף", "y": "~1673–1748", "s": [{"k": "wien", "r": "l", "t": ["וינה (מ-1719)"], "u": 0}], "c": {"n": "ר' יצחק לייטרסדורף (Isaac Leidesdorfer), וינה", "rel": "אביו של שמואל לייטרסדורף · סבה של יהודית ייטל", "b": "בערך 1673", "d": "1748", "place": "וינה (מ-1719)", "note": "מייסד הענף הוותיק של משפחת לייטרסדורף בווינה. ספק של הצבא וסוכן של שמואל אופנהיימר. קיבל רשות לגור בווינה ב-1719, והשלטונות נעזרו בו הרבה כמתורגמן.", "flag": "שנת הלידה משוערת, ממסירת המשפחה. על שאר הפרטים יש מקור אחד בלבד.", "src": "Encyclopaedia Judaica, \"Leidesdorfer\" (Henry Wasserman) · שנת הלידה: מסירת המשפחה, 3.11.2026 · M. Grunwald, \"Samuel Oppenheimer und sein Kreis\" (וינה, 1913), עמ' 215–216, ונספח עמ' 301 ואילך", "x": [["📖 מהספר של גרונוולד", "📚 M. Grunwald, \"Samuel Oppenheimer und sein Kreis\" (וינה, 1913), עמ' 215–216\n• יצחק לייטרסדורפר \"מאופן\" (Ofen, היום בודה). הגיע לווינה דרך פרשבורג.\n• עבד אצל שמואל אופנהיימר, ונהנה מזכות הישיבה של משפחת שלזינגר.\n• קנה ברזל ישן במחסנים באוסטריה ובמורביה. ב-1701 סיפק סירות וחבלים למחסן המזון בבאיה (Baja). ב-1706, עם יעקב מרקוס, סיפק בשר ומזון לבית החולים הצבאי באופן בסך 7,182 פלורין.\n• 1719: קיבל לו ולמשפחתו רשות לגור בווינה לעשר שנים.\n• 1720: קיבל את המזון והציוד של בית החולים הצבאי בבלגרד.\n• 1724: כבר מדובר על מצבו הדחוק. נפטר עני ב-1748.\n💍 אשתו: בלומה. נפטרה ב-30.12.1738 (לפי ארכיון המרשלות של החצר בווינה).\n👨‍👩‍👧 בניו: שמואל וליב (לב). שניהם כבר היו נשואים ב-1738.\n📝 שם המשפחה בא מהעיירה לייטרסדורף (Leidersdorf) ליד אמברג שבבוואריה. לפי האנציקלופדיה יודאיקה, הענף הוותיק של המשפחה בא מאייזנשטט."]]}, "g": []}, {"n": "הנל לייטר", "y": "–1727", "s": [{"k": "frankfurt", "r": "ld", "t": ["2.10.1727 (י\"ז בתשרי תפ\"ח), פרנקפורט"], "u": 0}], "c": {"n": "הנל (Hennel) לייטר, לבית דויץ", "rel": "אשתו של ר' דוד לייטר · אמה של גיטל לייטר חזן", "b": "", "d": "2.10.1727 (י\"ז בתשרי תפ\"ח), פרנקפורט", "place": "פרנקפורט", "note": "בתם של ברמן דויץ סג\"ל ושל מינקלן בת זליגמן בינגן. אשתו של ר' דוד לייטר, ואחרי מותו ב-1692 חיה כאלמנה עוד 35 שנה. נפטרה \"הזקנה\" ב-2.10.1727 ונקברה ליד אביה. ילדיה של דוד רשומים בכרטיס שלו.", "flag": "שנת הלידה לא ידועה. שהיא אמה של גיטל כתוב במפורש בכרטיס הרישום של גיטל: \"אמה: הנל בת ברמן דויץ סג\"ל, נפטרה 2.10.1727\" (נבדק 11.11.2026).", "src": "כרטיס הרישום \"Hennel Leiter, 2.10.1727\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1720–1729, עמ' 319 · כרטיס הרישום \"Dowid Leiter, 13.5.1692\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1690–1699, עמ' 98", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Hennel Leiter\n📅 נפטרה: 2.10.1727 (י\"ז בתשרי תפ\"ח)\n⚰️ נקברה ליד אביה, ברמן דויץ\n🏠 בית: המנורה (Zur Leuchte)\n👨 אביה: ברמן דויץ מבית הכבש (Zum Lamm), בן משה-יוסף סג\"ל. נפטר 2.5.1684.\n👩 אמה: מינקלן בת זליגמן בינגן. נפטרה באוגוסט 1692 (היום לא קריא)."]]}, "g": [{"f": "g251", "c": "כרטיס הרישום של הנל לייטר מפרנקפורט, נפטרה 2.10.1727"}, {"f": "g247", "c": "כרטיס הרישום של ר' דוד לייטר מפרנקפורט, נפטר 13.5.1692"}, {"f": "g252", "c": "כרטיס הרישום של ברמן דויץ מפרנקפורט, נפטר 2.5.1684"}, {"f": "g253", "c": "כרטיס הרישום של מינקלן דויץ מפרנקפורט, נפטרה 26.8.1692"}]}, {"n": "ר' דוד לייטר", "y": "–1692", "s": [{"k": "frankfurt", "r": "ld", "t": ["13.5.1692 (כ\"ז או כ\"ח באייר תנ\"ב), פרנקפורט"], "u": 1}], "c": {"n": "ר' דוד בר אלחנן לייטר", "rel": "אביה של גיטל לייטר חזן · בנו של ר' אלחנן לייטר", "b": "", "d": "13.5.1692 (כ\"ז או כ\"ח באייר תנ\"ב), פרנקפורט", "place": "פרנקפורט", "note": "אביה של גיטל לייטר חזן, ובנו של ר' אלחנן לייטר. נפטר ונקבר ביום כ\"ח באייר תנ\"ב, 14.5.1692 (בלוח הגרגוריאני; 4.5.1692 בלוח היוליאני, שנהג אז בפרנקפורט), בבית הקברות העתיק בפרנקפורט. במצבה הוא מתואר כאדם שהשכים והעריב לבית התפילה. על המצבה כתוב \"בר אלחנן ז\"ל\", כלומר אביו כבר לא היה בחיים ב-1692. בהשערה ברורה, \"הבחור ר' אלחנן לייטר, אלחנן בר דוד\", שנפטר צעיר ב-13 בכסלו ת\"ם (1679, הורוביץ כתובת 1097), היה בנו, ונקרא על שם סבו.", "flag": "שנת הלידה לא ידועה. שם המשפחה כתוב על המצבה בשיבוש, \"לאטיך צור לייכט\", והורוביץ מסווג אותה במפתח תחת Leiter. הזיהוי עם ר' דוד שבעץ נשען על השם \"דוד בר אלחנן\" ועל שם המשפחה. אי התאמה: במצבה כתוב \"יום ג'\", אבל כ\"ח באייר לעולם לא חל ביום שלישי. ב-1692 הוא חל ביום רביעי. אולי מדובר בטעות בהעתקה או בחריטה.", "src": "מסירת המשפחה, 9.11.2026 · נוסח המצבה: M. Horovitz (1901), עמ' 131, כתובת 1299 · מפתח השמות שם, עמ' 720, ערך Leiter · כרטיס הרישום \"Dowid Leiter, 13.5.1692\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1690–1699, עמ' 98", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Dowid Leiter\n📅 נפטר: 13.5.1692 (כ\"ז באייר תנ\"ב, ובתיקון כ\"ח)\n🪦 המצבה: הורוביץ 1299\n⚰️ נקבר ליד אביו, אלחנן לייטר\n🏠 בית: המנורה (Zur Leuchte)\n👩 אמו: אסתר\n💍 אשתו: הנל"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nמאיר לייטר, נפטר 27.1.1720\nיוזל לייטר, גר בבית המנורה (Zur Leuchte) ואחר כך בבית המנורה הכסופה (Zur silbernen Leuchte), נפטר 28.6.1752\nאלחנן, נפטר לא נשוי ב-6.12.1688\nגוטלה (גיטל), אשת החזן רפאל, נפטרה 11.12.1738. מופיעה בכרטיס נפרד"], ["נוסח המצבה (הורוביץ, כתובת 1299, אבן 1111)", "היקר כמ' דוד לאטיך צור לייכט. האבן הזאת שמתי עלו ראש הנעלה שהשכים והעריב לבית התפילה, גויתו מוטל בקבר ונשמתו למעלה עלה, כמר דוד בר אלחנן ז\"ל, נפ' ונק' ביום ג' כ\"ח אייר תנ\"ב לפ\"ק. תנצב\"ה."]]}, "g": [{"f": "g247", "c": "כרטיס הרישום של ר' דוד לייטר מפרנקפורט, נפטר 13.5.1692"}, {"f": "g215", "c": "ספר הורוביץ, עמ' 131: כתובת 1299, מצבת דוד בר אלחנן לייטר (1692)"}]}, {"n": "רישא ברודא", "y": "–~1715", "s": [{"k": "hamburg", "r": "l", "t": [], "u": 0}], "c": {"n": "רישא ברודא, בת ר' ישראל פירסט", "rel": "אמה של שרה גינז שלזינגר · אשתו של ר' משה ברודא", "b": "", "d": "בערך 1715", "place": "המבורג", "note": "בתו של ר' ישראל פירסט מהמבורג. נישאה לר' משה ברודא בהמבורג.", "flag": "ויקיפדיה לא אומרת במפורש שהיא אמה של שרה. ב-Geni היא רשומה כ-Shoshana Rachel Roischen.", "src": "ויקיפדיה העברית (\"משה ברודא\") · Geni (Shoshana Rachel Roischen)", "x": []}, "g": [{"f": "g201", "c": "מצבת רישא ברודא"}]}, {"n": "רבי משה ברודא", "y": "1675–1741", "s": [{"k": "hanau", "r": "l", "t": ["האנאו (1704)"], "u": 0}, {"k": "bamberg", "r": "l", "t": ["במברג (1718)"], "u": 0}, {"k": "worms", "r": "ld", "t": ["וורמס (1732)", "4.12.1741 (כ\"ו בכסלו תק\"ב), וורמס"], "u": 0}], "c": {"n": "רבי משה ברודא, בעל \"אהל משה\"", "rel": "אביה של שרה גינז שלזינגר · אבי-סבו של רבי עקיבא איגר מפוזנא", "b": "1675 (תל\"ו)", "d": "4.12.1741 (כ\"ו בכסלו תק\"ב), וורמס", "place": "האנאו (1704) ← במברג (1718) ← וורמס (1732)", "note": "בנו של רבי אברהם ברודא. רב ואב בית דין בהאנאו, במברג (13 שנה) ו-וורמס (עשר שנים, עד מותו). הוציא לאור את ספר אביו \"אשל אברהם\" עם הגהותיו, \"אהל משה\". קבור בבית הקברות היהודי העתיק בוורמס. אשתו רישא הייתה בתו של ר' ישראל פירסט מהמבורג.", "flag": "שנת הלידה: 1675 בוויקיפדיה, 1674 ב-Encyclopaedia Judaica, בערך 1680 ב-Geni. ב-Jewish Encyclopedia שנת הפטירה היא 1742. לפי המצבה, יום הפטירה הוא כ\"ו בכסלו תק\"ב (4.12.1741).", "src": "ויקיפדיה העברית (\"משה ברודא\") · המכלול · Encyclopaedia Judaica · מצבתו בבית העלמין היהודי בוורמס: מאגר המצבות epidat (Steinheim-Institut), wrm-1241, נבדק 21.11.2026", "x": [["🪦 המצבה בוורמס", "• המצבה נמצאת בבית הקברות היהודי העתיק בוורמס (\"החול הקדוש\", Heiliger Sand). מספרה במאגר המצבות epidat הוא wrm-1241.\n• בראש המצבה כתוב: \"רבינו מהור\"ר משה בן הגאון מהור\"ר אברהם ברודא\".\n• מהכתובת: \"פה אמו\"ה אב\"ד מהור\"ר משה ברודא זצ\"ל… בהיותו אב\"ד בק\"ק הענה (האנאו) והיה להם למשען ומשענה, ומשם נתקבל לאב\"ד בק\"ק בומבורג (במברג), ומשם יפוצו מעיינותיו… בן… הגאון החריף המפורסם מהור\"ר אברהם ברודא אב\"ד דק\"ק פ\"פ (פרנקפורט), נפטר ונקבר ביום ב' כ\"ו בחדש כסליו תק\"ב לפ\"ק\".\n• לפי המצבה הוא נפטר ונקבר ביום שני, כ\"ו בכסלו תק\"ב (4.12.1741)."]]}, "g": [{"f": "g199", "c": "עמוד מהספר \"משפחת ברודא\", עמ' 27: הגאון ר' משה ברודא"}, {"f": "g200", "c": "מצבת ר' משה ברודא, וורמס"}]}, {"n": "רבקה", "y": "–1715", "s": [{"k": "frankfurt", "r": "ld", "t": ["5.5.1715 (ב' באייר תע\"ה), פרנקפורט"], "u": 0}], "c": {"n": "רבקה, אשת ר' שלמה זלמן חזן", "rel": "אשתו של ר' שלמה זלמן חזן · אמו של ר' יעקב רפאל חזן", "b": "", "d": "5.5.1715 (ב' באייר תע\"ה), פרנקפורט", "place": "פרנקפורט", "note": "אשתו של ר' שלמה זלמן חזן, ואמו של ר' יעקב רפאל חזן. נפטרה ונקברה ביום ראשון, ב' באייר תע\"ה, 5.5.1715, בבית הקברות העתיק בפרנקפורט. במצבתה בעלה כבר מכונה \"ז\"ל\". האבן שלה (868) קרובה לאבנים של בנה יעקב רפאל (871) ושל בעלה זלמן (872).", "flag": "שנת הלידה ושם אביה לא ידועים. המצבה לא מזכירה את שם אביה. נבדק ב-24.11.2026: שמות הוריה לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "נוסח המצבה: M. Horovitz (1901), עמ' 172, כתובת 1660 · מפתח השמות שם, עמ' 701, ערך Chasan · Geni (נתנאל פריש ואחרים), נבדק 10.11.2026 · כרטיס הרישום \"Rifke, Frau des hazzan Zalman, 5.5.1715\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1710–1719, עמ' 183", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Rifke, אשת החזן זלמן\n📅 נפטרה: 5.5.1715 (ב' באייר תע\"ה)\n🪦 המצבה: הורוביץ 1660\n⚰️ נקברה ליד בנה, החזן רפאל"], ["נוסח המצבה (הורוביץ, כתובת 1660, אבן 868)", "רבקה אשת מהור' זלמן חזן ז\"ל. פה שכובה וטמונה אשה חשובה והגונה, שבחה מי יוכל להטנה, ובכל עת ועונה עשתה תפילתה בכוונה. נפ' ונק' ביום א' ב' אייר תע\"ה לפ\"ק. תנצב\"ה."]]}, "g": [{"f": "g246", "c": "כרטיס הרישום של רבקה, אשת החזן זלמן, מפרנקפורט, נפטרה 5.5.1715"}, {"f": "g221", "c": "ספר הורוביץ, עמ' 172: כתובת 1660, מצבת רבקה אשת ר' זלמן חזן (1715)"}]}, {"n": "ר' שלמה זלמן חזן", "y": "–1704", "s": [{"k": "frankfurt", "r": "l", "t": [], "u": 0}], "c": {"n": "ר' יצחק ישראל שניאור שלמה בן יקותיאל, הנקרא זלמן חזן, המשורר, מפרנקפורט", "rel": "אביו של ר' יעקב רפאל חזן · אבי-סבו של ר' אלחנן חזן · \"זקן זקנו\" של החתם סופר", "b": "", "d": "1704", "place": "פרנקפורט", "note": "חזן (\"המשורר הגדול האלוף והקצין\") בפרנקפורט. שמו המלא לפי כרטיס הרישום: יצחק ישראל שניאור שלמה, בן הר\"ר יקותיאל. על המצבה עצמה כתוב רק \"מהור\"ר זלמן חזן\". לפי כרטיס הרישום מפרנקפורט הוא נקרא \"זלמן חזן-האן\" (Zalman hazz'n-Hahn), בהשערה ברורה על שם בית התרנגול (Zum Hahn), היה חזן בפרנקפורט יותר מ-30 שנה, ושימש גם ראש המשוררים, כלומר מנהל מקהלת בית הכנסת. נפטר ב-28.2.1704, כ\"ג באדר א' תס\"ד, ונקבר בבית הקברות העתיק בפרנקפורט. האבן שלו (872) עומדת ליד האבנים של בנו יעקב רפאל (871) ושל אשתו רבקה (868).", "flag": "שנת הלידה לא ידועה. תאריך הפטירה 28.2.1704 לפי כרטיס הרישום ולפי קריאת הורוביץ (תס\"ד). ג'ני רושם 14.3.1708, וכנראה טועה. על האבן כתוב \"יום ד'\", אבל כ\"ג באדר א' תס\"ד חל ביום חמישי. עורך כרטיס הרישום מעיר שבשתי המצבות הוא לא נקרא חזן ממש, ושייתכן ש\"חזן\" היה אצלו כינוי של כבוד, ושהוא שימש בעיקר מנהל המקהלה ורק לפעמים גם חזן. חלק מהקריאות בכרטיס הרישום (כמו Hahn, Zum Hecht, Zum kalten Bad) הן בקריאה שלי של כתב היד, ובהשערה ברורה. קריאת שם הבית Hahn בכתב היד היא שלי, בהשערה ברורה, וגם אם היא נכונה לא ידוע באיזה משני בתי התרנגול מדובר.", "src": "כרטיס הרישום מפרנקפורט, \"Zalman hazz'n-Hahn, 28.2.1704\" (נמסר על ידי המשפחה, 10.11.2026) · נוסח המצבה: M. Horovitz (1901), עמ' 152, כתובת 1485 · מצבת בנו: שם, עמ' 167, כתובת 1616 · Geni (נתנאל פריש ואחרים), נבדק 10.11.2026 · על החזנים בפרנקפורט: המוזיאון היהודי פרנקפורט (METAhub, \"Cantor/ Chassan\") · על בתי התרנגול ברחוב היהודים: המוזיאון היהודי פרנקפורט (METAhub, \"House Roter Hahn\" ו-\"House Goldener Hahn and Fuchs\"), נבדק 19.11.2026 · כרטיסי הרישום של ילדיו: \"Hajjem, Sohn d. Zalman, 29.5.1721\" (אלה תולדות, קובץ 1720–1729, עמ' 72) ו-\"Ester Hecht, 2.10.1730\" (קובץ 1730–1739, עמ' 39), נבדק 24.11.2026", "x": [["כרטיס הרישום מפרנקפורט", "נפטר ב-28.2.1704. השם בראש הכרטיס: Zalman hazz'n-Hahn. לפי הכרטיס: שמו המלא יצחק ישראל שניאור שלמה בן יקותיאל, ונפטר בכ\"ג באדר תס\"ד (הורוביץ 1485). בפנקס הקהילה נכתב שהיה חזן בפרנקפורט יותר מ-30 שנה וגם ראש המשוררים (מנהל מקהלת בית הכנסת). אביו: יקותיאל."], ["👩‍🦱 אשתו", "רבקה. נפטרה ב-5.5.1715. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nהמשורר ר' רפאל (יעקב רפאל) חזן. נפטר ב-16.10.1712. מופיע בכרטיס נפרד\nאסתר. נישאה לפני 1697 לגומפרכט הכט בן מנקה סג\"ל, מבית הזאבן (Zum Hecht), שנפטר ב-21.11.1732. נפטרה ב-2.10.1730\nברנדל, אשת אהרן לוריא מבית המרחץ הקר (Zum kalten Bad). נפטרה ב-2.2.1743\nבת, אשת החזן משה בפיורדא. בתם הייל נפטרה ב-27.10.1729\nחיים. נפטר בג' בסיון תפ\"א (29.5.1721), כנראה לא נשוי"], ["נוסח המצבה (הורוביץ, כתובת 1485, אבן 872)", "המשורר הגדול האלוף והקצין מהור\"ר זלמן חזן נפטר' ונק' יום ד' כ\"ג אדר תס\"ד לפ\"ק. ציון הלא תשאלי דבר מי לך, פה שחצב קבר פה ספון וטמון איש צדיק ונבר, הי' מלא חכמה ותבונה, ונהג כל ימיו בחסידות ובאמונה, שבחו הטוב מי יוכל למנה, כל מעשיו היו לשם שוכן מעונה, מהור\"ר יצחק ישראל שניאור שלמה בהר\"ר יקותיאל ז\"ל. תנצב\"ה."], ["🏛️ החזנים ברחוב היהודים בפרנקפורט", "החזן הוביל את התפילות בבית הכנסת. עם הזמן התפקיד הפך למשרה בשכר של הקהילה, תפקיד של עובד קהילה בדרג נמוך יחסית, ולא של רב או פרנס.\nבסוף המאה ה-17 גרו ברחוב היהודים בפרנקפורט חמישה חזנים. שמותיהם לא ידועים, ולא ידוע אם ר' זלמן היה אחד מהם.\nב-1628 קבעה הקהילה לחזנים כללי התנהגות. בין השאר נדרשו להימנע מחברת נשים ומכל המשחקים, חוץ משחמט ודמקה. מהחזן ציפו לצניעות ולכובד ראש, כי הוא ייצג את הקהילה בתפילה."], ["🏠 הבית", "בכותרת כרטיס הרישום מופיע אחרי שמו גם שם הבית: Hahn, כלומר בית התרנגול (Zum Hahn). ברחוב היהודים בפרנקפורט נהגו לזהות אדם לפי הבית שבו גר.\n\nברחוב היהודים היו שני בתים בשם הזה:\nהתרנגול המוזהב (Zum goldenen Hahn), מספר 78, בניין אחורי מאחורי בית השועל (Zum Fuchs).\nהתרנגול האדום (Zum roten Hahn), מספר 175, שנוצר בסביבות 1542 מחלוקת בית הוורד האדום (Zur roten Rose).\n\nהכרטיס לא אומר באיזה מהשניים. שני הבתים נשרפו בשרפה הגדולה של 1711."]]}, "g": [{"f": "g220", "c": "ספר הורוביץ, עמ' 152: כתובת 1485, מצבת ר' שלמה זלמן חזן"}, {"f": "g222", "c": "כרטיס הרישום של זלמן חזן-האן מפרנקפורט (נפטר 28.2.1704)"}]}, {"n": "ר' ישראל בינגן", "y": "–1683", "s": [{"k": "frankfurt", "r": "ld", "t": ["4.12.1683 (ט\"ז בכסלו תמ\"ד), פרנקפורט"], "u": 0}], "c": {"n": "ר' ישראל בינגן (בינג), מבית הבקבוק (⁦Zur Flasche⁩)", "rel": "אביו של ר' שלמה זלמן בינגן · סבה של הינדלה", "b": "", "d": "4.12.1683 (ט\"ז בכסלו תמ\"ד), פרנקפורט", "place": "פרנקפורט", "note": "ישראל בר נפתלי הירץ בינג. גר בפרנקפורט בבית הבקבוק (Zur Flasche). נפטר בשבת ונקבר ביום ראשון, י\"ז בכסלו תמ\"ד, 5.12.1683, בבית הקברות העתיק בפרנקפורט. במצבתו הוא נקרא \"האלוף כהר\"ר ישראל ז\"ל בינג\" ו\"הצדיק\". לפי ג'ני שם אשתו רויזלה (Rösle).\nשתי משפחות בינגן בעץ אינן קשורות זו לזו. לפי עורך כרטיס הרישום, שלמה אטלינגר, לאביו של ר' ישראל כנראה אין קשר למשפחות בינגן בפרנקפורט, ובהן משפחת הר\"ר מאיר בינגן מבית הסולם (Zur Leiter), כי ר' ישראל גם לא נקבר לידן. לפי העורך, האב כנראה בא מהעיר בינגן (Bingen), ומכאן השם.", "flag": "שנת הלידה לא ידועה. לפי כרטיס הרישום אביו, הירץ, נפטר לפני 1663, ולכן הוא לא \"הירץ בר זעליגמן בינג\" שנפטר ב-1683, כפי ששוער כאן קודם. לפי עורך הכרטיס, לאביו כנראה אין קשר למשפחות בינגן בפרנקפורט, ובהן משפחת בינגן לייטר מבית הסולם (Zur Leiter). שם אשתו לפי ג'ני, רויזלה, מתאים לאשתו השנייה בכרטיס, רייזל בת הירץ אופנהיים.", "src": "A. Dietz, Stammbuch der Frankfurter Juden (1907), עמ' 36 (Bingo X), נבדק 23.11.2026 · כרטיס הרישום של בנו, \"Zalman Bingen, 7.4.1725\" (אלה תולדות, דרך Geni): \"Jisrol Bingen Zur Flasche b' Herts\", נפטר 1683 · נוסח המצבה: M. Horovitz (1901), עמ' 116, כתובת 1144 · Geni: Israel Bingen, Zur Flasche (Randy Schoenberg), נבדק 10.11.2026 · כרטיס הרישום \"Jisrol Bingen, 4.12.1683\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1680–1689, עמ' 83", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Jisrol Bingen\n📅 נפטר: 4.12.1683 (ט\"ז בכסלו תמ\"ד)\n🪦 המצבה: הורוביץ 1144\n⚰️ נקבר ליד גיטלה, אשת הירץ אופנהיים. בפנקס אחד נקרא \"ישראל בינג צור רוטן פלעש\", כלומר מבית הבקבוק האדום (Zur roten Flasche).\n📜 הצטרף לחברה קדישא בשנת תכ\"ד (1663/64)\n🏠 בית: הבקבוק (Zur Flasche), ולפני כן כנראה היעלה (Zur Gemse)\n👨 אביו: הירץ, כנראה מבינגן.\n📝 הערת העורך: כשהצטרף לחברה קדישא ב-1663/64 אביו כבר לא היה בחיים. לכן אביו לא יכול להיות אחד משני הירץ בינג שנפטרו ב-14.6.1683 וב-14.2.1686, וגם לא הירץ בן מאיר (נפטר בערך ב-1618) או הירץ בן זיסקינד (נפטר בערך ב-1615). לדעת העורך, לאביו כנראה אין קשר למשפחות בינגן בפרנקפורט, כי ישראל גם לא נקבר לידן."], ["👩‍🦱 נשותיו", "שפרינץ, בת יוזל רינדסקופף. נישאו ב-28.7.1657. נפטרה 14.2.1659\nרייזל, בת הירץ אופנהיים. נפטרה 20.1.1719, 35 שנה אחרי בעלה. לפי ג'ני שמה רויזלה (Rösle), והיא אמו של זלמן. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום. הכרטיס לא מציין מי מהנשים היא אמו של כל ילד. לפי ג'ני זלמן הוא בנה של רייזל.\nזלמן (ר' שלמה זלמן) בינגן, מבית התוכי (Zum Papagei). נפטר 7.4.1725. מופיע בכרטיס נפרד\nגוטלה, אשת הדיין יואל פוקס מבית ודל (Zum Wedel). נפטרה 25.12.1730\nרעכלין, אשת מאיר ביקרט מבית הבקבוק (Zur Flasche). נפטרה 17.11.1697\nפרומט, אשת אברהם מבית הזאבן (Zum Hecht). נפטרה 21.10.1701\nיאכט, אשת ליימה מבית תרנגול מזג האוויר (Zum Wetterhahn). נפטרה 22.3.1709\nטרצה, אשת מנדלה קנובלאוך מבית התפוח המוזהב (Zum goldenen Apfel). נפטרה 30.11.1732"], ["📚 בספר המשפחות של דיץ (1907)", "A. Dietz, Stammbuch der Frankfurter Juden, עמ' 36, ערך \"Bingo, auch Bing (X)\":\n\"eingewandert mit Israel von Bingen, welcher am 28. Juli 1657 bei seiner Verheiratung mit Sprintz, Tochter des Josef zum Kindskopf, in die Stättigkeit aufgenommen worden ist\"\nתרגום: \"באה [לפרנקפורט] עם ישראל מבינגן, שהתקבל לזכות הישיבה ב-28 ביולי 1657, כשנשא לאישה את שפרינץ, בת יוזף מבית ראש התינוק.\"\nדיץ כותב שנפטר ב-1684. על המצבה: י\"ז בכסלו תמ\"ד, דצמבר 1683."], ["נוסח המצבה (הורוביץ, כתובת 1144, אבן 4499)", "האלוף כהר\"ר ישראל ז\"ל בינג. אשפוך דמעות ביגון ואנחה, אשר ערבה לי כל שמחה, על פטירת הצדיק כהר\"ר ישראל בר נפתלי הירץ, נ' בש\"ק ונק' א' י\"ז כסליו תמ\"ד לפ\"ק."]]}, "g": [{"f": "g255", "c": "כרטיס הרישום של ר' ישראל בינגן מבית הבקבוק (Zur Flasche), נפטר 4.12.1683"}, {"f": "g227", "c": "ספר הורוביץ, עמ' 116: כתובת 1144, מצבת ר' ישראל בינג (1683)"}]}, {"n": "רייזל בינגן", "y": "–1719", "s": [{"k": "frankfurt", "r": "ld", "t": ["ערב ראש חודש שבט תע\"ט (20.1.1719), פרנקפורט"], "u": 0}], "c": {"n": "רייזל (רויזלה, Rösle) בינגן, בת הירץ אופנהיים", "rel": "אשתו השנייה של ר' ישראל בינגן · אמו של ר' שלמה זלמן בינגן, לפי ג'ני", "b": "", "d": "ערב ראש חודש שבט תע\"ט (20.1.1719), פרנקפורט", "place": "פרנקפורט", "note": "רייזל (רויזלה) בת הירץ אופנהיים. גרה בפרנקפורט בבית הבקבוק (Zur Flasche). נפטרה ונקברה ביום שישי, ערב ראש חודש שבט תע\"ט, 20.1.1719, ליד אמה גוטלה. בסביבות 1660 נישאה לר' ישראל בינגן, שהיה אז אלמן אחרי מות אשתו הראשונה שפרינץ. אחרי מותו ב-1683 נשארה אלמנה 35 שנה. ר' ישראל נקבר ליד גיטלה (גוטלה), אשת הירץ אופנהיים, כלומר ליד חמותו.", "flag": "שנת הלידה לא ידועה. ג'ני מעריך שנולדה בין 1625 ל-1649. כרטיס הרישום של בעלה לא מציין מי מנשותיו היא אמו של זלמן. את זה מוסר רק ג'ני, אבל זה מתאים לזמנים, כי שפרינץ נפטרה כבר ב-1659.", "src": "כרטיס הרישום \"Rejzle Bingen, 20.1.1719\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1710–1719, עמ' 296 · נוסח המצבה: M. Horovitz (1901), עמ' 177, כתובת 1708 (אבן 4568) · Geni: Rösle Bingen (Oppenheim), נפטרה 20.1.1719 (Randy Schoenberg), נבדק 11.11.2026 · כרטיסי הרישום של בעלה \"Jisrol Bingen\" (1680–1689 עמ' 83), של שפרינץ (1650–1659 עמ' 174), ושל בנותיה רעכלין (1690–1699 עמ' 253) וטרצה (1730–1734 עמ' 122)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Rejzle Bingen\n📅 נפטרה: 20.1.1719 (ערב ראש חודש שבט תע\"ט)\n🪦 המצבה: הורוביץ 1708\n⚰️ פנקס הקבורה: רייזלה אשת ישראל בינג, בת ר' הירץ אופנהיים, נקברה ליד אמה גוטלה\n📜 ברשימת התושבים: \"Rösle, אלמנת ישראל\", בשנים 1697/1700 ו-1709/12\n🏠 בית: הבקבוק (Zur Flasche)\n👨 אביה: ר' הירץ אופנהיים מבית הגביע הלבן (Zum weissen Becher), בן לייב. נפטר 6.6.1690.\n👩 אמה: גוטלה בת זלמן כ\"ץ. נפטרה 8.7.1666.\n💍 נישואיה: בסביבות 1660, לאלמן של שפרינץ, ישראל בינגן בן הירץ. נפטר 4.12.1683."], ["נוסח המצבה (הורוביץ, כתובת 1708, אבן 4568)", "הזקנה היקרה מ' . . . . נפ' ונק' בעש\"ק ער\"ח שבט תע\"ט לפ\"ק. פ\"ט אשה צנועה והגונה, מגזע ישרים ונכונה, מ' ריזלה בת האלוף הקצין פרנס ומנהיג . . . . . .\nהמשך הכתובת, ובו שם אביה, לא השתמר."], ["👨‍🦱 בעלה", "ר' ישראל בינגן (בינג), מבית הבקבוק (Zur Flasche). נפטר ב-4.12.1683. היא הייתה אשתו השנייה. מופיע בכרטיס נפרד"], ["👨‍👩‍👧 ילדיה", "ר' שלמה זלמן בינגן, מבית התוכי (Zum Papagei). נפטר ב-7.4.1725. לפי ג'ני הוא בנה. מופיע בכרטיס נפרד\nרעכלין, אשת מאיר ביקרט מבית הבקבוק (Zur Flasche). נפטרה ב-17.11.1697. לפי כרטיס הרישום שלה\nטרצה, אשת מנדלה קנובלאוך מבית התפוח המוזהב (Zum goldenen Apfel). נפטרה ב-30.11.1732. לפי כרטיס הרישום שלה"]]}, "g": [{"f": "g261", "c": "כרטיס Wasserman)", "x": []}, "g": []}, {"n": "שלמה זלמן הכהן כ\"ץ", "y": "–1685", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית השער (Zur Pforte)", "י\"ט באייר תמ\"ה (23.5.1685), פרנקפורט"], "u": 0}], "c": {"n": "שלמה זלמן הכהן כ\"ץ, \"זלמן מבית השער\" (Zur Pforte)", "rel": "אביהן של ביילה ושל חנה", "b": "", "d": "י\"ט באייר תמ\"ה (23.5.1685), פרנקפורט", "place": "פרנקפורט, בית השער (Zur Pforte)", "note": "אביהן של ביילה ושל חנה. בית השער (Zur Pforte) הוא שם בית משפחת כ\"ץ (Cahn) ברחוב היהודים בפרנקפורט, ליד השער הצפוני של הרחוב: הבית הפינתי מימין לשער הכניסה, מס' 1 ברחוב, בצד המערבי (דיץ, 1907).\n\nנפטר בי\"ט באייר תמ\"ה (23.5.1685). אביו: הדיין נתן כ\"ץ, בן זלמן, שנפטר ב-9.2.1690. אמו: הינדכן, שנפטרה ב-7.12.1675.", "flag": "שנת הלידה לא ידועה. השערה, לא מוכחת: זלמן הוא הצורה היידית של שלמה (Salomon). אצל דיץ (1907) מופיע שלמה כהן מבית האריה האדום (Zum roten Löwen), הצמוד לבית השער (Zur Pforte), שנפטר ב-1703, בנו של קלמן כהן מבית האריה האדום (Zum roten Löwen) (נפטר 1689), ולפי דיץ כנראה נכדו של נפתלי הירץ מבית התוכי (Zum Papagei) (נפטר 1635), ממשפחת הכהנים Cahn שגרה בבית השער (Zur Pforte) מ-1515. השם, המקום והתקופה מתאימים, אבל כינוי הבית שונה, ודיץ רושם לו רק ארבעה בנים (מאיר, זליגמן, קופל ושמעון), בלי בנות. לכן הקשר לא נוסף לעץ.", "src": "מסירת המשפחה, 3.11.2026 · Dietz, \"Stammbuch der Frankfurter Juden\" (1907), ערכים \"Cahn\" (מס' 83) ו-\"Papagei\" · פטירה, הורים ובנות: כרטיס הרישום מפרנקפורט, מסירת המשפחה, 9.11.2026 · כרטיס הרישום \"Zalman zur Pforte, 23.5.1685\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1680–1689, עמ' 127 · נוסח המצבה: M. Horovitz (1901), עמ' 693, כתובת 5892 (אבן 4953)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Zalman zur Pforte\n📅 נפטר: 23.5.1685 (י\"ט באייר תמ\"ה)\n🪦 המצבה (הורוביץ 5892): זלמן, שלמה בן הדיין נתן כ\"ץ\n⚰️ פנקס הקבורה: זלמן בן מורנו נתן כ\"ץ, נקבר ליד אמו הינדכן, אשת מורנו נתן כ\"ץ\n🏠 בית: השער (Zur Pforte)\n👨 אביו: הדיין נוסן (כנראה) מבית השער, בן זלמן כ\"ץ. נפטר 9.2.1690.\n👩 אמו: הינדכן. נפטרה 7.12.1675.\n💍 אשתו: בלימכן ממץ, בת יהודה טרייר. נפטרה 21.12.1710.\n👨‍👩‍👧 ילדיו:\n• חנה, אשת אב בית הדין שמואל שוטן כ\"ץ. נפטרה 8.5.1713\n• רעכלה, אשת שמואל בוכה. נפטרה 28.7.1737\n• ביילה, אשת הסופר שמעון. נפטרה 16.3.1739\n• הינדכה, אשת ליב האנאו. נפטרה 5.12.1747\n• שאדלה, לא נשואה. נפטרה 2.7.1746\n• בתוספת בכתב יד: שמעון כהן מבית השער. נפטר 24.3.1737"], ["נוסח המצבה (הורוביץ, כתובת 5892, אבן 4953)", "האלוף התורני כהר\"ר זלמן כ\"ץ ז\"ל. ציון הזה שמנו לראש אבינו, התנהג בחסידות לפני קונו, גם קבע עתים לתורה . . . , נבחר לג\"ץ (?) . . . . . . . שלמה בהאלוף הדיין כ' נתן כ\"ץ נו\"נ ה' . . .\nהכתובת בנספח של הורוביץ, בלי שנה בכותרת."], ["מצבת בנו שמעון כהן (הורוביץ, כתובת 5894, אבן 4957)", "היקר והנעלה כ' שמעון כהן ז\"ל. האבן הזאת שמתי לראש ה\"ה הנעלה כ' שמעון, בן האלוף והקצין כהר\"ר זלמן כהן ז\"ל, נפ' בש\"ט יו' א' כ\"א אדר שני . . . . לפ\"ק. תנצב\"ה.\nהכתובת בנספח של הורוביץ (עמ' 693), בלי שנה בכותרת. לפי כרטיס הרישום של זלמן, בנו שמעון נפטר ב-24.3.1737, ובשנה זו כ\"א באדר ב' חל ביום ראשון, כמו על המצבה."], ["👩‍🦱 אשתו", "בלימכן ממץ, בת יהודה טרייר. נפטרה ב-21.12.1710. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nחנה, אשת המהרשש\"ך. נפטרה ב-8.5.1713. מופיעה בכרטיס נפרד\nרעכלה, אשת שמואל בוכה מבית המגן השחור (Zum schwarzen Schild), שגר בבית הכובע האדום (Zum roten Hut). נפטרה ב-28.7.1737\nביילה, אשת ר' שמעון. נפטרה ב-16.3.1739. מופיעה בכרטיס נפרד\nהינדכה, אשת ליב האנאו מבית חבית היין (Zum Weinfass). נפטרה ב-5.12.1747\nשאדלה. נפטרה לא נשואה ב-2.7.1746\nשמעון כהן, מבית השער (Zur Pforte). נפטר ב-24.3.1737 (תוספת בכתב יד בכרטיס הרישום). מצבתו בהורוביץ, כתובת 5894: \"היקר והנעלה כ' שמעון כהן... בן... כהר\"ר זלמן כהן ז\"ל\""]]}, "g": [{"f": "g289", "c": "ספר הורוביץ, עמ' 693: כתובות 5892 ו-5893, מצבות זלמן כ\"ץ ואביו הדיין ר' נתן כהן"}, {"f": "g184", "c": "כרטיס הרישום של זלמן כ\"ץ, \"זלמן מבית השער\" (Zur Pforte) · פרנקפורט"}]}, {"n": "בלימכן", "y": "–1710", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, ן ב-1644. על מצבת בנו כתוב: \"מוהר\"ר שמואל בהר\"ר יוזף יוזפא כ\"ץ\". היה רבה ואב בית הדין של דרמשטט, ואחרי מותו מילא בנו את מקומו ברבנות שם, לפני שעבר לפרנקפורט. מאושר גם אצל דיץ (1907): \"משה משוטן\" נקלט בפרנקפורט ב-1681, \"בנו של יוסף\", ובשנה שאחריה נקלט אחיו, שמואל משוטן, לימים רב הקלויז (נפטר 1719), הוא המהרשש\"ך. דיץ כותב שהמשפחה היא משפחת כהנים.", "flag": "הוריו, שם אשתו (אמו של המהרשש\"ך) ושנות חייו לא ידועים. נבדק ב-24.11.2026: שמות הוריו לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "ויקיפדיה העברית (\"שמואל שאטין\") · ויקי ישיבה (\"רבי שמואל שאטין\") · Geni · Dietz, \"Stammbuch der Frankfurter Juden\" (1907), ערך \"Schott\" (מס' 507) · כרטיסי הרישום \"ab\"d Smul Schotten, 5.7.1719\" (אלה תולדות, קובץ 1710–1719, עמ' 322) ו-\"Mose Schotten, 11.10.1706\" (קובץ 1700–1709, עמ' 190), נבדק 24.11.2026 · נבדק גם: epidat (פרנקפורט ודרמשטט), אלה תולדות 1620–1749", "x": [["👨‍👦 בניו", "לפי כרטיסי הרישום של בניו (אלה תולדות). בשניהם האב נקרא \"Juzfe Schotten k\"ts\", כלומר יוזפא שוטן כ\"ץ, ושורת האם ריקה:\n• ר' שמואל שוטן, המהרשש\"ך, אב בית הדין ורב הקלויז בפרנקפורט. נפטר בי\"ח בתמוז תע\"ט (5.7.1719). על מצבתו (הורוביץ 5830): \"שמואל שאטן אב\"ד בן יוסף יוזפא כ\"ץ ז\"ל\". מופיע בכרטיס נפרד\n• משה שוטן, מהחלק הקדמי של בית הזאבן (Zum Hecht). נפטר בג' בחשוון תס\"ז (11.10.1706). אשתו: ברנדלין בת לייב הנק, נפטרה ב-4.5.1705. ילדיהם: יוזפא שוטן (נפטר 26.9.1773), לייב (נפטר 14.2.1715, לא נשוי), הענלה, אשת מיכל שטרן מבית הסוס השחור (Zum Rappen, נפטרה 11.11.1751), ויטלה (נפטרה 3.2.1731).\n\nבכרטיס של משה מעיר אטלינגר ששוטן היא העיירה שליד פרידברג, בהסן."]]}, "g": []}, {"n": "ר' משה בן משה שמעון", "y": "–1687", "s": [{"k": "frankfurt", "r": "ld", "t": ["ח' בכסלו תמ\"ח (13.11.1687), פרנקפורט"], "u": 0}], "c": {"n": "ר' משה בן משה שמעון", "rel": "אביו של ר' שמעון \"מן הנשר הזהב\"", "b": "", "d": "ח' בכסלו תמ\"ח (13.11.1687), פרנקפורט", "place": "פרנקפורט", "note": "הסופר והנאמן של קהילת פרנקפורט, ר' משה בן משה שמעון. אביו של ר' שמעון סופר \"מן הנשר הזהב\". לפי ההערה בכרטיס הרישום שלו, שימש שנים רבות סופר ונאמן בפרנקפורט, וציווה לפני מותו שלא ישבחו אותו לא על המצבה ולא בפנקס הקבורה, ולכן שניהם שותקים על תפקידיו. נפטר בח' בכסלו תמ\"ח (13.11.1687), ונקבר למחרת.", "flag": "שנת הלידה לא ידועה. לפי דיץ (1907), אביו של שמעון היה משה אורי (פייסט) ממשפחת הכהנים אדלר שבבית הנשר השחור (Zum schwarzen Adler). כרטיס הרישום של משה עצמו מראה שזו טעות: הוא \"הסופר משה, בן הסופר והנאמן משה שמעון\", ובנו שמעון גר בבית הנשר הזהב (Zum goldenen Adler), לא בבית הנשר השחור.", "src": "כרטיס הרישום \"sōfēr Mōše, 13.11.1687\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1680–1689, עמ' 196 · נוסח המצבה: M. Horovitz (1901), עמ' 122–123, כתובת 1213 (אבן 4091) · כרטיס הרישום של בנו \"Simon Schreiber, 15.4.1730\" · מסירת המשפחה, 3.11.2026 · Dietz (1907)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 sōfēr Mōše\n📅 נפטר: 13.11.1687 (ח' בכסלו תמ\"ח)\n🪦 המצבה (הורוביץ 1213): משה בן משה שמעון, סופר ונאמן\n⚰️ פנקס הקבורה: נקבר ליד שלמה מיינץ. ברשימה נוספת: היה שנים רבות סופר ונאמן בפרנקפורט, וציווה לפני מותו שלא ישבחו אותו לא על המצבה ולא בפנקס.\n👨 אביו: הסופר והנאמן משה שמעון.\n👩 אמו: לא נרשמה.\n💍 אשתו: פרומט ממץ, בת משה סג\"ל, אלמנת הסופר יוזל לייטר. נפטרה 22.6.1691.\n👨‍👩‍👧 ילדיו:\n• הסופר שמעון, מבית המרחץ הקר (Zum kalten Bad) ואחר כך מבית הנשר הזהב (Zum goldenen Adler). נפטר 15.4.1730"], ["נוסח המצבה (הורוביץ, כתובת 1213, אבן 4091)", "על אלה אני בוכיה ועיני יורדי מים, על פטירת אדוני אבי, ה\"ה כהר\"ר משה בר משה שמעון סופר ונאמן, פה נ' ליל ה' ונ' יום ו' ט' כסליו תמ\"ח לפ\"ק.\nהמצבה הוקמה על ידי בנו (\"אדוני אבי\"). כפי שציווה, אין בה שבחים."], ["👨‍👩‍👧 ילדיו", "ר' שמעון סופר, מבית המרחץ הקר (Zum kalten Bad) ואחר כך מבית הנשר הזהב (Zum goldenen Adler). נפטר ב-15.4.1730. מופיע בכרטיס נפרד"], ["👩‍🦱 אשתו", "פרומט, בת משה סג\"ל ממץ. נפטרה ב-22.6.1691"]]}, "g": [{"f": "g286", "c": "כרטיס הרישום של הסופר ר' משה בן משה שמעון, נפטר 13.11.1687"}, {"f": "g291", "c": "ספר הורוביץ, עמ' 122: תחילת כתובת 1213 ל סג\"ל. נפטרה ב-22.12.1767"]]}, "g": [{"f": "g225", "c": "כרטיס הרישום של ר' זלמן בינגן מבית התוכי, Zum Papagei (נפטר 7.4.1725)"}, {"f": "g255", "c": "כרטיס הרישום של ר' ישראל בינגן מבית הבקבוק (Zur Flasche), נפטר 4.12.1683"}]}, {"n": "גיטל לייטר חזן", "y": "–1738", "s": [{"k": "frankfurt", "r": "ld", "t": ["ערב ראש חודש טבת תצ\"ט (11.12.1738), פרנקפורט"], "u": 0}], "c": {"n": "גיטל (Gutle) לייטר חזן, בת ר' דוד לייטר", "rel": "אשתו של ר' יעקב רפאל חזן · בתו של ר' דוד לייטר", "b": "", "d": "ערב ראש חודש טבת תצ\"ט (11.12.1738), פרנקפורט", "place": "פרנקפורט", "note": "בתו של ר' דוד לייטר, ואשתו השנייה של ר' יעקב רפאל חזן. נפטרה בפרנקפורט בדצמבר 1738 (11.12.1738, ערב ראש חודש טבת תצ\"ט, לפי כרטיס הרישום שלה). בכרטיס הרישום של בעלה היא רשומה בשם \"Gutle b' Dowid Leiter\", כלומר גיטל בת דוד לייטר. בהשערה ברורה היא אמו של ר' אלחנן חזן, סבה של רייזל אמו של החתם סופר. כך היא מחברת בין משפחת החתם סופר לבין משפחות לייטר ובינגן.", "flag": "שנת הלידה לא ידועה. יום הפטירה בכרטיס חתוך בשוליים, ולכן \"11\" הוא קריאה משוערת. מצבה שלה לא נמצאה בספר הורוביץ. הכרטיס לא כותב במפורש שהיא אמו של אלחנן. האישה הראשונה של בעלה, אסתר טאוסיג, נפטרה ב-1685, ובתו של אלחנן, רייזל, נולדה רק ב-1733/34, ולכן סביר יותר שהוא בנה של גיטל. רמז נוסף, בהשערה ברורה, הוא השמות: אלחנן נקרא כנראה על שם אלחנן לייטר, סבה של גיטל, ובתו של אלחנן נקראה הענלה, כנראה על שם הנל, אמה של גיטל, שנפטרה ב-1727. אם אמו הייתה אסתר טאוסיג, היינו מצפים לשמות ממשפחתה. גם אם זה נכון, זו לא הוכחה.", "src": "כרטיס הרישום של בעלה, \"Refoel Hazz'n, 16.10.1712\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1710–1719, עמ' 90 · Geni: Gittel Chazan (Leiter), נתנאל פריש, נבדק 10.11.2026 · מסירת המשפחה, 9.11.2026 · כרטיס הרישום \"Gutle, Frau des hazzen Refoel, 11.12.1738\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1735–1739, עמ' 207", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Gutle, Fra  זלמן בן נוסן כהן. גרה בבית המרחץ הקר (Zum kalten Bad), ואחר כך בבית הנשר הזהב (Zum goldenen Adler). בעלה, ר' שמעון סופר בן משה, נפטר לפי כרטיס הרישום שלה ב-13.11.1687.", "flag": "", "src": "כרטיס הרישום מפרנקפורט, מסירת המשפחה, 9.11.2026 · מסירת המשפחה, 3.11.2026 · METAhub, המוזיאון היהודי פרנקפורט (\"Haus an der Pforte\", \"Haus Sonne\", \"Haus Wedel\", \"Haus Rote Tür\", \"House Wechsel\") · עץ משפחת אופנהיים, ענף וורמס (loebtree.com) · כרטיס הרישום \"Bejle, Frau d. Šimon sōfer, 16.3.1739\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1735–1739, עמ' 222", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Bejle, Frau d. Šimon sōfer\n📅 נפטרה: 16.3.1739 (ו' באדר ב' תצ\"ט)\n⚰️ פנקס הקבורה: ביילה אשת שמעון סופר ז\"ל, בת זלמן בן נוסן כהן, נקברה ליד אחותה רעכלה\n🪦 המצבה: בכרטיס אין מספר הורוביץ.\n🏠 בתים: המרחץ הקר (Zum kalten Bad), ואחר כך הנשר הזהב (Zum goldenen Adler)\n👨 אביה: זלמן מבית השער (Zur Pforte), בן נוסן כ\"ץ. נפטר 23.5.1685.\n👩 אמה: בלימכן ממץ, בת יהודה טרייר. נפטרה 21.12.1710.\n💍 בעלה: הסופר שמעון בן משה. נפטר 15.4.1730. בכרטיס כתוב ליד שמו התאריך 13.11.1687, אבל זה תאריך הפטירה של אביו."], ["👨‍🦱 בעלה", "ר' שמעון סופר \"מן הנשר הזהב\", בן ר' משה בן משה שמעון. נפטר ב-15.4.1730. מופיע בכרטיס נפרד"], ["👨‍👩‍👧 ילדיה", "לפי כרטיס הרישום של בעלה:\nהסופר ר' משה, מבית הנשר הזהב (Zum goldenen Adler). נפטר צעיר ב-4.2.1722. מופיע בכרטיס נפרד\nגומפרכט. נפטר לא נשוי ב-9.2.1758. מצבתו בהורוביץ, כתובת 5904\nפייס. נפטר לא נשוי ב-13.4.1740"], ["🏠 בית השער (Zur Pforte)", "הבית עמד ברחוב היהודים בפרנקפורט, מספר 1, צמוד לשער הצפוני של הגטו (היום אזור הקונסטבלרוואכה). \"Pforte\" פירושו שער. הוא נבנה ב-1472, עשר שנים אחרי שהוקם הגטו, והיה מהבתים הוותיקים ברחוב. רוחב החזית שלו היה כ-3.40 מטר.\n\nמשפחת כ\"ץ (Cahn), משפחת כהנים, גרה בו כמעט כל יותר מ-300 השנים שבהן עמד. לפי המוזיאון היהודי בפרנקפורט, זה היה חריג ברחוב, שבו המשפחות התחלפו לעתים קרובות.\n\nהדורות הראשונים שמתועדים בעצי משפחה: מאיר כ\"ץ \"אן דער פפורטה\" (נפטר 1556) ואשתו גוטלין; בתם שרלה, שנישאה ליהודה ליב אופנהיים (נפטרה 1579); זלמן כ\"ץ (נפטר 1577) וקלמן כ\"ץ (נפטר 1575). התאריכים מעצי משפחה שנשענים על Dietz, ולא נבדקו מול המקור.\n\nהמשפחה בנתה בתים בשכנות: בית השמש (Zur Sonne, מס' 10, 1530), שבו גרו ראשונים בת של משפחת כ\"ץ ובעלה הרץ צונס; בית ודל (Wedel, מס' 3, 1573), שבנו ואכלסו בני המשפחה; ובבתים הדלת האדומה (Rote Tür, מס' 8) וּוֶכְסֶל (Wechsel, מס' 6) גרו קרובים שלהם.\n\nהבית נשרף בשריפות הגדולות של 1711, 1721 ו-1796. אחרי השריפה האחרונה לא נבנה מחדש, ובמקומו הורחב הרחוב.\n\n🟠 השערה: ייתכן שזלמן, אביה של ביילה, נקרא על שם זלמן כ\"ץ שנפטר ב-1577. לא נמצא לזה מקור."], ["👭 אחותה חנה", "ביילה וחנה היו אחיות. ההורים של שתיהן: זלמן כ\"ץ מבית השער (Zur Pforte) ובלימכן.\nהבן של ביילה, ר' משה בן שמעון, התחתן עם הבת של חנה, רייצ'ן. כלומר בני דודים התחתנו זה עם זה."]]}, "g": [{"f": "g194", "c": "כרטיס הרישום של ביילה, אשת ר' שמעון סופר · פרנקפורט"}]}, {"n": "ר' שמעון \"מן הנשר הזהב\"", "y": "–1730", "s": [{"k": "frankfurt", "r": "ld", "t": ["15.4.1730 (כ\"ח בניסן ת\"ץ), פרנקפורט"], "u": 0}], "c": {"n": "ר' שמעון סופר, \"מן הנשר הזהב\" (⁦zum goldenen Adler⁩)", "rel": "אביו של ר' משה בן שמעון · אבי-סבו של החתם סופר", "b": "", "d": "15.4.1730 (כ\"ח בניסן ת\"ץ), פרנקפורט", "place": "פרנקפורט", "note": "סופר הקהילה היהודית של פרנקפורט. \"מן הנשר הזהב\" (Zum goldenen Adler) הוא שם בית המשפחה בפרנקפורט: בית הנשר הזהב (Zum goldenen Adler) ברחוב היהודים (Judengasse 86), בצד המערבי של הרחוב, סמוך לקצה הדרומי. ר' שמעון גר בו מ-1700 עם אשתו וארבעה ילדים. מקצוע הסופר עבר במשפחה מאב לבן, ומכאן שם המשפחה שרייבר.\nמפת רחוב היהודים, עם בתי המשפחה ומבני הקהילה, נמצאת בכרטיס \"רחוב היהודים\".", "flag": "לפי דיץ (1907) נפטר ב-1707. לפי כרטיס הרישום והמצבה (הורוביץ 2002) נפטר ב-15.4.1730, וזה התאריך שכאן.", "src": "Deutsche Biographie (NDB), \"Sofer, Moses\" · METAhub, המוזיאון היהודי פרנקפורט (\"Haus Goldener Adler\", \"Schreiber\") · מסירת המשפחה, 3.11.2026 · Dietz, \"Stammbuch der Frankfurter Juden\" (1907), ערך \"Schreiber\" (מס'  מילא את מקום הרב הראשי של פרנקפורט. מחבר \"כוס הישועות\" (פרנקפורט, 1711), חידושים על מסכתות סדר נזיקין. נחשב לגדול חכמי התלמוד בפרנקפורט בדורו. אחרי השריפה של 1711 אמר תפילות שחיבר בהנחת אבן הפינה לבית הכנסת החדש. שם המשפחה בא מעיר הולדתו, שוטן.", "flag": "תאריך הפטירה לפי הורוביץ (5830) וכרטיס הרישום: י\"ח בתמוז תע\"ט, 5.7.1719. בעבר נרשם כאן י\"ד בתמוז (1.7.1719), לפי ויקיפדיה ומקורות משניים. לפי כרטיס הרישום \"כוס ישועות\" יצא לאור ב-1717. בקטלוג של אוניברסיטת פנסילבניה שנת הפטירה היא 1709. שאר המקורות כותבים 1719 (תע\"ט).", "src": "ויקיפדיה האנגלית (\"Samuel Schotten\", לפי המוזיאון היהודי פרנקפורט) · ויקי ישיבה · המכלול · Deutsche Biographie (NDB), \"Sofer, Moses\" · מסירת המשפחה, 3.11.2026 · כרטיס הרישום \"ab\"d Smul Schotten, 5.7.1719\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1710–1719, עמ' 322 · נוסח המצבה: M. Horovitz (1901), עמ' 688, כתובת 5830 (אבן 4426)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 ab\"d Smul Schotten\n📅 נפטר: 5.7.1719 (י\"ח בתמוז תע\"ט)\n🪦 המצבה: הורוביץ 5830\n⚰️ נקבר ליד אב בית הדין אברהם ברודא\n📜 רב הקלויז. לפי הכרטיס כיהן ב-1703 כאב בית הדין בפרנקפורט, עד שב-1704 נקרא לתפקיד ר' נפתלי כ\"ץ.\n📖 ספרו \"כוס ישועות\" יצא לאור בפרנקפורט ב-1717.\n🏠 בתים: השער (Zur Pforte), ואחר כך המרחץ החם (Zum warmen Bad), ששם שכן בית הכנסת \"הקלויז\"\n👨 אביו: יוסף שוטן כ\"ץ.\n👨‍👦 אחיו: משה שוטן מבית הזאבן (Zum Hecht). נפטר 11.10.1706."], ["נוסח המצבה (הורוביץ, כתובת 5830, אבן 4426)", "הגאון מהר\"ש ש\"ך. הגאון מ\"ו שמואל שאטין אב\"ד ור\"מ דבה\"מ פה, פה נטמן צנצנת המן, כלכל ודרדע, חכים ורבן איתקרי, בכל מיני חכמה ומדע, העמיד תלמידים הרבה, ושמעתתיה מבדרין בעלמא, ובשערים המצויינים שמו נודע, לא הניח דבר גדול ודבר קטן עד ירדו לעמקא, והבירור אליו נתודע, ה\"ה הגאון ומקובל אלקי' נ\"י, פה ע\"ה מוהר\"ר שמואל בהר\"ר יוסף יוזפא כ\"ץ זצ\"ל, נפטר אור ליום ש\"ק י\"ח תמוז . . . . . . . . . . . . . .\nהכתובת בנספח של הורוביץ, בלי שנה בכותרת. השורה הראשונה, \"הגאון מהר\"ש ש\"ך\", מודפסת כותרת יבא איגר בקיץ 1781. נפטרה כחודשיים אחרי שהשיאו את בתם.", "flag": "המקורות לא אומרים במפורש שהיא אמה של שרל. זו מסקנה מהתאריכים: שרל נולדה בערך ⁦1788–1790⁩, ורבי עקיבא איגר נישא בשנית רק אחרי 1796. שנת הלידה שלה משוערת. השם רודיש מופיע רק ב-Geni. לפי Lewin (1904, עמ' 245) נפטרה ב-12 באדר 1786. בכרטיס כתוב 1796, כי רבי עקיבא איגר נישא בשנית רק ב-1797.", "src": "ויקיפדיה העברית (\"עקיבא איגר\") · Ancestry (⁦1763–1796⁩) · אמה רודיש ואחותה מאשה: Geni ו-MyHeritage · ר' יהושע פייבלמן כ'גיסו' של רבי עקיבא איגר: Lewin, Geschichte der Juden in Lissa (1904), עמ' 245 · נבדק 24.11.2026 · פטירתה לפי Lewin: L. Lewin, Geschichte der Juden in Lissa (1904), עמ' 177 ו-245 · נבדק 25.11.2026", "x": []}, "g": []}, {"n": "רייזל סופר", "y": "1734–1822", "s": [{"k": "frankfurt", "r": "ld", "t": ["י\"ז באדר תקפ\"ב (10.3.1822), פרנקפורט"], "u": 0}], "c": {"n": "רייזל (ריזלא, ⁦Rösle⁩) סופר, בת ר' אלחנן חזן", "rel": "אמו של החתם סופר", "b": "1733/34 (תצ\"ד)", "d": "י\"ז באדר תקפ\"ב (10.3.1822), פרנקפורט", "place": "פרנקפורט", "note": "אמו של החתם סופר. בתם של ר' אלחנן חזן ושל הינדלה, ואשתו של ר' שמואל סופר. נולדה בפרנקפורט ב-1733/34, וגרה עם בעלה בבית הסלמון (Zum Salm). אחרי מות בעלה ב-1779 חיה כאלמנה עוד 43 שנה. ב-1812 נשבעה שבועה בכתב, כנראה בגלל זקנה או מחלה.\nנפטרה ב-10.3.1822, בת 88, מאה שנה אחרי חמיה, ר' משה בן שמעון. היא נקברה בבית הקברות העתיק בפרנקפורט ליד הוריה, בחלקת המשפחה: האבן שלה (870) עמדה ליד האבנים של סבה רפאל חזן (871), של זלמן חזן (872) ושל אמה הינדלה (873). המצבה כנראה לא שרדה, כי היא לא מופיעה במאגר מכון שטיינהיים (epidat).\nבעיתון הרשמי של פרנקפורט (Intelligenzblatt) היא רשומה כ-\"Rösle geb. Sänger\", כלומר לבית זנגר, התרגום הגרמני של \"חזן\". החתם סופר קרא לבתו החמישית רייזל, על שמה.", "flag": "שנת הלידה 1733/34 לפי כרטיס הרישום ולפי הגיל 88 שנרשם בפטירתה. בספרים אחרים ובעצי משפחה של גולשים מופיעים גיל 96 ושנת לידה 1726, ולפי המאמר במעיין זו טעות. היום שבגוף הכתובת קשה לקריאה; הכותרת של הורוביץ וכרטיס הרישום אומרים י\"ז באדר. ההשערה שהייתה נשואה קודם מחוץ לפרנקפורט היא ש -Zsidó Szemle. בכותרת הוא נקרא: \"הרב המופלג הגביר המפורסם רחים ומוקיר רבנן צדיק נשגב מהו' יצחק ווייס זצ\"ל\".\n\n• מוצא: בשנים הראשונות של המאה ה-19 עבר מגאלסצ'ס (Gálszécs) לגורליצה שבמחוז יאסלו בגליציה. שם קראו לו בהתחלה \"רב איציק צ'צ'וביץ\" (Csecsevicz), על שם המקום שממנו בא.\n\n• עסקיו: סחר בבדים ובמוצרי אריגה ביריד של פשט. העסק גדל מהר, והוא שכר מחסנים ופתח חנות ברחוב Váci körút 1. בפשט קראו לו \"רב איציק גורליצה\". בתו ריווה ניהלה את העסק, ואחריה נכדו מור וורמן. בזקנתו מסר את העסק לחתנו מאיר וולף וורמן, ומאז סחר רק באבנים יקרות.\n\n• משפחתו: אשתו הייתה רייזה לבית קריגר (Krieger Rajze), וכל ילדיו נולדו בגורליצה. אחרי מותו חילקו את רכושו האלמנה, 7 בנים ו-7 בנות. הוא תמך ברבנים, בלמדנים ובבחורי ישיבה, והיה פחות עשיר ממה שחשבו. חתנו, הכתב סופר, קרא לו פעם \"עשיר דאורייתא\".\n\n• ברכת החמה, 1841: בזקנתו התעוור. כמה שבועות לפני פסח תר\"א עבר ניתוח קטרקט. הרופאים הרשו לו לצאת מהחדר החשוך כבר במרץ, אבל הוא נשאר בו עד יום רביעי, 6 באפריל 1841, ב' דפסח תר\"א, כדי שהדבר הראשון שיברך בעיניים הפקוחות יהיה ברכת החמה.\n\n• פטירתו: \"זמן קצר אחר כך נפטר גם הוא\", ואשתו האריכה ימים אחריו. את היארצייט שלו, כ\"ז באדר, מסרה בתם אסתר הירש מנוביטרג. את שנת הפטירה כבר לא זכרה."], ["👨‍👩‍👧 ילדיו (לפי Vadász, 1907)", "בנים: מוישה, בורך, מרדכי, אליקום, יאסלה, וולף, לוי.\nבנות: ריווה, חוה לאה, שורה, בונה, שנדלה, פראדלה, אסתר."]]}, "g": []}, {"n": "ר' יעקב דוד הלוי שפיץ", "y": "", "s": [{"k": "obuda", "r": "l", "t": ["אובן ישן (Óbuda, היום בודפשט)"], "u": 0}, {"k": "budapest", "r": "l", "t": ["אובן ישן (Óbuda, היום בודפשט)"], "u": 0}], "c": {"n": "רבי יעקב דוד הלוי שפיץ, דיין באובן ישן", "rel": "אביו של ר' שלמה זלמן שפיצר · מחותנו של החתם סופר", "b": "", "d": "", "place": "אובן ישן (Óbuda, היום בודפשט)", "note": "דיין, ולפי מקור אחד ראב\"ד, בקהילת אובן ישן. בנו, ר' שלמה זלמן, למד אצלו לפני שהלך ללמוד אצל הכתב סופר. לפי \"תולדות ושורשים\" כנראה אין קשר ישיר בינו לבין משפחת שפיץ של בעל \"חוות יאיר\" והמהר\"ל.", "flag": "שמו במחלוקת: יעקב דוד ברוב המקורות; יעקב דוב ב\"אגרות סופרים\"; לייב ה
