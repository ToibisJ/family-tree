דיה הקטינים זכות ישיבה."], ["👩‍🦱 אשתו", "שינליין. נישאו בערך ב-1504. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nמאיר, מבית השער (Zur Pforte). נפטר בערך ב-1557. מופיע בכרטיס נפרד\nקלמן, מבית השער (Zur Pforte), ואחר כך מבית הדלת הירוקה (Zur grünen Tür). נפטר בערך ב-1583. מופיע בכרטיס נפרד\nזלמן, מבית השער (Zur Pforte) (?). נפטר בערך ב-1594\nיעקב\nבת, אשת הרץ מבית השמש (Zur Sonne)"]]}, "g": [{"f": "g190", "c": "כרטיס הרישום של הרב קלמן נתן הכהן · פרנקפורט"}]}, {"n": "ר' אפרים", "y": "–<1552", "s": [{"k": "frankfurt", "r": "l", "t": ["לא ידוע (כנראה פרנקפורט)"], "u": 1}], "c": {"n": "ר' אפרים, אביה של גוטה (יוטה) בינגן", "rel": "אביה של גוטה (יוטה) בינגן · סבו של משה מאיר בינגן", "b": "", "d": "לפני 1552", "place": "לא ידוע (כנראה פרנקפורט)", "note": "אביה של גוטה (יוטה), אשתו של הר\"ר מאיר בינגן. ידוע עליו רק שמו. הוא נפטר לפני 1552.", "flag": "שנות חייו לא ידועות; נפטר לפני 1552. הזיהוי עם אחד מבעלי השם גומפל או גומפרכט הוא השערה בלבד. נבדק ב-13.11.2026, ולכן סומן \"נחקר · הורים לא ידועים\".", "src": "נוסח מצבת בתו: M. Horovitz (1901), עמ' 18, כתובת 202 · כרטיס הרישום של בתו \"Judde, Tochter des Efrajim, 14.2.1552\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599, עמ' 155 · כרטיס הרישום של חתנו \"Majer Bingen zur Leiter, um 1559\": שם, עמ' 201 · שמות גומפל וגומפרכט כשמות של אפרים: A. Dietz, \"Stammbuch der Frankfurter Juden\" (1907)", "x": [["📜 מה ידוע עליו", "• שמו כתוב על המצבה של בתו בפרנקפורט (1552): \"מרת יוטה בת ר' אפרים ז\"ל\".\n• המילים \"ז\"ל\" אחרי שמו מראות שב-1552 הוא כבר לא היה בחיים.\n• גם בכרטיס הרישום של בתו כתוב: \"אביה: אפרים\".\n• בתו התחתנה בסביבות 1531 עם מאיר בינגן, וב-1549 הם גרו יחד בבית הסולם (Zur Leiter)."], ["🤔 אולי הוא מופיע במסמכים בשם אחר (השערה)", "בפרנקפורט של אותה תקופה, ליהודים היה שם עברי ושם גרמני. מי שנקרא בעברית \"אפרים\" נקרא בגרמנית בדרך כלל \"גומפל\" או \"גומפרכט\".\n\nבכרטיסי הרישום יש כמה אנשים בשם גומפל או גומפרכט שנפטרו לפני 1552. ייתכן שאחד מהם הוא ר' אפרים, אבל אין שום מסמך שמקשר אחד מהם לבתו גוטה. לכן אי אפשר לדעת מי מהם, אם בכלל.\n\nהשמות, לפי הסדר: גומפכן מבית הטבעת השחורה (Zum schwarzen Ring), נפטר ב-1516 · גומפרכט מבית האייל (Zum Hirsch), בערך 1513 · גומפל מבית הזאב (Zum Wolf), בערך 1515 · הרב גומפרכט מבית הכוכב (Zum Stern), בערך 1536.\n\nעוד רמז לא ברור: ב-1559 אחד האפוטרופסים של נכדיו היה גוטשלק מבית הדג (Zum Fisch). גם השם גוטשלק הוא בעברית אפרים, ובכרטיס כתוב לידו \"אחיו\". לא ברור של מי הוא היה אח."], ["🔎 מה לא נמצא", "• כרטיס רישום משלו.\n• שנות חייו ומקום מגוריו.\n• שם אשתו ושמות הוריו.\n• המצבה שלו."]]}, "g": [{"f": "g265", "c": "כרטיס הרישום של יוטה בת אפרים, נפטרה 14.2.1552"}]}, {"n": "ישראל ריינבך", "y": "–1505", "s": [{"k": "frankfurt", "r": "ld", "t": ["ט\"ז באייר ה'רס\"ה (20.4.1505), פרנקפורט"], "u": 0}], "c": {"n": "הרב ר' ישראל בן אשר (אמשל) ריינבך, אב\"ד", "rel": "אביו של ר' זליגמן ריינבך · חתנו של ר' זעליגמן ז\"ק", "b": "", "d": "ט\"ז באייר ה'רס\"ה (20.4.1505), פרנקפורט", "place": "פרנקפורט", "note": "רב וראש בית דין. גר בנירנברג, ואחרי גירוש היהודים מנירנברג ב-1498 עבר לפרנקפורט, לבית הוורד האדום (Zur roten Rose). בסביבות 1497 נשא את בתו של ר' זעליגמן ז\"ק, אלמנתו של שלמה מוורמס. נפטר בפרנקפורט ב-20.4.1505.", "flag": "שנת הלידה לא ידועה.", "src": "כרטיס הרישום \"ab\"d Jisrael Rheinbach, 20.4.1505\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1500–1559⁩, עמ' 17 · נוסח המצבה: M. Horovitz (1901), עמ' 13, כתובת 142 (אבן 1478) · Jewish Encyclopedia, ערך \"Frankfort-on-the-Main\", רשימת הרבנים והחכמים · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), עמ' 578, רשימת קבלת התושבים · Alexander Dietz, Stammbuch der Frankfurter Juden (1907), משפחה 167 \"Fritzlar\" (עמ' 95), ורשימת השמות לפי מקומות, ערך \"Rheinbach\"", "x": [["📜 מה ידוע עליו", "• אביו: אמשל (אשר). אולי בנו של זלמן שטרליין מנירנברג (לא ודאי).\n• 1490: מוזכר במקורות של נירנברג.\n• 1497: אחרי מותו של שלמה מוורמס נשא את אלמנתו, בתו של ר' זעליגמן ז\"ק. בספר המסים של יהודי נירנברג כתוב שהעיר קיבלה כתושב את \"ישראל ריינפכר\" (Israhel Rainpacher).\n• 1497: לפי רשימת קבלת התושבים של פרנקפורט הוא התקבל בעיר כבר באותה שנה, וקיבל מיד את בית הוורד האדום (Zur roten Rose). ברשימה הוא רשום בתואר \"Hochmeister\".\n• שלמה מוורמס, בעלה הראשון של אשתו, התקבל בנירנברג ב-1486.\n• 1498: יהודי נירנברג גורשו, והוא עבר לפרנקפורט.\n• ⁦1500–1505⁩: גר בפרנקפורט בבית הוורד האדום (Zur roten Rose). בספרי העירייה הוא נקרא \"Hochmeister\". זה היה התואר שספרי העירייה נתנו לרב הראשי של הקהילה: דיץ כותב \"Hochmeister (Rabbiner)\" גם על רבנים אחרים בפרנקפורט, כמו מוסה מלאובה (1472) וזימל אפשטיין.\n• לפי דיץ הוא כיהן כרב מ-1499. לפי האנציקלופדיה היהודית הוא כיהן עד 1505.\n• גיסו: מאיר מפריצלאר. ב-1499 הוא גר יחד איתו בבית הוורד האדום, ב-1501 עבר לבית הקלחת (Zum Kessel), ונזכר לאחרונה ב-1502. \"גיס\" יכול להיות אחיה של אשתו, ואז הוא עוד בן של ר' זעליגמן ז\"ק, או בעלה של אחותו. אי אפשר לדעת מהמקור.\n• נפטר ב-ט\"ז באייר ה'רס\"ה, 20.4.1505. אלמנתו מופיעה ברשימות עד 1508."], ["🪦 המצבה (הורוביץ, כתובת 142)", "תורה וסברה בחכמתו חלף ועבר למנוחתו, האלוף והמפולפל מה\"ר ישראל בן הה\"ר אשר, אשר הנפטר י\"ו אייר ונקבר בו רס\"ו לאלף הששי. תנצב\"ה א\"ס.\nבספר כתובה השנה רס\"ו, שהיא 1506. הורוביץ מוסיף בהערת שוליים: \"עי' י\"א סי' תתק\"ע ואולי שם טעות המדפיס שכתב בשנת רס\"ה נפטר מה\"ר ישראל ז\"ל.\" כלומר הוא מפנה לספר \"יוסף אומץ\", שכותב רס\"ה, ומשער שנפלה שם טעות דפוס. גם כרטיס הרישום של אטלינגר כותב רס\"ה, 20.4.1505. כך שהאבן אומרת 1506, שני מקורות כתובים אומרים 1505, והורוביץ עצמו נוטה לאבן. אין הכרעה."], ["👨‍👩‍👦 משפחתו", "אשתו: בתו של ר' זעליגמן ז\"ק, אלמנתו של שלמה מוורמס. מופיעה בכרטיס נפרד\nבנו: ר' יהודה (זליגמן) ריינבך. נפטר בסביבות 1553. מופיע בכרטיס נפרד\nבת אשתו מנישואיה הראשונים: פריידה, בתו של שלמה מוורמס, אשת גומפרכט מבית הוורד האדום. נפטרה בסביבות 1516\nבכרטיס הרישום שלה הוא רשום כאביה החורג, ובשנים 1514 ו-1516 היא רשומה כחמותו של הרב מאיר מוורמס."], ["📖 מה כתב הנכד", "בספר \"יוסף אומץ\" (סימן 970) כתב ר' יוסף יוזפא האן מנוירלינגן, נינו של ישראל, בערך כך (תרגום מהכרטיס): \"סבי ומורי זליגמן ריינבך ז\"ל, בנו של הגאון ומפיץ התורה ישראל ריינבך. הוא נפטר כאן, בפרנקפורט, ב-רס\"ה\"."], ["👑 ברשימת רבני פרנקפורט", "האנציקלופדיה היהודית מונה אותו ברשימת הרבנים והחכמים של פרנקפורט, בלשון זו:\n\"⁦Israel Rheinbach; held office till 1505⁩\" (ישראל ריינבך, כיהן עד 1505).\nהרב שלפניו ברשימה: שמעון כהן, קרוב משפחתו של ר' משה מינץ.\nהרב שאחריו: ר' יצחק בן אליקים, שהשתתף באסיפת הרבנים בוורמס ב-1542.\nזהו מקור עצמאי מכרטיס הרישום ומהמצבה, והוא מאשר שישראל ריינבך אכן כיהן כרבה של פרנקפורט."], ["📛 \"שטרלה\": כינוי או טעות של הפקיד?", "בספרי העירייה של פרנקפורט הוא נקרא \"Strale\" ו-\"Strahel von Rheinbach\", ואחרי מותו \"אלמנת שטרלה\". שלושה חוקרים קראו את אותם מסמכים, והסבירו אחרת:\n• דיץ (1907) כותב: \"ריינבך: ישראל ⁦genannt⁩ שטרלה, בן אשר, מבית הוורד האדום, רב מ-1499\". המילה ⁦genannt⁩ פירושה \"המכונה\", כלומר דיץ מתייחס לשטרלה ככינוי שהאיש נשא.\n• אטלינגר, בכרטיס הרישום, כותב שזו טעות של פקיד העירייה, שלא הבין את השם \"ישראל\" שנאמר לו.\n• קספר-הולטקוטה (2010) קראה את \"אלמנת שטרלה\" והבינה ש\"שטרלה\" הוא שמה של האישה.\nבכל המקורות העבריים, המצבה והספר \"יוסף אומץ\", הוא נקרא ישראל בלבד.\nאין הכרעה בין שלוש הקריאות."]]}, "g": [{"f": "g327", "c": "כרטיס הרישום של הרב ישראל ריינבך, אב\"ד, נפטר 20.4.1505"}, {"f": "g331", "c": "ספר הורוביץ, עמ' 13: כתובת 142, מצבת הרב ישראל בן אשר ריינבך (1505)"}]}, {"n": "בת זעליגמן ז\"ק", "y": "–>1508", "s": [{"k": "frankfurt", "r": "ld", "t": ["אחרי 1508, פרנקפורט"], "u": 0}], "c": {"n": "בתו של ר' זעליגמן ז\"ק (שמה לא ידוע)", "rel": "אמו של ר' זליגמן ריינבך · אחותה של בריינלין וירשלר", "b": "", "d": "אחרי 1508, פרנקפורט", "place": "פרנקפורט", "note": "בתו של ר' זעליגמן ז\"ק מנירנברג. שמה לא נשמר. נישאה קודם לשלמה מוורמס. אחרי מותו ב-1497 נישאה לרב ישראל ריינבך, ועברה איתו לפרנקפורט. התאלמנה שוב ב-1505, ומופיעה ברשימות עד 1508.", "flag": "שמה ושנות חייה המדויקות לא ידועים.", "src": "כרטיס הרישום של בעלה \"ab\"d Jisrael Rheinbach, 20.4.1505\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1500–1559⁩, עמ' 17 · כרטיס הרישום של בנה \"Zeligman Rheinbach, um 1553\": שם, עמ' 165 · כרטיס הרישום של אביה ר' זעליגמן ז\"ק · כרטיס הרישום של פריידה \"Fraje zur roten Rose, um 1516\": שם, עמ' 61 · כרטיס הרישום של גוטלין \"Gutlin zur roten Rose, um 1549\": שם, עמ' 146", "x": [["📜 מה ידוע עליה", "• בעלה הראשון: שלמה מוורמס. כשאביה נפטר ב-1497, זכות המגורים שלו בנירנברג עברה גם לשלמה, חתנו.\n• שלמה נפטר ב-1497, ובאותה שנה היא נישאה בנירנברג לרב ישראל ריינבך.\n• 1498: יהודי נירנברג גורשו, והיא עברה עם בעלה לפרנקפורט, לבית הוורד האדום (Zur roten Rose).\n• בעלה נפטר ב-20.4.1505. ב-1505 וב-1508 היא רשומה \"אלמנת שטרלה\", כלומר אלמנת ישראל.\n• נפטרה בפרנקפורט אחרי 1508, השנה האחרונה שבה היא מופיעה ברשימות העיר.\n• היא אחותה של בריינלין, אשת מאיר וירשלר, שמופיעה באילן."], ["👨‍👩‍👦 ילדיה", "מנישואיה לשלמה מוורמס: פריידה, אשת גומפרכט מבית הוורד האדום. נפטרה בסביבות 1516\nבכרטיס הרישום של פריידה כתוב במפורש: אביה שלמה מוורמס מנירנברג, ואמה בתו של ר' זעליגמן ז\"ק מנירנברג. ישראל ריינבך רשום שם כאביה החורג.\nמנישואיה לרב ישראל ריינבך: ר' יהודה (זליגמן) ריינבך. נפטר בסביבות 1553. מופיע בכרטיס נפרד"]]}, "g": [{"f": "g327", "c": "כרטיס הרישום של הרב ישראל ריינבך, אב\"ד, נפטר 20.4.1505"}, {"f": "g408", "c": "כרטיס הרישום של ר' זעליגמן ז\"ק בנירנברג, נפטר 1497 — בו כתוב על חתנו שלמה מוורמס"}]}, {"n": "עדל אייסלשטיין", "y": "–~1562", "s": [{"k": "frankfurt", "r": "ld", "t": ["בסביבות 1562, פרנקפורט"], "u": 0}], "c": {"n": "עדל (אדל), בת בייפס מוורמס, אשת יצחק מאייסלשטיין", "rel": "אמה של שינלה גלנהויזן · סבתו של אייזיק גלנהויזן", "b": "", "d": "בסביבות 1562, פרנקפורט", "place": "פרנקפורט", "note": "בתם של בייפס מוורמס, מבית הדוב, ושל בת יואל מוורמס. בסביבות 1500 נישאה ליצחק מאייסלשטיין, וגרה איתו בבית הדוב (Zum Bär), ואחר כך בבית הוורד הלבן (Zur weissen Rose). אחרי מותו ב-1551 נשארה בוורד הלבן, וב-1555 שילמה עליו כאלמנה. נפטרה בסביבות 1562. ב-1565 שני חתניה, זליגמן גלנהויזן ויעקב מבית הפרח (Zur Blume), התדיינו זה עם זה על הירושה שלה.", "flag": "שנת הלידה ותאריך הפטירה המדויק לא ידועים. אין לה מצבה בספר הורוביץ.", "src": "כרטיס הרישום \"Adel Ysselstejn, um 1562\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 14 · הירושה: כרטיס הרישום \"Sejnlin zur weissen Rose, um 1585\", קובץ 1560–1599, עמ' 203", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Adel Ysselstejn\n📅 נפטרה: בסביבות 1562\n📜 רשומות:\n• 1502–1556: מסמכים רבים בבית הדוב ובבית הוורד הלבן\n• 1502: \"הזוג איזק ואדל, בת וייפוס\", בבית הדוב\n• 1511: בבית הוורד הלבן. כך גם ב-1514, 1530 ו-1533\n• 1555: משלמת כאלמנה על בית הוורד הלבן\n• 1560: אלמנה\n🏠 בתים: הדוב (Zum Bär), ואחר כך הוורד הלבן (Zur weissen Rose)\n👨 אביה: בייפס מוורמס, מבית הדוב. נפטר בסביבות 1501.\n👩 אמה: בת יואל מוורמס.\n💍 בעלה: בסביבות 1500, יצחק מאייסלשטיין בן יוסף. נפטר 10.8.1551."], ["👨‍👩‍👧 ילדיה", "לפי כרטיס הרישום של בעלה, יצחק:\nלייב אייסלשטיין, מבית הוורד הלבן (Zur weissen Rose). נפטר ב-1558\nבן שנישא בפולין. ב-1556 נרשם: \"זליגמן, בן אחיו של ... אייסלשטיין, שבא מפולין, כי היה כאן 6 שבועות\" (חלק מהמילים בכרטיס לא נקראות)\nחוה, אשת יעקב מבית הוורד הלבן, ואחר כך מבית הפרח (Zur Blume). נפטרה בסביבות 1571\nשינלה, אשת זליגמן גלנהויזן סג\"ל מבית הוורד הלבן. נפטרה בסביבות 1585. מופיעה בכרטיס נפרד"], ["🌳 אחיותיה נישאו לחיים מבית הדוב", "שתיים מאחיותיה של עדל, אנדה ואחריה גוטלין, היו נשותיו של חיים מבית הדוב, בן הירש (נפתלי) כ\"ץ ואחיה של הינדכה מפרידברג. כתוב בכרטיס הרישום של חיים ובכרטיס הרישום של אביה בייפס. העץ הקטן של חיים נמצא באילן מעל הירש כ\"ץ."]]}, "g": [{"f": "g425", "c": "כרטיס הרישום של עדל (אדל) אייסלשטיין, בת בייפס מוורמס, נפטרה בסביבות 1562"}, {"f": "g423", "c": "כרטיס הרישום של ר' יצחק מאייסלשטיין, \"ההולנדי\", מבית הדוב ומבית הוורד הלבן, נפטר 10.8.1551"}, {"f": "g426", "c": "כרטיס הרישום של בייפס מוורמס, מבית הדוב, נפטר בסביבות 1501"}]}, {"n": "יצחק מאייסלשטיין", "y": "–1551", "s": [{"k": "frankfurt", "r": "ld", "t": ["ח' באלול שי\"א (10.8.1551), פרנקפורט"], "u": 0}], "c": {"n": "ר' יצחק בר' יוסף מאייסלשטיין (Ysselstein), \"ההולנדי\" (Niederländer)", "rel": "אביה של שינלה גלנהויזן · סבו של אייזיק גלנהויזן", "b": "", "d": "ח' באלול שי\"א (10.8.1551), פרנקפורט", "place": "פרנקפורט", "note": "בנו של יוסף. בא מאייסלשטיין (IJsselstein) שבהולנד, ובפרנקפורט נקרא \"ההולנדי\". בסביבות 1500 נשא את עדל בת בייפס מוורמס, וגר איתה בבית הדוב (Zum Bär), ואחר כך בבית הוורד הלבן (Zur weissen Rose). יוהאנס פפרקורן (Pfefferkorn), שהחרים ספרים עבריים בפרנקפורט בשנים 1509–1510, החרים ספרים גם מביתו. נפטר ב-10.8.1551.", "flag": "שנת הלידה לא ידועה. בכרטיס הרישום כתוב שעל המצבה שי\"ב, אבל בספר הורוביץ כתוב שי\"א, והתאריך שבכרטיס (10.8.1551) מתאים לשי\"א. התאריכים לפני 1582 בכרטיסי הרישום הם לפי הלוח היוליאני.", "src": "כרטיס הרישום \"Jitshak Ysselstejn (Niederländer), 10.8.1551\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1559, עמ' 153 · נוסח המצבה: M. Horovitz (1901), עמ' 18, כתובת 200 (אבן 860)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Jitshak Ysselstejn (Niederländer)\n📅 נפטר: 10.8.1551\n🪦 המצבה (הורוביץ 200): \"יצחק בר' יוסף ז\"ל\", נקבר ח' באלול\n📜 רשומות:\n• מסמכים רבים בבית הדוב ובבית הוורד הלבן, ובספרי המס עד 1553\n• 1502: \"הזוג איזק מאייסלשטיין ואדל\", בבית הדוב. כך גם ב-1503\n• 1505: \"איזק מאייסלשטיין בבית הדוב\"\n• 1508: בבית הוורד הלבן. כך גם ב-1533\n• 1510–1545 ו-1549–1553: בבית הוורד הלבן\n• 1560: \"האלמנה אדל\"\n• פפרקורן (Pfefferkorn) החרים ספרים אצל \"איזק ההולנדי\"\n🏠 בתים: הדוב (Zum Bär), ואחר כך הוורד הלבן (Zur weissen Rose)\n👨 אביו: יוסף.\n👩 אמו: לא רשומה.\n💍 אשתו: בסביבות 1500, עדל בת בייפס. נפטרה בסביבות 1562."], ["נוסח המצבה (הורוביץ, כתובת 200, אבן 860)", "פה נטמן איש נאמן ר' יצחק בר' יוסף ז\"ל, נקבר יום ב' ח' אלול שי\"א לפ\"ק. תנצב\"ה א\"ס."], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום של יצחק:\nלייב אייסלשטיין, מבית הוורד הלבן (Zur weissen Rose). נפטר ב-1558\nבן שנישא בפולין. ב-1556 נרשם: \"זליגמן, בן אחיו של ... אייסלשטיין, שבא מפולין, כי היה כאן 6 שבועות\" (חלק מהמילים בכרטיס לא נקראות)\nחוה, אשת יעקב מבית הוורד הלבן, ואחר כך מבית הפרח (Zur Blume). נפטרה בסביבות 1571\nשינלה, אשת זליגמן גלנהויזן סג\"ל מבית הוורד הלבן. נפטרה בסביבות 1585. מופיעה בכרטיס נפרד"]]}, "g": [{"f": "g423", "c": "כרטיס הרישום של ר' יצחק מאייסלשטיין, \"ההולנדי\", מבית הדוב ומבית הוורד הלבן, נפטר 10.8.1551"}, {"f": "g424", "c": "ספר הורוביץ, עמ' 18: כתובת 200, מצבת ר' יצחק בר' יוסף (1551)"}, {"f": "g425", "c": "כרטיס הרישום של עדל (אדל) אייסלשטיין, בת בייפס מוורמס, נפטרה בסביבות 1562"}]}, {"n": "יצחק מדויץ", "y": "", "s": [{"k": "deutz", "r": "l", "t": ["דויץ (Deutz)"], "u": 0}], "c": {"n": "יצחק מדויץ (Deutz), אביה של יחת בלאד", "rel": "אביה של יחת בלאד · סבה של מונקלה", "b": "", "d": "לא ידוע", "place": "דויץ (Deutz)", "note": "אביה של יחת (גוטכן), אשת איצק בלאד מבית התפוח האדום בפרנקפורט. ידוע עליו רק מה שכתוב בכרטיסי הרישום של בתו ושל נכדתו מונקלה.", "flag": "שנות חייו לא ידועות. נבדק ב-19.11.2026: אין לו כרטיס רישום ואין לו מצבה בספר הורוביץ, ושמות הוריו לא נמצאו, ולכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום של בתו \"Jahet Blat, 16.5.1633\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1630–1634, עמ' 142 · כרטיס הרישום של נכדתו \"Munkle Gelnhausen, 5.3.1625\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1620–1629, עמ' 133 · נבדקו גם: M. Horovitz (1901), הכתובות משנים 1629–1634; A. Dietz, Stammbuch der Frankfurter Juden (1907), הפרק על משפחת דויץ", "x": [["📜 מה ידוע עליו בוודאות", "• שמו: יצחק. בכרטיס הרישום של בתו יחת כתוב: \"אביה: יצחק מדויץ\" (Jitshak zu Deutz).\n• בכרטיס הרישום של נכדתו מונקלה כתוב: \"אמה: גוטכן מדויץ, בת יצחק\".\n• בתו יחת (גוטכן) נישאה בסביבות 1583 לאיצק בלאד, וגרה איתו בפרנקפורט, בבית התפוח האדום (Zum roten Apfel). היא נפטרה שם ב-16.5.1633."], ["🔎 מה לא נמצא", "• כרטיס רישום משלו בכרטיסי אלה תולדות.\n• מצבה בספר הורוביץ.\n• אזכור בספר של דיץ על משפחות יהודי פרנקפורט (Stammbuch der Frankfurter Juden, 1907), גם לא בפרק על משפחת דויץ.\n• שנות חייו, שם אשתו ושמות הוריו."]]}, "g": [{"f": "g419", "c": "כרטיס הרישום של מונקלה, אשת אייזיק גלנהויזן, נפטרה 5.3.1625"}, {"f": "g422", "c": "כרטיס הרישום של יחת (גוטכן) בלאד, בת יצחק מדויץ, נפטרה 16.5.1633"}]}, {"n": "הירש (נפתלי) כ\"ץ", "y": "", "s": [{"k": "friedberg", "r": "l", "t": ["פרידברג (Friedberg)"], "u": 0}], "c": {"n": "הירש (נפתלי) הכהן (כ\"ץ) מפרידברג", "rel": "אביה של הינדכה מפרידברג · סבו של גומפרכט מבית החרב", "b": "", "d": "לא ידוע", "place": "פרידברג (Friedberg)", "note": "שמו הגרמני הירש, ושמו העברי נפתלי. כהן (כ\"ץ). גר בפרידברג. ילדיו: חיים מבית הדוב (Zum Bär) בפרנקפורט, שנפטר 4.1.1540, והינדכה מפרידברג, שנפטרה בסביבות 1550. ידוע עליו רק מה שכתוב בכרטיסי הרישום של שני ילדיו ועל מצבת בנו חיים.", "flag": "שנות חייו לא ידועות. נבדק ב-22.11.2026: שמות הוריו לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום של בתו \"Hindchen zu Friedberg, um 1550\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1559, עמ' 151 · כרטיס הרישום של בנו \"Ha'im Friedberg zum Bär, 4.1.1540\": קובץ 1500–1559, עמ' 117 · מצבת בנו: M. Horovitz (1901), עמ' 15, כתובת 172 (אבן 583) · מאגר המצבות epidat (Steinheim-Institut), ffb-696, נבדק 21.11.2026", "x": [["📜 מה ידוע עליו", "• בכרטיס הרישום של בתו, הינדכה מפרידברג: \"אביה: הירש מפרידברג, כ\"ץ\". בהערת העורך: \"נפתלי (בשמו הגרמני הירש) מפרידברג\", ושני ילדיו: חיים מבית הדוב והינדכה מפרידברג.\n• בכרטיס הרישום של בנו, חיים מבית הדוב: \"אביו: הירש כ\"ץ מפרידברג\".\n• לא נמצא לו כרטיס רישום משלו אצל אטלינגר."], ["🪦 שמו על מצבת בנו חיים (הורוביץ, כתובת 172)", "פה נטמן איש נאמן, הנד' חיים בר' נפתלי הכהן, הנפטר ביום א' ונקבר ביום ב' כ\"ה טבת שנת ש' לפ\"ק. תנצב\"ה א\"ס.\n(הורוביץ, עמ' 15, כתובת 172, אבן 583; epidat ffb-696. התאריך: 4.1.1540.)"], ["👨‍👩‍👧 ילדיו", "לפי כרטיסי הרישום של אטלינגר:\n• חיים מבית הדוב (Zum Bär) בפרנקפורט. נפטר 4.1.1540. נשא ב-1503 את אנדה בת וייבש, ואחרי מותה את אחותה גוטלה. ילדיו: גומפל ויקל מבית הדוב, שורלה אשת איסרליין אוירבך מבית המלאך, רייץ אשת שמואל לנדאו מבית השור, וגוטלה אשת גוטשלק מבית היונה.\n• הינדכה מפרידברג, אשת שלמה מפרידברג. נפטרה בסביבות 1550."]]}, "g": [{"f": "g461", "c": "כרטיס הרישום של חיים מבית הדוב, בן הירש כ\"ץ מפרידברג, נפטר 4.1.1540"}, {"f": "g462", "c": "ספר הורוביץ, עמ' 15: כתובת 172, מצבת חיים בר' נפתלי הכהן (1540)"}]}, {"n": "שמואל גלנהויזן", "y": "–~1572", "s": [{"k": "frankfurt", "r": "ld", "t": ["בסביבות 1572, פרנקפורט"], "u": 0}], "c": {"n": "שמואל גלנהויזן סג\"ל, מבית המנורה ומבית הוורד הלבן", "rel": "אביו של זליגמן גלנהויזן · סבו של אייזיק גלנהויזן", "b": "", "d": "בסביבות 1572, פרנקפורט", "place": "פרנקפורט", "note": "בנו של קופ מגלנהויזן סג\"ל. בסביבות 1540 נשא את גולדה. גר בבית המנורה (Zur Leuchte), ואחר כך בבית הוורד הלבן (Zur weissen Rose). על המצבה של בנו זליגמן הוא נקרא \"הקדוש ר' שמואל הלוי\".", "flag": "שנת הלידה לא ידועה. אין לו מצבה בספר הורוביץ. לא ידוע איך נפטר.", "src": "כרטיס הרישום \"Smul Gelnhausen, um 1572\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 88 · מצבת בנו: M. Horovitz (1901), עמ' 27, כתובת 293", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Smul Gelnhausen\n📅 נפטר: בסביבות 1572\n📖 קיצור תולדות חייו מופיע ב-Vorfahren, חוברת P, עמ' 4249.\n📜 רשומות (בתיקי הבתים, המנורה, הוורד הלבן והוורד האדום, מהשנים 1554–1570):\n• 1542 (?), 1549, 1552 (?): בני הזוג שמואל וגולדה\n• 1554/55: בבית המנורה\n• 1556–1562: בבית הוורד האדום. לפי העורך, כנראה טעות של סופר העירייה\n• 1566: \"שמואל מגלנהויזן מבית הוורד הלבן, בנו של קופ\"\n🪦 על מצבת בנו (הורוביץ 293): \"...הקדוש ר' שמואל הלוי\". העורך כותב: \"כלומר נפטר במוות אלים. איך?\"\n🏠 בתים: המנורה (Zur Leuchte), ואחר כך הוורד הלבן (Zur weissen Rose)\n👨 אביו: קופ מגלנהויזן סג\"ל. נפטר בסביבות 1555.\n👩 אמו: לא נרשמה.\n💍 אשתו: בסביבות 1540, גולדה.\n👨‍👩‍👧 ילדיו:\n• זליגמן גלנהויזן, מבית הוורד הלבן. נפטר 21.4.1584\n📝 הערת העורך: חותנו היה כנראה מאיר מגלנהויזן, שנפטר בסביבות 1568."]]}, "g": [{"f": "g427", "c": "כרטיס הרישום של שמואל גלנהויזן מבית המנורה ומבית הוורד הלבן, נפטר בסביבות 1572"}, {"f": "g428", "c": "כרטיס הרישום של קופ מגלנהויזן סג\"ל, נפטר בסביבות 1555"}]}, {"n": "גולדה גלנהויזן", "y": "", "s": [{"k": "frankfurt", "r": "l", "t": [], "u": 0}], "c": {"n": "גולדה, אשת שמואל גלנהויזן", "rel": "אמו של זליגמן גלנהויזן · סבתו של אייזיק גלנהויזן", "b": "", "d": "לא ידוע", "place": "פרנקפורט", "note": "בסביבות 1540 נישאה לשמואל גלנהויזן, וגרה איתו בבית המנורה (Zur Leuchte), ואחר כך בבית הוורד הלבן (Zur weissen Rose). לפי עורך כרטיסי הרישום, היא הייתה כנראה בתו של מאיר מגלנהויזן, וגרה אצלו בשנים הראשונות אחרי החתונה.", "flag": "שנות חייה לא ידועות. הקשר למאיר מגלנהויזן הוא \"כנראה\" אצל העורך, ולכן הקו באילן מקווקו. לא נמצא כרטיס רישום משלה.", "src": "כרטיס הרישום של בעלה \"Smul Gelnhausen, um 1572\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 88 · כרטיס הרישום \"Majer aus Gelnhausen, um 1568\", קובץ 1560–1599, עמ' 48", "x": [["📜 מה ידוע עליה", "• ברשימות 1542 (?), 1549 ו-1552 (?): \"בני הזוג שמואל וגולדה\".\n• בכרטיס הרישום של מאיר מגלנהויזן: \"גולדה, אשת שמואל מגלנהויזן מבית המנורה ואחר כך מבית הוורד הלבן, הייתה כנראה בתו. כנראה גרה אצל אביה בשנות המזונות\", כלומר בשנים הראשונות אחרי החתונה, שבהן הזוג גר אצל הורי הכלה."], ["👨‍👩‍👧 ילדיה", "לפי כרטיס הרישום של בעלה:\nזליגמן גלנהויזן, מבית הוורד הלבן. נפטר 21.4.1584. מופיע בכרטיס נפרד"]]}, "g": [{"f": "g427", "c": "כרטיס הרישום של שמואל גלנהויזן מבית המנורה ומבית הוורד הלבן, נפטר בסביבות 1572"}, {"f": "g429", "c": "כרטיס הרישום של מאיר מגלנהויזן, הבוימייסטר, נפטר בסביבות 1568"}]}, {"n": "גוטלין", "y": "–~1549", "s": [{"k": "frankfurt", "r": "ld", "t": ["בערך 1549, פרנקפורט"], "u": 0}], "c": {"n": "גוטלין, אשתו של הרב מאיר מוורמס, מבית הוורד האדום", "rel": "כנראה אמה של שרה", "b": "", "d": "בערך 1549, פרנקפורט", "place": "פרנקפורט", "note": "אשתו של הרב מאיר מוורמס. אחרי מותו ב-1540 היא שילמה בעצמה את מס הבית על הוורד האדום, מ-1543 ואילך. כנראה אמה של שרה.", "flag": "שנות חייה משוערות. שמות הוריה לא ודאיים — שני מקורות סותרים זה את זה. גם זה שהיא אמה של שרה אינו ודאי.", "src": "כרטיס הרישום שלה \"Gutlin zur roten Rose, um 1549\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1500–1559⁩, עמ' 146 · כרטיס הרישום של בעלה \"Majer aus Worms zur roten Rose, 22.7.1540\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1500–1559⁩, עמ' 118 · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), עמ' 43, 384, 580 ו-581 · Alexander Dietz, Stammbuch der Frankfurter Juden (1907), ערך \"Rheinbach\"", "x": [["📜 מה ידוע עליה", "• נישאה למאיר בסביבות 1505, לפי כרטיס הרישום שלה. קספר-הולטקוטה כותבת בסביבות 1511.\n• בשנים 1505, 1508, 1512, 1514, 1530 ו-1533 היא נזכרת ברשימות העיר יחד עם בעלה: \"מאיר וגוטלין מבית הוורד האדום\".\n• מ-1543, אחרי מות בעלה, היא משלמת בעצמה את מס הבית.\n• נפטרה בסביבות 1549."], ["👪 הוריה — כתוב בכרטיס הרישום שלה", "בכרטיס הרישום שלה כתוב במפורש:\n• אביה: גומפרכט מבית הוורד האדום. נפטר בסביבות 1507.\n• אמה: פריידה מוורמס, בתו של שלמה. נפטרה בסביבות 1516.\nפריידה היא בתה של אשת הרב ישראל ריינבך מנישואיה הראשונים, ולכן גוטלין היא נכדתה החורגת של משפחת ריינבך. ב-1514 וב-1516 פריידה אף רשומה בספרי העיר כחמותו של הרב מאיר, בעלה של גוטלין.\nהערה: אצל קספר-הולטקוטה, עמ' 580, מופיעה גוטלין אחרת, בת גומפרכט מבית הצבי (Zum Hirsch) ונכדתו של שמעון מוויזנאו. לפי כרטיסי הרישום אלה שתי נשים שונות."], ["❓ האם היא באמת אמה של שרה", "כנראה כן, אבל לא ודאי. ההסבר המלא נמצא בכרטיס של שרה."]]}, "g": [{"f": "g409", "c": "כרטיס הרישום של גוטלין מבית הוורד האדום, אשת הרב מאיר, נפטרה בסביבות 1549"}, {"f": "g328", "c": "כרטיס הרישום של הרב מאיר בן אברהם מוורמס, מבית הוורד האדום (Zur roten Rose), נפטר 22.7.1540"}]}, {"n": "הרב מאיר", "y": "", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט  ·  במקור מוורמס", "22.7.1540, פרנקפורט"], "u": 0}], "c": {"n": "הרב ר' מאיר בן אברהם מוורמס, מבית הוורד האדום (Zur roten Rose)", "rel": "כנראה אביה של שרה · חותנו של ר' זליגמן ריינבך", "b": "בערך 1485 (בהשערה ברורה)", "d": "22.7.1540, פרנקפורט", "place": "פרנקפורט · במקור מוורמס", "note": "רב עשיר ומוכר בפרנקפורט במחצית הראשונה של המאה ה-16. גר בבית הוורד האדום. כנראה אביה של שרה — אבל זה לא ודאי, וההסבר המלא נמצא בכרטיס שלה.", "flag": "שנת הלידה משוערת. שמות הוריו לא ודאיים — שלושה מקורות נותנים שלוש תשובות. גם זה שהוא אביה של שרה אינו ודאי.", "src": "כרטיס הרישום \"Majer aus Worms zur roten Rose, 22.7.1540\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1500–1559⁩, עמ' 118 · נוסח המצבה: M. Horovitz (1901), עמ' 15, כתובת 173 (אבן 248) · Alexander Dietz, Stammbuch der Frankfurter Juden (1907), משפחות 221, 224, 467 ו-612 · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), עמ' 43, 384, 580 ו-581", "x": [["📜 מה ידוע עליו", "• גר בבית הוורד האדום (Zur roten Rose) ברחוב היהודים בפרנקפורט.\n• שילם את מס הבית על הוורד האדום מ-1506 ועד 1542. מ-1543 משלמת אלמנתו גוטלין.\n• נזכר בספרי העיר שוב ושוב בין ⁦1505–1540⁩.\n• היה עשיר. דיץ קורא לו \"הרב מאיר מוורמס העשיר\", וכותב שניהל במשך שנים מסחר בבדים יחד עם בנו שלום ועם מחותנו בר מבית האשכרוע (Zum Buchsbaum).\n• נפטר ב-י\"ח באב ה'ש', 22.7.1540."], ["⚖️ רב עם סמכות", "שלושה מקורות נפרדים קוראים לו רב: כרטיס הרישום כותב \"הרב מאיר בן אברהם\", דיץ כותב \"הרב מאיר מוורמס\", וקספר-הולטקוטה כותבת \"מאיר מוורמס, רב\".\nבתיקי ארכיון העיר רשומים שני מעשים שלו:\n• 1521 — החרם שהטיל על יהודי טריר.\n• 1537 — חוות דעת הלכתית בסכסוך בין לייב אופנהיים ובין אדל.\nבכרטיס הרישום כתוב גם שיש עליו ביוגרפיה קצרה בכתב העת \"Vorfahren\", כרך O.2 עמ' 517. לא הגענו אליה."], ["👨‍👩‍👧‍👦 ילדיו", "לפי כרטיס הרישום שלו:\n• שלום גרוטוול, מבית האשכרוע (Zum Buchsbaum) ואחר כך מבית הארנב (Zum Hasen)\n• יצחק, מבית הוורד האדום ואחר כך בברנקסטל. נפטר בסביבות 1565\n• אברהם, מבית הוורד האדום ואחר כך מבית החסידה (Zum Storch). נפטר בסביבות 1543\n• פייגל, אשת מון בכרך מבית הוורד האדום ואחר כך מבית התרנגול האדום (Zum roten Hahn). נפטרה ב-19.4.1590\n• גולדה, אשת אברלין דירוונגן מבית הוורד האדום\nדיץ מוסיף בן נוסף: גומפרכט מבית הכוכב (Zum Stern), שנזכר ב-1520.\nהעורך של כרטיסי הרישום רשם ברשימה הזאת גם את זליגמן ריינבך עצמו, לפי לשון הרשומה מ-1554 \"בן\". זו כנראה אותה טעות.\nשרה לא מופיעה ברשימה."], ["🌳 מי יצא ממנו", "לפי ספר השושלות של דיץ:\n• מבנו שלום יצאו משפחות קאן, שוך, שטרן, האס ובר — מהמשפחות העשירות ברחוב היהודים.\n• מבתו פייגל יצאה משפחת האן, ודרך בנה יצחק, שעבר ב-1567 לבית המגן האדום (Zum roten Schild) — משפחת רוטשילד.\n• מבנו גומפרכט יצא ענף \"ורמס מבית הכוכב\", ומצאצאיו הרב מאיר שטרן."], ["👪 הוריו — שלוש תשובות שונות", "אין הכרעה. שלושה מקורות אומרים שלושה דברים:\n• כרטיס הרישום: אביו אברהם מוורמס, אמו גולדה מבית הוורד הלבן (Zur weissen Rose), שנפטרה בסביבות 1517.\n• קספר-הולטקוטה: \"בנו של אנזלם מוורמס\". אנזלם הוא אמשל, כלומר אשר.\n• דיץ: \"נראה שהיה נכד, ולא בן, של פיבוש מוורמס\" — ראש משפחת ורמס, שישבה בפרנקפורט מ-1485 והוא נפטר לפני 1501. דיץ לא מוסר את שם האב.\nנקודה מעניינת: אלמנתו של פיבוש נקראה גם היא גולדה, והיא גרה מ-1509 בבית הוורד הלבן. ייתכן שזו אותה אישה שכרטיס הרישום קורא לה אמו."], ["✡️ משפחת כהנים", "דיץ מתאר את משפחת ורמס של פרנקפורט כך: \"ורמס, נקראת גם ורמזר, אנגל, שטורך, שטרן, וכיוון שהם כהנים גם כהן וכ\"ץ\". הוא מוסיף שהשמות הפרטיים האופייניים למשפחה היו מאיר ואמשל.\nאם מאיר שייך למשפחה הזאת, הוא היה כהן."], ["🪦 המצבה", "בספר המצבות של הורוביץ, כתובת 173: \"פה מאיר עיני הגולה, וגם דלה מתורתו אומנתו, הרבן מהור\"ר מאיר בר' אברהם ז\"ל, הנעדר ביום ה' י\"ח אב ש' לפ\"ק. תנצב\"ה.\" (י\"ח באב ה'ש', 22.7.1540.)"], ["❓ האם הוא באמת אביה של שרה", "כנראה כן, אבל לא ודאי. ההסבר המלא — המסמך עצמו, מה שתומך ומה שלא — נמצא בכרטיס של שרה."]]}, "g": [{"f": "g328", "c": "כרטיס הרישום של הרב מאיר בן אברהם מוורמס, מבית הוורד האדום (Zur roten Rose), נפטר 22.7.1540"}, {"f": "g332", "c": "ספר הורוביץ, עמ' 15: כתובת 173, מצבת הרב מאיר בן אברהם (1540)"}]}, {"n": "רייזלן הכהן", "y": "~1517–1596", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית השער (Zur Pforte), ואחר כך בית הדלת הירוקה (Zur grünen Tür)", "כ\"ז בכסלו שנ\"ז (17.12.1596), פרנקפורט"], "u": 0}], "c": {"n": "רייזלן הכהן, בת ר' אורי", "rel": "אמה של בונלין גינצבורג · אשתו של ר' קלמן הכהן", "b": "בערך 1515–1520 (בהשערה ברורה)", "d": "כ\"ז בכסלו שנ\"ז (17.12.1596), פרנקפורט", "place": "פרנקפורט, בית השער (Zur Pforte), ואחר כך בית הדלת הירוקה (Zur grünen Tür)", "note": "בתו של ר' אורי, ואשתו של ר' קלמן הכהן. גרה בפרנקפורט כל חייה, ונפטרה שם ב-1596. על המצבה שלה כתוב שביתה היה פתוח לאורחים, ושתמכה בלומדי תורה.", "flag": "שנת הלידה היא הערכה, לפי נישואיה בסביבות 1537.", "src": "כרטיס הרישום \"Rözlen zur grünen Tür, 17.12.1596\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 297 · נוסח המצבה: M. Horovitz (1901), עמ' 33, כתובת 348 (אבן 2008) · מסירת המשפחה, 9.11.2026", "x": [["📅 חייה בקצרה", "• נולדה כנראה בין 1515 ל-1520 (בהשערה ברורה), כי התחתנה בסביבות 1537.\n• בסביבות 1537: התחתנה עם ר' קלמן הכהן.\n• 1560: היא ובעלה רשומים בבית השער (Zur Pforte).\n• 1570: אשתו של נתן מבית התאשור (Zum Buchsbaum) הייתה בת של אחיה.\n• בסביבות 1583: בעלה נפטר. היא נרשמה \"אלמנת קלמן הזקן\", ומ-1585 עד 1592 רשומה כאלמנה.\n• 1596: גרה בבית הדלת הירוקה (Zur grünen Tür), שהופרד מבית השער ב-1574.\n• 17.12.1596 (כ\"ז בכסלו שנ\"ז), יום חמישי: נפטרה ונקברה בבית הקברות העתיק בפרנקפורט."], ["🪦 המצבה שלה", "הנוסח, לפי הורוביץ (כתובת 348):\n\"רויזלן אשת מהר\"ר קלמן. פה טמונה אשה חשובה והגונה, וביתה היתה בית מלונה לכל באי הנה והנה, ותפלתה בכל כוונה וחם, לעמולי תורה ולמדיה, וכל ימיה לא כבו נרותיה, הנכבדת מרת רויזלן בת ר' אורי ז\"ל, נפטרת ונקברת יום ה' כ\"ז כסליו שנת שנ\"ז לפ\"ק. תנצב\"ה.\"\n\nבשפה פשוטה: היא הייתה אישה חשובה. ביתה היה פתוח לכל אורח, היא התפללה בכוונה, ועזרה ללומדי תורה."], ["👨‍👩‍👧 משפחתה", "• אביה: ר' אורי. מופיע בכרטיס נפרד.\n• אמה: שמה לא נרשם.\n• אח: היה לה אח ששמו לא ידוע. בתו הייתה אשתו של נתן מבית התאשור (Zum Buchsbaum).\n• בעלה: ר' קלמן הכהן (קלונימוס), בן הרב קלמן נתן הכהן. נפטר בסביבות 1583. מופיע בכרטיס נפרד.\n• ילדיה:\n   – ר' משה נתן (נטע) הכהן, מבית המגן הירוק (Zum grünen Schild). נפטר ב-21.1.1585. מופיע בכרטיס נפרד.\n   – בונלין, אשת ר' שלמה זלמן רייזמן מבית השער (Zur Pforte). נפטרה בסביבות 1619. מופיעה בכרטיס נפרד.\n   – לבעלה היו עוד שני בנים, פייבש וזלמן. כרטיסי הרישום לא אומרים מי אמם."], ["🔎 מה לא נמצא", "• שנת הלידה המדויקת.\n• שם אמה ושם אחיה."]]}, "g": [{"f": "g277", "c": "ספר הורוביץ, עמ' 33: כתובת 348, מצבת רייזלן אשת ר' קלמן (1596)"}, {"f": "g189", "c": "כרטיס הרישום של רייזלן, אשת ר' קלמן · פרנקפורט"}]}, {"n": "ר' קלמן הכהן", "y": "–~1583", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית השער (Zur Pforte), ואחר כך בית הדלת הירוקה (Zur grünen Tür)"], "u": 0}], "c": {"n": "ר' קלמן הכהן (קלונימוס), מבית הדלת הירוקה (Zur grünen Tür)", "rel": "אביה של בונלין גינצבורג", "b": "", "d": "בערך 1583", "place": "פרנקפורט, בית השער (Zur Pforte), ואחר כך בית הדלת הירוקה (Zur grünen Tür)", "note": "רב בפרנקפורט. שמו המלא: מורנו הרב רבי קלונימוס. גר בבית השער (Zur Pforte), ואחר כך בבית הדלת הירוקה (Zur grünen Tür), שהופרד מבית השער (Zur Pforte). יש עליו רשומות רבות מהשנים 1537–1583. ב-1560 נרשם עם אשתו רייזלין בבית השער (Zur Pforte). ב-1573 הופחת המס שלו, ובמסמך הוא נקרא \"הרב והיהודי הזקן\". נפטר בסביבות 1583: ברשומות 1583/84 אשתו כבר נקראת \"אלמנת קלמן הזקן\".\nאביו: קלמן מבית הקלחת (Zum Kessel), ואחר כך מבית השער (Zur Pforte), בן נטע כ\"ץ. נפטר בסביבות 1516.\nאמו: שינליין (Sejnlin).", "flag": "שנת הפטירה משוערת. שנת הלידה לא ידועה.", "src": "כרטיס הרישום \"Kalman zur Pforte, dann z. grünen Tür, um 1583\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 174 · מצבת בנו זלמן: M. Horovitz (1901), עמ' 38, כתובת 387 (אבן 2166) · מסירת המשפחה, 9.11.2026 · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), לפי ארכיון העיר פרנקפורט, עמ' 55, 57 ו-58 · Alexander Dietz, Stammbuch der Frankfurter Juden (1907), משפחה 85 \"Cahn\", עמ' 86 ואילך (מאשר את השושלת)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Kalman zur Pforte, dann zur grünen Tür\n📅 נפטר: בסביבות 1583\n🪦 המצבה: אין לו מצבה משלו. במצבת בנו זלמן (הורוביץ 387, 19.2.1604) הוא נקרא \"מוהרר\"ק\", כלומר מורנו הרב רבי קלונימוס.\n📖 תיאור חייו המפורט מופיע ב-Vorfahren, חוברת 1, עמ' 257.\n📜 רשומות רבות (בתיקי הבתים, השער והדלת הירוקה, מהשנים 1537–1583):\n• 1560: בני הזוג קלמן ורייזלין בבית השער\n• 1573: הופחת המס של \"הרב והיהודי הזקן\"\n• מ-1585: רייזלה, אלמנת קלמן\n🏠 בית: השער (Zur Pforte), ואחר כך הדלת הירוקה (Zur grünen Tür), שהופרד מבית השער\n👨 אביו: קלמן מבית הקלחת (Zum Kessel), ואחר כך מבית השער, בן נטע כ\"ץ. נפטר בסביבות 1516.\n👩 אמו: שינליין.\n💍 אשתו: רייזלן בת אורי. נישאו כנראה בסביבות 1537. נפטרה 17.12.1596."], ["אזכורו במצבת בנו זלמן (הורוביץ, כתובת 387, אבן 2166)", "מצבתו של ר' קלמן עצמו לא נמצאה. שמו מופיע במצבת בנו זלמן, שנפטר ב-1604:\n\"זלמן בן מוהרר\"ק הכהן ז\"ל. פה טמון ישר ונאמן, ככלכל והימן ובא שלו'. פה קבור צדיק ונבור, חלף עבר בן עולם הבא, גואל ושומר לסבור וגמור מהררי עולם, הוא שלמה בן מהר\"ר קלונמוס הכהן זלה\"ה, נפטר יום ח\"י אדר ראשון שס\"ד לפ\"ק.\""], ["👩‍🦱 אשתו", "רייזלן, בת אורי. נישאו בערך ב-1537. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nפייבש, מבית השער (Zur Pforte) ואחר כך מבית הגשרון (Zur Stege). נפטר ב-8.6.1571\nר' משה נתן (נטע), מבית המגן הירוק (Zum grünen Schild). נפטר ב-21.1.1585. מופיע בכרטיס נפרד\nזלמן, מבית הדלת הירוקה (Zur grünen Tür). נפטר ב-19.2.1604\nבונלין, אשת זלמן כ\"ץ מבית השער (Zur Pforte). נפטרה בסביבות 1619. מופיעה בכרטיס נפרד\nיכנט (Jachant), הנקראת גם אגתה, מבית המראה (Zum Spiegel). אשת הירץ מבית השמש (Zur Sonne). ב-1569 נתנה שלוש הלוואות משלה. מופיעה רק בספר המחקר של קספר-הולטקוטה, לא בכרטיס הרישום\nהספר מונה גם \"בלה\". ייתכן שזו בונלין (לא ודאי)"], ["👬 אחיו ר' מאיר", "ר' קלמן הכהן ור' מאיר הכהן מבית השער (Zur Pforte) היו אחים. ההורים של שניהם: הרב קלמן נתן הכהן ושינליין.\nהבת של קלמן, בונלין, התחתנה עם הבן של מאיר, ר' שלמה זלמן רייזמן. כלומר בני דודים התחתנו זה עם זה."]]}, "g": [{"f": "g278", "c": "ספר הורוביץ, עמ' 38: כתובת 387, מצבת זלמן בן ר' קלמן הכהן (1604), שבה מוזכר ר' קלמן"}, {"f": "g188", "c": "כרטיס הרישום של ר' קלמן הכהן · פרנקפורט"}]}, {"n": "ר' מאיר הכהן מבית השער (Zur Pforte)", "y": "–~1557", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית השער (Zur Pforte)"], "u": 0}], "c": {"n": "רבי מאיר הכהן, מבית השער (Zur Pforte)", "rel": "אביו של ר' שלמה זלמן הכהן גינצבורג (רייזמן) · בנו של הרב קלמן נתן הכהן", "b": "", "d": "בערך 1557", "place": "פרנקפורט, בית השער (Zur Pforte)", "note": "בנו של הרב קלמן נתן הכהן מבית הקלחת (Zum Kessel) ושל שינליין. גר בפרנקפורט בבית השער (Zur Pforte). ב-1530 נרשם שם כחתנה של שינלין, ובשנים 1537 עד 1557 שילם את שכר הדירה על הבית. לפי דף השושלת נפטר בשנת שי\"ז (בערך 1557). אחרי מותו שימש אחיו זלמן אפוטרופוס של ילדיו.", "flag": "שנת הלידה לא ידועה. שנת הנישואין מסומנת בכרטיס הרישום בסימן שאלה.", "src": "דף השושלת ששלחה המשפחה · כרטיס הרישום מפרנקפורט, 9.11.2026 · כרטיס הרישום \"Majer zur Pforte, um 1557\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599, עמ' 189 · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), לפי ארכיון העיר פרנקפורט, עמ' 19 · Alexander Dietz, Stammbuch der Frankfurter Juden (1907), משפחה 85 \"Cahn\", עמ' 86 ואילך (מאשר את השושלת)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Majer zur Pforte\n📅 נפטר: בסביבות 1557\n⚰️ פנקס הקבורה: בשנת 1631 מוזכרת \"למעלה בצד הצפוני\" המצבה של מאיר בן קלונימוס הכהן\n🪦 המצבה: בכרטיס אין מספר הורוביץ, אף שפנקס הקבורה ראה את מצבתו ב-1631.\n📜 רשומות (בתיק הבית, השער, מהשנים 1530–1557):\n• 1530: מאיר, \"חתנה של שינלין\", ואשתו גוטלין בבית השער. כך גם ב-1533\n• 1530–1533: מאיר וגוטלין רשומים כבעלי זכות ישיבה\n• 1537–1557: שילם את שכר הבית בבית השער\n• 1558: כבר לא היה בחיים. אפוטרופוס ילדיו היה אחיו זלמן מבית השער\n🏠 בית: השער (Zur Pforte)\n👨 אביו: קלמן מבית הקלחת (Zum Kessel), ואחר כך מבית השער, בן נתן כ\"ץ. נפטר בסביבות 1516.\n👩 אמו: שינליין.\n💍 אשתו: גוטלין בת שאול בינגן. נישאו כנראה בסביבות 1529. נפטרה בסביבות 1580."], ["👩‍🦱 אשתו", "גוטלין, בת שאול מבינגן. נישאו כנראה בערך ב-1529. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nזלמן רייזמן, מבית השער (Zur Pforte). נפטר בערך ב-1591. מופיע בכרטיס נפרד\nפייבש, מבית המניפה (Zum Wedel). נפטר ב-16.7.1606\nברנדלין, נזכרת בשנים 1549 ו-1554. כנראה נפטרה ב-3.10.1577"], ["👬 אחיו ר' קלמן", "ר' מאיר הכהן מבית השער ור' קלמן הכהן היו אחים. ההורים של שניהם: הרב קלמן נתן הכהן ושינליין.\nהבן של מאיר, ר' שלמה זלמן רייזמן, התחתן עם הבת של קלמן, בונלין. כלומר בני דודים התחתנו זה עם זה."], ["🏠 הבית השער ברשימת הדיירים", "ברשימת הדיירים של רחוב היהודים (השנה לא נכתבה בספר, אבל לפי הנתונים זה אחרי מותו של מאיר) רשום בבית השער:\n\"אלמנתו של מאיר כהן, גוטלין, עם בניה פייבש (ואשתו הינדלין) וזלמן (ואשתו שינלה), וגם גיסה של גוטלין, קלמן כהן (ואשתו רוז), ובנו זלמן (ואשתו גוטכן).\"\nזה בדיוק מבנה המשפחה שבאילן: מאיר וקלמן אחים, גוטלין ורייזלן הנשים, והבנים זלמן רייזמן וזלמן מבית הדלת הירוקה.\nהרשימה הזאת באה מארכיון העיר פרנקפורט, ולא מכרטיסי הרישום. לכן היא אישור עצמאי."]]}, "g": [{"f": "g192", "c": "כרטיס הרישום של ר' מאיר הכהן מבית השער (Zur Pforte) · פרנקפורט"}]}, {"n": "גוטלין הכהן", "y": "–~1580", "s": [{"k": "bingen", "r": "l", "t": ["בינגן (Bingen), ואחר כך פרנקפורט, בית השער (Zur Pforte)"], "u": 0}, {"k": "frankfurt", "r": "l", "t": ["בינגן (Bingen), ואחר כך פרנקפורט, בית השער (Zur Pforte)"], "u": 0}], "c": {"n": "גוטלין הכהן (aus Bingen), בת שאול", "rel": "אשתו של ר' מאיר הכהן מבית השער (Zur Pforte) · אמו של ר' שלמה זלמן רייזמן", "b": "", "d": "בערך 1580", "place": "בינגן (Bingen), ואחר כך פרנקפורט, בית השער (Zur Pforte)", "note": "בתם של הפרנס שאול בינג מבינגן ושל צרלין. נישאה לר' מאיר הכהן מבית השער (Zur Pforte), כנראה בערך ב-1529. ב-1530 וב-1533 היא נרשמה עם בעלה בבית השער (Zur Pforte), ובעלה נרשם שם כחתנה של שינלין. נפטרה בערך ב-1580.", "flag": "שנת הפטירה משוערת. שנת הלידה לא ידועה. בכרטיס הרישום שנת הנישואין מסומנת בסימן שאלה.", "src": "כרטיס הרישום \"Gutlin zur Pforte, um 1580\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 156 · מסירת המשפחה, 9.11.2026", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Gutlin zur Pforte\n📅 נפטרה: בסביבות 1580\n🪦 המצבה: בכרטיס אין מספר הורוביץ, כלומר מצבתה לא נמצאה אצל הורוביץ.\n📖 קיצור תולדות חייה מופיע ב-Vorfahren, חוברת 1, עמ' 346.\n📜 רשומות:\n• 1530: בני הזוג מאיר, \"חתנה של שינלין\", וגוטלין בבית השער. כך גם ב-1533\n• 1530–1533: מאיר וגוטלין רשומים כבעלי זכות ישיבה\n• 1556: גרה אצל קלמן\n• 1558 ו-1576: נקנסה\n• מ-1565, ובשנים 1567, 1577 ו-1578: רשומה כאלמנה\n🏠 בית: השער (Zur Pforte)\n👨 אביה: שאול מבינגן, מבית הדג (Zum Fisch). נפטר בסביבות 1538.\n👩 אמה: צרלין.\n💍 בעלה: מאיר בן קלמן כ\"ץ. נישאו כנראה בסביבות 1529. נפטר בסביבות 1557."], ["👨‍🦱 בעלה", "ר' מאיר הכהן, מבית השער (Zur Pforte), בן הרב קלמן נתן הכהן. נפטר בסביבות 1557. מופיע בכרטיס נפרד"], ["👨‍👩‍👧 ילדיה", "לפי כרטיס הרישום של בעלה. הוא לא מציין מי האם, אבל היא אשתו היחידה הידועה:\nר' שלמה זלמן רייזמן, מבית השער (Zur Pforte). נפטר בסביבות 1591. לפי כרטיס הרישום שלו היא אמו. מופיע בכרטיס נפרד\nפייבש, מבית המניפה (Zum Wedel). נפטר ב-16.7.1606\nברנדלין. נזכרת ב-1549 וב-1554. כנראה נפטרה ב-3.10.1577"]]}, "g": [{"f": "g282", "c": "כרטיס הרישום של גוטלין מבית השער (Zur Pforte), בת שאול מבינגן, נפטרה בסביבות 1580"}]}, {"n": "יצחק בינגן", "y": "–~1556", "s": [{"k": "mainz", "r": "l", "t": [], "u": 0}, {"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית הסולם (Zur Leiter)", "1555 או 1556, פרנקפורט"], "u": 1}], "c": {"n": "יצחק בן משה בינגן", "rel": "בנם של הר\"ר משה בינגן ממיינץ ופריידל · אחיו של הר\"ר מאיר בינגן", "b": "", "d": "1555 או 1556, פרנקפורט", "place": "מיינץ ← פרנקפורט, בית הסולם (Zur Leiter)", "note": "בנם של הר\"ר משה בינגן ממיינץ ושל פריידל, ואחיו של מאיר בינגן. ב-1533 נרשם יחד עם מאיר בבית הסולם (Zur Leiter) בפרנקפורט, עם אפוטרופסים, בתור \"בני משה מבינגן, לשעבר מבית הבלוט (Zur Eichel) במיינץ\". מצבתו לא נמצאה בספר הורוביץ. בספר יש שתי מצבות של \"מאיר בר יצחק\" ממשפחת בינגן: כתובת 278 (נפטר ה' בניסן של\"ט, 1579) וכתובת 290 (נפטר בשבת ט\"ו בשבט שד\"ם, 1584).", "flag": "שנות חייו לא ידועות. בהשערה ברורה, אחד משני ה\"מאיר בר יצחק\" ממשפחת בינגן, או שניהם, הם בניו או צאצאיו. לכן הם לא נוספו לעץ.", "src": "כרטיס הרישום של הר\"ר מאיר בינגן מפרנקפורט · M. Horovitz (1901), עמ' 25 ו-27, כתובות 278 ו-290; מפתח השמות, עמ' 699 · כרטיס הרישום \"der lange Jitshak Bingen, 1555 oder 56\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599, עמ' 178", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 der lange Jitshak Bingen (\"יצחק בינגן הארוך\")\n📅 נפטר: ב-1555 או 1556\n🪦 המצבה: בכרטיס אין מספר הורוביץ.\n📜 רשומות (בתיקי הבתים, הסולם והכוכב, מהשנים 1530–1556):\n• 1530: הוחלט לקבל את האחים מאיר ויצחק כתושבים\n• 1533: האפוטרופסים רשמו את מאיר ויצחק, בני משה מבינגן, לשעבר מבית הבלוט (Zur Eichel) במיינץ\n• 1531–1536: גר בבית הסולם. 1537–1557: בבית הכוכב\n• 1553: \"יצחק הארוך מבית הכוכב\" נעצר בחשד לעבירת מטבע\n• 1556: כבר לא היה בחיים. אפוטרופסי ילדיו היו בנו הבכור, מאיר מבית הסולם, ואחיו, גוטשלק מבית הדג (Zum Fisch)\n🏠 בית: הסולם (Zur Leiter), שהוא ואחיו היו דייריו הראשונים, ואחר כך, בעקבות נישואיו, הכוכב (Zum Stern)\n👨 אביו: משה בינגן במיינץ, או בווילצבאך.\n👩 אמו: לא נרשמה.\n💍 אשתו: רבקה בת גומפרכט כ\"ץ. נישאו בסביבות 1531. נפטרה בשנות ה-1550.\n📝 הערת העורך: אחיו היו מאיר מבית הסולם (נפטר בסביבות 1559) וגוטשלק מבית הדג (נפטר 5.8.1570). ייתכן שאחותו הייתה יוטא, שנפטרה ב-12.9.1581."], ["👩‍🦱 אשתו", "רבקה, בת גומפרכט כ\"ץ. נישאו בסביבות 1531. נפטרה בשנות ה-1550"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nמאיר בינגן, מבית הכוכב (Zum Stern) ואחר כך מבית הירגזי (Zur Meise). נפטר ב-1.4.1579"]]}, "g": [{"f": "g266", "c": "כרטיס הרישום של יצחק בינגן \"הארוך\", מבית הסולם (Zur Leiter) ומבית הכוכב (Zum Stern), נפטר 1555 או 1556"}]}, {"n": "יוטא בינגן", "y": "–1581", "s": [{"k": "frankfurt", "r": "l", "t": [], "u": 0}], "c": {"n": "יוטא בת ר' משה בינגן", "rel": "בתם של הר\"ר משה בינגן ממיינץ ופריידל · אחותם של הר\"ר מאיר בינגן ויצחק בינגן", "b": "", "d": "1581", "place": "פרנקפורט", "note": "בתם של הר\"ר משה בינגן ממיינץ ושל פריידל, ואחותם של מאיר בינגן מבית הסולם (Zur Leiter) ושל יצחק בינגן. נפטרה בליל החג הראשון של סוכות שמ\"ב (ערב 11.9.1581) ונקברה ביום השני של החג (13.9.1581, לפי הלוח היוליאני), בבית הקברות העתיק בפרנקפורט. על מצבתה כתוב שאביה, ר' משה, כבר נפטר, ושאבי אמה היה \"מהררם וידשלר\", כלומר רבי מאיר וירשלר. זו העדות הראשונה מהתקופה עצמה לכך שאשתו של משה בינגן הייתה בתו של רבי מאיר וירשלר.", "flag": "שנת הלידה לא ידועה. שם האם לא כתוב במצבה, אבל הקשר לבית וירשלר כתוב בה במפורש. \"מהררם\" נקרא כאן מהר\"ם, מורנו הרב רבי מאיר. \"ר' משה ז\"ל\" הוא משה בינגן ממיינץ ולא נכדו משה מאיר בינגן, שחי עד 1603.", "src": "M. Horovitz (1901), עמ' 26, כתובת 284 · מפתח השמות שם, עמ' 699, ערך Bing · כרטיס הרישום \"Judde Bingen, 12.9.1581\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 163", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Judde Bingen\n📅 נפטרה: 12.9.1581 (היום הראשון של סוכות שמ\"ב)\n🪦 המצבה (הורוביץ 284): יוטא בינג בת משה ז\"ל, ממשפחת בינג. אבי אמה היה המהר\"ם וירשלר.\n👨 אביה: משה בינגן.\n👩 אמה: בת מאיר (המהר\"ם) וירשלר.\n💍 כנראה לא נישאה.\n📝 הערות העורך: ייתכן שגוטשלק, שנפטר ב-5.8.1570, היה אחיה. על אבי אמה ראו את המצבה ואת ההערה בכרטיס של בן דודה, מאיר וירשלר, שנפטר ב-17.3.1591."], ["נוסח המצבה (הורוביץ, כתובת 284, אבן 666)", "מרת יוטא בינג. צאינה וראינה בואת הציונה של אשה חשובה הגונה כידוע בכל המדינה, וקננו עליה קינה, מר' יוטא בת ר' משה ז\"ל מילדי בינג, ואבי אמה הי' מהררם וידשלר. נפטרת ליל א' של סוכות ונקברת ביום שני של סוכות שמ\"ב לפ\"ק."]]}, "g": [{"f": "g263", "c": "כרטיס הרישום של יוטא בת משה בינגן, נפטרה 12.9.1581"}, {"f": "g214", "c": "ספר הורוביץ, עמ' 26: כתובת 284, מצבת יוטא בת ר' משה בינגן"}]}, {"n": "הר\"ר מאיר בינגן · בית הסולם (Zur Leiter)", "y": "–~1559", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית הסולם (Zur Leiter)"], "u": 0}], "c": {"n": "הר\"ר מאיר בן משה בינגן, מבית הסולם (Zur Leiter)", "rel": "אביו של משה מאיר בינגן · בעלה של גוטה בינגן", "b": "", "d": "בערך 1559", "place": "פרנקפורט, בית הסולם (Zur Leiter)", "note": "בנם של הר\"ר משה בינגן ממיינץ ושל פריידל בינגן. אביו של משה מאיר בינגן מבית הסולם (Zur Leiter). ב-1533 רשמו אפוטרופסים אותו ואת אחיו יצחק, בני משה מבינגן, לשעבר מבית הבלוט (Zur Eichel) במיינץ, בבית הסולם הלבן (Zur weissen Leiter) בפרנקפורט, והוא היה הדייר הראשון של הבית. במסמכים מ-1531 עד 1559 הוא מופיע בקשר לבית. ב-1559 כבר נרשם כמת, ובין האפוטרופסים של ילדיו היו אחיו גוטשלק מבית הדג (Zum Fisch), וזיסקינד מבית היען (Zum Strauß), שגם הוא ממשפחת בינגן. אחיו: יצחק בינגן. אחותו: יוטא, שנפטרה בסוכות 1581 (הורוביץ, כתובת 284).\nר' ישראל בינגן מבית הבקבוק (Zur Flasche), שגם הוא מופיע בעץ, הוא ממשפחת בינגן אחרת: לפי עורך כרטיס הרישום שלו, אין לו קשר ידוע למשפחה הזו.", "flag": "שנת הפטירה משוערת. שנת הלידה לא ידועה. לפי כרטיס הרישום, ב-1533 עוד היו לו ולאחיו אפוטרופסים, ולכן שנת הנישואין \"בערך 1531\" היא הערכה של עורך הכרטיס. גם זהות גוטה כאמו של משה היא הסקה של העורך: בכרטיס של משה היא כתובה בסוגריים, עם הנימוק שמשה כבר היה נשוי ב-1549. בספר הורוביץ, בעמודים 17–19 (כתובות 190–223, מהשנים 1546–1566), לא נמצאה כתובת שלו, אף שנמצאה שם המצבה של אשתו גוטה. בהשערה ברורה מצבתו לא שרדה עד 1901, או שהיא בלויה מכדי לזהות אותה. גם במפתח השמות בסוף הספר (עמ' 699, ערך Bing) הוא לא מופיע: שני ה\"מאיר\" של המשפחה שם הם בני יצחק.", "src": "כרטיס הרישום \"Majer Bingen zur Leiter, um 1559\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599, עמ' 201 · כרטיס הרישום של בנו משה · מסירת המשפחה, 9.11.2026", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Majer Bingen zur Leiter\n📅 נפטר: בסביבות 1559\n⚰️ פנקס הקבורה: ב-1624 מוזכר \"למעלה בבית הקברות\" קברו של מאיר בינג מבית הסולם\n🪦 המצבה: בכרטיס אין מספר הורוביץ.\n📜 רשומות (בתיק הבית, הסולם, מהשנים 1531–1559):\n• 1533: האפוטרופסים רשמו את האחים מאיר ויצחק, בני משה מבינגן, לשעבר מבית הבלוט (Zur Eichel) במיינץ, בבית הסולם\n• 1549: בני הזוג מאיר וגוטה בבית הסולם\n• 1559: כבר לא היה בחיים. בין אפוטרופסי ילדיו היו אחיו, גוטשלק מבית הדג (Zum Fisch), וזיסקינד מבית היען (Zum Strauß), שגם הוא ממשפחת בינגן\n🏠 בית: הסולם הלבן (Zur weissen Leiter). הוא היה הדייר הראשון של הבית.\n👨 אביו: משה מבינגן.\n👩 אמו: לא נרשמה.\n💍 נשותיו:\n• בסביבות 1531, גוטה (אולי יוטה בת אפרים, שנפטרה ב-14.2.1552)\n• רייזכן, שנפטרה כנראה ב-25.9.1584"], ["אזכורו במצבת בנו משה (הורוביץ, כתובת 395)", "מצבתו של ר' מאיר עצמו לא נמצאה אצל הורוביץ. שמו מופיע במצבת בנו משה, שנפטר ב-1603 או 1604: \"משה בינג צור לייטר. פה טמון איש נאמן, תם וישר, טוב וכשר, כמר משה בר מאיר ז\"ל, ממשפחת בינג...\" (הורוביץ, עמ' 39, כתובת 395)."], ["👩‍🦱 נשותיו", "גוטה (Gutta). אשתו הראשונה. נישאו בערך ב-1531. לפי עורך כרטיס הרישום, כנראה יוטה בת אפרים, שנפטרה ב-14.2.1552. מופיעה בכרטיס נפרד\nרייזכן (Rözchen). אשתו השנייה. כנראה נפטרה ב-25.9.1584"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nמשה בינגן, מבית הסולם (Zur Leiter). נפטר ב-23.12.1604 לפי הכרטיס; לפי נוסח המצבה בשנת שס\"ד (1603). מופיע בכרטיס נפרד\nזיסקינד בינגן, מבית הסולם (Zur Leiter) ואחר כך מבית הקנקן (Zur Kanne). נפטר בערך ב-1598. מופיע בכרטיס נפרד\nיוסף, מבית הסולם (Zur Leiter). מופיע ברשימות 1549–1570, תמיד בלי אישה. ייתכן שעזב את פרנקפורט בסביבות 1570, או שנפטר אז\nגולכן, אשת משה כ\"ץ מבית הסולם (Zur Leiter) ואחר כך מבית הרשת (Zur Reuse). נפטרה בערך ב-1585\nברנדל. ב-1558 עוד הייתה תחת אפוטרופסות\nביילה, אשת ליב אופנהיים מבית האריה הלבן (Zum weissen Löwen). נפטרה ב-9.3.1610"]]}, "g": [{"f": "g196", "c": "כרטיס הרישום של ר' מאיר בינגן, Majer Bingen zur Leiter · פרנקפורט"}, מדויץ, נפטרה 16.5.1633"}, {"f": "g421", "c": "כרטיס הרישום של יצחק (איצק) בלאד מבית התפוח האדום (Zum roten Apfel), נפטר בסביבות 1602"}]}, {"n": "איצק בלאד", "y": "–~1602", "s": [{"k": "frankfurt", "r": "ld", "t": ["בסביבות 1602, פרנקפורט"], "u": 0}], "c": {"n": "יצחק (איצק) בלאד, מבית התפוח האדום (Zum roten Apfel)", "rel": "אביה של מונקלה · סבה של הענל גלנהויזן", "b": "", "d": "בסביבות 1602, פרנקפורט", "place": "פרנקפורט", "note": "גר בבית התפוח האדום (Zum roten Apfel). בסביבות 1583 נשא את יחת (גוטכן), בת יצחק מדויץ. במסמך משנת 1593 הוא רשום כ\"איזק מבית התפוח האדום, אחיו של מאיר וגיסו של מנט (?)\", ושלושתם עשו חשבון ב-1589 באנדרנך (Andernach). נפטר בסביבות 1602. הקבר שלו עמד באמצע בית הקברות, בצד הצפוני.", "flag": "שנת הלידה ושמות הוריו לא ידועים. אין לו מצבה בספר הורוביץ. בכרטיס של בתו מונקלה הבית שלו נקרא \"התפוח הלבן\" (Zum weissen Apfel), ובכרטיס שלו \"התפוח האדום\". נבדק ב-19.11.2026: שמות הוריו לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום \"Itsek Blad, um 1602\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1600–1619, עמ' 28 · הבית: Metahub Frankfurt (המוזיאון היהודי פרנקפורט), \"House Roter Apfel\", metahubfrankfurt.de; נבדק 19.11.2026", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Itsek Blad\n📅 נפטר: בסביבות 1602\n⚰️ פנקס הקבורה:\n• הוא נזכר בקבורת בתו גוטלה ובקבורת אשתו יחת\n• מוזכרת המצבה של \"איצק בלייז\" (לפי העורך, כנראה קריאה שגויה של \"בלאד\"), שעמדה באמצע בית הקברות, בצד הצפוני\n📜 רשומות:\n• 1583–1601: כמה מסמכים בבית התפוח האדום (Zum roten Apfel)\n• 1593: \"איזק מבית התפוח האדום הוא אחיו של מאיר וגיסו של מנט (?). שלושתם עשו חשבון ב-1589 באנדרנך\"\n🏠 בית: התפוח האדום\n👨 אביו ואמו: לא רשומים.\n💍 אשתו: בסביבות 1583, יחת (גוטכן) מדויץ, בת יצחק. נפטרה 16.5.1633.\n📝 הערת העורך: הצאצאים של אחיו מאיר באנדרנך מופיעים בכרטיס של הירץ בינגן שנפטר בסביבות 1618."], ["🏠 הבית: התפוח האדום (Zum roten Apfel)", "ברחוב היהודים בפרנקפורט, מספר 49. הבית נבנה ב-1523 בשביל אברהם, חתנו של הרופא משה, על מגרש של בית האריה האדום שממול. ב-1563 חולק הבית השכן, האיש העליז (Zum fröhlichen Mann), וכמה שנים אחר כך הבית קיבל את השם \"התפוח האדום\". ב-1606 נוסף לו בית אחורי, האגס הזהב (Zur goldenen Birne). ב-1711 הבית נשרף, ונבנה מחדש זמן קצר אחר כך."], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום של איצק:\nמאיר בלאד, מבית התפוח האדום (Zum roten Apfel). נפטר בסביבות 1625\nביילה, אשת הירץ דויץ מבית התפוח האדום, ואחר כך מבית האגס הזהב (Zur goldenen Birne). נפטרה ב-22.1.1638\nמיידה, אשת בער סג\"ל מבית עץ האגס (Zum Birnbaum). נפטרה ב-29.3.1627\nגיטלה, אשת משה טראובה מבית החבית הזהב (Zum goldenen Fass). נפטרה בסביבות 1623\nמונקלה, אשת אייזיק גלנהויזן סג\"ל מבית הוורד הלבן (Zur weissen Rose). נפטרה ב-5.3.1625. מופיעה בכרטיס נפרד\nרייץ. בתה נישאה ב-1622 לבן דודה, בנו של מאיר בלאד. נפטרה כנראה ב-17.12.1640 (בכרטיס עם סימן שאלה)"]]}, "g": [{"f": "g421", "c": "כרטיס הרישום של יצחק (איצק) בלאד מבית התפוח האדום (Zum roten Apfel), נפטר בסביבות 1602"}, {"f": "g422", "c": "כרטיס הרישום של יחת (גוטכן) בלאד, בת יצחק מדויץ, נפטרה 16.5.1633"}]}, {"n": "שינלה גלנהויזן", "y": "–~1585", "s": [{"k": "frankfurt", "r": "ld", "t": ["בסביבות 1585, פרנקפורט"], "u": 0}], "c": {"n": "שינלה (שינלין, שענלין), בת יצחק מאייסלשטיין, אשת זליגמן גלנהויזן", "rel": "אמו של אייזיק גלנהויזן · סבתה של הענל גלנהויזן", "b": "", "d": "בסביבות 1585, פרנקפורט", "place": "פרנקפורט", "note": "בתם של יצחק מאייסלשטיין (Ysselstein) ושל עדל בת בייפס. בסביבות 1549 נישאה לזליגמן גלנהויזן, שבא לגור בבית של משפחתה, הוורד הלבן (Zur weissen Rose). ב-1585 היא רשומה כ\"שענכן, אלמנת זליגמן\". נפטרה בסביבות 1585.", "flag": "שנת הלידה ותאריך הפטירה המדויק לא ידועים. אין לה מצבה בספר הורוביץ.", "src": "כרטיס הרישום \"Sejnlin zur weissen Rose, um 1585\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 203", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Sejnlin zur weissen Rose\n📅 נפטרה: בסביבות 1585\n📜 רשומות:\n• 1542: רשומה כרווקה\n• 1549: \"הזוג זליגמן ושענלין\". בעלה נעדר מהעיר ב-1551, 1552 (?), 1554 ו-1560\n• 1585: \"שענכן, אלמנת זליגמן\"\n🏠 בית: הוורד הלבן (Zur weissen Rose)\n👨 אביה: יצחק מאייסלשטיין, מבית הדוב (Zum Bär) ואחר כך מבית הוורד הלבן, בן יוסף. נפטר 10.8.1551.\n👩 אמה: עדל בת בייפס. נפטרה בסביבות 1562.\n💍 בעלה: בסביבות 1549, זליגמן גלנהויזן בן שמואל סג\"ל.\n📝 הערת העורך: את הוריה אפשר היה לשער כבר מזה שבעלה בא לגור בוורד הלבן. זה מאושר במסמך משנת 1565: זליגמן ויעקב מבית הפרח (Zur Blume), שניהם חתנים של עדל, מתדיינים זה עם זה על הירושה שלה."], ["👨‍👩‍👧 ילדיה", "לפי כרטיס הרישום של זליגמן:\nיוסף גלנהויזן, מבית הוורד הלבן (Zur weissen Rose), ואחר כך מבית רוזנק (Roseneck). נפטר בסביבות 1610\nאייזיק גלנהויזן, מבית הוורד הלבן. נפטר ב-15.10.1629. מופיע בכרטיס נפרד\nזנוויל גלנהויזן, מבית הוורד הלבן, ואחר כך מבית רוזנק. נפטר בסביבות 1597\nהירץ, מבית הספינה (Zum Schiff), ואחר כך מבית הינשוף (Zur Eule). נפטר בשנות ה-90 של המאה ה-16 (הספרה האחרונה לא נקראת)\nזיסקינד, מבית הוורד הלבן. נזכר ב-1576\nרייכלין, אשת אברהם הומבורג מבית הסוס השחור (Zum Rappen). נפטרה ב-15.2.1627\nגנסלה (?). נזכרת ב-1560 כבתם של זליגמן ושינלה\nחיימכן (?). נזכרת ב-1587 כבת"]]}, "g": [{"f": "g416", "c": "כרטיס הרישום של שינלה בת יצחק מאייסלשטיין, מבית הוורד הלבן (Zur weissen Rose), נפטרה בסביבות 1585"}, {"f": "g414", "c": "כרטיס הרישום של ר' זליגמן (פנחס) גלנהויזן מבית הוורד הלבן (Zur weissen Rose), נפטר 21.6.1584"}, {"f": "g423", "c": "כרטיס הרישום של ר' יצחק מאייסלשטיין, \"ההולנדי\", מבית הדוב ומבית הוורד הלבן, נפטר 10.8.1551"}]}, {"n": "זליגמן גלנהויזן", "y": "–1584", "s": [{"k": "frankfurt", "r": "ld", "t": ["י\"ב בתמוז שד\"ם (21.6.1584), פרנקפורט"], "u": 0}], "c": {"n": "ר' פנחס זליגמן גלנהויזן הלוי, הפרנס, מבית הוורד הלבן (Zur weissen Rose)", "rel": "אביו של אייזיק גלנהויזן · סבה של הענל גלנהויזן", "b": "", "d": "י\"ב בתמוז שד\"ם (21.6.1584), פרנקפורט", "place": "פרנקפורט", "note": "בנם של שמואל גלנהויזן סג\"ל ושל גולדה. בסביבות 1549 נשא את שינלה בת יצחק מאייסלשטיין, ועבר לגור בבית של משפחתה, הוורד הלבן (Zur weissen Rose). יש עליו מסמכים רבים מ-1556 עד 1583. על המצבה הוא נקרא פנחס, וכתוב שהיה פרנס הקהילה. נפטר ב-21.6.1584.", "flag": "שנת הלידה לא ידועה. בכרטיס הרישום כתוב 21.4.1584, אבל התאריך שעל המצבה, י\"ב בתמוז שד\"ם, הוא 21.6.1584. בספר הורוביץ השנה הלועזית בכותרת מודפסת 1574, אבל שמ\"ד היא 1584.", "src": "כרטיס הרישום \"Zeligman Gelnhausen, 21.4.1584\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 180 · נוסח המצבה: M. Horovitz (1901), עמ' 27, כתובת 293 (אבן 1086) · A. Dietz, \"Stammbuch der Frankfurter Juden\" (1907), ערך 185 (Gelhäuser IV zur weissen Rose) וערך 183 (Gelhäuser II zur Leuchte)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Zeligman Gelnhausen\n📅 נפטר: 21.4.1584 (י\"ב בתמוז שד\"ם)\n🪦 המצבה (הורוביץ 293): \"זעליקמאן גלהייזר, פרנס\". שמו העברי: פנחס בן הקדוש שמואל הלוי.\n📖 יש קיצור תולדות חייו במקור נוסף (Vorf. O.2, עמ' 125).\n📜 רשומות:\n• 1556–1583: מסמכים רבים בבית הוורד הלבן (Zur weissen Rose)\n• 1585: \"היורשים של זליגמן\", ו\"שענלין, אלמנת זליגמן\"\n🏠 בית: הוורד הלבן\n👨 אביו: שמואל גלנהויזן, מבית המנורה (Zur Leuchte) ואחר כך מבית הוורד הלבן, בן קופ סג\"ל. נפטר בסביבות 1572.\n👩 אמו: גולדה.\n💍 אשתו: בסביבות 1549, שינלה בת יצחק מאייסלשטיין. נפטרה בסביבות 1585."], ["📖 מהספר של דיץ", "📚 Stammbuch der Frankfurter Juden (1907), ערך 185\n• זליגמן (פנחס) גלהויזר מבית הוורד הלבן, בן שמואל.\n• סוחר בדים ומשי מ-1550, וגם בקיא בתורה.\n• נפטר כפרנס (Vorsteher) של הקהילה.\n• הלווה כסף לנסיך הבוחר של ברנדנבורג.\n• ב-1592 חולק בית הוורד הלבן לשלושה בתים, כי נעשה צר מדי לבניו ולילדיהם: הוורד הלבן, פינת הוורד (Roseneck) וזר הוורדים (Rosenkranz).\n👨‍👩‍👧 בניו, לפי דיץ:\n• שמואל: 1577 בוורד הלבן, 1592 בפינת הוורד. אלמנתו עדל נזכרת עוד ב-1600. בנם לייב גלהויזר, הנקרא קולפ, היה אבי משפחת קולפ\n• יוסף: 1577 בוורד הלבן, 1592 בזר הוורדים. \"תפארת בית הכנסת\". נפטר 1614\n• יצחק (אייזיק): 1577 בוורד הלבן. ב-1610 שילם את המס הגבוה ביותר בקהילה. \"החסיד\". נפטר ב-1629, זקן מאוד\n📝 הסתייגות: דיץ כותב שזליגמן נפטר ב-1574, אבל לפי כרטיס הרישום ולפי המצבה הוא נפטר ב-1584. דיץ כותב גם שהענף הזה \"כנראה אינו לויים\", אבל על המצבות של זליגמן ושל אייזיק כתוב \"הלוי\"."], ["נוסח המצבה (הורוביץ, כתובת 293, אבן 1086)", "הר\"ר זעליקמאן גאלהויזר. האבן הזאת אקים לראש, רם וגדול בענקים למד, בתורה אמריו מתוקים, פרנס לציבור היה, ובנאמנות עסק עסקים. ה\"ה כהר\"ר פנחס בן הקדוש ר' שמואל הלוי, זכרונו עם צדיקים, נתבקש לישבת שחקים לבריאת ארקים, ונקבר יום ה' י\"ב תמוז שד\"ם לפ\"ק."], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום של זליגמן:\nיוסף גלנהויזן, מבית הוורד הלבן (Zur weissen Rose), ואחר כך מבית רוזנק (Roseneck). נפטר בסביבות 1610\nאייזיק גלנהויזן, מבית הוורד הלבן. נפטר ב-15.10.1629. מופיע בכרטיס נפרד\nזנוויל גלנהויזן, מבית הוורד הלבן, ואחר כך מבית רוזנק. נפטר בסביבות 1597\nהירץ, מבית הספינה (Zum Schiff), ואחר כך מבית הינשוף (Zur Eule). נפטר בשנות ה-90 של המאה ה-16 (הספרה האחרונה לא נקראת)\nזיסקינד, מבית הוורד הלבן. נזכר ב-1576\nרייכלין, אשת אברהם הומבורג מבית הסוס השחור (Zum Rappen). נפטרה ב-15.2.1627\nגנסלה (?). נזכרת ב-1560 כבתם של זליגמן ושינלה\nחיימכן (?). נזכרת ב-1587 כבת"]]}, "g": [{"f": "g414", "c": "כרטיס הרישום של ר' זליגמן (פנחס) גלנהויזן מבית הוורד הלבן (Zur weissen Rose), נפטר 21.6.1584"}, {"f": "g415", "c": "ספר הורוביץ, עמ' 27: כתובת 293, מצבת ר' פנחס זליגמן גלנהויזן (1584). הכתובת מתחילה בתחתית הטור הימני וממשיכה בראש הטור השמאלי"}, {"f": "g416", "c": "כרטיס הרישום של שינלה בת יצחק מאייסלשטיין, מבית הוורד הלבן (Zur weissen Rose), נפטרה בסביבות 1585"}, {"f": "g427", "c": "כרטיס הרישום של שמואל גלנהויזן מבית המנורה ומבית הוורד הלבן, נפטר בסביבות 1572"}]}, {"n": "אליה באלין", "y": "", "s": [{"k": "worms", "r": "l", "t": ["וורמס (Worms)"], "u": 0}], "c": {"n": "אליה באלין", "rel": "אביו של ליזר באלין · סבו של אברהם באלין", "b": "", "d": "לא ידוע", "place": "וורמס (Worms)", "note": "אביו של ליזר באלין. ידוע עליו רק מה שכתוב בהערת העורך בכרטיס הרישום של נינתו, פרומט אופנהיים.", "flag": "שנות חייו לא ידועות. נבדק ב-21.11.2026: שמות הוריו לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום של נינתו \"Frummet Oppenheim, 28.1.1649\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1640–1649, עמ' 126", "x": [["📜 מה ידוע עליו", "• בכרטיס הרישום של נינתו פרומט אופנהיים, בהערת העורך: \"אבי אביה, ליזר באלין, היה בן אליה באלין\"."]]}, "g": [{"f": "g438", "c": "כרטיס הרישום של פרומט אופנהיים, בת אברהם באלין מוורמס, נפטרה 28.1.1649"}]}, {"n": "הינדכה מפרידברג", "y": "–~1550", "s": [{"k": "friedberg", "r": "ld", "t": ["פרידברג (Friedberg)", "בסביבות 1550, פרידברג"], "u": 0}], "c": {"n": "הינדכה (הינדלין) מפרידברג, בת הירש כ\"ץ", "rel": "אמו של גומפרכט מבית החרב · סבתה של אשת משה אופנהיים", "b": "", "d": "בסביבות 1550, פרידברג", "place": "פרידברג (Friedberg)", "note": "בתו של הירש (נפתלי) כ\"ץ מפרידברג. אחיה: חיים מבית הדוב (Zum Bär) בפרנקפורט, שנפטר 4.1.1540. נישאה לשלמה מפרידברג, שנפטר בסביבות 1530. ילדיה: גומפרכט מבית החרב בפרנקפורט, וזליגמן. נפטרה בסביבות 1550.", "flag": "שנת הלידה לא ידועה. שנת הפטירה משוערת.", "src": "כרטיס הרישום \"Hindchen zu Friedberg, um 1550\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1559, עמ' 151 · כרטיס הרישום של בנה \"Gumpricht zum Schwert, 21.10.1569\": קובץ 1560–1599, עמ' 53", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Hindchen zu Friedberg\n📅 נפטרה: בסביבות 1550\n📜 רשומות:\n• 1532–1545: חיים מבית הדוב (נפטר 4.1.1540), אחיה של הינדכה, ושלמה מפרידברג ירשו שם כל אחד חצי בית\n🏠 בית: בפרידברג\n👨 אביה: הירש מפרידברג, כ\"ץ\n👩 אמה: לא רשומה\n💍 בעלה: שלמה מפרידברג, שנפטר בסביבות 1530\n👨‍👩‍👦 ילדיה:\n• גומפרכט מבית החרב. נפטר 21.10.1569\n• זליגמן. ב-1553 היה תחת אפוטרופסות של אחיו גומפרכט\n📝 הערת העורך: לפי הרשומות יש כאן שלושה דורות: 1) נפתלי (בשמו הגרמני הירש) מפרידברג; 2) ילדיו, חיים מבית הדוב והינדכה מפרידברג; 3) בנה של הינדכה, גומפל מפרידברג, מבית החרב בפרנקפורט, וכנראה עוד כמה ילדים בפרידברג."]]}, "g": [{"f": "g460", "c": "כרטיס הרישום של הינדכה מפרידברג, אמו של גומפרכט מבית החרב, נפטרה בסביבות 1550"}, {"f": "g461", "c": "כרטיס הרישום של חיים מבית הדוב, בן הירש כ\"ץ מפרידברג, נפטר 4.1.1540"}]}, {"n": "שלמה מפרידברג", "y": "–~1530", "s": [{"k": "friedberg", "r": "ld", "t": ["פרידברג (Friedberg)", "בסביבות 1530, פרידברג"], "u": 0}], "c": {"n": "החבר ר' שלמה (Salomo) מפרידברג", "rel": "אביו של גומפרכט מבית החרב · סבה של אשת משה אופנהיים", "b": "", "d": "בסביבות 1530, פרידברג", "place": "פרידברג (Friedberg)", "note": "גר בפרידברג. אשתו: הינדכה, בת הירש כ\"ץ. נפטר בפרידברג בסביבות 1530. ידוע עליו רק מה שכתוב בכרטיסי הרישום של אשתו ושל בנו גומפרכט.", "flag": "שנת הלידה לא ידועה. נבדק ב-22.11.2026: שמות הוריו לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "מצבת בנו: M. Horovitz (1901), עמ' 20, כתובת 230 · כרטיס הרישום של בנו \"Gumpricht zum Schwert, 21.10.1569\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 53 · כרטיס הרישום של אשתו \"Hindchen zu Friedberg, um 1550\": קובץ 1500–1559, עמ' 151", "x": [["📜 מה ידוע עליו", "• על מצבת בנו גומפרכט (הורוביץ, כתובת 230): \"ר' יצחק אפרים בן החבר ר' שלמה ז\"ל\".\n• בכרטיס הרישום של בנו, גומפרכט מבית החרב: \"אביו: שלמה מפרידברג, שנפטר שם בסביבות 1530\".\n• בכרטיס הרישום של אשתו, הינדכה מפרידברג: \"נישאה לשלמה מפרידברג, שנפטר בסביבות 1530\".\n• שם גם (רשומות 1532–1545): חיים מבית הדוב, אחיה של הינדכה, ושלמה מפרידברג ירשו שם כל אחד חצי בית."], ["👨‍👦 ילדיו", "לפי כרטיסי הרישום של אטלינגר:\n• גומפרכט (יצחק אפרים) מבית החרב (Zum Schwert). עבר ב-1523 מפרידברג לפרנקפורט. היה פרנס. נפטר ב-21.10.1569.\n• זליגמן. בכרטיס הרישום של אמו: \"ב-1553 היה תחת אפוטרופסות של אחיו גומפרכט\"."]]}, "g": [{"f": "g460", "c": "כרטיס הרישום של הינדכה מפרידברג, אמו של גומפרכט מבית החרב, נפטרה בסביבות 1550"}]}, {"n": "שרה", "y": "~1512–", "s": [{"k": "frankfurt", "r": "ld", "t": ["אחרי 1570, פרנקפורט"], "u": 0}], "c": {"n": "שרה, אשתו השנייה של ר' זליגמן ריינבך", "rel": "אמה של רייזלין · סבתו של ר' שלמה זלמן כ\"ץ", "b": "בערך ⁦1510–1515⁩ (בהשערה ברורה)", "d": "אחרי 1570, פרנקפורט", "place": "פרנקפורט", "note": "אשתו השנייה של ר' זליגמן ריינבך, ואמה של רייזלין. נישאה בסביבות 1531. התאלמנה בסביבות 1553, והמשיכה לגור בבית המגן הירוק עם בתה רייזלין וחתנה נטע. היא מופיעה ברשומות עד 1570.", "flag": "שנות הלידה והפטירה משוערות. הוריה לא ודאיים: כל הזיהוי נשען על רשומה אחת משנת 1554.", "src": "כרטיס הרישום של בעלה \"Zeligman Rheinbach, um 1553\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1500–1559⁩, עמ' 165 · כרטיס הרישום \"Majer aus Worms zur roten Rose, 22.7.1540\": שם, עמ' 118 · כרטיס הרישום של בתה \"Rejzlin zum grünen Schild\": קובץ ⁦1600–1619⁩, עמ' 120 · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), לפי ארכיון העיר פרנקפורט, עמ' 44 ו-64", "x": [["📜 מה ידוע עליה", "• ברשימה משנת 1531 נמחק שם אשתו של זליגמן, גוטלין, ונכתב מעליו \"שרה\". ב-1533 שרה קיבלה זכות מגורים בפרנקפורט.\n• ברשימה משנת 1560 כתוב: \"נתן, חתנה של שרה, ורוזלין, בבית המגן הירוק\".\n• 1554: שנה אחרי מות בעלה, אלכסנדר מבית הסל (Zum Korb) מונה אפוטרופוס לילדיה.\n• בתיק הבית של המגן הירוק היא מופיעה עד 1570."], ["👪 הוריה — מאיר וגוטלין", "אביה: כנראה הרב ר' מאיר בן אברהם מוורמס, מבית הוורד האדום (Zur roten Rose). נפטר ב-22.7.1540.\nאמה: כנראה גוטלין, מבית הוורד האדום. נפטרה בסביבות 1549.\nלשניהם יש עכשיו כרטיס נפרד בעץ.\n\n━━ המסמך שהכל נשען עליו\nרשומה אחת בספרי העיר פרנקפורט, משנת 1554, שנה אחרי מות בעלה. זה הנוסח המלא:\n\"הוא הבן (? כנראה החתן) של מאיר ושל גוטלין מבית הוורד האדום, והוא גר בבית המגן הירוק. האפוטרופוס של ילדיו הוא אלכסנדר מבית הסל.\"\nסימן השאלה והמילים \"כנראה החתן\" הם של עורך כרטיסי הרישום. גם הוא לא היה בטוח.\n\n━━ למה \"בן\" לא יכול להיות נכון\nאנחנו יודעים בוודאות מי היה אביו של זליגמן:\n• ב-1542 הוא חתם בעצמו \"יהודה בן ישראל ריינבך ז\"ל\" על מסמך של אסיפת הרבנים בוורמס.\n• בספר \"יוסף אומץ\" כתוב עליו: \"זליקמן ריינבך ז\"ל, בנו של הגאון ישראל ריינבך\".\nאביו היה ישראל ריינבך, ולא מאיר. לכן המילה \"בן\" ברשומה מ-1554 אינה כפשוטה.\nואם לא בן — נשארת רק הקריאה השנייה: חתן. חתן של מאיר וגוטלין פירושו שאשתו היא בתם. ואשתו באותה שנה, אמם של הילדים שהרשומה מדברת עליהם, הייתה שרה.\n\n━━ שני דברים נוספים שתומכים\n• ברשימת התושבים של 1531 נכתב על זליגמן \"גוטלין, אשתו\". השם נמחק, ומעליו נכתב \"שרה\". כלומר כבר אז פקיד כתב את שם האם במקום שם הבת. אותו בלבול בדיוק חוזר ב-1554.\n• בכרטיס הרישום של בתה רייזלין כתוב \"אבא: זליגמן מבית הצבי ואחר כך מבית המגן הירוק, בן מאיר\". העורך העתיק לשם את אותה טעות. זה מראה שהבלבול בין \"בן\" ל\"חתן\" הוא שלו.\n\n━━ מה שעדיין לא מסתדר\n• שרה לא מופיעה ברשימת ילדיו של מאיר בכרטיס הרישום שלו. הבנות שרשומות שם הן פייגל וגולדה.\n• שמה של שרה לא מופיע ברשומה מ-1554 בכלל.\n• העורך עצמו כתב בהערה בסוף הכרטיס: \"שרה, אשתו השנייה, מופיעה בתיק בית המגן הירוק עד 1570. היא הייתה אולי בתו של מאיר מוורמס מבית הוורד האדום.\"\n• ספר המחקר של קספר-הולטקוטה כותב את זה כעובדה, אבל הוא מסתמך על אותה רשומה עצמה. זה לא מקור שני.\n\n━━ השורה התחתונה\nכנראה כן, בסבירות גבוהה. ודאי — לא."], ["👩‍👧 ילדיה", "רייזלין, אשת ר' משה נתן הכהן מבית המגן הירוק. נפטרה בסביבות 1610. מופיעה בכרטיס נפרד\nלא ידוע אם גם הבת השנייה של זליגמן, אשת זליגמן נוירלינגן, היא בתה."], ["👨‍👩‍👧 אחיה האפשריים", "אם מאיר מוורמס הוא באמת אביה, אלה אחיה, לפי כרטיס הרישום שלו:\nשלום גרוטוול, מבית האשכרוע (Zum Buchsbaum) ואחר כך מבית הארנב (Zum Hasen). נפטר ב-19.1.1599\nיצחק, מבית הוורד האדום ואחר כך בברנקסטל. נפטר בסביבות 1565\nאברהם, מבית הוורד האדום ואחר כך מבית החסידה (Zum Storch). נפטר בסביבות 1543\nפייגל, אשת מון בכרך מבית הוורד האדום ואחר כך מבית התרנגול האדום. נפטרה ב-19.4.1590\nגולדה, אשת אברלין דירוונגן מבית הוורד האדום"]]}, "g": [{"f": "g326", "c": "כרטיס הרישום של ר' זליגמן ריינבך, מבית הצבי ומבית המגן הירוק, נפטר בסביבות 1553"}, {"f": "g328", "c": "כרטיס הרישום של הרב מאיר בן אברהם מוורמס, מבית הוורד האדום (Zur roten Rose), נפטר 22.7.1540"}, {"f": "g332", "c": "ספר הורוביץ, עמ' 15: כתובת 173, מצבת הרב מאיר בן אברהם (1540)"}]}, {"n": "ר' זליגמן ריינבך", "y": "~1501–~1553", "s": [{"k": "frankfurt", "r": "ld", "t": ["בסביבות 1553, פרנקפורט"], "u": 0}], "c": {"n": "ר' יהודה (זליגמן) ריינבך, בן הרב ישראל ריינבך", "rel": "אביה של רייזלין · נכדו של ר' זעליגמן ז\"ק", "b": "בערך ⁦1500–1503⁩ (לפי עדות שבה נאמר שהוא בן 43)", "d": "בסביבות 1553, פרנקפורט", "place": "פרנקפורט", "note": "שמו העברי: יהודה בן ישראל ריינבך. השם של יום-יום: זליגמן. בספר המצבות של הורוביץ לא נמצאה מצבה שלו. בנו של הרב ישראל ריינבך, אב\"ד בפרנקפורט, ושל בתו של ר' זעליגמן ז\"ק מנירנברג. הוא היה הדייר הראשון של בית המגן הירוק בפרנקפורט. נפטר בסביבות 1553.", "flag": "שנת הלידה מחושבת מהעדות. שנת הפטירה מקורבת.", "src": "כרטיס הרישום \"Zeligman Rheinbach, um 1553\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1500–1559⁩, עמ' 165 · כרטיס הרישום של אביו \"ab\"d Jisrael Rheinbach, 20.4.1505\": שם, עמ' 17 · כרטיס הרישום \"Majer aus Worms zur roten Rose, 22.7.1540\": שם, עמ' 118 · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), לפי ארכיון העיר פרנקפורט, עמ' 44 ו-64", "x": [["📜 מה ידוע עליו", "• נולד בערך ב-⁦1500–1503⁩. בעדות בבית המשפט מהשנים ⁦1543–1546⁩ כתוב שהוא בן 43, ושהונו כ-100 פלורין.\n• אביו, הרב ישראל ריינבך, היה אב\"ד בפרנקפורט ונפטר ב-20.4.1505, כשזליגמן היה תינוק.\n• בשנים ⁦1521–1534⁩ גר בבית הצבי (Zum Hirsch). מ-1537 גר בבית המגן הירוק (Zum grünen Schild), שנבנה כתוספת בצד בית הצבי. הוא היה הדייר הראשון שלו.\n• 1542: חתם באסיפת הרבנים בוורמס בשמו העברי: \"יודא ב\"ר ישראל ריינבך ז\"ל\".\n• נפטר בסביבות 1553. ב-1554 כבר מונה אפוטרופוס לילדיו: אלכסנדר מבית הסל (Zum Korb).\n• היה בעל תפקיד בקהילה, \"באומייסטר\" (Baumeister), אחראי על הבנייה ועל הכספים.\n• חותנו הראשון, שמעון מווייזנאו, היה רב ופרנס בקהילה."], ["💍 נשותיו", "• אשתו הראשונה: אנדלין, בת שמעון מווייזנאו, מבית הצבי. נישאו בסביבות 1520. היא ירשה מאביה את בית הצבי. נפטרה בסביבות 1527.\n• אשתו השנייה: שרה. נישאו בסביבות 1531. היא אמה של רייזלין. מופיעה בכרטיס נפרד."], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nרייזלין (רייזכן), אשת ר' משה נתן הכהן מבית המגן הירוק. נפטרה בסביבות 1610. מופיעה בכרטיס נפרד\nבת ששמה לא ידוע, אשת זליגמן נוירלינגן מבית התרנגול האדום (Zum roten Hahn). נפטרה בסביבות 1623"], ["🌳 הקשר למשפחת ז\"ק", "אמו של זליגמן הייתה בתו של ר' זעליגמן ז\"ק מנירנברג, שכבר מופיע באילן. היא נישאה קודם לשלמה מוורמס, ואחרי מותו ב-1497 לרב ישראל ריינבך.\nבהשערה ברורה: זליגמן נקרא על שם סבו, ר' זעליגמן ז\"ק, שנפטר זמן קצר לפני שנולד.\nכלומר: ר' זעליגמן ז\"ק הוא סבא-רבא של רייזלין. באילן היא מופיעה בכרטיס נפרד, \"בת ר' זעליגמן ז\"ק\", מחוברת לאביה."], ["📖 עדות של נכד", "בספר \"יוסף אומץ\" (סימן 970) כותב המחבר, ר' יוסף יוזפא האן מנוירלינגן: \"לאבי היה חותן ומורה, זליקמן ריינבך ז\"ל, בנו של הגאון ישראל ריינבך\" (תרגום מהכרטיס). גם הורוביץ מפנה לספר הזה בהערה למצבה של ישראל ריינבך.\nכלומר: אמו של ר' יוסף יוזפא האן הייתה בתו של זליגמן, אחותה של רייזלין. ר' יוסף יוזפא האן היה בן הדודה של ר' שלמה זלמן כ\"ץ מבית המגן הירוק."]]}, "g": [{"f": "g326", "c": "כרטיס הרישום של ר' זליגמן ריינבך, מבית הצבי ומבית המגן הירוק, נפטר בסביבות 1553"}, {"f": "g327", "c": "כרטיס הרישום של הרב ישראל ריינבך, אב\"ד, נפטר 20.4.1505"}]}, {"n": "מאיר וורמס", "y": "", "s": [{"k": "worms", "r": "l", "t": ["וורמס (Worms)"], "u": 0}], "c": {"n": "מאיר וורמס", "rel": "אביו של אליעזר וורמס · סבה של גוטרט באלין", "b": "", "d": "לא ידוע", "place": "וורמס (Worms)", "note": "אביו של אליעזר וורמס. ידוע עליו רק שמו, מהערת העורך בכרטיס הרישום של פרומט אופנהיים.", "flag": "שנות חייו לא ידועות. נבדק ב-21.11.2026: שמות הוריו לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום של נינתו \"Frummet Oppenheim, 28.1.1649\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1640–1649, עמ' 126", "x": [["📜 מה ידוע עליו", "• בכרטיס הרישום של פרומט אופנהיים, בהערת העורך: \"הורי אמה היו אליעזר בן מאיר וורמס ופרומט, בת יוסף לוי\"."]]}, "g": [{"f": "g438", "c": "כרטיס הרישום של פרומט אופנהיים, בת אברהם באלין מוורמס, נפטרה 28.1.1649"}]}, {"n": "אייזיק גלנהויזן", "y": "–1629", "s": [{"k": "frankfurt", "r": "ld", "t": ["כ\"ח בתשרי ש\"צ (15.10.1629), פרנקפורט"], "u": 0}], "c": {"n": "ר' יצחק (אייזיק) גלנהויזן סג\"ל, \"הזקן\", מבית הוורד הלבן (Zur weissen Rose)", "rel": "אביה של הענל גלנהויזן · סבה של זליגמן בינגן", "b": "", "d": "כ\"ח בתשרי ש\"צ (15.10.1629), פרנקפורט", "place": "פרנקפורט", "note": "בנם של זליגמן (פנחס) גלנהויזן ושל שינלה בת יצחק מאייסלשטיין. גר בבית הוורד הלבן (Zur weissen Rose), בית המשפחה. אשתו: מונקלה בת איצק בלאד. ברשימה משנת 1619 הם רשומים כ\"הזוג איזק ומינקלה, בבית הוורד הלבן\". נפטר ב-15.10.1629, ונקבר ליד אחותו רייכלין.", "flag": "שנת הלידה לא ידועה. על המצבה של בתו הענל הוא נקרא \"ר' יעקב אייזק\", ועל המצבה שלו \"יצחק בן פנחס\".", "src": "כרטיס הרישום \"Ajzek Gelnhausen, 15.10.1629\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1620–1629, עמ' 268 · נוסח המצבה: M. Horovitz (1901), עמ' 60, כתובת 585 (אבן 874)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Ajzek Gelnhausen\n📅 נפטר: 15.10.1629 (כ\"ח בתשרי ש\"צ)\n🪦 המצבה (הורוביץ 585): \"אייזק גלהייזר הלוי\", הזקן. שמו העברי: יצחק בן פנחס הלוי. לפי העורך, הורוביץ 176 הוא קריאה שגויה של אותה אבן.\n⚰️ פנקס הקבורה: \"אייזק הזקן בן זליגמן גלהייזר\", נקבר ליד אחותו רייכלין, אשת אברהם הומבורג\n📜 רשומות: מסמכים רבים בבית הוורד הלבן (Zur weissen Rose) מ-1576 ואילך.\n🏠 בית: הוורד הלבן\n👨 אביו: זליגמן גלנהויזן מבית הוורד הלבן, בן שמואל סג\"ל. נפטר 21.4.1584.\n👩 אמו: שינלה בת יצחק מאייסלשטיין. נפטרה בסביבות 1585.\n💍 אשתו: מונקלה בת איצק בלאד. נפטרה 5.3.1625."], ["נוסח המצבה (הורוביץ, כתובת 585, אבן 874)", "אייזק גלהייזר הלוי, יום ב' כ' ח' (?) תשרי ש\"ץ לפ\"ק. בגזירת עירין פתגמא, נחות מהאי עלמא זקן יצחק, ושבע יומא לסליק לשמיא. החסיד ר' יצחק בן מהר\"ר פנחס הלוי זלה\"ה, נפטר יום ונקבר... (סוף הכתובת חסר בספר)."], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום של אייזיק:\nזנוויל גלנהויזן, מבית הוורד הלבן (Zur weissen Rose), ואחר כך מבית המדרגות (Zur Stege). נפטר ב-17.11.1632\nשינכן, אשת שמעון גינצבורג מבית הוורד הזהב (Zur goldenen Rose). נפטרה ב-10.3.1657\nהענל, אשת הירץ בינגן מבית הרשת (Zur Reuse), ואחר כך אשת משה בון מבית כפתור המושק (Zum Bisemknopf). נפטרה ב-1.9.1648. מופיעה בכרטיס נפרד\nרייכלין, אשת משה בכרך מבית המאזניים (Zur Wage). נפטרה ב-16.3.1645"]]}, "g": [{"f": "g417", "c": "כרטיס הרישום של ר' יצחק (אייזיק) גלנהויזן סג\"ל מבית הוורד הלבן (Zur weissen Rose), נפטר 15.10.1629"}, {"f": "g418", "c": "ספר הורוביץ, עמ' 60: כתובת 585, מצבת ר' יצחק (אייזיק) גלנהויזן הלוי (1629)"}, {"f": "g414", "c": "כרטיס הרישום של ר' זליגמן (פנחס) גלנהויזן מבית הוורד הלבן (Zur weissen Rose), נפטר 21.6.1584"}, {"f": "g419", "c": "כרטיס הרישום של מונקלה, אשת אייזיק גלנהויזן, נפטרה 5.3.1625"}]}, {"n": "מונקלה גלנהויזן", "y": "–1625", "s": [{"k": "frankfurt", "r": "ld", "t": ["כ\"ו באדר שפ\"ה (5.3.1625), פרנקפורט"], "u": 0}], "c": {"n": "מונקלה (מינקלה), בת ר' יצחק (איצק) בלאד, אשת אייזיק גלנהויזן", "rel": "אמה של הענל גלנהויזן · סבתו של זליגמן בינגן", "b": "", "d": "כ\"ו באדר שפ\"ה (5.3.1625), פרנקפורט", "place": "פרנקפורט", "note": "בתם של איצק בלאד ושל יחת (גוטכן) מדויץ. אשתו של אייזיק גלנהויזן סג\"ל, וגרה איתו בבית הוורד הלבן (Zur weissen Rose). ברשימה משנת 1619: \"הזוג איזק ומינקלה, בבית הוורד הלבן\". מכרה את מקומה בבית הכנסת. נפטרה ב-5.3.1625, ונקברה בחלק העליון של בית הקברות.", "flag": "שנת הלידה לא ידועה. בכרטיס של אמה היא נקראת \"יחת\", ובכרטיס של מונקלה \"גוטכן\". בכרטיס של מונקלה הבית של אביה נקרא \"התפוח הלבן\", ובכרטיסים שלו ושל אמה \"התפוח האדום\".", "src": "כרטיס הרישום \"Munkle Gelnhausen, 5.3.1625\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1620–1629, עמ' 133 · נוסח המצבה: M. Horovitz (1901), עמ' 54, כתובת 527 (אבן 883)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Munkle Gelnhausen\n📅 נפטרה: 5.3.1625 (כ\"ו באדר שפ\"ה)\n🪦 המצבה (הורוביץ 527): \"מונקלה אשת אייזק גלהייזר, בת יצחק בלאד ז\"ל\"\n⚰️ פנקס הקבורה: מוזכר הקבר של \"מינקלין אשת אייזק גלהייזר\", שהיה בחלק העליון של בית הקברות\n📜 רשומות:\n• 1619: \"הזוג איזק ומינקלה, בבית הוורד הלבן\"\n• מכרה את מקומה בבית הכנסת\n🏠 בית: הוורד הלבן (Zur weissen Rose)\n👨 אביה: איצק בלאד, מבית התפוח הלבן (Zum weissen Apfel). נפטר בסביבות 1602.\n👩 אמה: גוטכן מדויץ, בת יצחק. נפטרה 16.5.1633.\n💍 בעלה: אייזיק גלנהויזן בן זליגמן סג\"ל. נפטר 15.10.1629.\n📝 הערת העורך: רישום הקבורה שלה חסר בפנקס הקבורה, אבל הפנקס בחלק הזה מנוהל בלי סדר, ויש בו פערים."], ["נוסח המצבה (הורוביץ, כתובת 527, אבן 883)", "מונקלה אשת אייזיק גלהייזר. פה טמונה אשה חשובה והגונה, בכל עת ועונה עובדה לקונה, בגמילות חסד טעונה, הצדקת מר' מונקלה בת ר' יצחק בד\"ל ז\"ל, נפטרת בליל ונקברת ביום ג' כ\"ו אדר שפ\"ה. תנצב\"ה."], ["👨‍👩‍👧 ילדיה", "לפי כרטיס הרישום של אייזיק:\nזנוויל גלנהויזן, מבית הוורד הלבן (Zur weissen Rose), ואחר כך מבית המדרגות (Zur Stege). נפטר ב-17.11.1632\nשינכן, אשת שמעון גינצבורג מבית הוורד הזהב (Zur goldenen Rose). נפטרה ב-10.3.1657\nהענל, אשת הירץ בינגן מבית הרשת (Zur Reuse), ואחר כך אשת משה בון מבית כפתור המושק (Zum Bisemknopf). נפטרה ב-1.9.1648. מופיעה בכרטיס נפרד\nרייכלין, אשת משה בכרך מבית המאזניים (Zur Wage). נפטרה ב-16.3.1645"]]}, "g": [{"f": "g419", "c": "כרטיס הרישום של מונקלה, אשת אייזיק גלנהויזן, נפטרה 5.3.1625"}, {"f": "g420", "c": "ספר הורוביץ, עמ' 54: כתובת 527, מצבת מונקלה, אשת אייזיק גלנהויזן (1625)"}, {"f": "g417", "c": "כרטיס הרישום של ר' יצחק (אייזיק) גלנהויזן סג\"ל מבית הוורד הלבן (Zur weissen Rose), נפטר 15.10.1629"}, {"f": "g421", "c": "כרטיס הרישום של יצחק (איצק) בלאד מבית התפוח האדום (Zum roten Apfel), נפטר בסביבות 1602"}]}, {"n": "זיסקינד בינגן", "y": "–~1598", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית הסולם (Zur Leiter), ואחר כך בית הקנקן (Zur Kanne) ובית הקנקן המוזהב (Zur gol", "בסביבות 1598, פרנקפורט"], "u": 0}], "c": {"n": "זיסקינד בינגן, מבית הסולם (Zur Leiter) ואחר כך מבית הקנקן (Zur Kanne)", "rel": "בנו של הר\"ר מאיר בינגן · סבו של זליגמן בינגן", "b": "", "d": "בסביבות 1598, פרנקפורט", "place": "פרנקפורט, בית הסולם (Zur Leiter), ואחר כך בית הקנקן (Zur Kanne) ובית הקנקן המוזהב (Zur goldenen Kanne)", "note": "בנו של הר\"ר מאיר בינגן ממיינץ, מבית הסולם (Zur Leiter). אחרי מות אביו היה, ב-1558, תחת אפוטרופסות של דודו, גוטשלק מבית הדג (Zum Fisch). גר בבית הסולם, אחר כך בבית הקנקן (Zur Kanne), ואחר כך בבית הקנקן המוזהב (Zur goldenen Kanne), שהופרד מבית הקנקן. ב-1590 נרשם שאשתו חולת נפש, ושבשבילה נבנה חדר מיוחד בבית הקנקן. נפטר בסביבות 1598.", "flag": "שנת הלידה לא ידועה. שנת הפטירה היא הערכה של עורך כרטיס הרישום. שם אמו ושם אשתו לא ידועים.", "src": "כרטיס הרישום \"Ziskind Bingen, um 1598\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 326 · כרטיס הרישום של בנו \"Herts Bingen, um 1609\": קובץ 1600–1619, עמ' 91 · מפתח השמות של M. Horovitz (1901), עמ' 699", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Ziskind Bingen\n📅 נפטר: בסביבות 1598\n⚰️ פנקס הקבורה (1645): \"למעלה באמצע בית הקברות\", המצבה של זיסקינד מבית הקנקן המוזהב\n📜 רשומות:\n• 1558: \"זיסקינד מבית הסולם, תחת אפוטרופסות של אחי אביו, גוטשלק מבית הדג (Zum Fisch)\"\n• 1590: אשתו חולת נפש, ובשבילה נבנה חדר מיוחד בבית הקנקן\n🏠 בתים: הסולם (Zur Leiter), אחר כך הקנקן (Zur Kanne), ואחר כך הקנקן המוזהב (Zur goldenen Kanne)\n👨 אביו: מאיר בינגן ממיינץ, מבית הסולם, בן משה. נפטר בסביבות 1559.\n👩 אמו: לא נרשמה.\n💍 אשתו: שמה לא נרשם."], ["👨‍🦱 אביו", "הר\"ר מאיר בינגן, מבית הסולם (Zur Leiter), בן משה בינגן ממיינץ. נפטר בסביבות 1559. מופיע בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nזנוויל (שמואל) בינגן, מבית הקנקן המוזהב (Zur goldenen Kanne). נפטר ב-17.3.1658 (הורוביץ, כתובת 835)\nהירץ בינגן, מבית הרשת (Zur Reuse). נפטר בסביבות 1609. מופיע בכרטיס נפרד"], ["🔎 חיפוש מצבה בספר הורוביץ", "במפתח השמות של הורוביץ, תחת \"Bing\", אין מצבה של זיסקינד. כנראה שהמצבה לא שרדה. ב-1645 היא עוד מוזכרת בפנקס הקבורה."]]}, "g": [{"f": "g311", "c": "כרטיס הרישום של זיסקינד בינגן (Ziskind Bingen), בנו של הר\"ר מאיר בינגן, נפטר בסביבות 1598"}]}, {"n": "בונלין גינצבורג רייזמן", "y": "–~1619", "s": [{"
