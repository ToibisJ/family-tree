76 נרשם כחתנו של קלמן. נפטר בסביבות 1591, וב-1592 כבר רשומה אשתו בונלין כאלמנה. נקבר במרכז בית הקברות, וליד קברו נקבר ב-1624 בנו, הגאון ר' שמעון.\nאביו: מאיר מבית השער (Zur Pforte), בן קלמן כ\"ץ. נפטר בסביבות 1557.\nאמו: גוטלין, בת שאול. נפטרה בסביבות 1580.", "flag": "שנת הפטירה משוערת: בסביבות 1591, כי ב-1592 אשתו כבר רשומה כאלמנה. שנת הלידה לא ידועה. מצבתו לא נמצאה אצל הורוביץ.", "src": "כרטיס הרישום \"Zalman Riesmann, um 1591\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org · מסירת המשפחה, 9.11.2026 · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), לפי ארכיון העיר פרנקפורט, עמ' 19 · Alexander Dietz, Stammbuch der Frankfurter Juden (1907), משפחה 85 \"Cahn\", עמ' 86 ואילך", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Zalman Riesmann\n📅 נפטר: בסביבות 1591\n⚰️ פנקס הקבורה: בשנת 1624, בקבורת בנו, מוזכר \"למעלה באמצע בית הקברות קברו של אבי הגאון שמעון, כלומר שלמה בן מאיר, המכונה זלמן רייזמן\" (כלומר מאזור ריס שבבוואריה).\n🪦 המצבה: בכרטיס אין מספר הורוביץ, כלומר מצבתו לא נמצאה אצל הורוביץ.\n📜 רשומות (בתיק הבית, השער, מהשנים 1567–1591):\n• 1574: זלמן מבית השער\n• 1576: חתנו של קלמן\n• 1580–1590: בנה של גוטלין\n• 1592: בונלין מבית השער, אלמנת זלמן\n🏠 בית: השער (Zur Pforte)\n👨 אביו: מאיר מבית השער, בן קלמן כ\"ץ. נפטר בסביבות 1557.\n👩 אמו: גוטלין בת שאול. נפטרה בסביבות 1580.\n💍 אשתו: בונלין בת קלמן כ\"ץ. נישאו כנראה בסביבות 1574. נפטרה בסביבות 1619."], ["👩‍🦱 אשתו", "בונלין, בת ר' קלמן הכהן ורייזלן. נישאו כנראה בסביבות 1574. נפטרה בסביבות 1619. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nשמעון גינצבורג. מופיע בכרטיס נפרד\nגוטלן, אשת מאיר שלוץ. נפטרה ב-21.10.1622"], ["❓ שאלה פתוחה: בונלין או שינלה?", "ברשימת הדיירים של רחוב היהודים שמביא ספר המחקר של קספר-הולטקוטה, אשתו של זלמן בבית השער נקראת שינלה, ולא בונלין.\nגם אלכסנדר דיץ, בספר השושלות שלו (1907), קורא לאשתו שינלין. כלומר שני מקורות עצמאיים זה מזה אומרים שינלה, ורק כרטיס הרישום אומר בונלין.\nלפי כרטיס הרישום הוא נשא את בונלין בסביבות 1574, והיא זו שרשומה כאלמנתו ב-1592.\nשלוש אפשרויות, ואי אפשר להכריע ביניהן:\n• שינלה הייתה אישה ראשונה, שנפטרה לפני 1574.\n• טעות בספר, או בלבול עם אישה אחרת.\n• הרשימה מתארת זלמן אחר מבית השער.\nבספר לא נכתבה שנת הרשימה, ולכן אי אפשר לבדוק את זה כרגע."]]}, "g": [{"f": "g187", "c": "כרטיס הרישום של ר' שלמה זלמן רייזמן · פרנקפורט"}]}, {"n": "רייזלין בת זליגמן", "y": "~1542–~1610", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית המגן הירוק (Zum grünen Schild)", "בסביבות 1610, פרנקפורט"], "u": 0}], "c": {"n": "רייזלין (Rejzlin, Röslin, רייזכן) בת זליגמן, מבית המגן הירוק (Zum grünen Schild)", "rel": "אשתו של ר' משה נתן הכהן · אמו של ר' שלמה זלמן כ\"ץ", "b": "בערך ⁦1540–1545⁩ (בהשערה ברורה)", "d": "בסביבות 1610, פרנקפורט", "place": "פרנקפורט, בית המגן הירוק (Zum grünen Schild)", "note": "אשתו של הרב ר' משה נתן (נטע) הכהן. בתם של ר' זליגמן ריינבך ושל שרה. היא גדלה בבית המגן הירוק, הבית של משפחתה, ובעלה עבר לגור בו. התאלמנה ב-1585, ונפטרה בסביבות 1610.", "flag": "שנת הלידה משוערת לפי שנת הנישואין. שנת הפטירה מקורבת.", "src": "כרטיס הרישום \"Rejzlin zum grünen Schild, um 1610\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1600–1619⁩, עמ' 120 · כרטיס הרישום של בעלה \"Nate zum grünen Schild, 21.1.1585\": קובץ ⁦1560–1599⁩, עמ' 187 · כרטיס הרישום של אביה \"Zeligman Rheinbach, um 1553\": קובץ ⁦1500–1559⁩, עמ' 165 · כרטיס הרישום של נכדתה \"Sejnlin Zons, 29.10.1635\": קובץ ⁦1635–1639⁩, עמ' 45 · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), לפי ארכיון העיר פרנקפורט, עמ' 44", "x": [["📜 מה ידוע עליה", "• אביה, ר' זליגמן ריינבך, היה הדייר הראשון של בית המגן הירוק. הוא נפטר בסביבות 1553, כשהיא הייתה נערה.\n• נישאה בסביבות 1560 לנטע, בנו של ר' קלמן הכהן. ברשימה משנת 1560 כתוב: \"נתן, חתנה של שרה, ורוזלין, בבית המגן הירוק\". כלומר אמה שרה גרה איתם.\n• בעלה נפטר ב-21.1.1585. ב-1586 וגם ב-⁦1593–1595⁩ היא רשומה \"אלמנת נתן\" בבית המגן הירוק.\n• יש עליה עוד רשומות מהשנים ⁦1596–1609⁩.\n• בספר המחקר של קספר-הולטקוטה היא נקראת \"שרה\" ולא רייזלין. כנראה טעות, ובלבול עם אמה. ברשימה משנת 1560 כתוב \"נתן, חתנה של שרה, ורוזלין\", כלומר שרה היא החותנת ורוזלין היא האישה.\n• נפטרה בסביבות 1610. בספר המצבות של הורוביץ לא נמצאה מצבה שלה. היא נקברה באמצע בית הקברות, בצד הדרומי. זה ידוע מהכרטיס של נכדתה שינלין צונס, שנקברה לידה ב-1635."], ["👨‍👩‍👧 ילדיה", "לפי כרטיס הרישום של בעלה:\nהירץ, מבית המגן הירוק (Zum grünen Schild). נפטר ב-29.11.1620\nקלמן, מבית החליפין (Zum Wechsel) ואחר כך מבית הדג (Zum Fisch). נפטר ב-9.12.1626\nיוזפא, מבית הגמל (Zum Kamel) ואחר כך מבית החליפין (Zum Wechsel). נפטר בסביבות 161?\nפייבש, מבית הדג (Zum Fisch). נפטר ב-11.1.1591\nר' שלמה זלמן כ\"ץ, מבית המגן הירוק (Zum grünen Schild). נפטר ב-22.1.1637. מופיע בכרטיס נפרד\nשרכן, אשת יעקב גינצבורג מבית הבאר המוזהבת (Zum goldenen Brunnen). נפטרה ב-23.6.1610\nאולי גם רעכלן, שנפטרה ב-24.7.1568, כנראה כשהייתה ילדה (לא ודאי)"], ["👭 אחותה", "לרייזלין הייתה אחות ששמה לא ידוע. היא נישאה לזליגמן נוירלינגן מבית התרנגול האדום (Zum roten Hahn), ונפטרה בסביבות 1623. בנה היה ר' יוסף יוזפא האן מנוירלינגן, בעל הספר \"יוסף אומץ\". בספר הוא כותב שזליגמן ריינבך היה סבו. פרטים בכרטיס של אביה."], ["📛 השם", "בכרטיסים היא נקראת רייזלין, רוזלין (Röslin) ורייזכן. כל אלה צורות קטנות של רייזל, \"ורד קטן\"."]]}, "g": [{"f": "g325", "c": "כרטיס הרישום של רייזלין מבית המגן הירוק (Zum grünen Schild), נפטרה בסביבות 1610"}, {"f": "g326", "c": "כרטיס הרישום של ר' זליגמן ריינבך, מבית הצבי ומבית המגן הירוק, נפטר בסביבות 1553"}]}, {"n": "ר' משה נתן הכהן", "y": "~1541–1585", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית המגן הירוק (Zum grünen Schild)", "כ\"א בשבט שמ\"ה (21.1.1585), פרנקפורט"], "u": 0}], "c": {"n": "הרב ר' משה נתן (נטע) הכהן, מבית המגן הירוק (Zum grünen Schild)", "rel": "בנו של ר' קלמן הכהן · סבה של גוטלה אופנהיים", "b": "", "d": "כ\"א בשבט שמ\"ה (21.1.1585), פרנקפורט", "place": "פרנקפורט, בית המגן הירוק (Zum grünen Schild)", "note": "רב בפרנקפורט. שמו המלא: משה נתן הכהן. בחתימתו: \"נתן בן קלונימוס הכהן\". גר בבית המגן הירוק (Zum grünen Schild). ברשומה משנת 1584 הוא בן 43, רב, והונו עולה על 4,000 פלורין. נפטר בכ\"א בשבט שמ\"ה, 21.1.1585. בשנת 1586 גרה אלמנתו רייזלין בבית המגן הירוק (Zum grünen Schild).\nאביו: ר' קלמן הכהן, מבית השער (Zur Pforte) ואחר כך מבית הדלת הירוקה (Zur grünen Tür). נפטר בסביבות 1583.\nאמו: רייזלן, בת אורי. נפטרה ב-17.12.1596.", "flag": "שנת הלידה משוערת: לפי הרשומה משנת 1584 היה אז בן 43, כלומר נולד בסביבות 1541.", "src": "כרטיס הרישום \"Nate zum grünen Schild, 21.1.1585\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 187 · נוסח המצבה: M. Horovitz (1901), עמ' 27–28, כתובת 297 (אבן 2162) · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), לפי ארכיון העיר פרנקפורט, עמ' 44", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Nate zum grünen Schild\n📅 נפטר: 21.1.1585 (כ\"א בשבט שמ\"ה)\n🪦 המצבה (הורוביץ 297): נתן כהן, ושמו המלא משה נתן\n📜 רשומות (בתיקי הבית, מהשנים 1560–1585):\n• 1560: נרשם כחתנה של שרה\n• 1573: נרשם כבנו של קלמן מבית השער (Zur Pforte)\n• 1584: בן 43, רב, והונו עולה על 4,000 פלורין. חתימתו: \"נתן בן קלונימוס הכהן\"\n• 1586: אלמנתו רייזלין גרה בבית המגן הירוק (Zum grünen Schild)\n👨 אביו: קלמן, מבית השער ואחר כך מבית הדלת הירוקה (Zur grünen Tür), בן קלמן כ\"ץ. נפטר בסביבות 1583.\n👩 אמו: רייזלן בת אורי. נפטרה 17.12.1596.\n📝 הערת העורך: זיהוי המצבה מבוסס על ההתאמה המדויקת בזמן לרשומות בארכיון, ועל השם הכפול משה נתן."], ["נוסח המצבה (הורוביץ, כתובת 297, אבן 2162)", "הה\"ר נתן כהן. נהי וקול בכי וקינה על צדיק אשר נאסף ופנה, גברא רבא וכהנא, גמר וסבר קרא ושנה, גם הי' לראש פינה, והשביע נפש נענה, ונתן לו אפים מנה. הר\"ר משה נתן ז\"ל נפטר כ\"א שבט שמ\"ה. תנצב\"ה א\"ס."], ["👩‍🦱 אשתו", "רייזלין (רייזכן), בת זליגמן ושרה. נישאו בסביבות 1560. ברשימה משנת 1560 כתוב: \"נתן, חתנה של שרה, ורוזלין, בבית המגן הירוק\". בית המגן הירוק היה הבית של משפחת אשתו, ונטע עבר לגור בו. היא נפטרה בסביבות 1610. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nהירץ, מבית המגן הירוק (Zum grünen Schild). נפטר ב-29.11.1620\nקלמן, מבית החליפין (Zum Wechsel) ואחר כך מבית הדג (Zum Fisch). נפטר ב-9.12.1626\nיוזפא, מבית הגמל (Zum Kamel) ואחר כך מבית החליפין (Zum Wechsel). נפטר בסביבות 161? (הספרה האחרונה חתוכה בסריקה)\nפייבש, מבית הדג (Zum Fisch). נפטר ב-11.1.1591\nר' שלמה זלמן כ\"ץ, מבית המגן הירוק (Zum grünen Schild). נפטר ב-22.1.1637. מופיע בכרטיס נפרד\nשרכן, אשת יעקב גינצבורג מבית הבאר המוזהבת (Zum goldenen Brunnen). נפטרה ב-23.6.1610\nרעכלן. נפטרה ב-24.7.1568, כנראה כשהייתה ילדה. על המצבה כתוב \"רעכלן בת משה נתן הכהן ז\"ל\". העורך של כרטיסי הרישום לא היה בטוח שהיא בתו, כי \"ז\"ל\" אומר שהאב כבר נפטר, ונטע היה אז עדיין בחיים. אבל ספר המחקר של קספר-הולטקוטה מונה את רעכלן ברשימת הנכדים של זליגמן ריינבך, יחד עם הירץ, קלמן, זלמן, יוזפא, פייבש ושרכן. זאת בדיוק רשימת ילדיו של נטע, ולכן היא כנראה באמת בתו"], ["👫 אחותו בונלין", "ר' משה נתן ובונלין היו אח ואחות. ההורים של שניהם: ר' קלמן הכהן ורייזלן.\nבונלין היא אמו של ר' שמעון הכהן גינצבורג, בעלה של שינלה."]]}, "g": [{"f": "g257", "c": "כרטיס הרישום של ר' משה נתן (נטע) הכהן מבית המגן הירוק (Zum grünen Schild), נפטר 21.1.1585"}, {"f": "g275", "c": "ספר הורוביץ, עמ' 27: תחילת כתובת 297, מצבת ר' משה נתן הכהן (1585)"}, {"f": "g276", "c": "ספר הורוביץ, עמ' 28: המשך כתובת 297, מצבת ר' משה נתן הכהן (1585)"}, {"f": "g325", "c": "כרטיס הרישום של רייזלין מבית המגן הירוק (Zum grünen Schild), נפטרה בסביבות 1610"}]}, {"n": "הרב ר' מאיר מברודא", "y": "–>1615", "s": [{"k": "prague", "r": "l", "t": [], "u": 0}], "c": {"n": "הרב ר' מאיר מברודא (\"איש ברוד\")", "rel": "אביו של ר' משה ברודא מפראג · בעלה של רבקה", "b": "", "d": "אחרי 1615", "place": "פראג", "note": "אביו של ר' משה ברודא, גבאי בפראג, ובעלה של רבקה. על המצבה של אשתו בפראג, משנת שע\"ה (1614/15), הוא נקרא \"הר\"ר מאיר איש ברוד\". שם אין אחרי שמו ז\"ל, ולכן, בהשערה ברורה, הוא עוד היה בחיים כשאשתו נפטרה.\n\n\"איש ברוד\" פירושו שבא מהעיר ברוד. בהשערה ברורה, הכוונה לבוהמישברוד (Český Brod) שליד פראג, או לעיר ברוד אחרת. מכאן שם המשפחה ברוד וברודא.", "flag": "השם לפי \"סדר הדורות\" ולפי המצבה של אשתו (\"הר\"ר מאיר איש ברוד\"). במסירת המשפחה, שמקורה ב-Geni, הוא נקרא משה ברודא. שנות חייו לא ידועות.", "src": "S. Hock, \"משפחות ק\"ק פראג על פי מצבותיהן\" (1892), פרק \"ברוד ברודא\", עמ' 48–49, דרך הספרייה הממלכתית של בוואריה (MDZ, bsb11538295), מס' 286 (מצבת אשתו) · \"סדר הדורות\" (בית קלם), עמוד שנמסר על ידי המשפחה · מסירת המשפחה, 9.11.2026", "x": [["🔎 חיפוש", "חיפשתי ב-12.11.2026:\n• בספר של הוק על מצבות בית הקברות העתיק בפראג, בפרק \"ברוד ברודא\". נמצאה רק המצבה של רבקה, אבל לא מצבה של מאיר, ולא מצבות של הוריהם.\n• חיפוש ברשת: לא נמצא מקור על הוריהם.\nשמות ההורים של שניהם לא ידועים.\nהמצבה שלו עצמו לא נמצאה, ולא נמצא צילום."]]}, "g": []}, {"n": "רבקה ברודא", "y": "–1614", "s": [{"k": "prague", "r": "ld", "t": ["שע\"ה (1614/15), פראג"], "u": 0}], "c": {"n": "רבקה ברודא, אשת ר' מאיר איש ברוד", "rel": "אמו של ר' משה ברודא מפראג · אשתו של הרב ר' מאיר מברודא", "b": "", "d": "שע\"ה (1614/15), פראג", "place": "פראג", "note": "אמו של ר' משה ברודא מפראג, ואשתו של הרב ר' מאיר מברודא. היא נפטרה בשנת שע\"ה, כלומר בין סתיו 1614 לסתיו 1615, ונקברה בבית הקברות היהודי העתיק בפראג.", "flag": "שנת הלידה לא ידועה. שמה, שם בעלה ושנת הפטירה מאומתים בספר של הוק. היום והחודש לא ידועים. אחיו של שאול מזוהים בהשערה.", "src": "S. Hock, \"משפחות ק\"ק פראג על פי מצבותיהן\" (1892), פרק \"ברוד ברודא\", עמ' 48–49, דרך הספרייה הממלכתית של בוואריה (MDZ, bsb11538295), מס' 286, 8081, 2832, 4831 · מסירת המשפחה, 9.11.2026 · \"סדר הדורות\" (בית קלם), עמוד שנמסר על ידי המשפחה", "x": [["🪦 המצבה", "המצבה שלה מתועדת בספר של שמעון הוק על מצבות בית הקברות העתיק בפראג, בפרק \"ברוד ברודא\" (עמ' 48, מס' 286), בשנת שע\"ה:\n\"רבקה אשת הר\"ר מאיר איש ברוד\".\nזו המצבה המוקדמת ביותר של המשפחה בספר. שם אביה לא מופיע, והחודש לא ידוע.\nזה מאשר את מה שכתוב ב\"סדר הדורות\": השנה שם היא שע\"ה ולא ש\"ה. גם בתאריך שהמשפחה מסרה, 1614, אין טעות, כי שנת שע\"ה התחילה בסתיו 1614."], ["👨‍👦 בנה משה ונכדיה", "באותו פרק אצל הוק מופיעים גם צאצאים של בנה, \"האלוף הראש והקצין מו\"ה משה ברוד\", שהיה \"גבאי דמתא\", כלומר גבאי העיר:\n• \"הילד אהרן בן ה\"ה מו' משה יצ\"ו ברוד גבאי דמתא\", נפטר בפסח שצ\"ד (1634). אז משה עוד היה בחיים.\n• \"מו' אברהם, אב\"ד ור\"מ... ודרשן פה פראג, בן האלוף הראש והקצין מו\"ה משה ברודא זצ\"ל\", נפטר בתשרי תל\"ז (1676).\n• \"האלוף מו\"ה טודרוס... בן הראש והקצין האלוף מו\"ה משה ברוד זצ\"ל\", נפטר בניסן תנ\"ט (1699) בגיל 78.\nאלה בהשערה ברורה אחיו של הרב שאול ברודא. הם לא נוספו לעץ."], ["🔎 חיפוש", "חיפשתי ב-12.11.2026:\n• בספר של הוק על מצבות בית הקברות העתיק בפראג, בפרק \"ברוד ברודא\". נמצאה רק המצבה של רבקה, אבל לא מצבה של מאיר, ולא מצבות של הוריהם.\n• חיפוש ברשת: לא נמצא מקור על הוריהם.\nשמות ההורים של שניהם לא ידועים.\nלא נמצא צילום של המצבה. לבית הקברות העתיק בפראג אין מאגר צילומים פתוח."]]}, "g": []}, {"n": "שורלין אופנהיים", "y": "–1579", "s": [{"k": "worms", "r": "l", "t": ["וורמס, ואחר כך פרנקפורט"], "u": 0}, {"k": "frankfurt", "r": "ld", "t": ["וורמס, ואחר כך פרנקפורט", "כנראה 23.1.1579 (כ\"ו בשבט של\"ט), פרנקפורט"], "u": 1}], "c": {"n": "שורלין, אשת לייב אופנהיים מבית הענק בוורמס, ואחר כך אשת אמשל מבית החסידה (Zum Storch)", "rel": "אמו של משה אופנהיים · סבתו של לייב אופנהיים", "b": "", "d": "כנראה 23.1.1579 (כ\"ו בשבט של\"ט), פרנקפורט", "place": "וורמס, ואחר כך פרנקפורט", "note": "אשתו של לייב (יהודה) אופנהיים מבית הענק בוורמס. אחרי מותו, ב-1577, נישאה לאמשל בן שמעון כ\"ץ מבית החסידה (Zum Storch) בפרנקפורט, אלמן של גוטלין. ב-1583 ירש בנה יוסף אחריה 1,500 פלורינים. לפי אטלינגר, המצבה של \"רבקה שערלן בת ר' מאיר הכהן\" מ-1579 היא כנראה המצבה שלה.", "flag": "שנת הלידה לא ידועה. אטלינגר עצמו כותב שהמצבה מ-1579 היא \"כנראה\" שלה, ולכן גם שם אביה, מאיר הכהן, לא ודאי.", "src": "כרטיס הרישום \"Sorlin Oppenheim-Worms, dann zum Storch, um 1580\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 160 · נוסח המצבה: M. Horovitz (1901), עמ' 25, כתובת 277 (אבן 1203) · כרטיס הרישום 'Riwka Serlen, Tochter Majers': אלה תולדות, קובץ 1560–1599, עמ' 143 · epidat ffb-760, נבדק 24.11.2026", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Sorlin Oppenheim-Worms, dann zum Storch\n📅 נפטרה: בסביבות 1580\n📜 רשומות:\n• 1.4.1577: \"שורלין, אלמנת לייב אופנהיים מבית הענק בוורמס, נישאה לאמשל מבית החסידה בפרנקפורט\"\n• 1576: נחקרה (נגבתה ממנה עדות)\n• 1583: יוסף מבית האריה הלבן, בנה, ירש אחריה 1,500 פלורינים\n🏠 בית: בנישואים הראשונים הענק (Riese) בוורמס, בנישואים השניים החסידה (Storch) בפרנקפורט\n👨 אביה: לא רשום\n👩 אמה: לא רשומה\n💍 בעליה:\n• לייב אופנהיים בוורמס. נפטר 1572 או 1573\n• אמשל בן שמעון כ\"ץ, אלמן של גוטלין. נפטר 3.3.1586\n📝 הערת העורך: \"הורוביץ 277 (23.1.1579) הוא כנראה המצבה שלה. אם כך, היא הייתה בתו של מאיר כ\"ץ.\""], ["🪦 המצבה שאטלינגר מייחס לה (הורוביץ, כתובת 277)", "ציון הלז שמתי לראש אשה חשובה והגונה, מרת רבקה שערלן בת ר' מאיר הכהן ז\"ל, נפטר' יום ו' כ\"ו שבט של\"ט לפ\"ק. תנצב\"ה.\n(הורוביץ, עמ' 25, כתובת 277, אבן 1203. התאריך: 23.1.1579.)"], ["🔍 האם זו המצבה שלה?", "לאטלינגר יש כרטיס רישום נפרד לאישה שעל המצבה: \"Riwka Serlen, Tochter Majers\" (אביה: Majer k\"ts, כלומר מאיר כ\"ץ). שם הוא כותב: \"אולי היא שורלין מבית החסידה, אבל איני יכול להוכיח זאת\". הוא אף מסמן בסימן שאלה אם האישה הזו הייתה נשואה בכלל. לפי epidat, המצבה עדיין עומדת בבית העלמין בבטונשטראסה (ffb-760), אבל שתי השורות האחרונות של הכתובת התקלפו לגמרי."]]}, "g": [{"f": "g456", "c": "כרטיס הרישום של שורלין, אלמנת לייב אופנהיים, ואחר כך אשת אמשל מבית החסידה, נפטרה בסביבות 1580"}, {"f": "g459", "c": "ספר הורוביץ, עמ' 25: כתובת 277, מצבת רבקה שערלן בת מאיר הכהן, 1579"}, {"f": "g488", "c": "המצבה של רבקה שערלן בת ר' מאיר הכהן, נפטרה כ\"ו בשבט של\"ט (23.1.1579). לפי אטלינגר כנראה המצבה של שורלין"}, {"f": "g455", "c": "כרטיס הרישום של לייב אופנהיים מבית הענק בוורמס, נפטר 1572 או 1573"}]}, {"n": "לייב אופנהיים", "y": "–1573", "s": [{"k": "worms", "r": "ld", "t": ["וורמס (Worms)", "1572 או 1573, וורמס"], "u": 1}], "c": {"n": 2 את יודלין. נפטר בערב שבת, י' בחשוון ש\"ל (21.10.1569).", "flag": "שנת הלידה לא ידועה. בכרטיס הרישום לא כתוב מי משתי נשותיו היא אמה של אשת משה אופנהיים.", "src": "כרטיס הרישום \"Gumpricht zum Schwert, 21.10.1569\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 53 · נוסח המצבה: M. Horovitz (1901), עמ' 20, כתובת 230 (אבן 252) · מאגר המצבות epidat (Steinheim-Institut), ffb-527, נבדק 21.11.2026", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Gumpricht zum Schwert\n📅 נפטר: 21.10.1569 (י' בחשוון ש\"ל)\n🪦 המצבה (הורוביץ 230): החבר גומפריכט, הפרנס (בשמו העברי: יצחק אפרים בן החבר שלמה ז\"ל)\n📜 רשומות:\n• 1523: מכתב מעבר (Geleit) מפרידברג לפרנקפורט\n• 1523–1567: מסמכים רבים בתיק בית החרב\n• 1540–1562: \"גומפרכט בבית החרב\"\n• 27.9.1555: \"בנה של הינדלין מפרידברג\" נותן ייפוי כוח למשה מפרידברג\n• 1556 ו-1560: \"בני הזוג גומפרכט ואנדלין בבית החרב\"\n• 1570: \"יוטלין, אלמנת גומפרכט מבית החרב\"\n📖 תיאור חייו: Vorfahren, חוברת O.3, עמ' 091\n🏠 בית: פרידברג (Friedberg)\n👨 אביו: שלמה מפרידברג, שנפטר שם בסביבות 1530\n👩 אמו: הינדכה מפרידברג, בת הירש כ\"ץ. נפטרה בסביבות 1550\n💍 נשותיו:\n• בסביבות 1540, הינדלה\n• בסביבות 1562, יודלין\n👨‍👩‍👧 ילדיו:\n• פריידלן, אשת וייבש בכרך מבית המאזניים (Zur Waage). נפטרה 18.1.1602\n• רעכלין, אשת משה וצלר מבית התפוח המוזהב (Zum goldenen Apfel). נפטרה 15.10.1623\n• (שמה לא נרשם), אשת משה אופנהיים מבית החרב (שנפטר 12.3.1626)\n📝 הערות העורך:\n• אשתו הראשונה רשומה בשם \"אנדלין\" ב-1543/45, ב-1556 וב-1560. כנראה הייתה בתם של יצחק מנאוהיים ושל חוה בת מאיר שיינפלד (שנפטרה בסביבות 1532).\n• \"יודלין\", האשה השנייה, רשומה עד 1570 כאלמנה שמשלמת את מס הבית."], ["🪦 נוסח המצבה (הורוביץ, כתובת 230; epidat ffb-527)", "החבר ר' גומפריכט ז\"ל. אשא כפי אל השמים, עיני עיני יורדה מים, לאיש צדיק ונאמן, פרנס והמנהיג הקהילה, החבר ר' יצחק אפרים בן החבר ר' שלמה ז\"ל, נפטר ונקבר בערב שבת י' חשון שנת ש\"ל. תנצב\"ה."]]}, "g": [{"f": "g454", "c": "כרטיס הרישום של גומפרכט מבית החרב, נפטר 21.10.1569"}, {"f": "g457", "c": "ספר הורוביץ, עמ' 20: כתובת 230, מצבת גומפרכט (יצחק אפרים בן שלמה), 1569"}, {"f": "g460", "c": "כרטיס הרישום של הינדכה מפרידברג, אמו של גומפרכט מבית החרב, נפטרה בסביבות 1550"}]}, {"n": "אליה גנס מטושקאו", "y": "–~1600", "s": [{"k": "tuschkau", "r": "l", "t": ["טושקאו (Tuschkau), בוהמיה"], "u": 0}], "c": {"n": "אליה (Elias) גנס מטושקאו", "rel": "אביו של שמחה בונם גנס · סבו של מאיר גנסמן", "b": "", "d": "כנראה זמן קצר אחרי 1600", "place": "טושקאו (Tuschkau), בוהמיה", "note": "אבי המשפחה בטושקאו שבבוהמיה, ליד פילזן. ידוע עליו רק שמו, ממצבת בנו שמחה בונם, ומה שכתב Meyer.", "flag": "שנות חייו ושם אשתו לא ידועים. שנת הפטירה היא הערכה של Meyer. נבדק ב-24.11.2026: שמות הוריו לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "מצבת בנו: S. Hock, \"Die Familien Prags\" (1892), עמ' 69, רשומה 7829 (Google Books), נבדק 24.11.2026 · W. Meyer, \"Zur Geschichte der Familie Eger-Gans-Gansmann\", Jüdische Familienforschung 14 (1938), עמ' 892–894 (Compact Memory, הספרייה של אוניברסיטת פרנקפורט)", "x": [["📜 מה ידוע עליו", "• על מצבת בנו שמחה בונם (הוק 7829, 1655): \"בן ר' אלי' ז\"ל מטושקא\".\n• לפי Meyer (1938): \"בטושקאו אנו מוצאים, בסביבות 1600, את אליה גנס, אבי משפחתנו\". עוד הוא כותב שאליה נפטר כנראה זמן קצר אחרי 1600, כי נכדו, שנקרא אליה על שמו, נפטר \"בשיבה טובה\", ולפי המנהג לא קראו לנכד על שם סבו בחיי הסב.\n• לפי Meyer, אביו של אליה לא ידוע."]]}, "g": [{"f": "g474", "c": "ספר הוק, עמ' 69: משפחת גנז, ובה רשומה 7829, מצבת שמחה בונם בן אליה מטושקאו (1655)"}, {"f": "g476", "c": "מפתח פופר לבית הקברות העתיק בפראג, עמ' 100: משפחת גנס. בשורה \"Simcheh Bunem S.v. Elija\": שמחה בונם בן אליה, חלקה L, מספר 1332 (8042)"}]}, {"n": "אליעזר וורמס", "y": "", "s": [{"k": "worms", "r": "l", "t": ["וורמס (Worms)"], "u": 0}], "c": {"n": "אליעזר בן מאיר וורמס", "rel": "אביה של גוטרט באלין · סבה של פרומט אופנהיים", "b": "", "d": "לא ידוע", "place": "וורמס (Worms)", "note": "בנו של מאיר וורמס. אשתו: פרומט, בת יוסף לוי. בתם גוטרט נישאה לאברהם באלין מבית הקנקן (Zur Kanne) בוורמס. ידוע עליו רק מה שכתוב בכרטיס הרישום של נכדתו.", "flag": "שנות חייו לא ידועות.", "src": "כרטיס הרישום של נכדתו \"Frummet Oppenheim, 28.1.1649\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1640–1649, עמ' 126 · מאגר המצבות epidat (Steinheim-Institut), בית העלמין של וורמס, נבדק 21.11.2026", "x": [["📜 מה ידוע עליו", "• בכרטיס הרישום של נכדתו פרומט אופנהיים, בהערת העורך: \"הורי אמה היו אליעזר בן מאיר וורמס ופרומט, בת יוסף לוי\".\n• מצבה: לא נמצאה במאגר המצבות של בית העלמין בוורמס (epidat)."]]}, "g": [{"f": "g438", "c": "כרטיס הרישום של פרומט אופנהיים, בת אברהם באלין מוורמס, נפטרה 28.1.1649"}]}, {"n": "ר' חיים כ\"ץ", "y": "–~1596", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית חבית היין (Zum Weinfass), ואחר כך פרידברג (Friedberg), הסן"], "u": 0}, {"k": "friedberg", "r": "l", "t": ["פרנקפורט, בית חבית היין (Zum Weinfass), ואחר כך פרידברג (Friedberg), הסן"], "u": 0}], "c": {"n": "ר' חיים כ\"ץ, אב בית הדין בפרידברג", "rel": "אביה של שפרינץ · סבה של גוטלין", "b": "", "d": "בסביבות 1596, ולכל המאוחר לפני נובמבר 1600", "place": "פרנקפורט, בית חבית היין (Zum Weinfass), ואחר כך פרידברג (Friedberg), הסן", "note": "חזן, ואחר כך אב בית הדין, בבית חבית היין (Zum Weinfass) בפרנקפורט, ואחר כך אב בית הדין בפרידברג. נפטר בסביבות 1596. אשתו: גיטלה מרוסהיים (Rosheim). אביה של שפרינץ, אשתו של ר' נתן נויגאס, וסבה של גוטלין בינגן לייטר. על מצבת בתו הוא נקרא \"מהר\"ר חיים זצ\"ל\".", "flag": "שנת הלידה לא ידועה. שנת הפטירה \"בסביבות 1596\" היא הערכה של עורך כרטיס הרישום, והוא מוסיף שייתכן שנפטר מאוחר יותר, עד 1605, ולא בהכרח בפרנקפורט. אבל על מצבת בתו שפרינץ מנובמבר 1600 הוא כבר נקרא \"זצ\"ל\", ולכן נפטר לכל המאוחר ב-1600. בספר הורוביץ לא נמצאה מצבה שלו (נבדק ב-11.11.2026). בכרטיס הרישום של נכדתו גוטלין נמחק ליד שמו התואר \"כ\"ץ\", ובכרטיס שלו אין סימן שהיה כהן; ייתכן שהתואר \"כ\"ץ\" בשמו בעץ אינו נכון.", "src": "כרטיס הרישום \"hazzān Ḥa'im zum Weinfass, um 1596 (?)\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 298 · כרטיס הרישום של בתו \"Šprints zum Weinfass, 9.11.1600\": קובץ 1600–1619, עמ' 4 · כרטיס הרישום של נכדתו \"Gutlen Bingen, 12.9.1650\": קובץ 1650–1659, עמ' 12 · מצבת בתו: M. Horovitz (1901), עמ' 36, כתובת 368 · כרטיסי הרישום של הוריו המשוערים: \"Amšel Neustadt, 6.2.1572\" ו-\"Sejnchen Neustadt, um 1576\", קובץ 1560–1599, עמ' 79 ו-132 · מצבת אנשל נוישטט: M. Horovitz (1901), עמ' 21, כתובת 240 · METAhub (\"House Weinfaß\")", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 hazzān Ḥa'im zum Weinfass (החזן חיים מבית חבית היין)\n📅 נפטר: \"בסביבות 1596 (?)\"\n🪦 המצבה: בכרטיס אין מספר הורוביץ.\n📜 רשומות:\n• 1576–1590: \"הייום, החזן, בבית חבית היין\"\n• 1577: שילם, כאח הבכור וכאפוטרופוס, עבור ילדו של אנשל מבית חבית היין\n• 1579: אפוטרופוס של ילדי מאיר מבית הירגזי (Zur Meise)\n• 1588: נשא את גיטלה מרוסהיים\n• 1600 (בפנקס הקבורה, בקבורת בתו): \"חיים, אב בית הדין דק\"ק פרידבורג\"\n• 1605: \"גוטלה, אלמנת הייום\"\n🏠 בית: חבית היין (Zum Weinfass)\n👨 אביו (בסימן שאלה): אנשל נוישטט מבית הדוב (Zum Bären), בן שמעון. נפטר 6.2.1572.\n👩 אמו (בסימן שאלה): שיינכן. נפטרה בסביבות 1576.\n👨‍👩‍👧 ילדיו:\n• שפרינץ, אשת נתן מהיידסהיים מבית חבית היין. נפטרה 9.11.1600\n📝 הערות העורך:\n• לא בטוח שנפטר בפרנקפורט, כי היה אז אב בית הדין בפרידברג, וייתכן שנפטר מאוחר יותר, עד 1605.\n• אשתו התקבלה כתושבת ב-1588, וכאלמנה היא רשומה ב-1605. היא באה ממשפחת יוזלמן מרוסהיים."], ["אזכורו בכרטיס הרישום של בתו (אלה תולדות)", "בכרטיס הרישום של בתו, \"Šprints zum Weinfass, 9.11.1600\", הוא רשום כאביה: \"ḥazzān, dann ab\"d Ḥa'im z. Weinfass, dann zu Friedberg\", כלומר החזן ואחר כך אב בית הדין חיים מבית חבית היין (Zum Weinfass), ואחר כך בפרידברג, שנפטר בסביבות 1596. אמה: גיטלה מרוסהיים."], ["👩‍🦱 אשתו", "גיטלה, מרוסהיים (Rosheim), ממשפחת יוזלמן מרוסהיים. נישאו ב-1588. ב-1605 רשומה כאלמנה. מופיעה בכרטיס נפרד"], ["אזכורו בכרטיס הרישום של נכדתו (אלה תולדות)", "בכרטיס הרישום של נכדתו, \"Gutlen Bingen, 12.9.1650\", מצוטט פנקס הקבורה: \"אמי גיטלה... נקברה ליד אמה שפרינץ בת חיים, אב בית הדין בפרידברג\". בשורת האם: \"Sprints b' Ha'im\", שנפטרה ב-9.11.1600."], ["👨‍👩‍👧 ילדיו", "שפרינץ, אשת ר' נתן נויגאס. נפטרה ב-9.11.1600. מופיעה בכרטיס נפרד"], ["🔎 חיפוש מצבה בספר הורוביץ", "נבדק ב-11.11.2026: בספר הורוביץ לא נמצאה מצבה של ר' חיים. נבדקו כל העמודים 33–60 (כתובות 342–591, השנים 1596–1631) ומפתח השמות.\n• באף מצבה לא נקרא חיים \"חזן\", ואין מצבה של חיים שקשורה לבית חבית היין (Zum Weinfass) או לפרידברג.\n• ממצא חשוב: על מצבת בתו שפרינץ (כתובת 368), מכסלו שס\"א (נובמבר 1600), הוא נקרא \"מהר\"ר חיים זצ\"ל\". כלומר, בנובמבר 1600 הוא כבר לא היה בחיים. לכן הוא נפטר לכל המאוחר ב-1600, ולא ב-1605 כפי שהעורך משער.\n• מצבות שאולי קשורות אליו, אבל לא הוכח (בהשערה ברורה בלבד):\n   כתובת 394 (1604): \"איציק... יצחק בן הר\"ר חיים\", נפטר בליל ראש השנה שס\"ה. אין במצבה שם בית או תואר.\n   כתובת 405 (1605): \"יוטכן צום גאנז (Zum Gans)... יטכן בת ר' חיים ז\"ל\".\n   כתובת 495 (1621): \"בילה אשת ר' ליווא בוך... בת הר\"ר חיים ז\"ל\".\nהשם חיים היה נפוץ, ולכן אי אפשר לקבוע שמדובר בילדיו."], ["👨‍👩 הוריו (בהשערה ברורה)", "לפי עורך כרטיסי הרישום מפרנקפורט, שלמה אטלינגר, ר' חיים היה כנראה בנם של אנשל נוישטט ואשתו שינכן. העורך רשם את זה בסימן שאלה, ואין רישום שכתוב בו במפורש \"חיים בן אנשל\". לכן ההורים לא נוספו לעץ.\n\nמי הם:\n• אביו המשוער: אנשל נוישטט (Anshel Neustadt). שמו העברי ר' אשר בר שמעון. גר בפרנקפורט בבית הדוב השחור (schwarzer Bär), ונפטר בכ\"ב בטבת של\"ב (1572). על המצבה שלו כתוב: \"אנשיל נייששטט, אשר שמו נודע בשערים... בסוד מורים בר אוריין, ר' אשר בר שמעון ז\"ל, נפטר ונקבר ביום ד', כ\"ב טבת של\"ב\" (הורוביץ, כתובת 240).\n• אמו המשוערת: שינכן (Schönchen). נישאה לאנשל כנראה בסביבות 1540, ונפטרה בסביבות 1576. שמות הוריה לא ידועים.\n\nלמה העורך חושב שהם הוריו? כך עולה מהרישומים, לפי הסדר:\n1. 1572: אנשל נפטר, ושינכן נשארת אלמנה עם ילדים.\n2. 1575: הבית של המשפחה, בית הדוב, מחולק לשניים. החלק החדש נקרא בית חבית היין (Zum Weinfass). האלמנה שינכן רשומה בו.\n3. 1576: גם החזן חיים רשום בבית חבית היין, כלומר הוא גר באותו בית עם שינכן.\n4. 1577: חיים משלם מס \"בשביל הילד של אנשל\". זה היה אח או אחות צעירים של חיים, שעוד היו קטנים כשאביהם נפטר, וחיים שילם עבורם כאח הבכור וכאפוטרופוס. מי היה הילד הזה לא ידוע, וגם העורך כותב שלא הצליח לזהות אותו.\n\nעוד דור אחורה: העורך משער, גם כאן בסימן שאלה, שאביו של אנשל היה וולף (שמעון) אוארבך מבית האסם המוזהב (Zur goldenen Scheuer), שנפטר בסביבות 1547. הסיבה: גם בנו של וולף גר בבית הדוב. השם \"נוישטט\" בא כנראה מהמקום שבו אנשל גר לפני כן, ליד משפחת אשתו."]]}, "g": [{"f": "g299", "c": "כרטיס הרישום של החזן ר' חיים מבית חבית היין (Zum Weinfass), \"נפטר בסביבות 1596 (?)\""}, {"f": "g249", "c": "כרטיס הרישום של גוטלין בינגן מפרנקפורט, נפטרה 12.9.1650"}, {"f": "g284", "c": "כרטיס הרישום של שפרינץ מבית חבית היין (Zum Weinfass), נפטרה 9.11.1600"}, {"f": "g288", "c": "ספר הורוביץ, עמ' 36: כתובת 368, מצבת שפרינץ בת ר' חיים (1600)"}]}, {"n": "גיטלה מרוסהיים", "y": "–>1605", "s": [{"k": "rosheim", "r": "l", "t": ["רוסהיים (Rosheim), אלזס"], "u": 0}, {"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית חבית היין (Zum Weinfass)"], "u": 0}], "c": {"n": "גיטלה (גוטלה) מרוסהיים, אשת החזן ר' חיים", "rel": "אשתו של ר' חיים, החזן ואב בית הדין בפרידברג · אמה של שפרינץ, לפי כרטיס הרישום של שפרינץ", "b": "", "d": "אחרי 1605", "place": "רוסהיים (Rosheim), אלזס ← פרנקפורט, בית חבית היין (Zum Weinfass)", "note": "באה מרוסהיים (Rosheim) שבאלזס, ממשפחת יוזלמן מרוסהיים. בהשערה ברורה הכוונה למשפחתו של השתדלן הנודע ר' יוסף (יוזלמן) מרוסהיים. ב-1588 נישאה לחזן ר' חיים מבית חבית היין (Zum Weinfass), ובאותה שנה התקבלה כתושבת פרנקפורט. היא מופיעה ברשומות העירייה בשנים 1589–1592, 1596 ו-1597, וב-1605 כ\"גוטלה, אלמנת הייום\". מתי נפטרה לא נרשם.", "flag": "שנת הלידה ושנת הפטירה לא ידועות: ב-1605 עוד הייתה בחיים. שם אביה לא ידוע. בספר הורוביץ לא נמצאה מצבה שלה (נבדק ב-11.11.2026, השנים 1596–1631). לפי כרטיס בעלה נישאו ב-1588, אבל לפי כרטיס הבת שפרינץ נישאה כבר בסביבות 1584. אם שתי ההערכות נכונות, בהשערה ברורה גיטלה הייתה אשתו השנייה של ר' חיים, ושפרינץ בתו מאשה קודמת. בכרטיס של שפרינץ גיטלה רשומה כאמה.", "src": "כרטיס הרישום של בעלה \"hazzān Ḥa'im zum Weinfass, um 1596 (?)\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 298 · כרטיס הרישום של בתה \"Šprints zum Weinfass, 9.11.1600\": קובץ 1600–1619, עמ' 4", "x": [["אזכורה בכרטיסי הרישום של בעלה ובתה (אלה תולדות)", "אין לה כרטיס רישום משלה.\nבכרטיס של בעלה, \"hazzān Ḥa'im zum Weinfass, um 1596 (?)\": \"נשא ב-1588 את גיטלה מרוסהיים\". והערת העורך: \"אשתו התקבלה כתושבת ב-1588, מופיעה ברשומות 1589–1592, 1596 ו-1597, וכאלמנה ב-1605. היא באה ממשפחת יוזלמן מרוסהיים\". ברשומה משנת 1605: \"גוטלה, אלמנת הייום\".\nבכרטיס של בתה, \"Šprints zum Weinfass, 9.11.1600\", בשורת האם: \"גיטלה מרוסהיים\"."], ["👨‍🦱 בעלה", "ר' חיים (הייום), החזן של בית חבית היין (Zum Weinfass), ואחר כך אב בית הדין בפרידברג. נפטר בסביבות 1596, ואולי מאוחר יותר. מופיע בכרטיס נפרד"], ["👨‍👩‍👧 ילדיה", "שפרינץ, אשת ר' נתן נויגאס מבית חבית היין (Zum Weinfass). נפטרה ב-9.11.1600. לפי כרטיס הרישום שלה גיטלה היא אמה. מופיעה בכרטיס נפרד"], ["🔎 חיפוש מצבה בספר הורוביץ", "נבדק ב-11.11.2026: בספר הורוביץ לא נמצאה מצבה של גיטלה. נבדקו כל העמודים 33–60 (כתובות 342–591, השנים 1596–1631) ומפתח השמות.\n• אין מצבה של גיטלה או גוטלה שנקראת אשתו או אלמנתו של חיים, או שבאה מרוסהיים (Rosheim).\n• המצבה היחידה בתקופה הזו של גוטלה שנקראת \"אלמנה\" היא כתובת 499 (1622): \"גויטלן אלמנה... בת ר' יעקב ז\"ל\". שם הבעל לא כתוב בה, ואין דרך לקשור אותה לר' חיים."]]}, "g": [{"f": "g284", "c": "כרטיס הרישום של שפרינץ מבית חבית היין (Zum Weinfass), נפטרה 9.11.1600"}, {"f": "g299", "c": "כרטיס הרישום של החזן ר' חיים מבית חבית היין (Zum Weinfass), \"נפטר בסביבות 1596 (?)\""}]}, {"n": "ר' אהרן מהיידסהיים", "y": "–~1600", "s": [{"k": "heidesheim", "r": "l", "t": [], "u": 0}], "c": {"n": "ר' אהרן מהיידסהיים (Heidesheim)", "rel": "אביו של ר' נתן נויגאס · סבה של גוטלין", "b": "", "d": "1600 או מעט לפני כן", "place": "היידסהיים", "note": "אביו של ר' נתן נויגאס, וסבה של גוטלין בינגן לייטר. גר בהיידסהיים, עיירה ליד מיינץ. שני בניו, נתן ויוזף, עברו לגור בפרנקפורט. בהשערה ברורה הוא נשאר בהיידסהיים ונפטר שם, ולכן אין לו כרטיס רישום או מצבה בפרנקפורט.", "flag": "שנת הלידה, שם אשתו ושמות הוריו לא ידועים. שנת הפטירה היא הערכה של עורך כרטיסי הרישום.", "src": "כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org: הכרטיס של בנו נתן (\"Nōsen Heidesheim, um 1625 ?\"), קובץ 1620–1629, עמ' 152, והכרטיס של בנו יוזף (\"Josef aus Heidesheim, um 1617\"), קובץ 1600–1619, עמ' 210", "x": [["📜 המקור", "אין לו כרטיס רישום משלו. שמו ושנת פטירתו רשומים, בלי סימן שאלה, בכרטיסי הרישום של שני בניו בפרנקפורט, בשורה \"האב\"."], ["👨‍👦‍👦 ילדיו", "• ר' נתן נויגאס, מבית חבית היין (Zum Weinfass) בפרנקפורט, ואחר כך בירושלים. נפטר בסביבות 1625. מופיע בכרטיס נפרד\n• יוזף מהיידסהיים, מבית הזאב (Zum Wolf) ואחר כך מבית השועל (Zum Fuchs) בפרנקפורט. נפטר בסביבות 1617. לא נוסף לעץ"]]}, "g": []}, {"n": "הירץ בינגן", "y": "–~1609", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית הקנקן (Zur Kanne), ואחר כך בית הרשת (Zur Reuse)", "בסביבות 1609, פרנקפורט"], "u": 0}], "c": {"n": "הירץ (משה נפתלי) בינגן, מבית הקנקן (Zur Kanne) ואחר כך מבית הרשת (Zur Reuse)", "rel": "בנו של זיסקינד בינגן · אביו של זליגמן בינגן · נינו של הר\"ר משה בינגן ממיינץ", "b": "", "d": "בסביבות 1609, פרנקפורט", "place": "פרנקפורט, בית הקנקן (Zur Kanne), ואחר כך בית הרשת (Zur Reuse)", "note": "בנו של זיסקינד בינגן מבית הקנקן (Zur Kanne), ונכדו של הר\"ר מאיר בינגן מבית הסולם (Zur Leiter). ב-1595 נרשם כ\"הירץ מבית הרשת, בנו של זיסקינד מבית הקנקן\". בשנים 1593–1598 שילם את מס הנישואין, ובסביבות 1595 נשא את הענל, בת אייזיק גלנהויזן. נפטר בסביבות 1609, וב-1610 אשתו כבר רשומה כאלמנה. על מצבת בנו זליגמן הוא נקרא \"משה נפתלי\".", "flag": "שנת הלידה לא ידועה. שנת הפטירה היא הערכה של עורך כרטיס הרישום. בכרטיס של בנו זליגמן שנת הפטירה מוקלדת ספרה על ספרה, וקל לקרוא אותה כ-1629. לפי הכרטיס של הירץ עצמו, ולפי הרישום של אשתו כאלמנה ב-1610, השנה היא בסביבות 1609. בכרטיס שלו שם סבו כתוב \"(? מאיר)\", אבל בכרטיס של אביו זיסקינד, מאיר רשום כאב בלי סימן שאלה. בכרטיס הרישום של ר' ישראל בינגן (קובץ 1680–1689, עמ' 83) אותו עורך כותב שהירץ בן זיסקינד נפטר \"בסביבות 1615\". כאן נשארה השנה 1609, לפי הכרטיס של הירץ עצמו, ולפי הרישום של אשתו כאלמנה ב-1610.", "src": "כרטיס הרישום \"Herts Bingen, um 1609\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1600–1619, עמ' 91 · כרטיס הרישום של אביו \"Ziskind Bingen, um 1598\": קובץ 1560–1599, עמ' 326 · כרטיס הרישום של בנו \"Zeligman Bingen zur Reuse, 30.11.1652\": קובץ 1650–1659, עמ' 49 · מפתח השמות של M. Horovitz (1901), עמ' 699", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Herts Bingen\n📅 נפטר: בסביבות 1609\n⚰️ פנקס הקבורה (1648, בקבורת אשתו): \"למעלה באמצע בית הקברות\", המצבה של הירץ בינג\n📜 רשומות:\n• 1593–1598: שילם את מס הנישואין\n• 1595: \"הירץ מבית הרשת, בנו של זיסקינד מבית הקנקן\"\n• 1610: \"הנלה, אלמנת הירץ\"\n🏠 בתים: הקנקן (Zur Kanne), ואחר כך הרשת (Zur Reuse)\n👨 אביו: זיסקינד בינגן מבית הקנקן, בן (? מאיר). נפטר בסביבות 1598.\n💍 אשתו: בסביבות 1595, הענל בת אייזיק גלנהויזן סג\"ל. נפטרה 1.9.1648. אחרי מותו נישאה למשה בון (Bonn)."], ["👩‍🦱 אשתו", "הענל, בת אייזיק גלנהויזן סג\"ל. נישאו בסביבות 1595. נפטרה ב-1.9.1648, ונקברה לידו. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nזליגמן (פנחס) בינגן, מבית הרשת (Zur Reuse), הדיין. נפטר ב-30.11.1652. מופיע בכרטיס נפרד\nמשה בינגן, מבית הרשת (Zur Reuse). נפטר ב-10.5.1665\nפוגל, אשת דוד כ\"ץ, ואחר כך אשת בערלה ורמס מבית הזאב (Zum Wolf), ואחר כך מבית הסוס השחור (Zum Rappen). נפטרה ב-16.12.1658\nמדין, אשת יעקב גינצבורג מבית העיר גינצבורג (Zur Stadt Günzburg). נפטרה ב-25.1.1636\nביילה\nהערת העורך: ייתכן, אבל לא סביר, שמדין וביילה הן בנותיו של הירץ בינגן אחר, שנפטר בסביבות 1618."], ["🔎 חיפוש מצבה בספר הורוביץ", "במפתח השמות של הורוביץ, תחת \"Bing\", אין מצבה של הירץ מהשנים האלה. כנראה שהמצבה לא שרדה. ב-1648 היא עוד מוזכרת בפנקס הקבורה.\nשמו מופיע במצבת בנו זליגמן (הורוביץ, עמ' 80, כתובת 774): \"פנחס זעליקמן בן משה נפתלי בינגא\"."]]}, "g": [{"f": "g312", "c": "כרטיס הרישום של הירץ בינגן (Herts Bingen), אביו של זליגמן בינגן, נפטר בסביבות 1609"}, {"f": "g311", "c": "כרטיס הרישום של זיסקינד בינגן (Ziskind Bingen), בנו של הר\"ר מאיר בינגן, נפטר בסביבות 1598"}, {"f": "g315", "c": "ספר הורוביץ, עמ' 80: כתובת 774, מצבת זליגמן (פנחס) בינגן, \"בן משה נפתלי בינגא\" (1652)"}]}, {"n": "הענל גלנהויזן", "y": "–1648", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית הרשת (Zur Reuse), ואחר כך בית כפתור המושק (Zum Bisemknopf)", "י\"ד באלול ת\"ח (1.9.1648), פרנקפורט"], "u": 0}], "c": {"n": "הענל (העניל), בת אייזיק גלנהויזן סג\"ל, אשת הירץ בינגן", "rel": "אשתו של הירץ בינגן · אמו של זליגמן בינגן", "b": "", "d": "י\"ד באלול ת\"ח (1.9.1648), פרנקפורט", "place": "פרנקפורט, בית הרשת (Zur Reuse), ואחר כך בית כפתור המושק (Zum Bisemknopf)", "note": "בתם של אייזיק גלנהויזן סג\"ל מבית הוורד הלבן (Zur weissen Rose) ושל מונקלה בת איצק בלאד. בסביבות 1595 נישאה להירץ בינגן, וגרה איתו בבית הרשת (Zur Reuse). הוא נפטר בסביבות 1609, ובסביבות 1610 נישאה שוב, לאלמן משה בון (Bonn) בן אהרן, וגרה איתו בבית כפתור המושק (Zum Bisemknopf). ב-1617 מסרה עדות על הביזה של רחוב היהודים בימי מהומות פטמילך (Fettmilch). נפטרה ב-1.9.1648, ונקברה ליד בעלה הראשון, הירץ בינג.", "flag": "שנת הלידה לא ידועה. בספר הורוביץ שנת הפטירה מודפסת \"ת\"ה\" (1645), ועורך כרטיס הרישום תיקן אותה ל\"ת\"ח\" (1648).", "src": "כרטיס הרישום \"Hennel, Frau des Herts Bingen, dann Mose Bonn, 1.9.1648\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1640–1649, עמ' 120 · נוסח המצבה: M. Horovitz (1901), עמ' 73, כתובת 710 (אבן 1202)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Hennel, Frau des Herts Bingen, dann Mose Bonn\n📅 נפטרה: 1.9.1648\n⚰️ פנקס הקבורה: \"הענל אשת משה בון, נקברה ליד בעלה הראשון, הירץ בינג\"\n📜 רשומות:\n• 1610: \"אלמנת הירץ\"\n• 1617: מסרה עדות על הביזה של מהומות פטמילך (Fettmilch)\n🏠 בתים: בנישואים הראשונים הרשת (Zur Reuse), ובנישואים השניים כפתור המושק (Zum Bisemknopf)\n👨 אביה: אייזיק גלנהויזן מבית הוורד הלבן (Zur weissen Rose), בן זליגמן סג\"ל. נפטר 15.10.1629.\n👩 אמה: מונקלה בת איצק בלאד. נפטרה 5.3.1625.\n💍 בעליה:\n• בסביבות 1595, הירץ בינגן בן זיסקינד. נפטר בסביבות 1609\n• בסביבות 1610, האלמן משה בון (Bonn) בן אהרן. נפטר 29.7.1647"], ["נוסח המצבה (הורוביץ, כתובת 710, אבן 1202)", "העניל אשת הירץ בינג צו רייזן, נפטרת יום ג' י\"ד אלול ת\"ה. פה נטמנת הצדקנית, ישרנית וגברתנית, החסידה, אשת חיל מרת העניל בת ר' יעקב אייזק גלהייזר ז\"ל, נפטר' ונקברת יום הנ\"ל. תנצב\"ה.\nהורוביץ הדפיס את השנה \"ת\"ה\" (1645). עורך כרטיס הרישום תיקן ל\"ת\"ח\" (1648), לפי פנקס הקבורה."], ["👨‍🦱 בעליה", "הירץ בינגן, מבית הרשת (Zur Reuse). נישאו בסביבות 1595, והוא נפטר בסביבות 1609. מופיע בכרטיס נפרד\nמשה בון (Bonn) בן אהרן, מבית כפתור המושק (Zum Bisemknopf). נישאו בסביבות 1610, והוא נפטר ב-29.7.1647"], ["👨‍👩‍👧 ילדיה", "לפי כרטיס הרישום של בעלה הירץ:\nזליגמן (פנחס) בינגן, הדיין, מבית הרשת (Zur Reuse). נפטר ב-30.11.1652. מופיע בכרטיס נפרד\nמשה בינגן, מבית הרשת (Zur Reuse). נפטר ב-10.5.1665\nפוגל. נפטרה ב-16.12.1658"]]}, "g": [{"f": "g313", "c": "כרטיס הרישום של הענל, אשת הירץ בינגן ואחר כך אשת משה בון, נפטרה 1.9.1648"}, {"f": "g314", "c": "ספר הורוביץ, עמ' 73: כתובת 710, מצבת הענל אשת הירץ בינג (1648)"}, {"f": "g312", "c": "כרטיס הרישום של הירץ בינגן (Herts Bingen), אביו של זליגמן בינגן, נפטר בסביבות 1609"}, {"f": "g417", "c": "כרטיס הרישום של ר' יצחק (אייזיק) גלנהויזן סג\"ל מבית הוורד הלבן (Zur weissen Rose), נפטר 15.10.1629"}]}, {"n": "אברהם באלין", "y": "–1622", "s": [{"k": "worms", "r": "ld", "t": ["וורמס (Worms)", "1622, וורמס"], "u": 0}], "c": {"n": "(שמואל) אברהם באלין, מבית הקנקן (Zur Kanne) בוורמס", "rel": "אביה של פרומט אופנהיים · סבו של ר' הירץ אופנהיים", "b": "", "d": "1622, וורמס", "place": "וורמס (Worms)", "note": "בספר הזיכרון של פרנקפורט שמו המלא: שמואל אברהם באלין. בנו של ליזר באלין. גר בוורמס, בבית הקנקן (Zur Kanne). אשתו: גוטרט, בת אליעזר וורמס. ב-1595 נישאה בתו פרומט ללייב אופנהיים מבית החרב בפרנקפורט. נפטר ב-1622 בוורמס. ידוע עליו רק מה שכתוב בכרטיס הרישום של בתו.", "flag": "שנת הלידה לא ידועה.", "src": "כרטיס הרישום של בתו \"Frummet Oppenheim, 28.1.1649\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1640–1649, עמ' 126", "x": [["📜 מה ידוע עליו", "• בכרטיס הרישום של בתו פרומט: \"אביה: אברהם באלין, מבית הקנקן בוורמס, בן ליזר, שנפטר ב-1622 בוורמס\" (לפי ספר הזיכרון של וורמס).\n• אביו, ליזר באלין, היה בן אליה באלין, ונפטר ב-1601 בוורמס.\n• אין לו כרטיס רישום בפרנקפורט, כי לא גר בה.\n• בספר הזיכרון של פרנקפורט (Memorbuch Frankfurt, MF 33-8), לפי כרטיס הרישום של בתו: \"פרומט בת שמואל אברהם באלין\"."]]}, "g": [{"f": "g438", "c": "כרטיס הרישום של פרומט אופנהיים, בת אברהם באלין מוורמס, נפטרה 28.1.1649"}]}, {"n": "גוטרט באלין", "y": "", "s": [{"k": "worms", "r": "l", "t": ["וורמס (Worms)"], "u": 0}], "c": {"n": "גוטרט, בת אליעזר וורמס, אשת אברהם באלין", "rel": "אמה של פרומט אופנהיים · סבתו של ר' הירץ אופנהיים", "b": "", "d": "לא ידוע", "place": "וורמס (Worms)", "note": "בתם של אליעזר בן מאיר וורמס ושל פרומט, בת יוסף לוי. אשתו של אברהם באלין, מבית הקנקן (Zur Kanne) בוורמס. ידוע עליה רק מה שכתוב בכרטיס הרישום של בתה.", "flag": "שנות חייה לא ידועות.", "src": "כרטיס הרישום של בתה \"Frummet Oppenheim, 28.1.1649\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1640–1649, עמ' 126", "x": [["📜 מה ידוע עליה", "• בכרטיס הרישום של בתה פרומט: \"אמה: גוטרט, בת אליעזר וורמס\".\n• שם בהערת העורך: \"הורי אמה היו אליעזר בן מאיר וורמס ופרומט, בת יוסף לוי\"."]]}, "g": [{"f": "g438", "c": "כרטיס הרישום של פרומט אופנהיים, בת אברהם באלין מוורמס, נפטרה 28.1.1649"}]}, {"n": "חיים פירשט", "y": "~1580–1653", "s": [{"k": "hamburg", "r": "l", "t": [], "u": 0}, {"k": "altona", "r": "ld", "t": ["28.3.1653 (כ\"ט באדר ב' תי\"ג), אלטונה"], "u": 0}], "c": {"n": "חיים פירשט", "rel": "אביו של משה חיים פירסט · בנו של ראובן · ראש הקהילה האשכנזית בהמבורג-אלטונה", "b": "בערך 1580", "d": "28.3.1653 (כ\"ט באדר ב' תי\"ג), אלטונה", "place": "המבורג ← אלטונה", "note": "חיים פירשט, שנקרא גם בשם הגרמני היינריך חיים פירשט (Heinrich Chajim Fürst), היה סוחר וסוכן חצר, ומראשי הקהילה היהודית האשכנזית בהמבורג ובאלטונה במחצית הראשונה של המאה ה-17. בזמנו נחשב היהודי העשיר ביותר בקהילה, והיה בה פרנס (ראש קהילה). הוא נפטר ביום שישי, 28 במרץ 1653, ונקבר בבית הקברות העתיק באלטונה. המצבה שלו עומדת שם עד היום.\n\nאביו נקרא ראובן, כך כתוב על המצבה. אשתו הייתה שרה, בת אברהם.\n\nאביו של משה חיים פירסט. לפי המצבות באלטונה ולפי זיכרונותיה של גליקל מהמלן, היו לו גם הבנים שלמה זלמן, נתנאל, וכנראה גם ירמיהו.", "flag": "שנת הלידה, בערך 1580, היא לפי Geni וויקיפדיה, ולא נמצא לה מסמך. תאריך הפטירה, שם אביו ראובן, מעמדו כפרנס, ושמות אשתו ובנו שלמה מאומתים במצבות ובזיכרונות של גליקל. אמו לא ידועה. הקשר שלו למשה חיים פירסט הוא לפי Geni. במצבות באלטונה יש \"משה פורשט\" (בעלה של בילה, 1665) ו\"חיים בן משה פוירשט\" (1682), אבל אף מצבה לא אומרת במפורש שמשה היה בנו של חיים.", "src": "מאגר epidat של מכון שטיינהיים, בית הקברות היהודי באלטונה (Königstraße): מצבות hha-3335 (חיים בר ראובן), hha-3334 (שלמה זלמן בר חיים), hha-3333 (שרה), hha-9549 ו-hha-2431 (נתנאל והענדלין), hha-2208 ו-hha-1302 (ירמיהו וציפורה) · זיכרונות גליקל מהמלן, מהדורה גרמנית, דרך bibliotheca Augustana, כולל הערת העורך על מספרי הקבר 855 ו-856 · M. Grunwald, \"Hamburgs deutsche Juden bis zur Auflösung der Dreigemeinden 1811\" (1904), מס' 3743, דרך ויקיטקסט: \"Eine Confrontation zwischen Glückel Hameln's Memoiren und den alten Hamburger Grabbüchern\" · M. Duckesz, \"Zur Geschichte und Genealogie der ersten Familien der hochdeutschen Israeliten-Gemeinden in Hamburg-Altona\" (1915), עמ' 24, מס' 31, ועמ' 38 · ויקיפדיה האנגלית, \"Chajim Fürst\", על פי U. Hinnenberg, \"Die Kehille\" (1996), ו-B.-Z. Abrahams, \"The Life of Glückel of Hameln\" (2010), עמ' 14 · שנת הלידה והקשר למשה: Geni (נמסר על ידי המשפחה, 9.11.2026)", "x": [["🪦 המצבה", "על המצבה הוא לא נקרא בשם המשפחה, אלא בשם אביו: \"חיים בר ראובן\". זו הכתובת:\nפה קבור ונטמן שורק נטע נאמן בקרן בן שמן הלך לו לאור באור החיים ... בארץ החיים הוא היקר פרנס ומנהג כמר חיים בר ראובן ז\"ל מת ונקבר עש\"ק כ\"ט אדר שני תי\"ג לפ\"ק ביום אשר הוא סימן יפה לנשמות הלך לו למנוחות ואותנ' עזב לבכי ואנחות נשמתו תהא צב\"צ החיים עש\"צ שבגע\"א\nכלומר: \"פה קבור ונטמן גפן משובחת, נטע נאמן... הוא היקר, הפרנס והמנהיג, כבוד מורנו ורבנו חיים בר ראובן ז\"ל. מת ונקבר בערב שבת קודש, כ\"ט באדר שני תי\"ג, ביום שהוא סימן יפה לנשמות. הלך לו למנוחות, ואותנו עזב לבכי ואנחות\".\n\"סימן יפה\": לפי הערת המאגר, הוא נפטר בערב ראש חודש, ביום שהמקובלים בצפת קראו לו \"יום כיפור קטן\". מי שנפטר ביום כזה נחשב נקי מחטא.\nאיך יודעים שזה חיים פירשט? בהערות לזיכרונות של גליקל, מספר הקבר שלו בספר הקבורה של הקהילה הוא 855, ושל בנו שלמה 856. אלה בדיוק המספרים של המצבה הזאת ושל המצבה של \"שלמה זלמן בר חיים\" שלידה. גם גרונוואלד (1904, מס' 3743) כותב במפורש שזה חיים פירשט, שנרשם \"לא בשם משפחתו המפורסם\".\nהמצבה עשויה מאבן חול, גובהה 1.87 מטר. היא נשברה, ושוקמה והוצבה מחדש ב-2005. תמונה שלה אחרי השיקום נמצאת בגלריה של הכרטיס."], ["📜 מה כתבה עליו גליקל מהמלן", "גליקל מהמלן (1646–1724) גדלה בקהילה הזאת, ובזיכרונותיה היא מתארת את חיים פירשט כמי שהכירה מקרוב. כשהיא מונה את העשירים בקהילה בימי אביה, היא כותבת שהעשיר מכולם היה חיים פירשט, עם הון של 10,000 טאלר. אביה, יהודה לייב, היה במקום השני, עם 8,000 טאלר.\nעל מותו היא כותבת שחיים פירשט, \"האיש העשיר ביותר בקהילה, שהיה גם פרנס\", נפטר בתקופה של מחלוקות פנימיות בקהילת אלטונה."], ["👨‍👦 בניו", "• שלמה זלמן: גליקל מספרת שהיה פרנס בית הכנסת, ומתארת אותו כאיש מצוין וכתלמיד חכם גדול. המצבה שלו, \"שלמה זלמן בר חיים\", עומדת ליד המצבה של אביו. הוא נפטר ביום ראשון, 30 במרץ 1653 (ב' בניסן תי\"ג), יומיים בלבד אחרי אביו.\n• משה: משה חיים פירסט שבעץ, בעלה של בילה בת ישראל.\n• נתנאל: \"האלוף הראש התורני, נגיד ושר, פרנס ומנהיג מוהר\"ר נתנאל בן פ\"ו כמר חיים פוירשט\". הוא נפטר ב-1681 (כ' בכסלו תמ\"ב). אשתו הענדלין, בת יוזפא ווינג מהאנאו, נפטרה ב-1662.\n• ירמיהו (כנראה): \"הדיין המצוין כמוהר\"ר ירמיהו בן האלוף כ' חיים פיורשט\", נפטר ב-1703. אשתו ציפורה, בת יהודה ליב סג\"ל, הייתה מיילדת מפורסמת, ונפטרה ב-1722. על המצבה לא כתוב שאביו היה הפרנס, ולכן הזיהוי הוא בהשערה ברורה.\nהבנים שלמה, נתנאל וירמיהו לא נוספו לעץ כאנשים נפרדים."], ["🏘️ הקהילה האשכנזית בהמבורג ובאלטונה", "בתחילת המאה ה-17 חיו באזור המבורג שתי קהילות יהודיות נפרדות:\n• הקהילה הפורטוגזית, של צאצאי האנוסים מפורטוגל.\n• הקהילה האשכנזית, \"ההוכדויטשית\", של יהודים דוברי יידיש מגרמניה.\nלכל קהילה היו בתי כנסת ובית קברות משלה. האשכנזים ישבו בעיקר באלטונה הסמוכה, שהייתה תחת שלטון דני, ובוונדסבק. באלטונה ניתנה להם זכות ישיבה ב-1612, ובית הקברות שלהם ברחוב Königstraße נפתח באותן שנים.\nב-1648 הורה הסנאט של המבורג לאשכנזים שהתיישבו בעיר לעזוב אותה עד פסח 1649, והם עברו לאלטונה. חלקם חזרו להמבורג בסוף שנות ה-50.\nבספר של דוקס (Duckesz, 1915) על \"המשפחות הראשונות\" של הקהילה האשכנזית בהמבורג-אלטונה מופיעים גם \"Heinrich Chajim Fürst\" וגם \"Salomon Chajim Fürst\"."], ["🔎 מה עוד אפשר לבדוק", "• מי היה אביו ראובן, ומאיפה הגיע. על המצבה כתוב רק \"בר ראובן\". ב-Geni רשום כאביו \"ראובן חיים פירשט\", אבל עם שנת לידה בערך 1607, כלומר אחרי חיים, ועם אשה בשם שרה אביגיל דה סילבה. לכן החיבור הזה לא נכנס לעץ.\n• הספר של דוקס מ-1915, שנסרק ונמצא באתר הספרייה של המבורג. לפי המאגר, בעמ' 24 מופיעה כתובת המצבה שלו, ובעמ' 38 יש פרק על המשפחה, שאולי יש בו גם את מוצאה.\n• בוויקיפדיה יש ערך על משה ישראל פירשט (Moses Israel Fürst), סוחר טבק ומממן מהמבורג שנפטר בערך ב-1692. לא ברור אם הוא קשור למשה חיים פירסט שבעץ, ואין לזהות ביניהם בלי מקור."]]}, "g": [{"f": "g203", "c": "מצבת חיים פירשט"}, {"f": "g320", "c": "מצבת חיים בר ראובן, הוא הפרנס חיים פירשט, 1653. בית הקברות העתיק באלטונה (Königstraße), אחרי השיקום ב-2005."}]}, {"n": "שרה פירשט", "y": "~1595–1666", "s": [{"k": "hamburg", "r": "l", "t": ["המבורג-אלטונה"], "u": 0}, {"k": "altona", "r": "ld", "t": ["המבורג-אלטונה", "1.9.1666 (ליל ב' באלול תכ\"ו), אלטונה"], "u": 0}], "c": {"n": "שרה פירשט, בת אברהם", "rel": "אמו של משה חיים פירסט · אשתו של חיים פירשט · בתו של אברהם", "b": "בערך 1595", "d": "1.9.1666 (ליל ב' באלול תכ\"ו), אלטונה", "place": "המבורג-אלטונה", "note": "אמו של משה חיים פירסט, ואשתו של הפרנס חיים פירשט. אביה נקרא אברהם.\n\nהיא נפטרה ביום רביעי בערב, 1 בספטמבר 1666 (ליל ב' באלול תכ\"ו), ונקברה למחרת בבית הקברות העתיק באלטונה, בשורה של המצבות של בעלה חיים ושל בנה שלמה זלמן, שנפטרו 13 שנה לפניה.", "flag": "שנת הלידה, בערך 1595, היא לפי Geni ולא נמצא לה מסמך. תאריך הפטירה, שם אביה ושם בעלה מאומתים במצבה. הקשר שלה למשה חיים פירסט כבנה הוא לפי Geni.", "src": "מאגר epidat של מכון שטיינהיים, בית הקברות היהודי באלטונה (Königstraße), מצבה hha-3333, צילום: Dan Bondy, ברישיון CC BY 4.0 · ספר הקבורה של הקהילה, מס' 857 · M. Grunwald (1904), עמ' 246, מס' 967 · Verborgene Pracht: Der jüdische Friedhof Hamburg-Altona – Aschkenasische Grabmale (2009), עמ' 179 · שנת הלידה: Geni (נמסר על ידי המשפחה, 9.11.2026)", "x": [["🪦 המצבה", "זו הכתובת. בחלקים שבסוגריים האבן שבורה, והם הושלמו במאגר:\nפה [שר\"ה וט]מונה אשה [חשוב]ה והגונה שבחה [מי מ]נה מרת שרה בת אברהם אשת הפ' כמ\"ר חיים פוירשט ז\"ל הלכה לבית מלונה במנוח[ה] נכונה תחילת ליל [ה'] ונקברת ביום ה' [שני] ימים לחדש אל[ול ה'] תכ\"ו פרט השנ[ה] רו[ח] [ה'] תנחנה בצ\"ה [עשנצ\"ו] במעלה עליונה א\"ס\nכלומר: \"פה נחה וטמונה אשה חשובה והגונה, ששבחה מי ימנה, מרת שרה בת אברהם, אשת הפרנס כבוד מורנו ורבנו חיים פוירשט ז\"ל. הלכה לבית מלונה, למנוחה נכונה, בתחילת ליל חמישי, ונקברה ביום חמישי, ב' באלול תכ\"ו. רוח ה' תנחנה\".\nמשחק מילים: המילה הראשונה, \"שר\"ה\", מסומנת בגרשיים. היא נקראת \"שָׁרָה\", כלומר נמצאת, נחה, וזה גם שמה.\nשנת הפטירה מוצפנת בפסוק \"רוח ה' תנחנה\" (ישעיהו ס\"ג, י\"ד). המצבה מעוטרת בעיטור פרחים, ושוקמה והוצבה מחדש ב-2012. תמונה שלה נמצאת בגלריה של הכרטיס."]]}, "g": [{"f": "g204", "c": "מצבת שרה פירסט"}, {"f": "g321", "c": "מצבת שרה בת אברהם, אשת הפרנס חיים פוירשט, 1666. בית הקברות העתיק באלטונה (Königstraße), אחרי השיקום ב-2012."}]}, {"n": "ר' משה ברודא, פראג", "y": "1590–~1639", "s": [{"k": "prague", "r": "l", "t": [], "u": 0}], "c": {"n": "האלוף הראש והקצין ר' משה ברודא", "rel": "אביו של הרב שאול ברודא", "b": "1590", "d": "בערך 1639", "place": "פראג", "note": "אביו של הרב שאול ברודא. בעלה של בילה ברוד. לפי \"סדר הדורות\" גבאי דמתא פראג, בנו של הרב ר' מאיר מברודא ואשתו רבקה.", "flag": "השנים נמסרו על ידי המשפחה ולא אומתו במקור נוסף. הקריאה של \"סדר הדורות\", שלפיה שאול הוא בנו, היא בהשערה ברורה, כי הניסוח שם דו-משמעי. במסירת המשפחה, שמקורה ב-Geni, אביו נקרא משה ברודא, והשם בעץ נקבע לפי \"סדר הדורות\".", "src": "מסירת המשפחה, 9.11.2026 · \"סדר הדורות\" (בית קלם), עמוד שנמסר על ידי המשפחה", "x": []}, "g": []}, {"n": "אשת ר' משה ברודא", "y": "", "s": [{"k": "prague", "r": "l", "t": [], "u": 0}], "c": {"n": "אשתו של ר' משה ברודא מפראג", "rel": "אמו של הרב שאול ברודא · אשתו של ר' משה ברודא מפראג", "b": "", "d": "", "place": "פראג", "note": "אשתו של ר' משה ברודא, \"הראש והקצין, גבאי דמתא\" בפראג, ואמו של הרב שאול ברודא. שמה ושם אביה לא ידועים.", "flag": "שמה, שנות חייה והוריה לא ידועים.", "src": "S. Hock, \"משפחות ק\"ק פראג על פי מצבותיהן\" (1892), דרך הספרייה הממלכתית של בוואריה (MDZ, bsb11538295)", "x": [["🔎 חיפוש", "בספר של הוק על מצבות בית הקברות העתיק בפראג, בפרק \"ברוד ברודא\" ובחלק של מי שאין לו שם משפחה, לא נמצאה מצבה שלה, ולא נמצא מקור אחר עם שמה או שמות הוריה."]]}, "g": []}, {"n": "משה מאיר בינגן", "y": "–1603", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית הסולם (Zur Leiter)"], "u": 0}], "c": {"n": "משה מאיר בינגן, מבית הסולם (Zur Leiter) (Mose Bing)", "rel": "אביו של מאיר משה בינגן מבית הסולם (Zur Leiter) · בעלה של פריידלין בינגן", "b": "", "d": "1603", "place": "פרנקפורט, בית הסולם (Zur Leiter)", "note": "בנו של הר\"ר מאיר בן משה מאיר בינגן. גר בפרנקפורט בבית הסולם הלבן (Zur weissen Leiter), ובמסמכים מ-1542 עד 1597 הוא מופיע בקשר לבית. אחרי מות אביו היה אפוטרופוס של אחיו הקטינים. נפטר בליל שבת קודש בחנוכה, ב' בטבת, ונקבר למחרת, ביום ראשון, ג' בטבת, בשנת שס\"ד (1603), לפי נוסח המצבה. ראו בהערה.", "flag": "שנת הלידה לא ידועה. שנת הפטירה במחלוקת בין שלוש קריאות: (1) בנוסח המצבה שהעתיק הורוביץ כתוב שס\"ד, כלומר 1603: ב' בטבת שס\"ד חל בשבת, היום האחרון של חנוכה (6.12.1603 בלוח הגרגוריאני), וג' בטבת ביום ראשון, בדיוק כמו בכתובת. (2) Wikimedia Commons נותן 22.12.1607, כלומר שס\"ח, וגם בשנה זו ב' בטבת חל בשבת בחנוכה. (3) הורוביץ עצמו מיין את הכתובת תחת שס\"ה (1604), וכך גם כרטיס הרישום (23.12.1604), אבל בשנה זו ב' בטבת חל ביום חמישי, ולכן היא לא מתאימה לכתוב על האבן. האותיות ד', ה' ו-ח' דומות, ולכן ההבדלים הם כנראה טעויות קריאה. בעץ נרשמה השנה 1603, לפי נוסח המצבה.", "src": "כרטיס הרישום \"Mose Bingen, 23.12.1604\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1600–1619, עמ' 43 · Wikimedia Commons, מצבה 0086 בבית הקברות בבטונשטראסה · נוסח המצבה: M. Horovitz (1901), עמ' 39, כתובת 395 · מסירת המשפחה, 9.11.2026", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Mose Bingen\n📅 נפטר: 23.12.1604 (ג' בטבת שס\"ה)\n🪦 המצבה (הורוביץ 395): משה בינג מבית הסולם, בן מאיר ז\"ל, ממשפחת בינג\n📜 רשומות (בתיק הבית, הסולם, מהשנים 1542–1597):\n• 1560: רשום כאפוטרופוס של ילדי מאיר המנוח, כלומר הבן הבוגר היה אפוטרופוס של אחיו הקטינים\n🏠 בית: הסולם הלבן (Zur weissen Leiter)\n👨 אביו: מאיר בינגן מבית הסולם, בן משה. נפטר בסביבות 1559.\n👩 אמו: לא נרשמה. לפי העורך זו כנראה גוטה, אשתו הראשונה של אביו, כי משה כבר היה נשוי ב-1549.\n💍 נשותיו:\n• כנראה בסביבות 1545, ברנדל. רשומה כאשתו הראשונה ברשימת 1549\n• פריידלין. רשומה כאשתו ברשימת 1560\n📝 הערות העורך:\n• לפי הורוביץ נפטר בליל שבת חנוכה, ב' בטבת, ונקבר למחרת, ביום ראשון, ג' בטבת שס\"ה. אבל ב' בטבת שס\"ה חל ביום חמישי.\n• יצחק מבית הטבעת הצהובה (Zum gelben Ring), שנפטר בסביבות 1592, היה כנראה קרוב משפחה שלו, אולי בנו."], ["👩‍🦱 נשותיו", "ברנדל. אשתו הראשונה. נישאו כנראה בערך ב-1545. מופיעה כאשתו ברשימת 1549\nפריידלין. מופיעה כאשתו ברשימת 1560. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nמאיר בינגן, מבית הסולם (Zur Leiter). נפטר ב-3.8.1614. מופיע בכרטיס נפרד\nפוגל, אשת עקיבא דקינגן מבית הסולם (Zur Leiter). נפטרה ב-1.3.1643\nשפרינץ, אשת מרדכי דויץ מבית הסולם (Zur Leiter). נפטרה ב-10.11.1647\nיודלין, אשת מאיר טנהאוזן מבית הסולם (Zur Leiter). נפטרה ב-23.10.1632"], ["נוסח המצבה (הורוביץ, כתובת 395, אבן 727)", "משה בינג צור לייטר. פה טמון איש נאמן, תם וישר, טוב וכשר, כמר משה בר מאיר ז\"ל, ממשפחת בינג. נפטר ליל שבת קודש בחנוכה ב' טבת, ונקבר למחרתו יום א' ג' בו, שס\"ד לפ\"ק. תנצב\"ה א\"ס."]]}, "g": [{"f": "g195", "c": "כרטיס הרישום של משה מאיר בינגן, Mose Bing · פרנקפורט"}, {"f": "g197", "c": "מצבת משה מאיר בינגן, Zur Leiter · פרנקפורט (אבן 0086)"}, {"f": "g212", "c": "ספר הורוביץ, עמ' 39: כתובת 395, מצבת משה בינג צור לייטר"}]}, {"n": "ר' וולף שיק גרעץ", "y": "1606–1649", "s": [{"k": "hradec", "r": "l", "t": ["Hradec Králové, צ'כיה"], "u": 0}], "c": {"n": "ר' וולף שיק גרעץ (Wolf Grätz)", "rel": "אביו של ר' אליעזר ליפמן גרעץ", "b": "1606", "d": "1649", "place": "Hradec Králové, צ'כיה", "note": "אביו של ר' אליעזר ליפמן גרעץ, אב בית הדין בבומסלא. על המצבה של בנו הוא נקרא \"מהורר וואלף גראץ זצ\"ל\", כלומר היה תלמיד חכם ונפטר לפני בנו. גם גרינוואלד, שכתב על רבני בומסלא, קורא לו \"הרב המלומד וולף גרץ\" (der gelehrte R. Wolf Grätz).", "flag": "שנות חייו, 1606–1649, נמסרו על ידי המשפחה ולא נמצא להן מסמך. שמו, היותו תלמיד חכם, והיותו אביו של ליפמן מאומתים במצבת בנו. השם \"שיק\" והמקום Hradec Králové נמסרו על ידי המשפחה. המקום מתאים להסבר של גרינוואלד לשם גרץ.", "src": "M. Grünwald, \"Jungbunzlauer Rabbiner\" (פראג 1888), עמ' 8–10, סריקה בספריית האוניברסיטה של פרנקפורט (אוסף פריימן) · Jewish Encyclopedia (\"Jung-Bunzlau\") · S. Hock, \"משפחות ק\"ק פראג על פי מצבותיהן\" (1892), עמ' 75, מצבת הנכד וולף בן ליפמן · שם מלא, שנים ומקום: מסירת המשפחה, 9.11.2026; Geni", "x": [["🪦 מצבת בנו ליפמן", "שמו של וולף ידוע מהמצבה של בנו בבומסלא, שגרינוואלד העתיק בספרו (עמ' 10):\n\"שר גדול נפל בישראל ביום ב' של גליות חג השבועות תנ\"ד לפ\"ק: פ\"נ הרב הגאון אליעזר ליפמן בן מהורר וואלף גראץ זצ\"ל, רב ואב\"ד בק\"ק טעפליץ וקאלין ובקהלתנו בומסלא והמדינה סביבותיה, לפנים מו\"ש בק\"ק פראג\"."], ["📛 השם גרעץ", "לפי גרינוואלד (עמ' 8, הערה 4), השם \"גרץ\" הוא קיצור של שם העיר קניגגרץ (Königgrätz) בבוהמיה, היא Hradec Králové של היום. זה מתאים למקום שהמשפחה מסרה עבור וולף. הוא כתב על כך גם ב-Jüdisches Centralblatt משנת 1888, עמ' 39–40.\nהשם \"שיק\" מופיע רק ב-Geni, ולא מצאתי לו מקור."], ["🔎 חיפוש המצבה שלו", "המצבה שלו לא נמצאה. בספר של הוק על מצבות בית הקברות העתיק בפראג אין מצבה שלו, וגם לא של אשתו. בפראג יש מצבה של נכדו, \"וואלף בן הגאון מו' ליפמן ז\"ל אב\"ד דק\"ק בומסלא\" (1714), שנקרא כנראה על שמו. בהשערה ברורה, וולף נקבר בקניגגרץ. לא מצאתי צילום של מצבה."]]}, "g": []}, {"n": "ר' זיסקינד בומסלא", "y": "–<1654", "s": [{"k": "boleslav", "r": "l", "t": [], "u": 0}], "c": {"n": "ר' זיסקינד, מבית בומסלא (בונצל)", "rel": "אביה של שרל בונצל גרעץ", "b": "", "d": "לפני 1654 (תי\"ד)", "place": "בומסלא", "note": "אביה של שרל, אשתו של ר' אליעזר ליפמן גרעץ. על המצבה של בתו בפראג הוא נקרא \"הרב הקצין מו' זיסקינד בומסלא\".\n\nלפי הערה בספר של שמעון הוק הוא נפטר לפני שנת תי\"ד (1654). זה ידוע \"ממעיל אשר נדב בנו מוהר\"ר יאקב בבומסלא\", כלומר בנו יעקב תרם לזכרו מעיל לספר תורה בבית הכנסת בבומסלא. בהשערה ברורה, המשפחה חיה בבומסלא (מלאדה בולסלאב), ומכאן שם המשפחה.", "flag": "שנות חייו לא ידועות. תאריך הפטירה, לפני 1654, הוא לפי ההערה של הוק. מקום המגורים בבומסלא הוא השערה.", "src": "S. Hock, \"משפחות ק\"ק פראג על פי מצבותיהן / Die Familien Prags\" (פרשבורג 1892), דרך הספרייה הממלכתית של בוואריה (MDZ, bsb11538295), עמ' 75, מס' 2114, ההערה · M. Grünwald, \"Jungbunzlauer Rabbiner\" (פראג 1888), עמ' 9, הערה 1, סריקה בספריית האוניברסיטה של פרנקפורט (אוסף פריימן)", "x": [["🧥 המעיל לספר התורה", "גרינוואלד, בספרו על רבני בומסלא (1888, עמ' 9, הערה 1), מביא את הכתובת על מעיל לספר תורה ששרד בבית הכנסת בבומסלא:\n\"ה\"ה הוא הראש והקצין מוהרר יאקב יצ\"ו ר\"מ ופרימז בן ה\"ה מוהרר זיסקינד זצ\"ל ואשתו מרת שרל בת כהרר איסר ז\"ל, תי\"ד לפ\"ק\".\nכלומר: את המעיל תרם ב-1654 בנו של זיסקינד, יעקב, \"הראש והקצין\", שהיה ראש מדינה ו\"פרימס\". זיסקינד עצמו כבר לא היה אז בחיים.\n\"ואשתו מרת שרל בת כהרר איסר\" היא, בהשערה ברורה, אשתו של יעקב התורם. אבל אפשר לקרוא את המשפט גם כאילו מדובר באשתו של זיסקינד.\nלפי גרינוואלד, התואר \"פרימס\" (Primas) עבר בירושה בכמה דורות במשפחה, והפך לשם משפחה. ב-1679 מופיע \"Jacob Süsskind\" בין זקני הקהילה בבומסלא."], ["⚠️ לא להתבלבל", "בפרק \"בומסלא\" בספר של הוק יש עוד אדם באותו שם: ר' זיסקינד בן שמחה, מראשי קהילת פראג, שנפטר בפראג ב-1676. אתר גנאלוגי פרטי (rootsweb) מזהה אותו כאביה של שרל, וגם בעץ הוא הופיע לזמן קצר בתפקיד הזה. אבל לפי הוק, אביה של שרל נפטר לפני 1654, ולכן מדובר בשני אנשים שונים."], ["🔎 מה עוד אפשר לבדוק", "המצבה שלו לא נמצאה, ושמות הוריו ואשתו לא ידועים. הוק מפנה לספר של גרינוואלד על רבני יונג-בונצלאו (Grünwald, Jung-Bunzlauer Rabbiner, עמ' 9, הערה 1), ולספר \"מגדל דוד\" של דוד גרינהוט. את הספר של גרינוואלד בדקתי, והכתובת מהמעיל מובאת למעלה. את \"מגדל דוד\" לא מצאתי בעותק דיגיטלי."]]}, "g": []}, {"n": "משה אופנהיים", "y": "–1626", "s": [{"k": "frankfurt", "r": "ld", "t": ["בפורים שפ\"ו (12.3.1626), פרנקפורט"], "u": 0}], "c": {"n": "ר' משה אופנהיים, הפרנס, מבית החרב (Zum Schwert)", "rel": "אביו של לייב אופנהיים · סבו של ר' הירץ אופנהיים", "b": "", "d": "בפורים שפ\"ו (12.3.1626), פרנקפורט", "place": "פרנקפורט", "note": "בנו של לייב אופנהיים מוורמס. גר בפרנקפורט בבית החרב (Zum Schwert), ויש עליו מסמכים רבים מ-1572 ואילך. כינויו היה \"קרוט\" (Krot, קרפדה). נשא בסביבות 1571 את בתו של גומפרכט מפרידברג, ואחרי מותה, ב-1599 או 1600, את הינדלה בת מיכל זונס. על המצבה שלו הוא נקרא \"הפרנס\", \"יסוד עולם\". נפטר בפורים שפ\"ו (12.3.1626).", "flag": "שנת הלידה לא ידועה. דיץ וכרטיס הרישום חלוקים בשמות הוריו.", "src": "כרטיס הרישום \"Mose Oppenheim, 12.3.1626\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1620–1629, עמ' 165 · נוסח המצבה: M. Horovitz (1901), עמ' 55, כתובת 544 (אבן 3634) · A. Dietz, \"Stammbuch der Frankfurter Juden\" (1907), ערך 435", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Mose Oppenheim\n📅 נפטר: 12.3.1626 (פורים שפ\"ו)\n🪦 המצבה (הורוביץ 544): ר' משה אופנהיים בן יהודה ז\"ל\n⚰️ פנקס הקבורה: \"הזקן ר' משה אופנהיים\", נקבר ליד אשת אברהם דילקה (?)\n📜 רשומות: מסמכים רבים בתיק הבית (החרב) מ-1572 ואילך\n📖 תיאור חייו המפורט מופיע ב-Vorfahren, חוברת N, עמ' 1545.\n💬 כינוי: קרוט (Krot, קרפדה)\n🏠 בית: החרב (Zum Schwert)\n👨 אביו: לייב אופנהיים בוורמס, מבית הענק (Riese). נפטר ב-1572 או 1573.\n👩 אמו: שורלין. נפטרה בסביבות 1580.\n💍 נשותיו:\n• בסביבות 1571, בת גומפרכט (מפרידברג), שנפטר 21.10.1569\n• ב-1599 או 1600, הינדלה בת מיכל זונס, אלמנת יוזבל כ\"ץ. נפטרה 24.4.1624\n👨‍👩‍👧 ילדיו:\n• לייב אופנהיים, מבית החרב. נפטר 7.4.1655. מופיע בכרטיס נפרד\n• גומפרכט אופנהיים, מבית החרב. נפטר בסביבות 1630\n• צורלין, אשת זנוויל הזה מבית הדוב המוזהב (Zum goldenen Bär). נפטרה 9.3.1633"], ["נוסח המצבה (הורוביץ, כתובת 544, אבן 3634)", "הפרנס מהר\"ר משה אופנהיים. פור נהפך לאבל, כנעדר ממנו מתבל, שבר שלשלת וחבל, יסוד עולם מלחבל, האלוף מהור\"ר משה בן ה\"ה יהודא זצ\"ל, נפטר יום ה' בפורים שפ\"ו לפ\"ק. תנצב\"ה."], ["📖 מהספר של דיץ", "דיץ (1907) קורא לו משה אופנהיים מבית החרב, ששילם את המס הגבוה ביותר בקהילה ונפטר ב-1626 זקן מאוד. לפי דיץ הוא ואחיו יוסף סחרו במשי ובחוטים. דיץ כותב שהוריו היו לייב ועדל אופנהיים, שבאו מהיידלברג ב-1531. לפי כרטיס הרישום, אביו היה לייב אופנהיים מוורמס, ואמו שורלין."]]}, "g": [{"f": "g439", "c": "כרטיס הרישום של ר' משה אופנהיים מבית החרב, נפטר 12.3.1626"}, {"f": "g440", "c": "ספר הורוביץ, עמ' 55: כתובת 544, מצבת ר' משה אופנהיים (1626)"}, {"f": "g435", "c": "כרטיס הרישום של ר' לייב (יוסף יהודה) אופנהיים מבית החרב, נפטר 7.4.1655"}, {"f": "g454", "c": "כרטיס הרישום של גומפרכט מבית החרב, נפטר 21.10.1569"}, {"f": "g455", "c": "כרטיס הרישום של לייב אופנהיים מבית הענק בוורמס, נפטר 1572 או 1573"}]}, {"n": "בת גומפרכט מפרידברג", "y": "", "s": [{"k": "frankfurt", "r": "l", "t": [], "u": 0}], "c": {"n": "בת גומפרכט מפרידברג, אשתו הראשונה של משה אופנהיים", "rel": "אמו של לייב אופנהיים · סבתו של ר' הירץ אופנהיים", "b": "", "d": "לא ידוע", "place": "פרנקפורט", "note": "שמה הפרטי לא נרשם. בתו של גומפרכט (יצחק אפרים בן שלמה) מבית החרב (Zum Schwert), שבא מפרידברג ונפטר ב-21.10.1569. נישאה בסביבות 1571 למשה אופנהיים מבית החרב (Zum Schwert) בפרנקפורט. נפטרה לפני 1599 או 1600, כשבעלה נשא אשה שנייה.", "flag": "שמה, שנת הלידה ותאריך הפטירה לא ידועים.", "src": "כרטיס הרישום של בעלה \"Mose Oppenheim, 12.3.1626\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1620–1629, עמ' 165 · כרטיס הרישום של בנה \"Lejb Oppenheim, 7.4.1655\", קובץ 1650–1659, עמ' 90 · כרטיס הרישום של אביה \"Gumpricht zum Schwert, 21.10.1569\", קובץ 1560–1599, עמ' 53", "x": [["📜 מה ידוע עליה", "• בכרטיס הרישום של בעלה: \"נשא בסביבות 1571 את בת גומפרכט (שנפטר 21.10.1569)\".\n• בכרטיס הרישום של בנה לייב: \"אמו: בת גומפרכט מפרידברג\".\n• שמה הפרטי לא נרשם באף אחד מהם.\n• בכרטיס הרישום של אביה, גומפרכט מבית החרב, היא רשומה בין ילדיו, בלי שם, כאשת משה אופנהיים מבית החרב. אחיותיה: פריידלן, אשת וייבש בכרך מבית המאזניים (נפטרה 18.1.1602), ורעכלין, אשת משה וצלר מבית התפוח המוזהב (נפטרה 15.10.1623).\n• בכרטיס של אביה לא כתוב מי משתי נשותיו היא אמה."]]}, "g": [{"f": "g435", "c": "כרטיס הרישום של ר' לייב (יוסף יהודה) אופנהיים מבית החרב, נפטר 7.4.1655"}, {"f": "g439", "c": "כרטיס הרישום של ר' משה אופנהיים מבית החרב, נפטר 12.3.1626"}, {"f": "g454", "c": "כרטיס הרישום של גומפרכט מבית החרב, נפטר 21.10.1569"}]}, {"n": "ר' שלמה כ\"ץ", "y": "~1560–", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט (כנראה)"], "u": 1}], "c": {"n": "ר' שלמה כ\"ץ (Slomo k\"ts)", "rel": "אביה של שינלה גינצבורג · סבו של ר' נוסן הכהן כ\"ץ", "b": "בערך ⁦1555–1565⁩ (בהשערה ברורה)", "d": "אחרי מאי 1628. התאריך המדויק לא ידוע", "place": "פרנקפורט (כנראה)", "note": "אביהן של שתי אחיות מפרנקפורט: שינלה, אשת ר' שמעון הכהן גינצבורג, וברנדלין, אשת מנדלה בכרך. הוא היה כהן (כ\"ץ = כהן צדק). הוא היה עדיין בחיים במאי 1628, אחרי ששתי בנותיו כבר נפטרו.", "flag": "שנת הלידה משוערת. שנת הפטירה, שם אשתו ומקום מגוריו המדויק לא ידועים.", "src": "כרטיס הרישום של בתו \"Sejnle Günzburg-Ries, 17.5.1628\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1620–1629⁩, עמ' 247 · כרטיס הרישום של בתו \"Brendlin Bacharach, 4.4.1628\": שם, עמ' 236 · נוסח המצבה של שינלה: M. Horovitz (1901), עמ' 59, כתובת 574 (אבן 1494) · נוסח המצבה של שפרינץ: שם, עמ' 53, כתובת 526 (אבן 1714) · כרטיס הרישום של ר' נוסן מפרנקפורט · מסירת המשפחה, 9.11.2026 · בדיקת כל שלמה (זלמן) כ\"ץ: כרטיסי \"אלה תולדות\", קובץ ⁦1620–1629⁩ עמ' 163 ו-216, קובץ ⁦1635–1639⁩ עמ' 19 ו-95, קובץ ⁦1640–1649⁩ עמ' 57 ו-118 · מקום הקבורה והמצבות של משפחת זלמן: כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1620–1629⁩ עמ' 13 (הירץ), קובץ ⁦1650–1659⁩ עמ' 191 (רייזכן), קובץ ⁦1660–1669⁩ עמ' 115 (חיים) · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), לפי ארכיון העיר פרנקפורט, עמ' 44 ו-63 · epidat, Salomon Ludwig Steinheim-Institut, \"Frankfurt am Main, Battonnstraße\", ffb-3027, ffb-3395, ffb-1285, נבדק 24.11.2026", "x": [["📜 מה ידוע עליו", "• אין לו כרטיס רישום משלו. כל מה שידוע עליו בא מהכרטיסים של שתי בנותיו.\n• בכרטיס של שינלה וגם בכרטיס של ברנדלין כתוב: \"⁦Vater: Slomo k\"ts⁩\", כלומר האב: שלמה כ\"ץ.\n• על המצבה של שינלה (הורוביץ, כתובת 574) כתוב: \"מרת שוינלן בת האלוף ר' שלמה הכהן שליט\"א\". \"שליט\"א\" כותבים רק על אדם חי, ולכן במאי 1628 הוא היה עדיין בחיים. התואר \"האלוף\" ניתן לאנשים חשובים בקהילה, כמו פרנסים.\n• באביב 1628 הוא איבד את שתי בנותיו בתוך שישה שבועות: ברנדלין ב-4.4.1628 ושינלה ב-17.5.1628. בכרטיס של שינלה יש הסבר על כך."], ["❓ אולי בת שלישית", "בספר המצבות של הורוביץ, כתובת 526 (אבן 1714), מצבה משנת שפ\"ה, 1625:\n\"אשת מיכל האן. המצבה הזאת לעד, איך נפטרת ביום מועד א' ט\"ז אדר ראשון שפ\"ה, ברתת ורעד, הצנועה מרת שפרינץ בת הקצין והפרנס שלמה הכהן יחיה לעד. תנצב\"ה.\"\n\"יחיה\" אומר שאביה היה בחיים ב-1625, בדיוק כמו \"שליט\"א\" על המצבה של שינלה ב-1628. גם התארים דומים: קצין ופרנס כאן, האלוף שם.\nאבל אי אפשר לקבוע שזה אותו שלמה הכהן. בפרנקפורט של אותן שנים היה יותר מאדם אחד בשם הזה. זו שאלה פתוחה, לא ממצא."], ["👨‍👩‍👧 ילדיו", "לפי כרטיסי הרישום:\nשינלה. נישאה ב-1602 או 1603 לר' שמעון (זימל) הכהן גינצבורג. נפטרה ב-17.5.1628. מופיעה בכרטיס נפרד\nברנדלין. נישאה למנדלה בן שמואל בכרך. גרה בבית האסכלה (Zum Rost). נפטרה ב-4.4.1628"], ["🧮 שנת לידה משוערת", "בהשערה ברורה: שינלה נישאה ב-1602 או 1603. בנות נישאו אז בדרך כלל בגיל 16 עד 20, ולכן היא נולדה בערך ב-⁦1583–1587⁩. אביה נולד כנראה 20 עד 30 שנה לפניה, כלומר בערך ב-⁦1555–1565⁩. אם כך, ב-1628 הוא היה בן 63 עד 73."], ["⚠️ לא להתבלבל", "• בכרטיס של שינלה כתוב שגם בעלה, שמעון, היה \"בן שלמה כ\"ץ\". זה אדם אחר: חמיה של שינלה, ר' שלמה זלמן רייזמן, שנפטר בערך ב-1591. אביה של שינלה היה עדיין בחיים ב-1628."], ["🔗 אולי אותו אדם: ר' שלמה זלמן כ\"ץ מבית המגן הירוק", "זלמן הוא השם של יום-יום, ושלמה הוא השם העברי. לכן \"שלמה כ\"ץ\" ו\"זלמן כ\"ץ\" הם אותו שם בדיוק.\nבקצרה: כנראה מאוד שזה אותו אדם. אין הוכחה סופית.\n\n✔️ מה תומך בזה:\n• מקום הקבורה. זו הראיה החזקה ביותר. שינלה וברנדלין נקברו \"למעלה, בצד הדרומי\" של בית הקברות. שם בדיוק קבורה המשפחה של זלמן: אחיו הירץ (1620), זלמן עצמו (1637), בתו רייזכן (1659, \"ליד אביה\") ובנו חיים (1666, \"ליד אביו זלמן\"). העורך של כרטיסי הרישום השתמש בדיוק בראיה הזאת כדי לזהות את אביה של רייזכן. הערה: באותן שנים נקברו באזור הזה גם אנשים ממשפחות אחרות.\n• הילדים של זלמן קוראים לו \"שלמה\". על המצבה של בנו חיים: \"חיים כהן בן שלמה ז\"ל\". על המצבה של בתו גוטלה: \"בת הפרנס כ' שלמה זלמן כ\"ץ\". על המצבה של שינלה: \"בת האלוף ר' שלמה הכהן\". \"אלוף\" ו\"פרנס\" הם תארים של ראשי הקהילה, ולכן הם מתאימים זה לזה. גם ספר מחקר שמבוסס על ארכיון העיר פרנקפורט קורא לזלמן \"פרנס\". הערה חשובה: התואר הזה אינו ייחודי, והיו בפרנקפורט עוד פרנסים בשם שלמה הכהן.\n• הגיל. זלמן נפטר ב-1637, ובפנקס הקבורה הוא נקרא \"הזקן\". לפי שנת הלידה המשוערת של שלמה, בערך ⁦1555–1565⁩, הוא נפטר אז בגיל 72 עד 82. זה מתאים לכינוי \"הזקן\".\n• השם נתן. הבן של שינלה נקרא נתן, וגם אביו של זלמן נקרא נתן (נטע). באשכנז קראו לילדים על שם קרוב שנפטר.\n• הבית. אין מקור שאומר באיזה בית גר שלמה כ\"ץ. אם הוא זלמן, הבית הוא בית המגן הירוק (Zum grünen Schild), שבו גרה משפחתו שלושה דורות.\n\n❓ מה עוד חסר:\n• אין מסמך שאומר זאת במפורש, למשל \"שינלה בת זלמן מבית המגן הירוק\".\n• בכרטיס הרישום של זלמן רשומים ילדים אחרים: חיים, הירץ, רייזכן וגוטלה. שינלה וברנדלין לא מופיעות שם. הרשימות של העורך אינן תמיד שלמות.\n• ייתכן גם שהאב גר בעיר אחרת.\n\nאם זה נכון: הוריו הם ר' משה נתן (נטע) הכהן ורייזלין בת זליגמן, ושינלה וגוטלה אופנהיים היו אחיות.\n\n🔎 מי עוד נבדק: נבדקו כל כרטיסי \"אלה תולדות\" מהשנים ⁦1600–1649⁩, וכל שלמה (זלמן) כ\"ץ שחי בפרנקפורט ב-1628. אלה לא מתאימים:\n• זלמן בן פייבש כ\"ץ, מבית המלקחיים המוזהבים (Zur goldenen Zange). נפטר ב-10.6.1648. התחתן בפעם הראשונה רק ב-1591, ולכן לא יכלה להיות לו בת נשואה כבר ב-1602.\n• זלמן בן אברהם כ\"ץ. אביו נפטר רק ב-1647, ולכן הוא צעיר מדי.\n• זלמן כ\"ץ מפרידברג. נפטר ב-10.3.1626, לפני ששתי הבנות נפטרו.\n\nבאילן יש קו כתום מקווקו בין שני הכרטיסים, עם הכיתוב \"אולי אותו אדם?\"."], ["🪦 איפה נקברו (epidat)", "לפי פנקס הקבורה, כפי שמביא אותו epidat:\n• בתו שינלה (ffb-3027) נקברה למעלה בבית הקברות, ולידה אחותה ברנדלן (ffb-3395).\n• ר' שלמה זלמן כ\"ץ מבית המגן הירוק (ffb-1285) נקבר למעלה, בצד הדרומי של בית הקברות, ליד אחיו הירץ."]]}, "g": [{"f": "g329", "c": "כרטיס הרישום של ברנדלין בכרך, בת שלמה כ\"ץ, נפטרה 4.4.1628"}, {"f": "g268", "c": "כרטיס הרישום של שינלה גינצבורג-ריס מבית השער (Zur Pforte), נפטרה 17.5.1628"}, {"f": "g479", "c": "מצבת הפרנס ר' שלמה זלמן כ\"ץ (1637), בבית הקברות היהודי הישן בפרנקפורט. בראשה תרנגול, סימן הבית, וידי כהנים"}, {"f": "g480", "c": "שבר ממצבת הרבנית שינלה בת שלמה הכהן (1628), פרנקפורט"}, {"f": "g481", "c": "שבר ממצבת ברנדלן בת ר' שלמה כ\"ץ, אחותה של שינלה (1628), פרנקפורט"}, {"f": "g333", "c": "ספר הורוביץ, עמ' 59: כתובת 574, מצבת הרבנית שינלה בת שלמה הכהן (1628)"}]}, {"n": "שמחה בונם גנס", "y": "–1655", "s": [{"k": "tuschkau", "r": "l", "t": ["טושקאו (Tuschkau), בוהמיה"], "u": 0}, {"k": "prague", "r": "ld", "t": ["אב תט\"ו (1655), פראג"], "u": 0}], "c": {"n": "שמחה בונם (Simcha Bunem) גנס מטושקאו", "rel": "אביו של מאיר גנסמן · סבו של ר' יהודה לייב איגר", "b": "", "d": "אב תט\"ו (1655), פראג", "place": "טושקאו (Tuschkau), בוהמיה ← פראג", "note": "שמו העברי שמחה, וקראו לו בונם. בנו של אליה גנס מטושקאו. לפי Meyer עבר לפראג כנראה בגיל מבוגר, אולי לבנו שגר שם. נפטר באב תט\"ו (1655), ונקבר בבית הקברות היהודי העתיק בפראג.", "flag": "שנת הלידה ושם אשתו לא ידועים.", "src": "מצבתו: S. Hock, \"Die Familien Prags\" (1892), עמ' 69, רשומה 7829 (Google Books), נבדק 24.11.2026 · מצבת בנו אליה: S. Hock, \"Die Familien Prags\" (1892), עמ' 149, רשומה 8255 · W. Meyer, \"Zur Geschichte der Familie Eger-Gans-Gansmann\", Jüdische Familienforschung 14 (1938), עמ' 892–894 (Compact Memory, הספרייה של אוניברסיטת פרנקפורט) · JewishGen, \"Czech: Prague Old Jewish Cemetery\" (מבוסס על הוק ועל המפתח של פופר), נבדק 24.11.2026", "x": [["🪦 המצבה בפראג (הוק 7829)", "תט\"ו. אב, כ\"ה שמחה נקרא ר' בונם בן ר' אלי' ז\"ל מטושקא.\n(הוק, \"Die Familien Prags\", 1892, עמ' 69, תחת הכותרת \"גנז\".)\nמקום המצבה בבית הקברות: חלקה L, מספר 1332 (מפתח פופר, עמ' 100; JewishGen, \"Prague Old Jewish Cemetery\")."], ["📜 מה ידוע עליו", "• לפי Meyer (1938): \"בנו של אליה, שמחה הנקרא בונם גנס 'מטושקאו'\". ידוע עליו רק שנפטר בפראג בחודש אב 1655 (הוק 7829). Meyer משער שעבר לפראג בגיל מבוגר, אולי לבנו שגר שם.\n• על המצבה כתוב \"בן ר' אלי' ז\"ל\", כלומר אביו כבר לא היה בחיים ב-1655."], ["👨‍👩‍👦 ילדיו", "לפי Meyer (1938):\n• מאיר גנסמן, השתדלן, שגר כנראה במיס (Mies). נפטר 6.3.1674. מופיע בכרטיס נפרד\n• אליה \"טושקאו\", כנראה הבן הבכור, שגר בפראג. על מצבתו (הוק 8255, עמ' 149, תחת הכותרת \"טושקא\"): \"תמ\"ח. אלול, הישיש כ\"ה אלי' בן הר\"ר בונם — ז\"ל\". לפי הוק נפטר באלול תמ\"ח (1688), וכך גם במאגר של JewishGen. Meyer כותב 1678. מקום המצבה: חלקה M, מספר 270 (מפתח פופר, עמ' 387)."]]}, "g": [{"f": "g474", "c": "ספר הוק, עמ' 69: משפחת גנז, ובה רשומה 7829, מצבת שמחה בונם בן אליה מטושקאו (1655)"}, {"f": "g475", "c": "ספר הוק, עמ' 149: משפחת טושקא, ובה רשומה 8255, מצבת אליה בן בונם (1688)"}, {"f": "g476", "c": "מפתח פופר לבית הקברות העתיק בפראג, עמ' 100: משפחת גנס. בשורה \"Simcheh Bunem S.v. Elija\": שמחה בונם בן אליה, חלקה L, מספר 1332 (8042)"}, {"f": "g478", "c": "מפתח פופר לבית הקברות העתיק בפראג, עמ' 387: משפחת טושקא. בשורה \"Elijeh S.v. Bunem\": אליה בן בונם, חלקה M, מספר 270"}]}, {"n": "ר' נתן נויגאס", "y": "–1625", "s": [{"k": "heidesheim", "r": "l", "t": [], "u": 0}, {"k": "jerusalem", "r": "l", "t": ["ירושלים (לפי ג'ני)"], "u": 0}], "c": {"n": "החסיד ר' נתן נויגאס מהיידסהיים, מתושבי ירושלים", "rel": "אביה של גוטלין בינגן לייטר", "b": "", "d": "1625", "place": "היידסהיים ← ירושלים (לפי ג'ני)", "note": "אביה של גוטלין בינגן לייטר. על מצבת בתו (1650) הוא נקרא \"החסיד מהר\"ר נתן, מתושבי ירושלים\", ו-\"ז\"ל\" אחרי שמו מראה שכבר לא היה בחיים. על מצבת בנו, משה נויגאס (6 בכסלו שצ\"ט, 1638), כתוב \"מהר\"ר משה בן מהר\"ר נתן ז\"ל\". בנו של ר' אהרן מהיידסהיים, כפי שרשום בכרטיסי הרישום שלו ושל אחיו יוזף. לפי ג'ני נשותיו היו גיטלה ושפרינץ, ילדיו היו חיים, יצחק, משה וגוטלין, והוא נפטר ב-1625 בירושלים. לכן אין לו מצבה בספר הורוביץ על בית הקברות בפרנקפורט.\nלפי כרטיס הרישום של בתו גוטלין: נתן מהיידסהיים, מבית חבית היין (Zum Weinfass), ואחר כך \"מתושבי ירושלים\", בן אהרן, נפטר בערך ב-1625. אשתו שפרינץ מופיעה בכרטיס נפרד.", "flag": "שנת הלידה לא ידועה (ג'ני מעריך 1535–1583). השם נתן, הקשר לירושלים והקשר לבניו בני נויגאס מאושרים בשתי מצבות מהתקופה. המוצא מהיידסהיים ושם אביו אהרן מאומתים בשני כרטיסי רישום, שלו ושל אחיו יוזף. הפטירה ב-1625 בירושלים היא הערכה, ומקום הפטירה עולה ממצבת בתו.", "src": "כרטיס הרישום \"Nōsen Heidesheim, um 1625 ?\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1620–1629, עמ' 152 · מצבת בתו: M. Horovitz (1901), עמ' 78, כתובת 754 · מצבת בנו: שם, עמ' 68, כתובת 658 · Geni · כרטיס הרישום של אחיו \"Josef aus Heidesheim, um 1617\": קובץ 1600–1619, עמ' 210", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Nōsen Heidesheim\n📅 נפטר: \"בסביבות 1625 ?\"\n🪦 המצבה: בכרטיס אין מספר הורוביץ למצבה שלו. על מצבת בתו גוטלין (הורוביץ 754, 1650) הוא נקרא \"נוסן ז\"ל מתושבי ירושלים\".\n📜 רשומות: בתיק הבית (חבית היין) יש רשומות רבות מ-1583 ואילך.\n🏠 בית: חבית היין (Zum Weinfass). אחר כך היגר.\n👨 אביו: אהרן מהיידסהיים, שנפטר ב-1600 או מעט לפני כן.\n👩 אמו: לא נרשמה.\n💍 נשותיו:\n• כנראה בסביבות 1584, שפרינץ בת חיים. נפטרה 9.11.1600\n• ב-1601, גיטלה\n👨‍👩‍👧 ילדיו:\n• משה נויגאס מבית פינת האריה (Zum Löweneck). נפטר ב-17.11.163?\n• חיים מבית חבית היין. נפטר בסביבות 1623\n• איצק מבית חבית היין. אשתו גוטלן נפטרה ב-16.7.1641\n• גוטלן, אשת מאיר בינגן מבית הסולם (Zur Leiter). נפטרה 12.9.1650\n📝 הערות העורך:\n• אחיו נפטר בסביבות 1617 וגר בבית הזאב (Zum Wolf), ואחר כך בבית השועל (Zum Fuchs). בכרטיס של נתן הוא נקרא וולף, אבל בכרטיס של האח עצמו שמו תוקן ליוזף (ראו בסעיף \"אחיו\").\n• לפי רשימת 1619 הוא עדיין חי אז בפרנקפורט עם אשתו השנייה, ומצבת בתו מ-1650 מראה שנפטר בירושלים. שנת הפטירה \"בסביבות 1625\" היא הערכה בלבד."], ["אזכורו במצבת בתו גוטלין (הורוביץ, כתובת 754, אבן 2088)", "גוטלן א' מאיר לייטר. פה טמונה אשה ישרה והגונה, מר' גוטלן בת החסיד מהר\"ר נתן מתושבי ירושלים ז\"ל, נפט' ליל ב' ונקברת יום ג' י\"ז אלול ת\"י לפ\"ק. תנצב\"ה."], ["👩‍🦱 נשותיו", "שפרינץ, בת ר' חיים, אב בית הדין בפרידברג. נישאו כנראה בסביבות 1584. נפטרה ב-9.11.1600. מופיעה בכרטיס נפרד\nגיטלה. נישאו ב-1601"], ["מצבת בנו משה נויגאס (הורוביץ, כתובת 658, אבן 2091)", "מהר\"ר משה נייגאס. פה נחצב קבר אשר חלף ועבר הוא משה רעיא מהימן … האלוף בתורה ממנו יצא אורה, מהר\"ר משה בן מהר\"ר נתן ז\"ל, נפטר בליל ג' ונקבר ביום ד' ו' כסליו שצ\"ט לפ\"ק. תנצב\"ה אמן."], ["👨‍👦 אחיו", "יוזף מהיידסהיים. בכרטיס הרישום שלו (\"Josef aus Heidesheim, um 1617\") העורך מחק את השם \"Wolf\" וכתב ביד \"יוזף\", ולכן אחיו של נתן הוא יוזף ולא וולף. \"וולף\" הוא שם הבית שבו גר, בית הזאב (Zum Wolf).\nמה כתוב בכרטיס של יוזף:\n• 1592: יוזף מהיידסהיים שליד מיינץ נשא את פוגל, בתו של מאיר שיינפלד מבית הזאב (Zum Wolf).\n• 1597: מבית הזאב הופרד בית השועל (Zum Fuchs), ויוזף גר בו.\n• 1599 ו-1602: שילם אגרות על נישואיו השני והשלישי.\n• אביו: אהרן מהיידסהיים, שנפטר ב-1600 או מעט לפני כן.\n• הערת העורך: \"נוסן מבית חבית היין, שנפטר בסביבות 1625, היה אחיו\".\nיוזף לא נוסף לעץ."]]}, "g": [{"f": "g285", "c": "כרטיס הרישום של נוסן מהיידסהיים (ר' נתן נויגאס), \"נפטר בסביבות 1625 ?\""}, {"f": "g217", "c": "ספר הורוביץ, עמ' 68: כתובת 658, מצבת משה בן נתן נויגאס (1638)"}, {"f": "g249", "c": "כרטיס הרישום של גוטלין בינגן מפרנקפורט, נפטרה 12.9.1650"}, {"f": "g216", "c": "ספר הורוביץ, עמ' 78: כתובת 754, מצבת גוטלין אשת מאיר לייטר (1650)"}]}, {"n": "שפרינץ", "y": "–1600", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית חבית היין (Zum Weinfass)", "ג' בכסלו שס\"א (9.11.1600), פרנקפורט"], "u": 0}], "c": {"n": "שפרינץ, בת ר' חיים כ\"ץ", "rel": "אשתו של ר' נתן נויגאס · אמה של גוטלין", "b": "", "d": "ג' בכסלו שס\"א (9.11.1600), פרנקפורט", "place": "פרנקפורט, בית חבית היין (Zum Weinfass)", "note": "בתו של ר' חיים כ\"ץ, אב בית הדין בפרידברג. אשתו של ר' נתן מהיידסהיים (נויגאס), ואמה של גוטלין. נפטרה ב-9.11.1600. בתה גוטלין, שנפטרה חמישים שנה אחריה, ב-1650, נקברה לידה.", "flag": "שנת הלידה לא ידועה. בכרטיס של גוטלין מצוטט פנקס בית הקברות: \"אמו של כותב הפנקס, גיטל..., נקברה ליד אמה שפרינץ בת חיים כ\"ץ, אב בית הדין בפרידברג\". כרטיס רישום של שפרינץ עצמה לא נבדק (הקובץ 1600–1619 לא הורד).", "src": "כרטיס הרישום \"Šprints zum Weinfass, 9.11.1600\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1600–1619, עמ' 4 · נוסח המצבה: M. Horovitz (1901), עמ' 36, כתובת 368 (אבן 2089) · כרטיס הרישום של בתה גוטלין", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Šprints zum Weinfass\n📅 נפטרה: 9.11.1600 (ג' בכסלו שס\"א)\n🪦 המצבה (הורוביץ 368): שפרינץ אשת נתן ויינפאס, בת חיים ז\"ל. בכרטיס יש תיקון בכתב יד של השנה.\n⚰️ פנקס הקבורה (בקבורת בתה, 1650): \"באמצע בית הקברות, בצד הצפוני ליד החומה\", מצבתה של שפרינץ בת חיים, אב בית הדין בפרידברג\n🏠 בית: חבית היין (Zum Weinfass)\n👨 אביה: החזן, ואחר כך אב בית הדין, חיים מבית חבית היין, ואחר כך בפרידברג. נפטר בסביבות 1596.\n👩 אמה: גיטלה מרוסהיים (Rosheim).\n💍 בעלה: כנראה בסביבות 1584, נתן מהיידסהיים בן אהרן. נפטר בסביבות 1625. אחרי מותה נשא את גיטלה ועלה לירושלים."], ["נוסח המצבה (הורוביץ, כתובת 368, אבן 2089)", "שפרינץ אשת ר' נתן וויינזוס. שפירינץ החמה הלכה למקומה, ביום ה' פרחה נשמתה, וביום ו' ד' כסליו שס\"א לפ\"ק נגנזה. פה בארמנה (?) ואני שממה, על אשה החסידה והתמימה, מרת שפרינץ בת מהר\"ר חיים זצ\"ל. תנצב\"ה.\nשם בעלה מודפס \"וויינזוס\", כנראה שיבוש של \"וויינפאס\" (Weinfass), שם הבית. האות האחרונה לא ברורה בסריקה."], ["👨‍🦱 בעלה", "החסיד ר' נתן נויגאס מהיידסהיים, מבית חבית היין (Zum Weinfass). עלה לירושלים ונפטר שם. מופיע בכרטיס נפרד"], ["👨‍👩‍👧 ילדיה", "לפי כרטיס הרישום של בעלה. הוא לא מציין מי האם, אבל בהשערה ברורה כולם ילדיה, כי בעלה נישא שוב רק ב-1601:\nמשה נויגאס, מבית פינת האריה (Zum Löweneck). נפטר ב-17.11.163?\nחיים, מבית חבית היין (Zum Weinfass). נפטר בסביבות 1623\nאיצק, מבית חבית היין (Zum Weinfass). אשתו גוטלן נפטרה ב-16.7.1641\nגוטלין, אשת מאיר בינגן מבית הסולם (Zur Leiter). נפטרה ב-12.9.1650. נקברה לידה. מופיעה בכרטיס נפרד"]]}, "g": [{"f": "g284", "c": "כרטיס הרישום של שפרינץ מבית חבית היין (Zum Weinfass), נפטרה 9.11.1600"}, {"f": "g288", "c": "ספר הורוביץ, עמ' 36: כתובת 368, מצבת שפרינץ בת ר' חיים (1600)"}, {"f": "g249", "c": "כרטיס הרישום של גוטלין בינגן מפרנקפורט, נפטרה 12.9.1650"}]}, {"n": "זליגמן בינגן", "y": "–1652", "s": [{"k": "frankfurt", "r": "ld", "t": ["30.11.1652 (ערב ראש חודש טבת תי\"ג), פרנקפורט"], "u": 0}], "c": {"n": "ר' פנחס זליגמן בינגן, הדיין, מבית הרשת (Zur Reuse)", "rel": "אביה של מינקלן דויץ · סבה של הנל לייטר", "b": "", "d": "30.11.1652 (ערב ראש חודש טבת תי\"ג), פרנקפורט", "place": "פרנקפורט", "note": "פנחס בן משה נפתלי בינגא, שנקרא זליגמן בינגן. דיין בפרנקפורט. גר בבית הרשת (Zur Reuse), בית משפחתו. נפטר ב-30.11.1652. נינו של הר\"ר מאיר בינגן מבית הסולם (Zur Leiter): בנו של הירץ בינגן, ונכדו של זיסקינד בינגן, בנו של מאיר.", "flag": "שנת הלידה ושם אשתו לא ידועים. בנו הירץ, שנפטר ב-14.6.1683 (הורוביץ 1133: \"הירץ בר זעליגמן בינג\"), אינו אביו של ר' ישראל בינגן מבית הבקבוק (Zur Flasche): לפי כרטיס הרישום של ר' ישראל, אביו כבר לא היה בחיים ב-1663.", "src": "כרטיס הרישום \"Zeligman Bingen zur Reuse, 30.11.1652\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1650–1659, עמ' 49 · כרטיס הרישום \"Minklen Deutz, 26.8.1692\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1690–1699, עמ' 103 · נוסח המצבה: M. Horovitz (1901), עמ' 80, כתובת 774 (אבן 1197)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Zeligman Bingen zur Reuse\n📅 נפטר: 30.11.1652 (ערב ראש חודש טבת תי\"ג)\n🪦 המצבה (הורוביץ 774): \"זעליגמן בינג צור רייזן\", כלומר פנחס בן משה נפתלי בינגא\n🏠 בית: הרשת (Zur Reuse)\n👨 אביו: הירץ בינגן, בן זיסקינד, מבית הרשת ואחר כך מבית כפתור המושק (Zum Bisemknopf). נפטר בסביבות 1609. בכרטיס השנה מוקלדת ספרה על ספרה (ראו בכרטיס של הירץ).\n👩 אמו: הנל בת אייזיק גלנהויזן סג\"ל. נפטרה 1.9.1648."], ["נוסח המצבה (הורוביץ, כתובת 774, אבן 1197)", "האלוף זעליגמן בינג זצ\"ל צור רייזן. פה נטמן היקר והנעלה, מחשובי וספוני הקהלה, כבודו הורד שאולה, כמר פנחס זעליקמן בן משה נפתלי בינגא זצ\"ל, נפטר בליל ש\"ק ונקבר ביום א' ב' טבת תי\"ג לפ\"ק. תנצב\"ה.\nעל המצבה אביו, הירץ בינגן, נקרא בשמו העברי: משה נפתלי."], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nהירץ בינגן, מבית רייפנברג (Zum Reifenberg). נפטר ב-14.6.1683\nיודלן בינגן, מבית הרשת (Zur Reuse). נפטר ב-6.3.1659\nמינקלן, אשת ברמן דויץ מבית הכבש (Zum Lamm). נפטרה ב-26.8.1692. מופיעה בכרטיס נפרד"]]}, "g": [{"f": "g254", "c": "כרטיס הרישום של זליגמן בינגן מבית הרשת (Zur Reuse), נפטר 30.11.1652"}, {"f": "g315", "c": "ספר הורוביץ, עמ' 80: כתובת 774, מצבת זליגמן (פנחס) בינגן, \"בן משה נפתלי בינגא\" (1652)"}]}, {"n": "לייב אופנהיים", "y": "–1655", "s": [{"k": "frankfurt", "r": "ld", "t": ["כ\"ט באדר ב' תט\"ו (7.4.1655), פרנקפורט"], "u": 0}], "c": {"n": "ר' יוסף יהודה (לייב) אופנהיים, הפרנס, מבית החרב (Zum Schwert)", "rel": "אביו של ר' הירץ אופנהיים · סבה של רייזל בינגן", "b": "", "d": "כ\"ט באדר ב' תט\"ו (7.4.1655), פרנקפורט", "place": "פרנקפורט", "note": "בנו של ר' משה אופנהיים מבית החרב (Zum Schwert). ב-1595 נשא את פרומט, בת אברהם באלין מוורמס. גר בבית החרב. על המצבה ש
