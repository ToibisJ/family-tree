לו הוא נקרא \"פרנס הדור וגובה הקהלה\", ו\"חכם עדיף מנביא\". נפטר בערב ראש חודש ניסן תט\"ו (7.4.1655), ונקבר ליד אשתו פרומט.", "flag": "שנת הלידה לא ידועה.", "src": "כרטיס הרישום \"Lejb Oppenheim, 7.4.1655\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1650–1659, עמ' 90 · נוסח המצבה: M. Horovitz (1901), עמ' 82–83, כתובת 801 (אבן 3791)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Lejb Oppenheim\n📅 נפטר: 7.4.1655 (כ\"ט באדר ב' תט\"ו)\n🪦 המצבה (הורוביץ 801): ר' לייב אופנהיים, שמו העברי יוסף יהודה בן משה ז\"ל אופנהיים\n⚰️ פנקס הקבורה: \"הזקן ר' לייב אופנהיים\", נקבר ליד אשתו פרומט\n📜 רשומות רבות בתיק הבית (החרב)\n📖 תיאור חייו מופיע ב-Vorfahren, חוברת M, עמ' 773.\n🏠 בית: החרב (Zum Schwert)\n👨 אביו: משה אופנהיים מבית החרב, בן לייב. נפטר 12.3.1626.\n👩 אמו: בת גומפרכט מפרידברג (גומפרכט נפטר 21.10.1569). שמה לא נרשם.\n💍 אשתו: ב-1595, פרומט מוורמס, בת אברהם באלין. נפטרה 28.1.1649.\n👨‍👩‍👧 ילדיו:\n• גומפרכט אופנהיים, מבית הפרח (Zur Blume) ואחר כך מבית הראש המוזהב (Zum goldenen Kopf). נפטר בסביבות 1623\n• וולף אופנהיים, מבית הפרח, גם בוורמס ובמץ. נפטר 4.11.1664\n• הירץ אופנהיים, מבית הגביע הלבן (Zum weissen Becher). נפטר 6.6.1690. מופיע בכרטיס נפרד\n• טודרוס אופנהיים, מבית הקנקן הכסוף (Zur silbernen Kanne). נפטר 18.9.1697\n• בער אופנהיים, מבית החד-קרן (Zum Einhorn). נפטר 13.1.1695\n• רייזלן, אשת יוזבל וצלר מבית הדלת האדומה (Zur roten Tür), ואחר כך אשת משה כ\"ץ מבית המגן הירוק (Zum grünen Schild). נפטרה 29.7.1689\n• הינדכן, אשת זנוויל גלנהויזן מבית המדרגות (Zur Stege). נפטרה 20.3.1632"], ["נוסח המצבה (הורוביץ, כתובת 801, אבן 3791)", "האלוף הפרנס מהר\"ר ליב אופנהיים. האבן הזאת שמתי מצבה על ראש ארי' לביא, ה\"ה פרנס הדור וגובה הקהלה, המוציא והמביא, עמד בפרץ ועסק באמונה, יראת ה' אוצרו, חכם עדיף מנביא, מהר\"ר יוסף יהודה במהר\"ר משה ז\"ל אופנהיים, נפ' ונק' ביום ד' ער\"ח ניסן תט\"ו לפ\"ק. תנצב\"ה."]]}, "g": [{"f": "g435", "c": "כרטיס הרישום של ר' לייב (יוסף יהודה) אופנהיים מבית החרב, נפטר 7.4.1655"}, {"f": "g436", "c": "ספר הורוביץ, עמ' 82: תחילת כתובת 801, מצבת ר' לייב אופנהיים (1655)"}, {"f": "g437", "c": "ספר הורוביץ, עמ' 83: המשך כתובת 801, מצבת ר' לייב אופנהיים (1655)"}, {"f": "g438", "c": "כרטיס הרישום של פרומט אופנהיים, בת אברהם באלין מוורמס, נפטרה 28.1.1649"}, {"f": "g439", "c": "כרטיס הרישום של ר' משה אופנהיים מבית החרב, נפטר 12.3.1626"}]}, {"n": "פרומט אופנהיים", "y": "–1649", "s": [{"k": "frankfurt", "r": "ld", "t": ["ט\"ו בשבט ת\"ט (28.1.1649), פרנקפורט"], "u": 0}], "c": {"n": "פרומט, בת אברהם באלין מוורמס, אשת לייב אופנהיים", "rel": "אמו של ר' הירץ אופנהיים · סבתה של רייזל בינגן", "b": "", "d": "ט\"ו בשבט ת\"ט (28.1.1649), פרנקפורט", "place": "פרנקפורט", "note": "בתם של אברהם באלין מבית הקנקן (Zur Kanne) בוורמס ושל גוטרט, בת אליעזר וורמס. ב-1595 נישאה ללייב אופנהיים מבית החרב (Zum Schwert) בפרנקפורט. בשנים 1622–1623 מסרה עדות. נפטרה בט\"ו בשבט ת\"ט (28.1.1649), ונקברה ליד חתנה, זנוויל גלנהויזן, וליד גיסתה, צורלין אופנהיים, אחות בעלה.", "flag": "שנת הלידה לא ידועה. אין לה מצבה בספר הורוביץ.", "src": "כרטיס הרישום \"Frummet Oppenheim, 28.1.1649\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1640–1649, עמ' 126", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Frummet Oppenheim\n📅 נפטרה: 28.1.1649 (ט\"ו בשבט ת\"ט)\n🪦 המצבה: בכרטיס אין מספר הורוביץ.\n⚰️ פנקס הקבורה: \"פורמיט\" (כנראה טעות במקום פרומט), אשת לייב אופנהיים, נקברה ליד זנוויל גלהייזר (בעלה של בתה הינדכן), וליד צורלין אופנהיים, אשת זנוויל הזה, אחות בעלה (בכרטיס: \"אחות אביה\" של הינדכן)\n📜 רשומות:\n• 1595: \"פרומט, בת אברהם מוורמס\", נישאה ללייב מבית החרב\n• 1619: ברשימת התושבים\n• 1622–1623: מסרה עדות\n📖 תיאור חייה מופיע ב-Vorfahren, חוברת M, עמ' 774.\n🏠 בית: החרב (Zum Schwert)\n👨 אביה: אברהם באלין, מבית הקנקן בוורמס, בן ליזר. נפטר ב-1622 בוורמס (לפי ספר הזיכרון של וורמס).\n👩 אמה: גוטרט, בת אליעזר וורמס.\n💍 בעלה: ב-1595, ר' לייב אופנהיים בן משה. נפטר 7.4.1655.\n📝 הערות העורך:\n• אבי אביה, ליזר באלין, היה בן אליה באלין, ונפטר ב-1601 בוורמס.\n• הורי אמה היו אליעזר בן מאיר וורמס ופרומט, בת יוסף לוי."], ["👨‍👩‍👧 ילדיה", "לפי כרטיס הרישום של בעלה, לייב:\n• גומפרכט אופנהיים, מבית הפרח (Zur Blume) ואחר כך מבית הראש המוזהב (Zum goldenen Kopf). נפטר בסביבות 1623\n• וולף אופנהיים, מבית הפרח, גם בוורמס ובמץ. נפטר 4.11.1664\n• הירץ אופנהיים, מבית הגביע הלבן (Zum weissen Becher). נפטר 6.6.1690. מופיע בכרטיס נפרד\n• טודרוס אופנהיים, מבית הקנקן הכסוף (Zur silbernen Kanne). נפטר 18.9.1697\n• בער אופנהיים, מבית החד-קרן (Zum Einhorn). נפטר 13.1.1695\n• רייזלן, אשת יוזבל וצלר מבית הדלת האדומה (Zur roten Tür), ואחר כך אשת משה כ\"ץ מבית המגן הירוק (Zum grünen Schild). נפטרה 29.7.1689\n• הינדכן, אשת זנוויל גלנהויזן מבית המדרגות (Zur Stege). נפטרה 20.3.1632"]]}, "g": [{"f": "g438", "c": "כרטיס הרישום של פרומט אופנהיים, בת אברהם באלין מוורמס, נפטרה 28.1.1649"}, {"f": "g435", "c": "כרטיס הרישום של ר' לייב (יוסף יהודה) אופנהיים מבית החרב, נפטר 7.4.1655"}]}, {"n": "משה חיים פירסט", "y": "~1614–~1640", "s": [{"k": "hamburg", "r": "l", "t": ["המבורג-אלטונה"], "u": 0}, {"k": "altona", "r": "l", "t": ["המבורג-אלטונה"], "u": 0}], "c": {"n": "משה חיים פירסט", "rel": "אביו של ר' ישראל פירסט · בעלה של בילה בת ישראל", "b": "בערך 1614", "d": "בערך 1640 (לפי Geni, ראו בכרטיס)", "place": "המבורג-אלטונה", "note": "אביו של ר' ישראל פירסט, ובנם של חיים ושרה פירשט. אשתו הייתה בילה (בלה), בת ישראל.\n\nהמסמך היחיד שנמצא עליו עד עכשיו הוא המצבה של אשתו בבית הקברות העתיק באלטונה, משנת 1665. שם הוא נקרא \"משה פורשט\", בלי השם \"חיים\". המצבה שלו עצמו לא נמצאה.", "flag": "שנות חייו, בערך 1614 עד בערך 1640, הן לפי Geni ולא נמצא להן מסמך. המצבות של אשתו (1665) ושל כלתו (1682) מציינות את שמו בלי ז\"ל, ולכן ייתכן שנפטר מאוחר יותר. השם \"משה חיים\" הוא לפי Geni. במצבה של אשתו הוא נקרא רק \"משה פורשט\". הקשר לחיים ושרה פירשט כהוריו הוא לפי Geni, ולא נמצא לו מסמך.", "src": "מאגר epidat של מכון שטיינהיים, בית הקברות היהודי באלטונה (Königstraße), מצבות: hha-2516 (בילה), hha-3335 (חיים בר ראובן), hha-3334 (שלמה זלמן בר חיים), hha-3333 (שרה), hha-2431 ו-hha-9549 (נתנאל והענדלין), hha-2208 (ירמיהו), hha-2412 (ריזכת) · M. Grunwald, \"Hamburgs deutsche Juden bis zur Auflösung der Dreigemeinden 1811\" (1904), עמ' 246, מס' 966–969, כפי שהם מצוטטים במאגר · \"Eine Confrontation zwischen Glückel Hameln's Memoiren und den alten Hamburger Grabbüchern\" (ויקיטקסט), על הזיהוי של חיים בר ראובן עם חיים פירשט · שנות חייו: Geni (נמסר על ידי המשפחה, 9.11.2026)", "x": [["🪦 המצבה של אשתו בילה (1665)", "המצבה של בילה עומדת עד היום במקומה בבית הקברות העתיק באלטונה. זו הכתובת, שורה אחר שורה:\nפה / נטמנה היקרה בילה / בת ישראל אשת / משה פורשט נפטרת / בליל ב׳ ונקברת ביום / ב׳ אב תכ״ה לפ״ק / תנצב״ה\nכלומר: \"פה נטמנה היקרה בילה, בת ישראל, אשת משה פורשט. נפטרה בליל ב' ונקברה ביום ב', ב' באב תכ\"ה\". לפי המאגר, היא נפטרה ביום שני בערב, 13 ביולי 1665, ונקברה למחרת.\nהמצבה עשויה מאבן חול, וגובהה כמטר. תמונה שלה נמצאת בגלריה של הכרטיס."], ["🔎 המצבה שלו", "המצבה של משה לא נמצאה. חיפשתי בכל 6,056 הכתובות של בית הקברות באלטונה במאגר epidat, בכל צורות הכתיב של השם (פירשט, פירסט, פורשט, פוירשט, פיורשט), וגם \"משה בן חיים\". לא נמצאה מצבה שלו. הרבה מצבות מהמאה ה-17 שם אבדו או נשארו רק כשברים בלי כתב.\nברשימת המצבות של גרונוואלד (Grunwald, 1904) מופיעות מצבות משפחת פירשט ברצף, בעמ' 246: בילה (מס' 966), שרה, אשת חיים (מס' 967), וריזכת, אשת חיים בן משה (מס' 969). בהשערה ברורה, גם מס' 968 שייך למשפחה, ואולי הוא של משה עצמו, אבל עוד לא ראיתי את הספר."], ["❓ מתי נפטר?", "לפי Geni הוא נפטר בערך ב-1640. אבל המצבות מעוררות ספק:\n• במצבה של בילה מ-1665 כתוב \"אשת משה פורשט\", בלי ז\"ל. לעומת זאת, במצבה של שרה מ-1666 כתוב \"אשת הפ' כמ\"ר חיים פוירשט ז\"ל\", כי חיים כבר נפטר.\n• גם במצבה של ריזכת מ-1682, \"אשת כמ\"ר חיים בן משה פוירשט\", אין ז\"ל אחרי שם האב משה.\nבהשערה ברורה, ייתכן שמשה היה עדיין בחיים ב-1665, ואולי גם ב-1682. בוויקיפדיה יש ערך על משה ישראל פירשט (Moses Israel Fürst), סוחר טבק ומממן מהמבורג שנפטר בערך ב-1692. לא ברור אם זה אותו אדם, ואין לזהות ביניהם בלי מקור נוסף."], ["👨‍👩‍👦 משפחת פירשט במצבות אלטונה", "בבית הקברות באלטונה נמצאו עוד מצבות של המשפחה, מהמאה ה-17:\n• הוריו: \"הפרנס והמנהיג כמר חיים בר ראובן\", נפטר ב-28.3.1653. לפי גרונוואלד זה חיים פירשט, שרשום שם בשם אביו ולא בשם המשפחה. ושרה בת אברהם, \"אשת הפ' כמ\"ר חיים פוירשט ז\"ל\", נפטרה ב-1.9.1666.\n• אחיו (לפי שם האב): שלמה זלמן בר חיים, נפטר ב-30.3.1653, יומיים אחרי אביו. הפרנס נתנאל בן חיים פוירשט, נפטר ב-1681, ואשתו הענדלין, נפטרה ב-1662. והדיין ירמיהו בן חיים פיורשט, נפטר ב-1703.\n• בהשערה ברורה, אולי גם בן שלו: חיים בן משה פוירשט. אשתו ריזכת, בת עמינדב דוד, נפטרה ב-30.8.1682.\nכל המצבות האלה מתועדות במאגר epidat."]]}, "g": [{"f": "g319", "c": "מצבת בילה בת ישראל, אשת משה פורשט, 1665. בית הקברות העתיק באלטונה (Königstraße). הכתובת: \"פה נטמנה היקרה בילה בת ישראל אשת משה פורשט נפטרת בליל ב׳ ונקברת ביום ב׳ אב תכ״ה לפ״ק תנצב״ה\"."}]}, {"n": "בלה בטי פירסט", "y": "–1665", "s": [{"k": "hamburg", "r": "l", "t": ["המבורג-אלטונה"], "u": 0}, {"k": "altona", "r": "ld", "t": ["המבורג-אלטונה", "13.7.1665 (ליל ב' באב תכ\"ה), אלטונה"], "u": 0}], "c": {"n": "בילה (בלה) פירסט, בת ישראל", "rel": "אמו של ר' ישראל פירסט · אשתו של משה חיים פירסט · בתו של ישראל", "b": "", "d": "13.7.1665 (ליל ב' באב תכ\"ה), אלטונה", "place": "המבורג-אלטונה", "note": "אמו של ר' ישראל פירסט, ואשתו של משה חיים פירסט. אביה נקרא ישראל.\n\nהיא נפטרה ביום שני בערב, 13 ביולי 1665 (ליל ב' באב תכ\"ה), ונקברה למחרת בבית הקברות העתיק באלטונה. המצבה שלה עומדת שם עד היום.\n\nבהשערה ברורה, בנה ישראל נקרא על שם אביה.", "flag": "שנת הלידה לא ידועה. תאריך הפטירה, שם אביה ושם בעלה מאומתים במצבה. השם \"בטי\" מופיע רק ב-Geni, ובמצבה כתוב \"בילה\".", "src": "מאגר epidat של מכון שטיינהיים, בית הקברות היהודי באלטונה (Königstraße), מצבה hha-2516, צילום: Bert Sommer, 2002, ברישיון CC BY 4.0 · M. Grunwald (1904), עמ' 246, מס' 966 · השם \"בלה בטי\": Geni (נמסר על ידי המשפחה, 9.11.2026)", "x": [["🪦 המצבה", "זו הכתובת, שורה אחר שורה:\nפה / נטמנה היקרה בילה / בת ישראל אשת / משה פורשט נפטרת / בליל ב׳ ונקברת ביום / ב׳ אב תכ״ה לפ״ק / תנצב״ה\nכלומר: \"פה נטמנה היקרה בילה, בת ישראל, אשת משה פורשט. נפטרה בליל ב' ונקברה ביום ב', ב' באב תכ\"ה. תהא נשמתה צרורה בצרור החיים\".\nהמצבה עשויה מאבן חול, מידותיה 0.99 על 0.61 מטר, והיא עומדת במקומה המקורי. בספר הקבורה של הקהילה היא רשומה בעמ' 1129. ברשימה של גרונוואלד היא מס' 966, ראשונה ברצף מצבות משפחת פירשט."]]}, "g": [{"f": "g319", "c": "מצבת בילה בת ישראל, אשת משה פורשט, 1665. בית הקברות העתיק באלטונה (Königstraße). הכתובת: \"פה נטמנה היקרה בילה בת ישראל אשת משה פורשט נפטרת בליל ב׳ ונקברת ביום ב׳ אב תכ״ה לפ״ק תנצב״ה\"."}]}, {"n": "ר' שלמה זלמן כ\"ץ", "y": "–1637", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית המגן הירוק (Zum grünen Schild)", "כ\"ו בטבת שצ\"ז (22.1.1637), פרנקפורט"], "u": 0}], "c": {"n": "הפרנס ר' שלמה זלמן כ\"ץ, מבית המגן הירוק (Zum grünen Schild)", "rel": "אביה של גוטלה אופנהיים · בנו של ר' משה נתן הכהן", "b": "", "d": "כ\"ו בטבת שצ\"ז (22.1.1637), פרנקפורט", "place": "פרנקפורט, בית המגן הירוק (Zum grünen Schild)", "note": "פרנס בקהילת פרנקפורט. שמו העברי: שלמה בן משה נתן הכהן. גר בבית המגן הירוק (Zum grünen Schild). נפטר בשיבה טובה ביום חמישי, כ\"ו בטבת שצ\"ז, 22.1.1637. בפנקס הקבורה הוא נקרא \"הזקן ר' זלמן בן נתן כ\"ץ\", ונקבר ליד אחיו ר' הירץ.\nאביו: ר' משה נתן הכהן מבית המגן הירוק (Zum grünen Schild). נפטר ב-21.1.1585.\nאמו: רייזלין, בת זליגמן. נפטרה בסביבות 1610.", "flag": "שנת הלידה ושם אשתו לא ידועים.", "src": "כרטיס הרישום \"Zalman zum grünen Schild, 22.1.1637\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1635–1639, עמ' 95 · נוסח המצבה: M. Horovitz (1901), עמ' 67, כתובת 648 (אבן 918) · Cilli Kasper-Holtkotte, Die jüdische Gemeinde von Frankfurt/Main in der Frühen Neuzeit (de Gruyter 2010), לפי ארכיון העיר פרנקפורט, עמ' 44 · epidat, Salomon Ludwig Steinheim-Institut, \"Frankfurt am Main, Battonnstraße\", ffb-1285, נבדק 24.11.2026", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Zalman zum grünen Schild\n📅 נפטר: 22.1.1637 (כ\"ו בטבת שצ\"ז)\n🪦 המצבה (הורוביץ 648): ר' זלמן כ\"ץ, שלמה בן משה נתן ז\"ל\n⚰️ פנקס הקבורה: הזקן ר' זלמן בן נתן כ\"ץ, נקבר ליד אחיו ר' הירץ\n📜 רשומות: בתיקי הבית (המגן הירוק) יש עליו כמה רשומות.\n👨 אביו: נטע מבית המגן הירוק (Zum grünen Schild), בן קלמן כ\"ץ. נפטר 21.1.1585.\n👩 אמו: רייזלין בת זליגמן. נפטרה בסביבות 1610.\n💍 אשתו: לא נרשמה."], ["נוסח המצבה (הורוביץ, כתובת 648, אבן 918)", "הפרנס זלמן כ\"ץ ז\"ל. קמה ונצבה הגל והמצבה, לראש גבר הונו מפוז הב והבה, מדותיו נאים כקטורת בעריבה, הפרנס שלמה ב\"ר משה נתן הכהן ז\"ל, נפטר בשיבה טובה יום ה' כ\"ו טבת שצ\"ז לפ\"ק. תנצב\"ה."], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nחיים. נפטר ב-6.1.1666\nהירץ, נשוי להינדלן, שנפטרה ב-9.11.1651. בתו יאכט נפטרה ב-3.5.1649\nרייזכן, אשת קלמן כ\"ץ מבית האריה האדום (Zum roten Löwen). נפטרה ב-20.12.1659\nגוטלה, אשת הירץ אופנהיים מבית הגביע הלבן (Zum weissen Becher). נפטרה ב-8.7.1666. מופיעה בכרטיס נפרד"], ["🔗 אולי אותו אדם: ר' שלמה כ\"ץ, אביה של שינלה", "ייתכן שר' שלמה זלמן הוא גם ר' שלמה כ\"ץ, אביהן של שינלה גינצבורג וברנדלין בכרך, שהיה בחיים במאי 1628. מבין כל הגברים בשם שלמה (זלמן) כ\"ץ שחיו בפרנקפורט ב-1628, רק הוא מתאים בגיל. זו השערה בלבד (לא ודאי): שינלה וברנדלין לא מופיעות ברשימת ילדיו. ההסבר המלא נמצא בכרטיס של ר' שלמה כ\"ץ. באילן יש קו כתום מקווקו בין שני הכרטיסים."], ["📚 מקור נוסף: ספר המחקר על קהילת פרנקפורט", "ספר המחקר של קספר-הולטקוטה, שמבוסס על ארכיון העיר פרנקפורט ולא על כרטיסי הרישום, מזכיר גם הוא את \"זלמן, פרנס, נפטר 1637\". זה אישור עצמאי לכך שזלמן היה פרנס הקהילה.\n⚠️ אבל בספר יש טעות דור: הוא רושם את זלמן כבנו של זליגמן ריינבך, ולא כנכדו. באותה טבלה עצמה מופיע \"זלמן מבית המגן הירוק\" שוב, ברשימת הנכדים. על המצבה כתוב במפורש \"שלמה ב\"ר משה נתן הכהן\", ולכן כרטיס הרישום צודק: זלמן הוא בנו של נטע ונכדו של זליגמן."], ["🪦 המצבה היום (epidat)", "המצבה של ר' שלמה זלמן נשמרה, והיא נמצאת היום בבית הקברות היהודי הישן בפרנקפורט, ברחוב באטונשטראסה (epidat, ffb-1285).\n• המצבה נשברה לכמה חלקים. שלושה מהם נמצאו והורכבו מחדש, והכתובת קריאה היטב.\n• בראש המצבה שני עיגולים: באחד ידי כהנים, הסמל של הכהנים, ובשני סימן הבית שלו, תרנגול.\n• לפי פנקס הקבורה הוא נקבר למעלה, בצד הדרומי של בית הקברות. משמאל לראשו עומדת המצבה של אחיו הירץ (הורוביץ 494, נפטר 29.11.1620).\nתמונה של המצבה נמצאת בגלריה."]]}, "g": [{"f": "g258", "c": "כרטיס הרישום של ר' שלמה זלמן כ\"ץ מבית המגן הירוק (Zum grünen Schild), נפטר 22.1.1637"}, {"f": "g479", "c": "מצבת הפרנס ר' שלמה זלמן כ\"ץ (1637), בבית הקברות היהודי הישן בפרנקפורט. בראשה תרנגול, סימן הבית, וידי כהנים"}, {"f": "g274", "c": "ספר הורוביץ, עמ' 67: כתובת 648, מצבת ר' שלמה זלמן כ\"ץ (1637)"}]}, {"n": "מאיר גנסמן", "y": "–1674", "s": [{"k": "mies", "r": "l", "t": ["מיס, בוהמיה"], "u": 0}], "c": {"n": "מאיר בן בונם גנסמן (Meier Bunems Gansmann)", "rel": "אביו של ר' יהודה ליב איגר · סבו של רבי שמחה בונים איגר", "b": "", "d": "6.3.1674", "place": "מיס, בוהמיה", "note": "\"הפרנס העשיר והנכבד, ראש ומנהיג יהודי מדינת בוהמיה\", וגם שתדלן, כלומר מי שייצג את היהודים מול השלטונות. כנראה גר במיס, מערבית לפילזן. נפטר ב-6.3.1674, לפי ספר הזיכרון של בית הכנסת \"קלויז\" בהלברשטט. בספר הזיכרון של בית המדרש שבנה בנו אליה בפראג הוא נקרא \"ראש וקצין כהר\"ר מאיר מיס, מגזע גנסמן\". מצבה שלו לא נמצאה.", "flag": "שנת הלידה לא ידועה. אאורבך (1866) כתב שגר בהלברשטט ונפטר שם. לפי Meyer זו טעות: הוא לא מופיע ברשימות היהודים של הלברשטט בשנים 1650–1674, ושמו נזכר בספר הזיכרון של הלברשטט בגלל בנו ליב.", "src": "W. Meyer, \"Zur Geschichte der Familie Eger-Gans-Gansmann\", Jüdische Familienforschung 14 (1938), גיליונות 48–50, עמ' 889–896, 914–918, 940–943 (Compact Memory, הספרייה של אוניברסיטת פרנקפורט) · נבדק 23.11.2026 · S. Hock, \"Die Familien Prags\" (1892), עמ' 69, רשומה 7829 (Google Books), נבדק 24.11.2026", "x": [["🗺️ איפה זה בוהמיה", "בוהמיה היא החלק המערבי של צ'כיה של היום, ופראג היא הבירה שלה. המקומות של המשפחה נמצאים במערב בוהמיה, ליד הגבול עם גרמניה:\n• טושקאו (Tuschkau, היום Touškov), ליד פילזן. כאן חיו אבות המשפחה, אליה גנס ובנו שמחה בונם.\n• מיס (Mies, היום Stříbro), כ-30 ק\"מ מערבית לפילזן. כאן כנראה גר מאיר גנסמן.\n• איגר (Eger, היום Cheb), על הגבול עם גרמניה. מכאן בא שם המשפחה איגר.\n• הלברשטט, בגרמניה. לשם עבר בנו, ליב איגר.\n• פראג. שם קבורים כמה מבני המשפחה.\nזו לא העיר איגר שבהונגריה (ערלוי, Erlau), שבה כיהן ר' שמעון סופר."], ["👨‍👦 הוריו", "לפי Meyer: אביו שמחה בונם גנס מטושקאו (Tuschkau). נפטר בפראג באב 1655. על מצבתו (הוק 7829, עמ' 69): \"תט\"ו. אב, כ\"ה שמחה נקרא ר' בונם בן ר' אלי' ז\"ל מטושקא\". מופיע בכרטיס נפרד. אמו לא ידועה."]]}, "g": [{"f": "g474", "c": "ספר הוק, עמ' 69: משפחת גנז, ובה רשומה 7829, מצבת שמחה בונם בן אליה מטושקאו (1655)"}]}, {"n": "שרל בונצל גרעץ", "y": "1626–1708", "s": [{"k": "prague", "r": "l", "t": ["פראג  ·  בומסלא"], "u": 0}, {"k": "boleslav", "r": "l", "t": ["פראג  ·  בומסלא"], "u": 0}, {"k": "prague", "r": "d", "t": ["אייר תס\"ח (1708), פראג"], "u": 0}], "c": {"n": "שרל גרעץ, בת ר' זיסקינד בונצל (בומסלא)", "rel": "אמה של רייק ליפמן גרץ ברודא · אשתו של ר' אליעזר ליפמן גרעץ · בתו של ר' זיסקינד בומסלא", "b": "1626", "d": "אייר תס\"ח (1708), פראג", "place": "פראג · בומסלא", "note": "בתו של ר' זיסקינד מבית בומסלא (בונצל), שנפטר לפני 1654. אשתו של ר' אליעזר ליפמן גרעץ, אב בית הדין בבומסלא, ואמה של רייק, אשתו הראשונה של רבי אברהם ברודא.\n\nהיא נפטרה בחודש אייר תס\"ח, באביב 1708, ונקברה בבית הקברות היהודי העתיק בפראג. בעלה נפטר לפניה, ב-1694.", "flag": "שנת הלידה, 1626, נמסרה על ידי המשפחה ולא נמצא לה מסמך. שמה, שם אביה, שם בעלה ושנת הפטירה מאומתים בספר של הוק. היום המדויק באייר לא מופיע בספר. הזיהוי של עזריאל זיסקינד כבנה הוא השערה.", "src": "S. Hock, \"משפחות ק\"ק פראג על פי מצבותיהן / Die Familien Prags\" (פרשבורג 1892), דרך הספרייה הממלכתית של בוואריה (MDZ, bsb11538295), עמ' 31 ו-75, מס' 2114 (כולל ההערה בעמ' 75), ועמ' 32, מס' 1011 · שנת הלידה: מסירת המשפחה, 9.11.2026 · Grätz Family Genealogy (rootsweb), להשוואה", "x": [["🪦 המצבה", "המצבה שלה מתועדת בספר של שמעון הוק על מצבות בית הקברות העתיק בפראג, פעמיים: בפרק \"בומסלא\" (עמ' 31) ובפרק \"גריץ\" (עמ' 75), שתיהן במס' 2114, בשנת תס\"ח. זה הנוסח בעמ' 75:\n\"אייר, שרל אשת הרב הגאון מו' אליעזר ליפמן גרעץ, בת הרב הקצין מו' זיסקינד בומסלא ז\"ל\".\nבהערה מוסיף הוק: \"והר\"ר זיסקינד הנ\"ל כבר היה נפטר בשנת תי\"ד, כנודע ממעיל אשר נדב בנו מוהר\"ר יאקב בבומסלא\". כלומר, אביה נפטר לפני 1654, ואחיה יעקב תרם לזכרו מעיל לספר תורה בבומסלא.\nבהשערה ברורה, אחד מבניה היה עזריאל זיסקינד, שנקרא על שם אביה. בספר של הוק (עמ' 32, מס' 1011) מופיעה מ-1737 \"עלקלה אשת כ\"ה עזרי' זיסקינד בן הגאון מו' ליפמן זצ\"ל אב\"ד ור\"מ דק\"ק בומסלא והגליל\"."], ["📅 שנת הפטירה", "המשפחה מסרה 1707. לפי הספר של הוק היא נפטרה באייר תס\"ח, כלומר באביב 1708.\nבאתר גנאלוגי פרטי (Grätz Family Genealogy, ב-rootsweb) כתוב שנפטרה ב-30.5.1694. זו כנראה טעות: זה תאריך הפטירה של בעלה, ליפמן, בב' דשבועות תנ\"ד. באותו אתר אביה מזוהה עם זיסקינד בן שמחה, מראשי קהילת פראג, שנפטר ב-1676. גם זו כנראה טעות, כי לפי הוק אביה נפטר לפני 1654."]]}, "g": []}, {"n": "ר' אליעזר ליפמן גרעץ", "y": "~1625–1694", "s": [{"k": "teplitz", "r": "l", "t": ["טפליץ וקולין"], "u": 0}, {"k": "kolin", "r": "l", "t": ["טפליץ וקולין"], "u": 0}, {"k": "boleslav", "r": "l", "t": [], "u": 0}, {"k": "prague", "r": "l", "t": [], "u": 0}], "c": {"n": "ר' אליעזר ליפמן גרעץ, אב\"ד בומסלא", "rel": "אביה של אשת רבי אברהם ברודא · סבו של ר' משה ברודא", "b": "בערך 1625", "d": "1694 (ז' בסיון תנ\"ד), נקבר בבומסלא", "place": "טפליץ וקולין ← בומסלא ← פראג", "note": "בנו של ר' וולף גרץ. אב בית דין בטפליץ ובקולין, ואחר כך אב בית דין וראש ישיבה בבומסלא (מלאדה בולסלאב). בהמשך מונה לדיין בבית הדין הגבוה בפראג. חתנו, רבי אברהם ברודא, עבר לבומסלא ועזר לו לנהל את הישיבה. מוזכר בספר \"מגדול דוד\" של דוד גרינהוט.", "flag": "שנת הלידה משוערת. השנים בבומסלא לא עקביות במקורות (מ-1676, או אחרי טפליץ וקולין ב-⁦1678–1679⁩). לפי המכלול נכלא בגלל מחלוקת על בית הכנסת אלטנוי בפראג ונפטר כשנה אחר כך; סיבת המאסר היא השערה.", "src": "המכלול (\"רבי אליעזר ליפמן גרעץ\") · ויקיפדיה העברית (\"מלאדה בולסלאב\", \"אברהם ברודא\") · Jewish Encyclopedia", "x": []}, "g": [{"f": "g207", "c": "מצבת הרב אליעזר ליפמן גרעץ (סימון באתר: MB H144)"}]}, {"n": "שינלה כ\"ץ גינצבורג", "y": "~1585–1628", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית השער (Zur Pforte)", "י\"ד באייר שפ\"ח (17.5.1628), פרנקפורט"], "u": 0}], "c": {"n": "הרבנית שינלה (Sejnle, Schönle) כ\"ץ גינצבורג, בת שלמה כ\"ץ", "rel": "אמו של ר' נוסן הכהן כ\"ץ · סבתו של שלמה זלמן", "b": "בערך ⁦1583–1587⁩ (בהשערה ברורה)", "d": "י\"ד באייר שפ\"ח (17.5.1628), פרנקפורט", "place": "פרנקפורט, בית השער (Zur Pforte)", "note": "אשתו של ר' שמעון (זימל) הכהן גינצבורג ואמו של ר' נוסן הכהן כ\"ץ. בתו של ר' שלמה כ\"ץ. גרה בבית השער (Zur Pforte) בפרנקפורט. נפטרה ב-17.5.1628, שישה שבועות אחרי אחותה ברנדלין, ונקברה לידה.", "flag": "שנת הלידה משוערת. סיבת המוות לא ידועה. בכרטיס הרישום לא מופיע שם המשפחה גינצבורג; זה שם המשפחה של בעלה.", "src": "כרטיס הרישום \"Sejnle Günzburg-Ries, 17.5.1628\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1620–1629⁩, עמ' 247 · כרטיס הרישום של אחותה \"Brendlin Bacharach, 4.4.1628\": שם, עמ' 236 · נוסח המצבה: M. Horovitz (1901), עמ' 59, כתובת 574 (אבן 1494) · ספירת הפטירות: אותו קובץ, עמ' ⁦156–274⁩ · מגפות בגרמניה באותן שנים: Die Pest im Dreißigjährigen Krieg 1623 bis 1628 (אוניברסיטת ברמן) · שם המשפחה גינצבורג: מסירת המשפחה, 9.11.2026 · epidat, Salomon Ludwig Steinheim-Institut, \"Frankfurt am Main, Battonnstraße\", ffb-3027, ffb-3395, נבדק 24.11.2026", "x": [["📜 מה ידוע עליה", "• נולדה כנראה בשנים ⁦1583–1587⁩ (בהשערה ברורה, לפי שנת הנישואין).\n• נישאה ב-1602 או 1603 לר' שמעון (זימל) הכהן גינצבורג, רב גדול בפרנקפורט.\n• הם גרו בבית השער (Zur Pforte). ברשימה משנת 1619 הם רשומים יחד: \"שמעון ושינלה בבית השער\".\n• בעלה נפטר ב-27.5.1624. ברשימה משנת 1624 היא רשומה כ\"שינה, אלמנת שמעון מבית השער\". בנה נתן היה אז ילד קטן.\n• נפטרה ביום י\"ד באייר שפ\"ח, 17.5.1628. אביה היה עדיין בחיים."], ["🪦 המצבה", "בספר המצבות של הורוביץ, כתובת 574:\n\"הרבנית שונלן אשת מהר\"ר ש' ז\"ל. פה קבר אשת חבר, ובפולחנא דשמיא גבר. היא האשה החשובה מרת שוינלן בת האלוף ר' שלמה הכהן שליט\"א. נפטרת ונקברת יום ד' י\"ד אייר שפ\"ח לפ\"ק. תנצב\"ה.\"\n\"ש'\" הוא בעלה שמעון. \"בפולחנא דשמיא גבר\" פירושו: חזקה בעבודת השם. \"שליט\"א\" אומר שאביה היה עדיין בחיים.\nבפנקס הקבורה כתוב שהיא נקברה ליד אחותה ברנדלן, בחלק הדרומי של בית הקברות.\n\nלפי epidat (ffb-3027): חמישה שברים מהמצבה נמצאו בגבעה האמצעית A של בית הקברות. לפי פנקס הקבורה היא נקברה למעלה בבית הקברות. משמאלה קבורה אחותה ברנדלן, והראשים של שתיהן פונים זו אל זו. תמונה של אחד השברים נמצאת בגלריה."], ["👭 אחותה ברנדלין", "ברנדלין הייתה אחותה של שינלה, וגם היא בת שלמה כ\"ץ.\n• היא נישאה למנדלה בן שמואל בכרך. מנדלה לא מופיע ברשימות אחרי 1623, ולכן כנראה נפטר לפני 1624, או שעזב את פרנקפורט (לא ודאי).\n• היא גרה בבית האסכלה (Zum Rost).\n• בפנקס הקבורה בעלה נקרא \"מענדלין בן שמואל יתום\". לא ידוע מה פירוש המילה \"יתום\" כאן, כי אביו שמואל היה עדיין בחיים באפריל 1628.\n• היא נפטרה ב-4.4.1628, ראש חודש ניסן שפ\"ח. בפנקס כתוב בטעות \"ראש חודש סיון\", והעורך תיקן לניסן.\n• שישה שבועות אחריה נפטרה שינלה, ונקברה לידה.\n• גם שמואל בכרך, חמיה של ברנדלין, נפטר באותו אביב, ב-28.5.1628.\nברנדלין ובעלה לא מופיעים באילן בכרטיס נפרד. מנדלה קשור למשפחה רק דרך הנישואין, ולא בדם.\n• שברי המצבה שלה נמצאו (epidat, ffb-3395): \"ברענדלן אשת מענדלין … נפטרת ונקברת … ר\"ח ניסן שפ\"ח … ברענדלן בת ר' שלמה כ\"ץ יחיה לעד\". גם על המצבה שלה כתוב שאביה עדיין בחיים.\n• לפי פנקס הקבורה (כפי שמביא epidat) היא נקברה למעלה בבית הקברות. מעל ראשה עומדת המצבה של שינכן בת שמואל, משמאלה מאטן בת ישראל, ובגובה אמצע הקבר מצבת חיים לוי ועץ אגוז. תמונה של שבר מהמצבה נמצאת בגלריה."], ["📈 למה שתי האחיות נפטרו כמעט יחד?", "סיבת המוות לא כתובה בשום מקום. אבל כשסופרים כמה אנשים נפטרו בפרנקפורט לפי כרטיסי \"אלה תולדות\", רואים קפיצה:\n• בכל שנת 1627: בערך 21.\n• בחמשת החודשים ינואר עד מאי 1628: בערך 33. באפריל לבדו: בערך 9.\n• ביוני עד דצמבר 1628: בערך 10. בכל שנת 1629: בערך 13.\nכלומר באביב 1628 מתו הרבה יותר אנשים מהרגיל, ושתי האחיות מתו בדיוק אז.\nבהשערה ברורה: כנראה הייתה בקהילה מגפה. אלה היו שנות מלחמת שלושים השנה, ובשנים ⁦1623–1628⁩ היו מגפות דבר וטיפוס באזורים רבים בגרמניה. לא נמצא מקור שאומר במפורש שהייתה מגפה בפרנקפורט ב-1628, והספירה מקורבת."], ["👭 אולי אחותה של גוטלה אופנהיים (לא ודאי)", "אם אביה, ר' שלמה כ\"ץ, הוא באמת ר' שלמה זלמן כ\"ץ מבית המגן הירוק, אז שינלה וגוטלה אופנהיים היו אחיות.\nבמקרה כזה: אמו של בעלה שמעון, בונלין, הייתה אחותו של סבה של שינלה, ר' משה נתן. כלומר שינלה התחתנה עם בן הדוד של אביה."]]}, "g": [{"f": "g268", "c": "כרטיס הרישום של שינלה גינצבורג-ריס מבית השער (Zur Pforte), נפטרה 17.5.1628"}, {"f": "g480", "c": "שבר ממצבת הרבנית שינלה בת שלמה הכהן (1628), פרנקפורט"}, {"f": "g481", "c": "שבר ממצבת ברנדלן בת ר' שלמה כ\"ץ, אחותה של שינלה (1628), פרנקפורט"}, {"f": "g330", "c": "כרטיס הרישום של מנדלה בכרך, בעלה של ברנדלין, נפטר בסביבות 1623"}, {"f": "g333", "c": "ספר הורוביץ, עמ' 59: כתובת 574, מצבת הרבנית שינלה בת שלמה הכהן (1628)"}, {"f": "g329", "c": "כרטיס הרישום של ברנדלין בכרך, בת שלמה כ\"ץ, נפטרה 4.4.1628"}]}, {"n": "ר' שמעון הכהן גינצבורג", "y": "–1624", "s": [{"k": "frankfurt", "r": "ld", "t": ["פרנקפורט, בית השער (Zur Pforte)", "ט' בסיון שפ\"ד (27.5.1624), פרנקפורט"], "u": 0}], "c": {"n": "ר' שמעון (זימל) הכהן גינצבורג (כ\"ץ)", "rel": "בעלה של שינלה · אביו של ר' נוסן הכהן כ\"ץ", "b": "", "d": "ט' בסיון שפ\"ד (27.5.1624), פרנקפורט", "place": "פרנקפורט, בית השער (Zur Pforte)", "note": "הגאון ר' שמעון (זימל) הכהן גינצבורג, בנם של ר' שלמה זלמן רייזמן ושל בונלין. גר בבית השער (Zur Pforte), ויש עליו רשומות רבות מ-1603 ואילך. נפטר ביום שני, ט' בסיון שפ\"ד (27.5.1624), ונקבר ליד אביו. בפרנקפורט נשמר עליו פתגם: \"רבי זימל שליד השער יודע את כל התורה על מילה אחת\".", "flag": "שנת הלידה לא ידועה. הקריאה והתרגום של הפתגם מהכרטיס אינם ודאיים.", "src": "כרטיס הרישום \"Simon Günzburg, 27.5.1624\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1620–1629 · נוסח המצבה: M. Horovitz (1901), עמ' 52–53, כתובת 518 (אבן 2147) · מסירת המשפחה, 9.11.2026", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Simon Günzburg\n📅 נפטר: 27.5.1624 (ט' בסיון שפ\"ד)\n🪦 המצבה (הורוביץ 518): הגאון שמעון הכהן גינצבורג, בן החבר שלמה הכהן ז\"ל\n⚰️ פנקס הקבורה: הגאון שמעון, נקבר ליד אביו שלמה בר מאיר, המכונה זלמן רייזמן\n🏠 בית: השער (Zur Pforte). בתיק הבית יש רשומות רבות מ-1603 ואילך.\n💬 פתגם פרנקפורטי ישן: \"רבי זימל שליד השער יודע את כל התורה על מילה אחת\"\n👨 אביו: זלמן רייזמן מבית השער, בן מאיר כ\"ץ. נפטר בסביבות 1591.\n👩 אמו: בונלין בת קלמן כ\"ץ. נפטרה בסביבות 1616.\n💍 אשתו: שינלה בת שלמה. נישאו ב-1602 או 1603. נפטרה 17.5.1628.\n📝 הערות העורך:\n• \"רייזמן\" פירושו כאן מאזור ריס (Ries) שבבוואריה.\n• שמעון גינצבורג אחר, מבית הוורד המוזהב (Zur goldenen Rose), נפטר ב-26.2.1659.\n• הידיעה על הבן נתן, שהיה ילד קטן כשאביו נפטר, באה מהערה בכתב יד בתיק הבית."], ["נוסח המצבה (הורוביץ, כתובת 518, אבן 2147)", "הגאון האשל הגדול מהר\"ר שמעון הכהן גוינצבורג. ציון מצבת ספון, ראש ישראל ארון התורה, תוכן אורה וחתום תורה תתיפי . . . . . . . . . מהור\"ר שמעון בן החבר ר' שלמה הכהן זצ\"ל, הי' לקדשו יום ב' ט' סיון שפ\"ד."], ["👩‍🦱 אשתו", "שינלה, בת שלמה כ\"ץ. נישאו בשנת 1602 או 1603. נפטרה ב-17.5.1628. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nנתן. היה ילד קטן כשאביו נפטר. מופיע בכרטיס נפרד\nסרלן, אשת משה כ\"ץ. נפטרה ב-22.9.1624"], ["🔁 נישואים בתוך המשפחה", "• ההורים של שמעון היו בני דודים: אביו, ר' שלמה זלמן רייזמן, הוא בנו של ר' מאיר. אמו, בונלין, היא בתו של ר' קלמן. ר' מאיר ור' קלמן היו אחים.\n• אשתו שינלה הייתה אולי נכדה של ר' משה נתן, האח של אמו בונלין (לא ודאי). אם כך, שמעון התחתן עם הבת של בן הדוד שלו."]]}, "g": [{"f": "g279", "c": "ספר הורוביץ, עמ' 52: תחילת כתובת 518, מצבת ר' שמעון הכהן גינצבורג (1624)"}, {"f": "g280", "c": "ספר הורוביץ, עמ' 53: המשך כתובת 518, מצבת ר' שמעון הכהן גינצבורג (1624)"}, {"f": "g186", "c": "כרטיס הרישום של ר' שמעון גינצבורג · פרנקפורט"}]}, {"n": "דוד", "y": "", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט (כנראה)"], "u": 1}], "c": {"n": "דוד, אביה של אסתר לייטר", "rel": "אביה של אסתר לייטר · סבו של ר' דוד לייטר", "b": "", "d": "", "place": "פרנקפורט (כנראה)", "note": "אביה של אסתר, אשתו של ר' אלחנן לייטר מבית המנורה (Zur Leuchte). בכרטיס הרישום של בתו הוא נקרא \"מורנו דוד\", כלומר היה תלמיד חכם שקיבל את תואר \"מורנו\". נכדו, ר' דוד לייטר, נקרא כנראה על שמו.", "flag": "מלבד השם והתואר \"מורנו\" לא ידוע עליו דבר: לא שם משפחה, לא מקום מגורים ולא תאריכים. זה שהנכד נקרא על שמו הוא השערה לפי מנהג מתן השמות. נבדק ב-19.11.2026: שמות הוריו לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום של בתו \"Ester Leiter-Bingen, 7.5.1686\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1680–1689, עמ' 161 · כרטיס הרישום של חתנו \"Hon Leiter, 31.12.1659\": קובץ 1650–1659, עמ' 192 · כרטיס הרישום של נכדו \"Dowid Leiter, 13.5.1692\": קובץ 1690–1699, עמ' 98", "x": [["אזכורו בכרטיסי הרישום של בתו וחתנו (אלה תולדות)", "לא נמצא לו כרטיס רישום משלו. בכרטיס הרישום של בתו, \"Ester Leiter-Bingen, 7.5.1686\", כתוב: \"Ester b' morenu Dawid, Wwe. des Elhanan Later z\"l tsur Lajht\" (אסתר בת מורנו דוד, אלמנת אלחנן לייטר ז\"ל מבית המנורה), ובשורת האב: \"Vater: Dawid\". בכרטיס הרישום של חתנו, \"Hon Leiter, 31.12.1659\", אשתו רשומה כ\"Ester b' Dowid\"."], ["👨‍👩‍👧 ילדיו", "אסתר, אשת ר' אלחנן לייטר מבית המנורה (Zur Leuchte). נפטרה ב-7.5.1686. מופיעה בכרטיס נפרד"]]}, "g": [{"f": "g248", "c": "כרטיס הרישום של ר' אלחנן לייטר מפרנקפורט, נפטר 31.12.1659"}, {"f": "g283", "c": "כרטיס הרישום של אסתר לייטר-בינגן, בת מורנו דוד, נפטרה 7.5.1686"}]}, {"n": "דוד וולף", "y": "", "s": [{"k": "halberstadt", "r": "l", "t": [], "u": 0}], "c": {"n": "דוד וולף, פרנס הקהילה בהלברשטט", "rel": "אביה של רחל וולף איגר · סבו של רבי שמחה בונים איגר", "b": "", "d": "", "place": "הלברשטט", "note": "פרנס (Vorsteher) הקהילה היהודית בהלברשטט. ידוע מהרשימה הרשמית של יהודי הלברשטט משנת 1688, שלפיה ליב איגר קיבל את זכות הישיבה בעיר בזכות נישואיו עם בתו.", "flag": "שנות חייו לא ידועות. ב-WikiTree ובג'ני הוא נקרא \"דוד בנימין וולף\". לפיהם נולד בדסאו בערך ב-1634, נפטר בהלברשטט בערך ב-1700, והיה בנו של שמעון בנימין וולף (וילנר). לזה אין מקור. Freudenthal (1900) לא מונה בן בשם דוד בין ילדי שמעון וולף וילנר. נבדק ב-24.11.2026: שמות הוריו לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "W. Meyer, \"Zur Geschichte der Familie Eger-Gans-Gansmann\", Jüdische Familienforschung 14 (1938), גיליון 48, עמ' 896 (Compact Memory, הספרייה של אוניברסיטת פרנקפורט) · נבדק 23.11.2026 · WikiTree (Wolf-8046) · M. Freudenthal, Aus der Heimat Mendelssohns (1900), עמ' 23–28 וטבלת המשפחה", "x": [["📜 ברשימת יהודי הלברשטט, 1688", "\"...daß Levin Meier dort das Schutzrecht erworben hat auf Grund seiner Verheiratung mit der Tochter des Halberstädter Vorstehers David Wolf.\"\nתרגום: \"...ש-Levin Meier [ליב איגר] קיבל שם את זכות הישיבה בזכות נישואיו עם בתו של פרנס הלברשטט, דוד וולף.\"\n(W. Meyer, 1938, לפי הארכיון הממלכתי הפרוסי, Rep. 33 Nr. 120c)"]]}, "g": []}, {"n": "גוטלין בינגן", "y": "–1650", "s": [{"k": "frankfurt", "r": "l", "t": [], "u": 0}], "c": {"n": "גוטלין בינגן לייטר, בת ר' נתן נויגאס", "rel": "אשתו של מאיר משה בינגן לייטר · אמו של ר' אלחנן לייטר · בתו של ר' נתן נויגאס", "b": "", "d": "1650", "place": "פרנקפורט", "note": "אשתו של מאיר משה בינגן לייטר, ואמם של ר' אלחנן ושל אהרן לייטר. בתו של \"החסיד מהר\"ר נתן, מתושבי ירושלים\", כלומר ר' נתן נויגאס. לפי ג'ני היו לה אחים בשם חיים ויצחק נויגאס (מבית חבית היין, Zum Weinfass) ומשה נויגאס (מבית פינת האריה, Zum Löweneck). בבתים ברחוב היהודים של פרנקפורט לא היו מספרים: לכל בית היה שם ושלט, והמשפחות נקראו על שם הבית. נפטרה בליל שני ונקברה ביום שלישי, י\"ז באלול ת\"י, 13.9.1650 (בלוח הגרגוריאני; 3.9.1650 בלוח היוליאני, שנהג אז בפרנקפורט), בבית הקברות העתיק בפרנקפורט. ג'ני רושם את יום הפטירה 12.9.1650, כלומר ערב יום הקבורה. בעלה נפטר ב-1614, כך שהיא חיה אחריו כאלמנה כ-36 שנה.", "flag": "שנת הלידה לא ידועה (ג'ני מעריך 1560–1588). הזיהוי עם מצבה 754 מתאים גם לג'ני: אותו בעל, אותו אב ואותו תאריך. שימו לב: בכתובת 645 (1636) יש גוטלין אחרת, אשת אהרן לייטר ובת ר' שמואל. ו\"נתן ירושלמי בן חיים הלוי\", שנפטר בפרנקפורט ב-1686 (כתובת 1195), הוא אדם אחר ולא אביה.", "src": "מסירת המשפחה, 9.11.2026 · נוסח המצבה: M. Horovitz (1901), עמ' 78, כתובת 754 · מפתח השמות שם, עמ' 720, ערך Leiter · Geni: Guttlin Bingen (Neugass), Randy Schoenberg ואחרים, נבדק 10 Zur Leiter)\n👨 אביו: משה בינגן מבית הסולם, בן מאיר. נפטר 23.12.1604.\n👩 אמו: פריידלין.\n💍 אשתו: גוטלן מהיידסהיים, בת נתן. נישאו ב-1598 או 1599. נפטרה 12.9.1650."], ["נוסח המצבה (הורוביץ, כתובת 463, אבן 885)", ". . . . . א' . . . . . . טר. פה טמון קנה וקנמון, נוח כטל חרמון, כמר יעקב מאיר בר משה ז\"ל, נפטר יום א' כ\"ח אב שע\"ד לפ\"ק. תנצב\"ה.\nתחילת הכתובת לא השתמרה."], ["👩‍🦱 אשתו", "גוטלן (גוטלין) מהיידסהיים, בת נתן. נישאו ב-1598 או 1599. נפטרה ב-12.9.1650. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nאהרן, מבית הסולם (Zur Leiter). נפטר ב-23.1.1660\nר' אלחנן, מבית המנורה (Zur Leuchte). נפטר ב-31.12.1659. מופיע בכרטיס נפרד\nמשה, מבית הרשת (Zur Reuse). נפטר ב-13.5.1628\nמיכל, מבית הרשת (Zur Reuse). מוזכר ב-1617"]]}, "g": [{"f": "g262", "c": "כרטיס הרישום של מאיר משה בינגן מבית הסולם (Zur Leiter), נפטר 3.8.1614"}, {"f": "g269", "c": "ספר הורוביץ, עמ' 47: כתובת 463, מצבת מאיר משה בינגן (\"יעקב מאיר בר משה\"), 1614"}]}, {"n": "ר' משה מרגליות שלזינגר", "y": "", "s": [{"k": "wien", "r": "l", "t": ["וינה (הגטו, מ-1624)"], "u": 0}], "c": {"n": "ר' משה מרגליות (מרגוליס, יפה) שלזינגר", "rel": "אביו של ר' מרדכי מרגליות · אבי-סבו של ר' שמואל גינז שלזינגר", "b": "בערך 1560–1570 (בהשערה ברורה)", "d": "", "place": "וינה (הגטו, מ-1624)", "note": "אביו של ר' מרדכי מרגליות (יפה) שלזינגר, ראש הקהילה בווינה. גר בווינה, ובמסמכי העירייה נקרא \"Moysses Schlesinger Hoff Judt\", כלומר משה שלזינגר, יהודי החצר. כלומר, השם שלזינגר כבר היה שלו, ולא רק של בנו. היה הבעלים של חלק מבית \"הטווס המוזהב\" (Gulden Pfaben) בווינה. היה בין היהודים הראשונים שהתיישבו בגטו היהודי של וינה. הגטו היה באזור Unterer Werd, על אי מעבר לזרוע הדנובה, היום רובע לאופולדשטאט. היהודים הועברו אליו ב-1624, והוא התקיים עד הגירוש ב-1670. מרגליות ומרגוליס הם שני איותים של אותו שם. בעצי הגולשים הוא רשום גם בשם יפה, שם השושלת.", "flag": "שנות חייו לא ידועות. שנת הלידה המשוערת (1560–1570) מחושבת מגיל בתו. הקשר לבנו ר' מרדכי מבוסס על ווכשטיין. שמות הוריו לא ידועים, והקשר לבעל הלבוש הוא השערה בלבד.", "src": "B. Wachstein, \"Die Inschriften des alten Judenfriedhofes in Wien\", כרך 1 (1912), מצבה 175 (מצבת בתו יוטל) והערת העורך, עמ' 136–137 · Encyclopaedia Judaica (\"Schlesinger\") · Geni · הגטו בווינה: עיריית וינה (wien.gv.at) והמוזיאון היהודי וינה · מסירת המשפחה, 3.11.2026", "x": [["🪦 מצבת בתו יוטל בווינה (ווכשטיין, מצבה 175)", "בבית הקברות היהודי העתיק בווינה נמצאת המצבה של בתו, יוטל, מג' בסיון שצ\"א (10 ביוני 1631). על המצבה כתוב:\n\"אשת הקצין והראש כמר חנוך שיק... היקרה יוטל בת הר' משה מרגליות\".\nלפי המצבה היא נפטרה בגיל 41, כלומר נולדה בערך ב-1590. לכן, בהשערה ברורה, ר' משה עצמו נולד בסביבות 1560–1570.\nהחוקר ברנהרד ווכשטיין כותב בהערה למצבה שר' משה הוא \"ללא ספק\" אביו של מרכס שלזינגר, ראש הקהילה בווינה בזמן הגירוש של 1670. יוטל לא נוספה לעץ."], ["👨‍👩‍👧 ילדיו", "• ר' מרדכי מרגליות (מרכס שלזינגר), ראש הקהילה בווינה. נרצח ב-1683. מופיע בכרטיס נפרד\n• יוטל, אשת חנוך שיק, ראש הקהל בווינה. נולדה בערך ב-1590, ונפטרה בווינה ב-10.6.1631. לא נוספה לעץ"], ["⚠️ השערה בלבד, לא מוכחת: הקשר לבעל הלבוש", "לפי Geni ו-MyHeritage (עצים של גולשים), אביו של ר' משה היה ר' יהודה אריה ליב יפה, בנו של בעל הלבוש, רבי מרדכי יפה (בערך 1530–1612), רבה של פראג ופוזנא, שהיה בנו של ר' אברהם יפה, ראש הקהל בבוהמיה. מה כן מבוסס: לבעל הלבוש היה בן בשם אריה ליב (אנציקלופדיית דעת, המכלול), וספר היחוס \"מילי דאבות\" קורא לר' מרדכי, בנו של ר' משה, \"נכדו\" של בעל הלבוש. מה לא מבוסס: אין מקור שמוכיח שר' משה היה בנו של אריה ליב; החוקר ווכשטיין חולק על הקשר לבעל הלבוש; ובאותם עצים שנות האם (לייטע יפה, לבית האמרשלג) לא מסתדרות. לכן בעל הלבוש ואבותיו לא נוספו לעץ."]]}, "g": []}, {"n": "ר' הירץ אופנהיים", "y": "–1690", "s": [{"k": "frankfurt", "r": "ld", "t": ["כ\"ט בסיון ת\"ן (6.6.1690), פרנקפורט"], "u": 0}], "c": {"n": "ר' נפתלי הירץ אופנהיים, מבית הגביע הלבן (Zum weissen Becher)", "rel": "אביה של רייזל בינגן · חמיו של ר' ישראל בינגן", "b": "", "d": "כ\"ט בסיון ת\"ן (6.6.1690), פרנקפורט", "place": "פרנקפורט", "note": "פרנס ומנהיג (פו\"מ) בקהילת פרנקפורט. שמו העברי: נפתלי הירץ בן יוסף יהודה (לייב). גר בבית הגביע הלבן (Zum weissen Becher). ברשימת יהודי וורמס משנת 1615 הוא מופיע, בשם הירש, כילד רווק בבית אביו. נפטר בכ\"ט בסיון ת\"ן, 6.6.1690. בפנקס הקבורה הוא נקרא \"הזקן ר' הירץ אופנהיים\", ונקבר ליד משה אופנהיים ושלמה אופנהיים.\nאביו: לייב אופנהיים מבית החרב (Zum Schwert), בן משה. נפטר ב-7.4.1655.\nאמו: פרומט, בת אברהם באלין. נפטרה ב-26.1.1649.", "flag": "שנת הלידה לא ידועה. בג'ני הוא רשום כ\"Herz Löb Oppenheim\". לייב הוא שם אביו, כך שייתכן שבג'ני צורף שם האב לשמו.", "src": "כרטיס הרישום \"Herts Oppenheim, 6.6.1690\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1690–1699, עמ' 20 · נוסח המצבה: M. Horovitz (1901), עמ' 648, כתובת 5392 (אבן 3638) · Geni: Herz Löb Oppenheim, z. weisser Becher, נבדק 11.11.2026 · A. Dietz, \"Stammbuch der Frankfurter Juden\" (1907), ערך 435 (Oppenheim II)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Herts Oppenheim\n📅 נפטר: 6.6.1690 (כ\"ט בסיון ת\"ן)\n🪦 המצבה (הורוביץ 5392): הירץ אופנהיים, נפתלי בן יוסף יהודה ז\"ל\n⚰️ פנקס הקבורה: הזקן ר' הירץ אופנהיים, נקבר ליד משה אופנהיים ושלמה אופנהיים\n📜 ברשימת יהודי וורמס משנת 1615: \"הירש\" רשום כילד רווק אצל אביו\n🏠 בית: הגביע הלבן (Zum weissen Becher)\n👨 אביו: לייב אופנהיים מבית החרב (Zum Schwert), בן משה. נפטר 7.4.1655.\n👩 אמו: פרומט בת אברהם באלין. נפטרה 26.1.1649."], ["נוסח המצבה (הורוביץ, כתובת 5392, אבן 3638)", "האלוף פו\"מ מהור\"ר הירץ אופנים ת . . . ז ל\"ק. על אלה אני בוכיה ועיני יורדי מים, על איש צדיק שהלך לשמים, ה\"ה פו\"מ כהר\"ר נפתלי בן הפ\"ו כמהו' יוסף יהודה ז\"ל . . . .\nשנת הפטירה במצבה לא השתמרה."], ["👩‍🦱 נשותיו", "גוטלה, בת ר' שלמה זלמן כ\"ץ מבית המגן הירוק (Zum grünen Schild). נפטרה ב-8.7.1666. אשתו הראשונה. מופיעה בכרטיס נפרד\nפייל, בת יוקל. נפטרה ב-25.5.1695. נשא אותה כאלמן"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום. הכרטיס לא מציין מי מהנשים היא אמו של כל ילד.\nוולף אופנהיים. נפטר ב-25.2.166? (הספרה האחרונה של השנה לא ברורה בסריקה)\nרייזל, אשת ר' ישראל בינגן מבית הבקבוק (Zur Flasche). נפטרה ב-20.1.1719. מופיעה בכרטיס נפרד\nיאכט, אשת וולף גלנהאוזן. נפטרה ב-4.3.165? (הספרה האחרונה של השנה לא ברורה בסריקה)\nהינדכן, אשת איצק גולדשמיד-המלן מבית האמבט (Zur Wanne). נפטרה ב-14.9.1704"], ["📖 מהספר של דיץ", "📚 Stammbuch der Frankfurter Juden (1907), ערך 435 (Oppenheim II)\n• משפחת אופנהיים נחשבה לאחת המכובדות ביותר ברחוב היהודים. הורוביץ העתיק 218 מצבות של בני המשפחה.\n• אבי המשפחה בפרנקפורט: לייב (יהודה) ועדל אופנהיים, שבאו מהיידלברג ב-1531.\n• סבו: משה אופנהיים מבית החרב (Zum Schwert). נפטר ב-1626, זקן מאוד, ושילם את המס הגבוה ביותר בקהילה.\n• אביו: יוסף יהודה (לייב) מבית החרב. נפטר ב-1655 כפרנס הקהילה, \"הירא את אלוהים, החכם\".\n• ר' הירץ עצמו: נפטר כפרנס הקהילה.\n👨‍👦 אחיו, לפי דיץ:\n• בער. נפטר ב-1695\n• נתן (טודרוס) אופנהיים, מבית הקנקן הכסוף (Zur silbernen Kanne). נפטר ב-1698, זקן ועשיר מאוד\n📝 הסתייגות: דיץ כותב שר' הירץ גר בבית הדוב השחור (Zum schwarzen Bären), ושבנו היה שלמה, פרנס, שנפטר ב-1697. לפי כרטיס הרישום הוא גר בבית הגביע הלבן, ושלמה לא מופיע בין ילדיו. דיץ עצמו כותב שלפי ידיעה אחרת ייתכן שהירץ היה בנו של ליזר אופנהיים."]]}, "g": [{"f": "g260", "c": "כרטיס הרישום של ר' הירץ אופנהיים מבית הגביע הלבן (Zum weissen Becher), נפטר 6.6.1690"}, {"f": "g272", "c": "ספר הורוביץ, עמ' 648: כתובת 5392, מצבת ר' הירץ (נפתלי) אופנהיים (1690)"}, {"f": "g435", "c": "כרטיס הרישום של ר' לייב (יוסף יהודה) אופנהיים מבית החרב, נפטר 7.4.1655"}]}, {"n": "גוטלה אופנהיים", "y": "–1666", "s": [{"k": "frankfurt", "r": "ld", "t": ["ה' בתמוז תכ\"ו (8.7.1666), פרנקפורט"], "u": 0}], "c": {"n": "גוטלה אופנהיים, בת ר' שלמה זלמן כ\"ץ", "rel": "אמה של רייזל בינגן · חמותו של ר' ישראל בינגן", "b": "", "d": "ה' בתמוז תכ\"ו (8.7.1666), פרנקפורט", "place": "פרנקפורט", "note": "אשתו הראשונה של הפרנס ר' הירץ אופנהיים. גרה בבית הגביע הלבן (Zum weissen Becher). בתו של ר' שלמה זלמן כ\"ץ מבית המגן הירוק (Zum grünen Schild), שנפטר ב-22.1.1637. נפטרה ביום חמישי, ה' בתמוז תכ\"ו, 8.7.1666, ונקברה למחרת, ביום שישי. נקברה ליד רחל, אשת איצק חזן. לימים נקברו לידה גם בתה רייזל וחתנה ר' ישראל בינגן.\nלפי כרטיס הרישום של אביה, הוא היה בנו של נטע מבית המגן הירוק (Zum grünen Schild), בן קלמן כ\"ץ, שנפטר ב-21.1.1585. אביה וסבה מופיעים בכרטיסים נפרדים, וכך היא מחוברת בעץ לר' קלמן הכהן.", "flag": "שנת הלידה ושם אמה לא ידועים. בדפוס של הורוביץ שנת הפטירה היא תכ\"ד (1664). אטלינגר רשם תכ\"ו (1666), לפי פנקס הקבורה.", "src": "כרטיס הרישום \"Gutle Oppenheim, 8.7.1666\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1660–1669, עמ' 131 · כרטיס הרישום של אביה \"Zalman zum grünen Schild, 22.1.1637\": קובץ 1635–1639, עמ' 95 · נוסח המצבה: M. Horovitz (1901), עמ' 94, כתובת 916 (אבן 4503) · Geni: Gutle Oppenheim (Katz), נבדק 11.11.2026", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Gutle Oppenheim\n📅 נפטרה: 8.7.1666 (ה' בתמוז תכ\"ו)\n🪦 המצבה (הורוביץ 916): גוטלה אשת ר' הירץ אופנהיים, בת ר' שלמה (זלמן) כ\"ץ ז\"ל. אטלינגר מתקן את השנה שבדפוס של הורוביץ ל-תכ\"ו.\n⚰️ פנקס הקבורה: נקברה ליד רחל אשת איצק חזן. ברשימה נוספת: גוטלה אשת ר' הירץ אופנהיים מבית הגביע הלבן.\n🏠 בית: הגביע הלבן (Zum weissen Becher)\n👨 אביה: ר' זלמן מבית המגן הירוק (Zum grünen Schild), בן נוסן כ\"ץ. נפטר 22.1.1637.\n👩 אמה: לא נרשמה.\n💍 בעלה: ר' הירץ אופנהיים בן לייב. נפטר 6.6.1690. אחרי מותה נשא את פייל."], ["נוסח המצבה (הורוביץ, כתובת 916, אבן 4503)", "גוטלה א' הפרנס הירץ אופנהיים. פה נקברת הגברת המוכשרת לבעלה הי', עטרת במצות חנה היא נזהרת, הצנועה גוטלה בת הפרנס כ' שלמה זלמן כ\"ץ ז\"ל. נפ' יום ה' ונק' בע\"ש ו' תמוז תכ\"ד לפ\"ק.\nבדפוס של הורוביץ השנה היא תכ\"ד (1664). לפי אטלינגר ופנקס הקבורה השנה היא תכ\"ו (1666)."], ["👨‍🦱 בעלה", "ר' הירץ (נפתלי) אופנהיים, פרנס, מבית הגביע הלבן (Zum weissen Becher). נפטר ב-6.6.1690. היא הייתה אשתו הראשונה. מופיע בכרטיס נפרד"], ["👨‍👩‍👧 ילדיה", "רייזל, אשת ר' ישראל בינגן מבית הבקבוק (Zur Flasche). נפטרה ב-20.1.1719. לפי כרטיס הרישום שלה. מופיעה בכרטיס נפרד\nלבעלה היו עוד ילדים: וולף, יאכט והינדכן. כרטיס הרישום לא מציין מי מנשותיו היא אמם"], ["👭 אולי אחותה של שינלה (לא ודאי)", "אם ר' שלמה כ\"ץ, אביה של שינלה, הוא באמת ר' שלמה זלמן כ\"ץ מבית המגן הירוק, אביה של גוטלה, אז גוטלה ושינלה היו אחיות. זו השערה בלבד."]]}, "g": [{"f": "g259", "c": "כרטיס הרישום של גוטלה אופנהיים מבית הגביע הלבן (Zum weissen Becher), נפטרה 8.7.1666"}, {"f": "g273", "c": "ספר הורוביץ, עמ' 94: כתובת 916, מצבת גוטלה אופנהיים (1666)"}]}, {"n": "רייק ליפמן גרץ ברודא", "y": "~1650–1691", "s": [{"k": "boleslav", "r": "l", "t": [], "u": 0}], "c": {"n": "רייק ליפמן גרץ ברודא, אשתו הראשונה של רבי אברהם ברודא", "rel": "אמו של ר' משה ברודא · סבתה של שרה גינז שלזינגר", "b": "בערך 1650", "d": "1691", "place": "בומסלא", "note": "בתו של ר' אליעזר ליפמן גרעץ, אב בית הדין בבומסלא, ושל שרל בונצל גרעץ. אשתו הראשונה של רבי אברהם ברודא, ואמו של ר' משה ברודא. נפטרה ביום שישי, י\"ב באייר תנ\"א (11.5.1691), ומצבתה בליכטנשטאט.", "flag": "שמה ותאריך פטירתה מנוסח המצבה. יום השבוע שעל האבן תואם לתאריך. שנת הלידה נמסרה על ידי המשפחה ולא אומתה במקור נוסף.", "src": "ויקיפדיה העברית (\"אברהם ברודא\", \"משה ברודא\") · נוסח המצבה: המוזיאון היהודי בפראג, בציטוט שנמסר על ידי המשפחה · שנת לידה: מסירת המשפחה, 9.11.2026", "x": [["נוסח המצבה", "פ\"ט, יום ו' עש\"ק י\"ב אייר תנ\"א, הצדקת האשה החשובה, כל מעשיה שוין לטובה, הרבנית הצנועה והחסודה, מרת רייק בת הרב הגדול מוהר\"ר ליפמן אשת הגאון מוהר\"ר אברהם נר\"ו אב\"ד ור\"מ פה ק\"ק ל\"ש ורב המדינה, שבחה אין למלל, אשה יראת ה' תתהלל, תנצב\"ה."]]}, "g": [{"f": "g205", "c": "מצבת רייק ברודא, ליכטנשטאט"}, {"f": "g206", "c": "נוסח מצבתה של רייק ברודא"}]}, {"n": "רבי אברהם ברודא", "y": "1640–1717", "s": [{"k": "boleslav", "r": "bl", "t": ["1640 או 1650, בומסלא (Mladá Boleslav) או פראג"], "u": 1}, {"k": "prague", "r": "l", "t": [], "u": 0}, {"k": "frankfurt", "r": "ld", "t": ["11.4.1717 (ל' בניסן תע\"ז), פרנקפורט"], "u": 0}], "c": {"n": "רבי אברהם ברודא, בעל \"אשל אברהם\"", "rel": "אביו של ר' משה ברודא · סבה של שרה גינז שלזינגר", "b": "1640 או 1650, בומסלא (Mladá Boleslav) או פראג", "d": "11.4.1717 (ל' בניסן תע\"ז), פרנקפורט", "place": "בומסלא ← פראג ← פרנקפורט", "note": "בנו של רבי שאול ברודא. מחבר \"אשל אברהם\", שבנו ר' משה הוציא לאור עם הגהותיו. קבור בבית הקברות היהודי העתיק בפרנקפורט (בטונשטראסה), ליד שער הכבוד שבכניסה הדרום-מערבית. צילום של מצבתו לא נמצא.", "flag": "שנת הלידה במחלוקת בתוך הערך עצמו: 1640 בתיבת המידע, 1650 בפתיחה. מקום הלידה במחלוקת: בומסלא לפי ויקיפדיה העברית, פראג לפי המכלול.", "src": "ויקיפדיה העברית (\"אברהם ברודא\") · המכלול (\"רבי אברהם ברודא\") · מקום הקבר: המוזיאון היהודי פרנקפורט (Abraham Brodi) · כרטיס הרישום \"ab\"d Awrom Brody, 12.4.1717\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1710–1719, עמ' 237 · נוסח המצבה: M. Horovitz (1901), עמ' 175, כתובת 1682 (אבן 4427) · Liber Judaeorum Albus V (\"Kniha židovská bílá\"), כרך 2282, דף 5 ודף 100, הארכיון העירוני של פראג (AHMP), הקטלוג PragaPublica, סריקות 55 ו-245", "x": [["📜 בספר הרישום של יהודי פראג (Liber Albus), 1679 ו-1681", "בארכיון העירוני של פראג שמור \"הספר הלבן של היהודים\" (Liber Judaeorum Albus V, כרך 2282, השנים 1675–1685). זה ספר רישום כתוב ביד, שבו נרשמו עסקאות בתים ומשכנתאות של יהודי פראג. הכרך סרוק ופתוח לקריאה בקטלוג של הארכיון. שני רישומים בו עוסקים ברבי אברהם:\n• דף 5, 1679: מנדל בונדי, יהודי מפראג, ואשתו רלה, מתחייבים לשלם 450 גולדן \"לאברהם שאול ברוט ולכלתו לעתיד רייק, בתו של רבי ליפמן גרעץ\". זה הרישום המקורי של האירוסין שמצוטט בספר בגרמנית (שם התאריך הוא 10.1.1679). הרישום מאשר את השמות של אברהם, של רייק ושל אביה.\n• דף 100, יוני 1681: אליאס בונצל, יהודי מפראג, פועל בשם \"אברהם שאוּאֵלבּרוֹדט ואשתו רייק, הגרים עכשיו ביונג-בונצלאו\", לפי ייפוי כוח מ-17 ביוני 1681, ופודה עבורם את המשכנתה הזאת (300 רייכסטאלר). מכאן שב-1681 אברהם ורייק כבר גרו בבומסלא, העיר של אביה.\nהשם בספר נכתב כמילה אחת, \"שאול-ברוט\" או \"שאוּאֵלבּרוֹדט\", כלומר \"אברהם בן שאול ברוד\"."], ["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 ab\"d Awrom Brody\n📅 נפטר: 12.4.1717 (א' באייר תע\"ז)\n🪦 המצבה (הורוביץ 1682): אב בית הדין אברהם ברודא מפראג\n⚰️ פנקס הקבורה: אב בית הדין אברהם בן שאול ברודא מפראג, נקבר ליד אב בית הדין שמואל מקראקא\n📜 ברשימה נוספת: אברהם בן שאול ברודא ז\"ל, אב בית הדין של קהילתנו, שהגיע מפראג דרך מץ לפרנקפורט.\n• היה רב ברודניץ\n• אחר כך ראש ישיבה בפראג\n• אחר כך רב במץ, ומשם הגיע לפרנקפורט\n📖 על הלווייתו כתב שודט (Schudt). על הזמנתו לשטרסבורג ועל המשך דרכו לפרנקפורט כתבה גליקל מהמלן בספר השביעי של זיכרונותיה.\n🏠 בית: הבלוט (Zur Eichel)\n👨 אביו: שאול ברודא בפראג.\n👩 אמו: לא נרשמה.\n💍 אשתו: רעכלה בת שמואל (זנוויל) מפפרזה. נפטרה 21.1.1747."], ["נוסח המצבה (הורוביץ, כתובת 1682, אבן 4427)", "הגאון אב\"ד ור\"מ פה הקהלה, החסיד מ\"ו אברהם זצ\"ל ברודא מפראג, נפ' יום א' דר\"ח אייר תע\"ז לפ\"ק. פה זיווה והדרה, אראלים ומצוקים אחזו בארון הקודש, איש צדיק תמים הי' טהור וקדוש, הרביץ תורה וחכמה, ומאיר עיני ישראל עם קדוש, אור תורתו זרח בכמה קהילות הקודש, רבן של כל בני הגולה, משמעתתו מבדרין בעלמא הדין, והניח אחריו ברכה מלא וגדוש. נשמתו אתיא למעלה בצד כסא רחמים . . . . . . . ."], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nדוד ברודא, מבית הקנקן (Zur Kanne). נפטר ב-19.4.1741"], ["👩‍🦱 נשותיו", "לרבי אברהם היו שתי נשים, בזו אחר זו:\n1. אשתו הראשונה: רייק, בתו של ר' אליעזר ליפמן גרעץ, אב בית הדין בבומסלא, ושל שרל. האירוסין שלהם נרשמו בפראג ב-10.1.1679, וב-1681 הם כבר גרו בבומסלא. היא אמו של ר' משה ברודא. נפטרה ב-11.5.1691 (י\"ב באייר תנ\"א), ומצבתה בליכטנשטאט.\n2. אשתו השנייה: רעכלה, בתו של ר' זנוויל (שמואל) אולמא-גינצבורג מפפרזה. בהשערה ברורה, הוא נשא אותה אחרי מותה של רייק ב-1691. לפי כרטיס הרישום מפרנקפורט, היא נפטרה ב-21.1.1747, שלושים שנה אחריו."]]}, "g": [{"f": "g264", "c": "כרטיס הרישום של רבי אברהם ברודא, אב בית הדין, מבית הבלוט (Zur Eichel), נפטר 12.4.1717"}, {"f": "g270", "c": "ספר הורוביץ, עמ' 175: כתובת 1682, מצבת רבי אברהם ברודא, אב בית הדין (1717)"}]}, {"n": "ברמן דויץ", "y": "–1684", "s": [{"k": "frankfurt", "r": "ld", "t": ["2.5.1684 (י\"ח באייר תמ\"ד), פרנקפורט"], "u": 0}], "c": {"n": "ר' ברוך (ברמן) דויץ הלוי", "rel": "אביה של הנל לייטר · חותנו של ר' דוד לייטר", "b": "", "d": "2.5.1684 (י\"ח באייר תמ\"ד), פרנקפורט", "place": "פרנקפורט", "note": "ברוך בן משה יוסף הלוי, שנקרא ברמן דויץ (Berman Deutz). בא לפרנקפורט מהעיירה דויץ (Deutz) שעל הריין, מול קלן. במאי 1645 נשא את מינקלן, בת הדיין זליגמן בינגן, וקיבל זכות ישיבה בפרנקפורט. גר בבית הכבש (Zum Lamm). כמה שנים היה חבר בחברה קדישא. נפטר ביום שלישי, י\"ח באייר תמ\"ד (2.5.1684).", "flag": "שנת הלידה לא ידועה.", "src": "A. Dietz, Stammbuch der Frankfurter Juden (1907), עמ' 59 (Deutz IV) ועמ' 155 · אתר המוזיאון היהודי בפרנקפורט (METAhub), הבית Weißes Lamm · epidat ffb-4531 (המצבה של יוזל) · M. Horovitz (1901), עמ' 153, כתובת 1493 (אבן 909) · נבדק 23.11.2026 · כרטיס הרישום \"Berman Deutz, 2.5.1684\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1680–1689, עמ' 98 · כרטיס הרישום \"Hennel Leiter, 2.10.1727\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1720–1729, עמ' 319 · נוסח המצבה: M. Horovitz (1901), עמ' 656, כתובת 5481 (אבן 908)", "x": [["👨‍👦 הוריו", "אביו: משה יוסף הלוי. כך כתוב על המצבה. בפנקס הקבורה כתוב \"יוסף סג\"ל\". לא נמצאה לו מצבה בפרנקפורט.\nאמו: לא ידועה."]]}, "g": [{"f": "g252", "c": "כרטיס הרישום של ברמן דויץ מפרנקפורט, נפטר 2.5.1684"}, {"f": "g290", "c": "ספר הורוביץ, עמ' 656: כתובת 5481, מצבת ברמן דויץ"}]}, {"n": "מינקלן דויץ", "y": "–1692", "s": [{"k": "frankfurt", "r": "ld", "t": ["26.8.1692 (י\"ד באלול תנ\"ב), פרנקפורט"], "u": 0}], "c": {"n": "מינקלן דויץ, לבית בינגן", "rel": "אשתו של ברמן דויץ · אמה של הנל לייטר", "b": "", "d": "26.8.1692 (י\"ד באלול תנ\"ב), פרנקפורט", "place": "פרנקפורט", "note": "בתם של זליגמן בינגן, הדיין, ושל שיינלן בת קלמן כ\"ץ. אשתו של ברמן דויץ, וגרה איתו בבית הכבש (Zum Lamm). נפטרה ב-26.8.1692, שלושה חודשים אחרי חתנה, ר' דוד לייטר.", "flag": "שנת הלידה לא ידועה. אמה שיינלן, שנפטרה ב-23.3.1693, אחרי בתה, עדיין אין לה כרטיס בעץ.", "src": "כרטיס הרישום \"Minklen Deutz, 26.8.1692\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1690–1699, עמ' 103 · נוסח המצבה: M. Horovitz (1901), עמ' 131, כתובת 1303 (אבן 1482)", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Minklen Deutz\n📅 נפטרה: 26.8.1692 (י\"ד באלול תנ\"ב)\n🪦 המצבה (הורוביץ 1303): \"מינקלן אשת ברמן דייץ צום לאמ, בת זעליגמן דיין ז\"ל\"\n🏠 בית: הכבש (Zum Lamm)\n👩 אמה: שיינלן בת קלמן כ\"ץ. נפטרה 23.3.1693."], ["נוסח המצבה (הורוביץ, כתובת 1303, אבן 1482)", "מינקלן א' בערמן דייץ צום לאם. אמרר בבכי וגם ביגונים, על פטירת אשה יקרה, שבחה מי (מנה) מונים, וכל מעשיה הי' לשם שוכן מעונים, היקרה מר' מינקלן בת זעליגמן דיין ז\"ל, נפטר' ונק' יום ג' י\"ד אלול תנ\"ב לפ\"ק. תנצב\"ה."]]}, "g": [{"f": "g253", "c": "כרטיס הרישום של מינקלן דויץ מפרנקפורט, נפטרה 26.8.1692"}, {"f": "g254", "c": "כרטיס הרישום של זליגמן בינגן מבית הרשת (Zur Reuse), נפטר 30.11.1652"}, {"f": "g215", "c": "ספר הורוביץ, עמ' 131: כתובת 1299, מצבת דוד בר אלחנן לייטר (1692)"}]}, {"n": "ר' נפתלי הירץ", "y": "–<1664", "s": [{"k": "bingen", "r": "l", "t": ["כנראה בינגן"], "u": 1}], "c": {"n": "ר' נפתלי הירץ, כנראה מבינגן", "rel": "אביו של ר' ישראל בינגן · סבו של ר' שלמה זלמן בינגן", "b": "", "d": "לפני 1663/64", "place": "כנראה בינגן", "note": "שמו המלא ידוע מנוסח מצבת בנו בפרנקפורט: \"ישראל בר נפתלי הירץ\". בכרטיס הרישום של בנו הוא נקרא הירץ, ועורך הכרטיס, שלמה אטלינגר, כותב שהוא כנראה מבינגן. כשבנו הצטרף לחברה קדישא בפרנקפורט, בשנת תכ\"ד (1663/64), הוא כבר לא היה בחיים. לפי העורך, כנראה אין לו קשר למשפחות בינגן בפרנקפורט, ובהן משפחת הר\"ר מאיר בינגן מבית הסולם (Zur Leiter).", "flag": "שנות הלידה והפטירה, שם אשתו ומקום מגוריו לא ידועים. לפי עורך כרטיס הרישום הוא לא אחד משני הירץ בינג שנפטרו בפרנקפורט ב-14.6.1683 וב-14.2.1686, לא הירץ בן מאיר ולא הירץ בן זיסקינד, וכנראה אין לו קשר למשפחות בינגן בפרנקפורט. נבדק ב-11.11.2026: אין לו כרטיס רישום משלו אצל אטלינגר (נבדקו כל כרטיסי הגברים בשם הירץ שנפטרו בין 1600 ל-1669), ובמפתח השמות של הורוביץ (עמ' 699, ערך Bing) אין הירץ בינג שנפטר לפני 1664. בהשערה ברורה: הוא לא נקבר בפרנקפורט, או שמצבתו לא השתמרה. נבדק שוב ב-23.11.2026: שמות הוריו לא נמצאו. לכן סומן \"נחקר · הורים לא ידועים\".", "src": "נוסח מצבת 659, בבית הקברות העתיק בפרנקפורט. במצבתו הוא מתואר כאיש \"ישר ונעלה\", שביתו היה \"פתוח יומם ולילה\" ושהשכים והעריב לבית התפילה. לפי ג'ני אחיו היה אהרן לייטר ואשתו אסתר.", "flag": "לפי כרטיס הרישום הוא גר בבית המנורה (Zur Leuchte), ו\"צור לייכט\" שעל המצבה הוא כנראה Zur Leucht. בית הסולם (Zur Leiter) היה בית אביו. שנת הלידה לא ידועה. במצבה אביו נקרא \"יעקב מאיר\", ובעץ \"מאיר משה בינגן לייטר\". בהשערה ברורה לאביו היה שם כפול שכלל את \"מאיר\" (במצבת אשתו גוטלין, 1650, הוא נקרא \"מאיר לייטר\"), אבל זה לא מוכח.", "src": "נוסח המצבה: M. Horovitz (1901), עמ' 88, כתובת 856 · מפתח השמות שם, עמ' 720, ערך Leiter · Geni: Rabbi Elchanan Leiter (Randy Schoenberg), נבדק 10.11.2026 · מסירת המשפחה, 9.11.2026 · כרטיס הרישום \"Hon Leiter, 31.12.1659\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1650–1659, עמ' 192", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Hon Leiter\n📅 נפטר: 31.12.1659 (ט\"ז בטבת ת\"ך)\n🪦 המצבה: הורוביץ 856\n⚰️ נקבר ליד אביו, מאיר\n🏠 בית: המנורה (Zur Leuchte). אביו גר בבית הסולם (Zur Leiter).\n💍 אשתו: אסתר"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nדוד לייטר, גר בבית המנורה (Zur Leuchte), נפטר 13.5.1692. מופיע בכרטיס נפרד\nאולי חיים בינגן, נפטר 12.10.168? (השנה חתוכה בכרטיס)\nשפרינץ, אשת זלמן אורזל מבית הענב האדום (Zur roten Traube), נפטרה 28.10.1697\nפריידלן, אשת יעקב מבית כפתור המושק (Zum Bisemknopf), ואחר כך אשת גומפריכט מייזה, נפטרה 9.8.1663"], ["נוסח המצבה (הורוביץ, כתובת 856, אבן 937)", "היקר כמר אלחנן צור לייכט[ר], ט\"ו טבת ת\"ך לפ\"ק. נתבקש למעלה האיש ישר ונעלה, ביתה היתה פתוחה יומם ולילה, משכים ומעריב לבית התפילה, ה\"ה כמר אלחנן בר יעקב מאיר ז\"ל, תנצב\"ה. נפט' בליל ד' ונק' למחרתו ט\"ז טבת ת\"ך לפ\"ק."]]}, "g": [{"f": "g248", "c": "כרטיס הרישום של ר' אלחנן לייטר מפרנקפורט, נפטר 31.12.1659"}, {"f": "g226", "c": "ספר הורוביץ, עמ' 88: כתובת 856, מצבת ר' אלחנן לייטר (1659)"}]}, {"n": "אסתר לייטר", "y": "–1686", "s": [{"k": "frankfurt", "r": "ld", "t": ["7.5.1686, פרנקפורט"], "u": 0}], "
