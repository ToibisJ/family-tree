(1907), עמ' 336 · נבדק 25.11.2026", "x": [["👨‍👩‍👧 ילדיה", "בנים:\nיעקב עקיבא\nמשה\nשמחה בונים, בעל \"שבט סופר\"\nיצחק ליב\nשמעון, רב ערלוי. מופיע בכרטיס נפרד\nשלמה, בעל \"חוט המשולש\"\nאליקים, נפטר בילדותו\nבנות:\nשרל\nרחל\nהינדל\nרייזל"], ["🪦 ספר הקבורה בפרשבורג", "בספר הקבורה של בית הקברות היהודי בפרשבורג (ברטיסלבה), באתר jewishcemetery.sk, רשומה \"Schreiber, Chave Lea\" בעמודים 60–61 של הספר. באותם עמודים רשומה גם \"Spitzer, Gitl\".\nתמונות העמודים של הספר עוד לא נפתחו באתר (העומס באתר גדול מדי)."]]}, "g": [{"f": "g137", "c": "חוה לאה סופר, לבית וייס, אשת הכתב סופר"}, {"f": "g159", "c": "מצבת חוה לאה סופר, אשת הכתב סופר"}]}, {"n": "ר' אברהם שמואל בנימין וולף סופר 'הכתב סופר'", "y": "1815–1871", "s": [{"k": "pressburg", "r": "bld", "t": ["11.2.1815 (א' באדר א' תקע\"ה), פרשבורג", "1871 (י\"ט בטבת תרל\"ב), פרשבורג"], "u": 0}], "c": {"n": "רבי אברהם שמואל בנימין וולף סופר, \"כתב סופר\"", "rel": "בנו הבכור של החתם סופר · אחיהם של גיטל ור' שמעון · אבי-סבו של ר' אברהם", "b": "11.2.1815 (א' באדר א' תקע\"ה), פרשבורג", "d": "1871 (י\"ט בטבת תרל\"ב), פרשבורג", "place": "פרשבורג", "note": "👥 אחיהם של גיטל ושל ר' שמעון סופר, רב קרקוב. שלושתם ילדי החתם סופר ושרל, ומכל אחד מהם יוצא קו נפרד לאסתי (קווים א', ב' ו-ג').\n\nבנו הבכור של החתם סופר ושל שרל, בת רבי עקיבא איגר. בגיל שש חלה אנושות; אביו הוסיף לו את השם אברהם לסגולה, ולפי המסורת אמר שהשיג לו חמישים שנה. החתם סופר הציע אותו כחתן לר' יצחק וייס מגורליצה, אחרי שזה דחה מועמד אחר בגלל יחוסו; ב-1833 נשא את חוה לאה. אחרי פטירת אביו (1839) מונה, למרות גילו הצעיר, לרב פרשבורג ולראש הישיבה, ושימש בתפקידים אלה 33 שנה. הישיבה פרחה בימיו ומספר תלמידיה הוכפל; בין תלמידיו ר' יוסף חיים זוננפלד, לימים רבה של ירושלים. בשנות ה-60 נחשב מתון ופתוח: היה קרוב לעמדת ר' עזריאל הילדסהיימר, תמך בהוספת לימודי חול לישיבה, ושכר דרשן בגרמנית לבית הכנסת שלו, מה שהרגיז את הקנאים בהנהגת ר' הלל ליכטנשטיין. ב-1856 היה מהרבנים הראשונים באירופה שהתירו מצות שנאפו במכונה. ספריו נקראים \"כתב סופר\": שו\"ת על ארבעת חלקי השולחן ערוך, חידושים על גיטין וחולין ועל סוגיות הש\"ס, ועל התורה, ההגדה ופרקי אבות, ודרשות. מהם כינויו. חלה בשנת תרל\"ב ונפטר בי\"ט בטבת; לפי ר' עזריאל הילדסהיימר, אלפים נהרו לפרשבורג ללוויה. קבור בפרשבורג. רבני ערלוי הם צאצאיו הישירים, ורשת ישיבות \"כתב סופר\" בארץ ישראל קרויה על שמו.", "flag": "", "src": "Renato Podbersič, \"Rabin Abraham (Sofer) Schreiber – med Sočo in Kvarnerjem\", Edinost in dialog 80 (2025) 2: 55–73 · ויקיפדיה העברית (\"אברהם שמואל בנימין סופר\") · Boro Park 24 (\"Living Legacy: The K’sav Sofer\") · Vadász Ede, Magyar-Zsidó Szemle 24 (1907), עמ' 340–341 · נבדק 25.11.2026", "x": [["📜 לפי Vadász, אחיין אשתו (1907)", "Vadász התארח בביתו כמעט כל יום ב-1864–1865. הוא מספר:\n• ב-1852 עמד הכתב סופר בראש משלחת לקיסר הצעיר, שהודתה לו על ביטול האיסור לשלוח כספי צדקה לארץ ישראל.\n• ב-1871, בשנתו האחרונה, חיפש מרפא במריאנבד יחד עם אחיו ר' שמעון.\n• כשהרגיש שסופו קרב, ביקש שיאמרו עליו את מזמורי תהלים נ\"ז–נ\"ט וע\"ה, כמו שציווה גם אביו. כל ארבעת המזמורים פותחים במילים \"אל תשחת\".\n• ישב על כס אביו 33 שנים, ונפטר בשבת, 30 בדצמבר 1871."]]}, "g": [{"f": "g134", "c": "ר' אברהם שמואל בנימין סופר, ה\"כתב סופר\""}, {"f": "g135", "c": "ר' אברהם שמואל בנימין סופר, ה\"כתב סופר\", מתוך \"אגרות סופרים\""}, {"f": "g154", "c": "ר' אברהם שמואל בנימין סופר (שרייבר), ה\"כתב סופר\""}, {"f": "g155", "c": "מצבת ר' אברהם שמואל בנימין סופר, ה\"כתב סופר\" · פרשבורג (ברטיסלבה)"}]}, {"n": "גיטל סופר שפיצר", "y": "1817–1873", "s": [{"k": "wien", "r": "d", "t": ["1873, וינה"], "u": 0}], "c": {"n": "גיטל סופר שפיצר, בת החתם סופר", "rel": "בת החתם סופר · אחותם של הכתב סופר ור' שמעון · סבתו של ר' אברהם מצד אמו", "b": "1817", "d": "1873, וינה · נקברה בפרשבורג (ברטיסלבה)", "place": "פרשבורג ← וינה ← קבורה בפרשבורג (ברטיסלבה)", "note": "👥 אחותם של הכתב סופר (רבי אברהם שמואל בנימין) ושל ר' שמעון סופר, רב קרקוב. שלושתם ילדי החתם סופר ושרל, ומכל אחד מהם יוצא קו נפרד לאסתי (קווים א', ב' ו-ג').\n\nבנישואיה השניים נישאה לר' שלמה זלמן שפיצר, רב השיף-שול בווינה.", "flag": "", "src": "ויקיפדיה העברית (\"משפחת סופר\") · Deutsche Biographie · מקום הפטירה (וינה): Loebtree, עץ משפחת קורניצר · מקום הקבורה: מסירת המשפחה, 8.11.2026 · ספר הקבורה של בית הקברות היהודי בפרשבורג, jewishcemetery.sk, נבדק 24.11.2026", "x": [["🪦 ספר הקבורה בפרשבורג", "בספר הקבורה של בית הקברות היהודי בפרשבורג (ברטיסלבה), באתר jewishcemetery.sk, יש שלוש רשומות בשם \"Spitzer, Gitl\": בעמודים 60–61, 108–109 ו-200–201 של הספר. בעמודים 60–61 רשומה גם \"Schreiber, Chave Lea\", חוה לאה סופר.\nעוד לא ידוע איזו מהרשומות היא של גיטל בת החתם סופר: תמונות העמודים של הספר לא נפתחו באתר (העומס באתר גדול מדי)."]]}, "g": [{"f": "g127", "c": "מצבת גיטל שפיצר, בת החתם סופר · בית הקברות היהודי בפרשבורג (ברטיסלבה)"}]}, {"n": "ר' שלמה זלמן שפיצר", "y": "1826–1893", "s": [{"k": "obuda", "r": "bl", "t": ["ט\"ז בחשוון תקפ\"א (1820) או תקפ\"ו (1825), אובן ישן", "אובן ישן (Óbuda, היום בודפשט)"], "u": 1}, {"k": "budapest", "r": "l", "t": ["אובן ישן (Óbuda, היום בודפשט)"], "u": 0}, {"k": "wien", "r": "l", "t": [], "u": 0}], "c": {"n": "רבי בנימין שלמה זלמן סג\"ל שפיצר", "rel": "בעלה של גיטל · חתנו של החתם סופר", "b": "ט\"ז בחשוון תקפ\"א (1820) או תקפ\"ו (1825), אובן ישן", "d": "1893 (אור לכ\"ו בכסלו תרנ\"ד, ליל שני של חנוכה), נקבר בפרשבורג", "place": "אובן ישן (Óbuda, היום בודפשט) ← וינה", "note": "נולד בשנת תקפ\"ו (1825/1826) באובן ישן, היום חלק מבודפשט, ונפטר בווינה ב-1893, בגיל 67 בערך. אביו, ר' יעקב דוד הלוי שפיץ, כיהן שם כדיין (ולפי מקור אחד כראב\"ד), ור' שלמה זלמן למד אצלו; אחר כך למד אצל הכתב סופר, שהשיא לו את אחותו גיטל, אלמנתו של ר' אליהו קורניצר. גיטל נולדה ב-1815 או ב-1817, כלומר הייתה מבוגרת ממנו בכעשר שנים. ב-1852 נבחר לרב הראשון של בית הכנסת \"שיף-שול\" בווינה, מרכז היהדות האורתודוקסית בעיר. נקבר בפרשבורג, ליד חותנו, החתם סופר. על מכתב בכתב ידו הוא חתום \"בנימין שלמה זלמן סג\"ל שפיצר\"; מהכינוי סג\"ל עולה שהיה לוי.\n\n👧 בנותיו\nמגיטל נולדו לו שלוש בנות: שרח, מלכה אסתר ויטל. אחרי שגיטל נפטרה ב-1873 נשא את אסתר להמן, בתה של שמחה להמן, אחותה של גיטל. גיטל ושמחה היו שתיהן בנות של החתם סופר ושל אשתו שרל. מאסתר נולדה לו בת אחת, גיטל. הפרטים בכרטיס \"ילדי גיטל ור' שלמה זלמן שפיצר\".\n\n🕍 השיף-שול בווינה\nבית הכנסת \"קהל עדת ישראל\" (Adass Jisroel), ברחוב Große Schiffgasse 8 ברובע ליאופולדשטט. הקהילה האורתודוקסית נוסדה בערך ב-1852, ור' שלמה זלמן היה רבה הראשון; דרכו הייתה קשורה לקהילת פרשבורג. הבניין נבנה בשנים ⁦1858–1864⁩ ונחנך ב-16.9.1864: 750 מקומות (500 לגברים ו-250 לנשים), תחת כיפה בהשפעה ביזנטית. הקמתו הייתה גם הצהרה נגד הנטיות הליברליות של הקהילה הרשמית בווינה. מ-1897 פעלה לצדו האגודה \"עדת ישראל\", והשיף-שול היה בית התפילה היחיד בווינה שלא היה תלוי כלכלית בקהילה הכללית.\n\nאחריו כיהנו ר' ישעיהו פירסט, תלמיד הכתב סופר (⁦1894–1943⁩), ור' שלמה באומגרטן, הרב האחרון, שברח מהנאצים עם העתק של \"פנקס הזכרת נשמות\" של בית הכנסת (⁦1819–1938⁩).\n\nב-10 בנובמבר 1938, בליל הבדולח, הרסו הנאצים את בית הכנסת; נשארו רק אגפי הצד, והדרומי נהרס ב-1951. היום פועל במקום בית המדרש \"קהל חסידים\", ועל הקיר שלט לזכר ההרס. הקהילה עברה לניו יורק, ונקראת היום \"קהילת וויען\", עם בתי כנסת בבורו פארק ובמונסי.", "flag": "שנת הלידה: תקפ\"א (1820) או תקפ\"ו (1825) לפי \"תולדות ושורשים\", 1826 לפי Deutsche Biographie. מועד הרס השיף-שול: מרץ 1938 לפי ויקיפדיה העברית, נובמבר 1938 לפי השלט במקום ושאר המקורות.", "src": "ויקיפדיה העברית (\"בית הכנסת עדת ישראל\", \"משפחת סופר\") · Deutsche Biographie · \"תולדות ושורשים\" (\"רבי שלמה זלמן שפיצר דיין דק\"ק שיפשוהל בוינה\") · גנזים (מכתב בכתב ידו) · השיף-שול: ויקיפדיה העברית והאנגלית (Schiffschul), David (\"Jüdische Andachtstätten in Wien vor dem Jahre 1938\"), Appel Auctions · בנותיו: המכלול (\"רבי שלמה זלמן שפיצר\", \"החתם סופר\") ומסירת המשפחה, 9.11.2026 · Die Neuzeit, Wien, 8.12.1893, עמ' 2–3 (ANNO, הספרייה הלאומית של אוסטריה), נבדק 24.11.2026 · ספר הקבורה של בית הקברות היהודי בפרשבורג, jewishcemetery.sk, נבדק 24.11.2026", "x": [["📰 ההספד ב-Die Neuzeit", "בעיתון היהודי Die Neuzeit (וינה), 8.12.1893, עמ' 2–3, תחת הכותרת \"Rabbiner Salomon Spitzer, gest. am 4. December 1893\":\n\"בגיל 69 נפטר הרב שלמה שפיצר אחרי מחלה קצרה. הוא היה ראש האורתודוקסיה המחמירה בווינה, רב למדן מאוד, נואם מוכשר ושנון, בעל אופי חזק ונאמן לעקרונותיו. שום קורבן כספי לא היה גדול מדי בעיניו כשהיה צריך לעמוד על עקרונותיו האורתודוקסיים. את העמידה הזאת הוכיח כשעזב את משרתו כאסֶסור ברבנות של קהילת וינה.\"\nכותב ההספד מספר שהם נפגשו בידידות במשך שנים, אף שהשקפותיהם היו שונות. ההספד נמשך בעמ' 489 ומסתיים במילים: \"שרידיו של המנוח ייקברו בפרשבורג. ינוח הרב הירא והלמדן בשלום!\". הוא חתום באות \"J.\"."], ["🪦 ספר הקבורה בפרשבורג", "בספר הקבורה של בית הקברות היהודי בפרשבורג (ברטיסלבה), באתר jewishcemetery.sk, יש שתי רשומות שיכולות להיות שלו:\n• \"Spitzer, Salmen\", בעמודים 166–167 של הספר.\n• \"Spitzer, Binjomin Schleume\", כלומר בנימין שלמה, בעמודים 186–187 של הספר.\nתמונות העמודים עוד לא נפתחו באתר (העומס באתר גדול מדי), ולכן עוד לא ידוע מה כתוב בהן."]]}, "g": [{"f": "g482", "c": "Die Neuzeit (וינה), 8.12.1893, עמ' 483: תחילת ההספד \"Rabbiner Salomon Spitzer, gest. am 4. December 1893\" (בתחתית הטור הימני). \"בגיל 69 נפטר הרב שלמה שפיצר אחרי מחלה קצרה\""}, {"f": "g483", "c": "Die Neuzeit (וינה), 8.12.1893, עמ' 489: סוף ההספד על הרב שלמה שפיצר (הטור השמאלי, למעלה). בסופו: \"שרידיו של המנוח ייקברו בפרשבורג\", וחתימה \"J.\""}, {"f": "g126", "c": "ר' שלמה זלמן שפיצר, רב השיף-שול ודיין בווינה"}]}, {"n": "ר' שמעון סופר מקרקוב 'המכתב סופר'", "y": "1820–1883", "s": [{"k": "pressburg", "r": "bl", "t": ["18.12.1820 (י\"ג בטבת תקפ\"א), פרשבורג"], "u": 0}, {"k": "mattersdorf", "r": "l", "t": ["מטרסדורף (⁦1848–1861⁩)"], "u": 0}, {"k": "krakow", "r": "ld", "t": ["קרקוב (⁦1861–1883⁩)", "26.3.1883 (י\"ז באדר ב' תרמ\"ג), קרקוב"], "u": 0}], "c": {"n": "רבי שמעון סופר, \"מכתב סופר\", רב קרקוב", "rel": "בן החתם סופר · אחיהם של הכתב סופר וגיטל · אבי-סבתה של שרה", "b": "18.12.1820 (י\"ג בטבת תקפ\"א), פרשבורג", "d": "26.3.1883 (י\"ז באדר ב' תרמ\"ג), קרקוב", "place": "פרשבורג ← מטרסדורף (⁦1848–1861⁩) ← קרקוב (⁦1861–1883⁩)", "note": "👥 אחיהם של הכתב סופר (רבי אברהם שמואל בנימין) ושל גיטל. שלושתם ילדי החתם סופר ושרל, ומכל אחד מהם יוצא קו נפרד לאסתי (קווים א', ב' ו-ג').\n\n👑 הקשר עם הקיסר פרנץ יוזף\n1866 — במלחמה: לפי עדות בנו, טיפל בחיילים פצועים, והקיסר העניק לו על כך אות כבוד.\n\n1872 (תרל\"ב) — ראיון אצל הקיסר: נסע לווינה להשתדל בעד רבי חיים מצאנז, ה\"דברי חיים\", שהסתבך בעקבות הלשנה. הקיסר התרשם ממנו והעניק לו עיטור. לפי ערך אחר, ביקש מהקיסר לשחרר את הדיינים שנאסרו בפרשה; הקיסר הורה להמיר את העונש למעצר בית, אבל בפועל הוא רוצה בבית הסוהר.\n\n1880 (כ\"ה באלול תר\"מ) — ביקור הקיסר בקרקוב: הקיסר ביקר בעיר שלושה ימים. ר' שמעון עמד בראש הקהילה האורתודוקסית שקיבלה את פניו בתחנת הרכבת, בירך עליו ברכת הרואה מלך, ונפגש איתו גם ביחידות. לפי הסיפור, בלילה הורידו אנטישמים בסתר את תמונות הקיסר מבית הכנסת וממקומות יהודיים אחרים, כדי שייראה שהיהודים אינם מכבדים אותו. כשהקיסר שאל היכן תמונתו, ענה ר' שמעון שהתמונות היו תלויות והורדו ממש לפני הביקור, והשווה זאת לשבת, שבה לא מניחים תפילין: כשהמלך עצמו כאן, אין צורך בסימן. ר' שמעון תיעד את הביקור במכתב לבניו.\n\nסיפור הסיגר: באתר JewishHistory.org מובא סיפור, כאגדה על אביו, החתם סופר: הקיסר ביקר בקהילת פרשבורג בשבת ונתן לרב סיגר, והרב שם אותו בכיס. כשהקיסר שאל אם לא יעשן את הסיגר של הקיסר, ענה: \"האם הכבוד שנתן לי הקיסר צריך לעלות בעשן?\" פרנץ יוזף עלה לשלטון רק ב-1848, תשע שנים אחרי פטירת החתם סופר (1839).", "flag": "סיפור הסיגר מובא ב-JewishHistory.org כאגדה על החתם סופר, אף שפרנץ יוזף עלה לשלטון רק אחרי פטירתו. הסיפור על ביקור 1880 מסופר במקורות כ\"מסורת\", לא כעדות מתועדת. שנת הבחירה לרייכסראט: 1878 לפי Podbersič ו-Encyclopaedia Judaica, 1879 לפי ויקיפדיה העברית. Yated נותן את שנת הלידה 1821 (תקפ\"א). תחילת כהונתו במטרסדורף: 1848 בשדה המקום, 1844 לפי ויקיפדיה ו-Yated.", "src": "Renato Podbersič, \"Rabin Abraham (Sofer) Schreiber – med Sočo in Kvarnerjem\", Edinost in dialog 80 (2025) 2: 55–73 · Encyclopaedia Judaica · ויקיפדיה העברית (\"שמעון סופר (1820)\") · Yated (\"The Torah Treasure of Rav Shimon Sofer\") · המכלול (\"רבי שמעון סופר (מכתב סופר)\") · ויקיפדיה (\"אהרן הלברשטאם\") · Kosher.com (\"Exuding Joy in the King’s Presence\") · Hevrat Pinto · JewishHistory.org (\"Rabbi Moses Sofer\") · הפרלמנט האוסטרי, דף האישיות של Simon Schreiber (parlament.gv.at, person 60079) · Österreichisches Biographisches Lexikon · הדיוקן מ-1884 וציור הכניסה של יוליוש קוסאק: ויקישיתוף, נחלת הכלל · ההספד: Salomon Spitzer, Hesped nach Sr. Ehrwürden dem sel. Herrn Simon Schreiber, Oberrabiner in Krakau, וינה 1883, סרוק בארכיון האינטרנט · ביקור הקיסר 1880 לפי fortyck.pl · הדרשה הראשונה בקרקוב: אתר כיפה, \"דרשת רבי שמעון סופר בקרקא\", מדור תורה לילדים, 25.12.2002; נבדק 19.11.2026", "x": [["👩‍🦱 אשתו", "מרים, בת הגביר דב בר שטרנברג מקרולה. נישאו ב-1838, כשהיה בן 17. מופיעה בכרטיס נפרד"], ["📖 קורות חייו", "בנו של החתם סופר ושל שרל, בת רבי עקיבא איגר. למד אצל אביו בישיבת פרשבורג. אחרי פטירת אביו הדפיס את תשובותיו, וערך את חלק יורה דעה בשו\"ת חתם סופר. ב-1844 התמנה לרב מטרסדורף, כיהן שם 18 שנה ועמד בראש ישיבה. ב-1861 התמנה לרב קרקוב, וכיהן 22 שנה עד מותו; התנגד למשכילים שניסו להשפיע על הקהילה. ייסד את אגודת \"מחזיקי הדת\" בגליציה ואת כתב העת שלה, והוביל אותה יחד עם רבי יהושע מבעלז. נבחר לרייכסראט, הפרלמנט האוסטרי בווינה, מטעם מחוז קולומיה–סניאטין–בוצ'אץ'. הצטרף ל\"מועדון הפולני\", אבל מאחר שלא שלט בשפה לא השתתף בדיוניו. כמו רוב האורתודוקסים בגליציה תמך בברית עם הלאומיות הפולנית. יחד עם ר' אהרן מרקוס ייסד את \"ראש פינה\", אגודה לחיזוק התנועה הלאומית בעיר ולתמיכה בהתיישבות בארץ ישראל, שנחשבת לארגון הציוני הראשון בקרקוב. הקיסר פרנץ יוזף הראשון העניק לו עיטור כאות הוקרה. ספריו: \"מכתב סופר\", דרשות ושו\"ת. נפטר בקרקוב ביום שני, י\"ז באדר ב' תרמ\"ג, ונקבר למחרת בבית הקברות היהודי החדש. חתנו ואחיינו, ר' עקיבא קורניצר, מילא את מקומו כרב קרקוב.\n\nהדרשה הראשונה בקרקוב. כשהגיע לעיר נדהם לגלות בה יותר ממאה מניינים — מבתי כנסת גדולים ובתי מדרש ועד חדרי תפילה קטנים של בעלי מלאכה: צבעים, טייחים, חייטים וסנדלרים. ראשי הקהילה סיפרו לו שהעיר שסועה, ושאיש אינו סומך על רעהו.\nבדרשתו הראשונה הביא את דברי הגמרא בסנהדרין, שכל ברכותיו של בלעם חזרו להיות קללות — חוץ מברכת \"מה טובו אוהליך יעקב\", שנאמרה על ריבוי בתי הכנסת ובתי המדרש. הוא אמר שתמיד תהה למה דווקא הברכה הזאת התקיימה, ובקרקוב הבין: ריבוי מקומות התפילה בא מתוך פילוג ומחלוקת. בלעם ראה את זה, ובליבו רצה שכך יישאר; ומכיוון שבברכה הזאת פיו וליבו היו שווים, היא לא התבטלה.\nכמעט עשרים וחמש שנה עבד על הסרת המחיצות בין יהודי קרקוב ובין העיירות שסביבה. אחרי מותו ב-1883 המשיכו זקני העיר לספר לבניהם ולנכדיהם על הדרשה ההיא.\nהסתייגות: הסיפור מובא באתר \"כיפה\", במדור תורה לילדים, בלי מקור מדויק. שם גם כתוב שהתמנה לרב קרקוב ב-1860, ובשאר המקורות ב-1861."], ["🏛️ הפרלמנט, הקיסר וההספד · מה שנמצא בארכיונים", "שלושה ממצאים שנוספו בנובמבר 2026, משלושה ארכיונים.\nהרשומה הרשמית בפרלמנט האוסטרי. בארכיון הפרלמנט בווינה שמור הדף שלו. כתוב בו: סימון שרייבר, חבר בית הנבחרים במושב התשיעי, סיעת המועדון הפולני, מ-7 באוקטובר 1879 עד 25 במרס 1883. מקצוע: רב מאז 1842. השכלה: תלמוד תורה. מקום הלידה רשום \"לא ניתן לקבוע, פרשבורג\", והפטירה 26 במרס 1883 בקרקוב. כלומר הוא מת בכהונתו, יום אחד אחרי שהסתיים המנדט שלו.\nהלקסיקון הביוגרפי האוסטרי מוסיף שנבחר במחוז בוצ'אץ'–קולומיאה, שכמעט לא נאם בבית, ושב-1881 נאלץ לפרוש מוועדת המסחר מטעמי בריאות.\nלצד זה נמצא דיוקן מודפס שפורסם ב-1884, ומתחתיו כתוב בגרמנית: \"ש. שרייבר — רב ראשי, ציר הרייכסראט, קרקוב\", ומתחת לזה השנה 1883. זהו דיוקן אחר מזה שכבר היה באילן, והוא מופיע עכשיו לצדו.\nביקור הקיסר בקרקוב, לפי המקורות הפולניים. התאריכים המדויקים: 1 עד 3 בספטמבר 1880. ביום הראשון הוצגו לפני הקיסר ראשי הקהילה היהודית, בראשות הנשיא סמלסון והרב שרייבר. ביום השלישי בא הקיסר לקז'ימייז', הרובע היהודי, והתקבל בהתלהבות. הקהילה מימנה אז חמש מאות ארוחות לעניי העיר, בלי הבדל דת.\nמאותו מעמד נשמר ציור של יוליוש קוסאק, \"כניסת הקיסר פרנץ יוזף לקרקוב\", צבעי מים משנת 1880. רואים בו את המרכבה הכחולה הפתוחה, סוסים לבנים, שער פלוריאן, דגלי הגילדות וקהל רב. הסתייגות: המשלחת היהודית אינה מזוהה בציור, ואין לומר שר' שמעון נמצא בו.\nההספד עליו, וינה 1883. שבועיים אחרי מותו נשא עליו הספד בווינה גיסו, ר' שלמה זלמן שפיצר, רב השיף-שול — אותו שלמה זלמן שפיצר שהוא סבו של הרב אברהם סופר-שרייבר מצד אמו. ההספד נדפס כחוברת בווינה באותה שנה, בהוצאת יעקב שלוסברג מרחוב דונאו העליון 107, במחיר עשרה קרויצר, והוא שמור וסרוק.\nכתוב בפתיחה: \"מותו של הרב הראשי שרייבר הטיל על היהדות השמרנית את האבל הגדול ביותר. בקהילות רבות נערכו תפילות אבל\". ועל האירוע עצמו: הרב שפיצר נשא את ההספד ביום חמישי, 5 באפריל 1883, בשיף-שול; בית הכנסת היה מלא בכאלפיים איש, שהקשיבו נרגשים; והנאום נמשך יותר משעה, ותיאר את יראתו של הנפטר, את ענוותנותו הגדולה ואת חוש הצדקה שלו.\nהערה: החוברת מודפסת בכתב גותי, והטקסט שקראתי הוא תמלול אוטומטי. המשפטים שציטטתי ברורים; פרטים קטנים יותר בתוך הדרשה עצמה לא נבדקו אחד-אחד."]]}, "g": [{"f": "g124", "c": "ר' שמעון סופר, בעל \"מכתב סופר\", רב קרקוב"}, {"f": "g379", "c": "ר' שמעון סופר · דיוקן מודפס, 1884"}, {"f": "g378", "c": "כניסת הקיסר פרנץ יוזף לקרקוב, ספטמבר 1880 · יוליוש קוסאק"}, {"f": "g380", "c": "שער ההספד עליו · וינה, 1883"}, {"f": "g125", "c": "מצבת ר' שמעון סופר, בעל \"מכתב סופר\" · בית הקברות היהודי החדש בקרקוב (Miodowa)"}]}, {"n": "מרים שטרנברג סופר", "y": "–1892", "s": [{"k": "carei", "r": "l", "t": ["קרולה (כנראה נאג'קארוי, היום קארֵיי ברומניה)"], "u": 1}, {"k": "mattersdorf", "r": "l", "t": [], "u": 0}, {"k": "krakow", "r": "ld", "t": ["ליל שבת, י\"ז באייר תרנ\"ב (13–14.5.1892), קרקוב"], "u": 0}], "c": {"n": "מרים סופר, לבית שטרנברג", "rel": "אשתו של ר' שמעון סופר, רב קרקוב · כלתו של החתם סופר", "b": "", "d": "ליל שבת, י\"ז באייר תרנ\"ב (13–14.5.1892), קרקוב", "place": "קרולה (כנראה נאג'קארוי, היום קארֵיי ברומניה) ← מטרסדורף ← קרקוב", "note": "בתו של הגביר דב בר שטרנברג מקרולה. נישאה לר' שמעון סופר בשנת תקצ\"ח (1838), כשהיה בן 17. נפטרה בקרקוב בליל שבת, י\"ז באייר תרנ\"ב, תשע שנים אחרי בעלה, ונקברה בבית הקברות היהודי בקרקוב. על המצבה היא נקראת \"הרבנית הצנועה והחסידה\".", "flag": "שנת הלידה לא ידועה. בצילום המצבה רוב הכיתוב לא קריא. המקור לא אומר במפורש שהיא אמו של ר' שלמה אלכסנדרי.", "src": "ויקיפדיה העברית (\"שמעון סופר (1820)\") · תאריך הפטירה: בלוג \"תולדות ושורשים\" (toladot.blogspot.com) · צילום המצבה שמסרה המשפחה, 4.11.2026", "x": [["🪦 המצבה בקרקוב", "מצבה שחורה וחדשה, כנראה מצבה שחודשה, בבית הקברות היהודי בקרקוב, בין מצבות עתיקות.\nמה שקריא בצילום:\n• בראש: \"פ\"נ\"\n• בכותרת: \"הרבנית הצנועה והחסידה מרת מרים ע\"ה\".\n• \"אשת הרה\"ג ... ר' שמעון סופר זצ\"ל ...\".\n• \"יצאה נשמתה ליל ש\"ק ...\".\n• אחר כך שיר הספד, ובסוף \"ת.נ.צ.ב.ה.\".\n🟠 הצילום ברזולוציה נמוכה, ואת רוב השורות אי אפשר לקרוא. צילום חד יותר יאפשר להעתיק את כל הכיתוב."]]}, "g": [{"f": "g089", "c": "מצבת הרבנית מרים, אשת ר' שמעון סופר - קרקוב"}]}, {"n": "ר' חיים זאב וולף הלוי (ווענטל?)", "y": "", "s": [{"k": "papa", "r": "l", "t": ["פאפא (Pápa), הונגריה"], "u": 0}], "c": {"n": "ר' חיים זאב וולף הלוי (ווענטל?), פאפא", "rel": "אביה של לאה · סבה של אסתר · אבי-סבה של שרה", "b": "", "d": "לפני 1900", "place": "פאפא (Pápa), הונגריה", "note": "אביה של לאה, אשתו של ר' עקיבא סופר מפאפא. שמו ידוע מהשיר שכתב ר' עקיבא על מצבת לאה בתשרי תרס\"א (1900): \"קברתי את לאה בת חיים זאב הלוי ווענטל ז\"ל\". לפי \"ז\"ל\" הוא כבר לא היה בחיים ב-1900. היה לוי. נדבן בפאפא. בתו לאה נישאה לר' עקיבא סופר ב-1860, והזוג גר בפאפא כל חייו.", "flag": "הקריאה של שם המשפחה \"ווענטל\" בצילום לא ודאית, והכתבה לא מזכירה אותו. שנות חייו ואשתו לא ידועים. השם המלא, המקום והעיסוק מגיעים ממקור אחד, כתבה בעיתונות קהילתית.", "src": "השיר \"על מצבת אשתי היקרה\" של ר' עקיבא סופר מפאפא (צילום שמסרה המשפחה, 4.11.2026) · השם המלא, פאפא, נדבן ושנת הנישואין: Rockland Daily / Boro Park 24, \"Living Legacy: Rav Akiva Sofer of Pápa\"", "x": []}, "g": []}, {"n": "ר' משה וקס", "y": "–1890", "s": [{"k": "siret", "r": "ld", "t": ["סירט (Siret), בוקובינה", "1890, סירט"], "u": 0}], "c": {"n": "ר' משה וקס, הגביר מסירט", "rel": "אביה של הינדה · חותנו של ר' שלמה אלכסנדרי", "b": "", "d": "1890, סירט", "place": "סירט (Siret), בוקובינה", "note": "בנו של ר' שרגא פייבל וקס. גביר מסירט. אשתו שרה. בתם הינדה נישאה לר' שלמה אלכסנדרי סופר-שרייבר, נכדו של החתם סופר.", "flag": "שנת הלידה לא ידועה. מקום הקבר לא ידוע בוודאות.", "src": "המכלול (הערך רבי שלמה אלכסנדרי שרייבר) · מסירת המשפחה, 3.11.2026 (שנת הפטירה, האישה והאב) · חיה שרה וקס וקבר 26: Jewish Galicia & Bukovina, מצבות 226854 ו-226848", "x": [["👩‍🦱 חיה שרה וקס, כנראה אחותו", "בחלקה A בבית הקברות היהודי החדש בסירט, בקבר 29, קבורה מרת חיה שרה, \"בת הרבני החסיד מגזע אפרתים מוהר\"ר שרגא פייוויל וואקס\". היא נפטרה בח' בכסלו תרנ\"ז (13.11.1896), \"בשנת שמונים ושש לימי חייה\", כלומר נולדה בערך ב-1810.\n\nגם ר' משה הוא בנו של ר' שרגא פייבל וקס. לכן, בהשערה ברורה, חיה שרה היא אחותו. הקבר שלה נמצא ממש ליד הקבר של שרה, אשת ר' משה (קבר 30)."], ["🪦 האם זה הקבר שלו? קבר 26 בחלקה A", "לוח הכתובת של קבר 26 בחלקה A חסר, ולכן אי אפשר לדעת של מי הוא. הקבר נמצא ליד הקברים של שרה, אשת ר' משה (קבר 30), ושל חיה שרה וקס (קבר 29).\n\nקבר 26 דומה מאוד למצבה של מחלה גליקל, נכדתו של ר' משה, שנפטרה ב-1895 (חלקה BB, קבר 12). בשתיהן יש בראש המצבה זר ורדים עגול, עם סרט קשור מתחתיו. בשתיהן יש פס עיטורים לרוחב, מתחת לזר. בשתיהן יש שדה כתובת מלבני ושקוע, וגם צורת החלק העליון זהה. נראה שהן יצאו מאותה סדנת אבנים, או לפחות מאותה תקופה ובאותו סגנון. גם במצבה של אחותה גיטל זלאטא (חלקה BB, קבר 13) יש זר עם סרט, אבל צורת המצבה שלה שונה.\n\nההבדל: אצל מחלה גליקל הכתובת חקוקה ישר באבן. בקבר 26 השדה חלק לגמרי. אולי היה שם לוח כתובת נפרד שנעלם, ואולי הכתובת נשחקה.\n\nהמשמעות: בהשערה ברורה, הדמיון מחזק את הסברה שקבר 26 שייך למשפחה, ואולי לר' משה עצמו. הוא קבור ליד אשתו ואחותו, נפטר ב-1890, וסגנון המצבה מתאים לתקופה שבה נקברו נכדותיו. אבל זר עם סרט היה עיטור נפוץ באותן שנים, ולכן זו עדיין לא הוכחה. מה שיכריע זה צילומים מהשיפוץ של \"אהלי צדיקים\" ב-2010, או מישהו שיבדוק במקום."]]}, "g": [{"f": "g129", "c": "אולי מצבת ר' משה וקס (לא מאומת) · בית הקברות היהודי החדש בסירט, חלקה A, קבר 26"}]}, {"n": "שרה וקס", "y": "~1823–1899", "s": [{"k": "siret", "r": "ld", "t": ["סירט (Siret), בוקובינה", "י\"ט בניסן תרנ\"ט (30.3.1899), חג הפסח, סירט"], "u": 0}], "c": {"n": "הגבירה מרת שרה וקס", "rel": "אשתו של ר' משה וקס · אמה של הינדה", "b": "בערך 1823", "d": "י\"ט בניסן תרנ\"ט (30.3.1899), חג הפסח, סירט", "place": "סירט (Siret), בוקובינה", "note": "אשתו של ר' משה וקס, הגביר מסירט, ואמה של הינדה. נפטרה ביום החמישי של פסח תרנ\"ט, בגיל 76. קבורה בבית הקברות היהודי החדש בסירט, חלקה A, קבר 30.", "flag": "שם משפחתה לא ידוע. שנת הלידה מחושבת מהגיל שכתוב על המצבה.", "src": "מסירת המשפחה, 3.11.2026 · המצבה: Jewish Galicia & Bukovina, מצבה 226856 (תיעוד 2022: Shlomi Golan, Meytal Katten Sosnovik)", "x": [["🪦 המצבה", "על המצבה היא נקראת \"הגבירה מרת שרה, אשת האלוף המרומם מוהר\"ר משה וואקס ז\"ל\".\n\nכתוב שם שמכספה תרמה מנורה לבית הכנסת, ובראש המצבה חקוקה מנורה.\n\nעוד כתוב שהשיאה את שלוש בנותיה \"רק לחכמי תורה\". אחת מהן היא הינדה, אשת ר' שלמה אלכסנדרי סופר-שרייבר.\n\nהיא נפטרה \"ביום ה' חמישי לימי חג הפסח\" תרנ\"ט, \"בשנת שבעים ושש לימי חייה\"."]]}, "g": [{"f": "g128", "c": "מצבת שרה וקס, אשת ר' משה וקס · בית הקברות היהודי החדש בסירט, חלקה A, קבר 30"}]}, {"n": "ר' שלמה אלכסנדרי סופר-שרייבר", "y": "1856–1924", "s": [{"k": "siret", "r": "ld", "t": ["סירט (Siret), בוקובינה", "1924, סירט"], "u": 0}], "c": {"n": "", "rel": "בנו של ר' שמעון רב קרקוב · סבה של שרה", "b": "1856", "d": "1924, סירט", "place": "סירט (Siret), בוקובינה", "note": "תלמיד חכם ידוע. עמד שנים רבות בראש הקהילה היהודית בסירט, וב-1914 היה מורה הדת בעיר (Hugo Gold).\nבתו מחלה גליקל: נפטרה בגיל 11, בד' בטבת תרנ\"ו (19.12.1895), ונקברה בבית הקברות היהודי בסירט (חלקה BB, קבר 12). על המצבה כתוב: \"הילדה הנעימה טובת לב... מחלה גליקל בת הרב ר' שלמה אלכסנדר סופר... בת יא שנים ביום ד טבת\". במשפחה נמסר גם השם \"נחלה\".", "flag": "מחלה גליקל: בהעתקת הכיתוב באתר JGB כתוב \"תרמו\", אבל התאריך הלועזי שהאתר נתן (19.12.1895) מתאים לתרנ\"ו. ברשומה אחרת ב-JGB נרשם 7.10.1891. המכלול מונה רק בת אחת, ריזל.", "src": "המכלול · Hugo Gold, Geschichte der Juden in der Bukowina, כרך ב', עמ' 105 (סירט) · מחלה גליקל: המצבה בסירט, Jewish Galicia & Bukovina (Tombstone of Nachla Glikel Sofer, מס' 231954), מסירת המשפחה 3.11.2026", "x": [["📰 הספד ב-Jüdische Presse, וינה, 23.5.1924", "בעיתון Jüdische Presse בווינה (גיליון 21, 23.5.1924, עמוד 140) נדפסה רשימה בשם \"Rabbi Alexander Salamon Schreiber\". היא נשלחה מסירט וחתומה באות S. זה תרגום שלה:\n\n\"ר' אלכסנדר שלמה שרייבר נולד ב-26 בתשרי תרי\"ז במטרסדורף. הוא נפטר ב-25 בניסן תרפ\"ד בסירט שבבוקובינה, אחרי מחלה ארוכה וקשה. מתאבלים עליו אשתו הנאמנה הילדה שרייבר, בניו ר' עקיבא שרייבר מווינה, ברנהרד ושמעון שרייבר, ובתו היחידה רוזה, אשת ר' יוסף שטרן. כל בני המשפחה הם בעלי תורה ויראה.\n\nבזכות שכלו ומסירותו נהנה מאמון מלא, והייתה לו השפעה גדולה גם בקרב הלא-יהודים. הוא היה נשיא כבוד, נשיא הקהילה, סגן ראש העיר, חבר לשכת המסחר של בוקובינה ואפוטרופוס של קרנות גדולות רבות. כראש הקהילה חידש והרחיב את מוסדותיה.\n\nבכל יום שישי אחר הצהריים עבר בעיר מחנות לחנות, כדי לוודא שהחנויות נסגרות בזמן לפני כניסת השבת. בזכותו אף חנות בסירט לא נפתחת בשבת.\n\nהוא עסק ביסודיות בכתבי היד של סבו, החתם סופר, שהיו ברשותו. החתם סופר היה האידיאל של חייו. על חשבונו הדפיס את חידושי החתם סופר על חולין, עם הקדמה משלו. הוא הדפיס גם את הגהות החתם סופר על שלושים ושבע סוגיות, ואת אוסף השירים \"שירת משה\". עבודתו האחרונה הייתה הוצאת הדרשות של החתם סופר. עוד לפני המלחמה הכין לדפוס את כל כתבי אביו, ר' שמעון סופר (שרייבר) מקרקוב.\n\nבגלל המלחמה נאלץ לברוח מעירו. את שנות הפליטות עשה בסלובקיה ובווינה. שם השתתף כחבר נלהב של אגודת ישראל בכל עבודתה, ובעיקר בעזרה לפליטים.\""], ["📰 הספד ב-Der Israelit, 15.5.1924", "בעיתון Der Israelit (גיליון 20, 15.5.1924, עמודים 9–10), במדור \"Personalien\", נדפסה ידיעה מסירט מ-1 במאי, ואיתה דיוקן מודפס שלו. זה תרגום שלה:\n\n\"ביום שלישי, 25 בניסן, נפטר אחרי מחלה ארוכה ר' אלכסנדר שלמה שרייבר, עמוד התווך של האורתודוקסיה בבוקובינה (רומניה החדשה). הוא נולד ב-1857 במטרסדורף. אביו, ר' שמעון סופר (שרייבר), היה אחר כך הרב הראשי המפורסם של קרקוב וחבר בבית הנבחרים האוסטרי. את ילדותו עשה בקרקוב, בלימוד תורה. בגיל תשע-עשרה נשא את בתו של משה וַאקס, הנדבן הידוע בבוקובינה. כך נעשה קרוב משפחה של שני גיסיו המבוגרים ממנו: הרב הראשי לייביש הורוביץ מסטניסלב, והרב שלמה לאדיר (כך בדפוס) מלובלין.\n\nכשאביו נבחר לבית הנבחרים, קרא לו לבוא לווינה. שם היה הבן היועץ והעוזר הטוב ביותר של אביו בעבודתו הפוליטית, שעיקרה היה לשמור על הזכויות הדתיות של הקהילות ועל זכויות האורתודוקסיה. הוא כתב גם בעיתון העברי \"מחזיקי הדת\" בלמברג ובעיתון יהודי-גרמני בווינה. יותר מפעם אחת ניהל משא ומתן בעניינים אלה עם ראש הממשלה הרוזן טאפה, יחד עם אביו או במקומו.\n\nללמד אחרים, לקרב אותם ליהדות ולהפיץ את רוח התורה בהמון העם, אלה היו חייו ושאיפותיו. הייתה לו הופעה מרשימה מאוד, והוא כבש את כולם בשנינותו ובטוב לבו. בשנים האחרונות הצטרף בכל לבו לאגודה.\n\nבזכות השפעתו החיים הדתיים בקהילה תוססים ואף חנות יהודית לא פתוחה בשבת, אף שכבר 18 שנה אין לקהילה רב בשכר. בזכות מעמדו אצל השלטונות יש בקהילה עירוב כשר, והוא אף הורחב לחלקים נוספים של העיר. שוב ושוב הוצע לו מושב בפרלמנט ובבית הנבחרים של המחוז, והוא סירב. אבל מתפקידי הכבוד בקהילה לא הצליח להתחמק: הוא היה נשיא הקהילה ורב כבוד בלי שכר, והעיר מינתה אותו לסגן ראש העיר ולחבר בלשכת המסחר. יותר מפעם אחת השתמש במעמדו בווינה ובצ'רנוביץ לטובת אחיו היהודים.\n\nהוא נחשב לבקי הגדול ביותר בכתבי סבו, החתם סופר, וערך רבים מהם עם הערות או הקדמה. הוא הוציא את 'שירת משה', אוסף שירים לשבת ולחגים מאת החתם סופר, ובסופו נספח של שירים מאת אביו, הרב הראשי שמעון סופר. הוא גם ערך והכין לדפוס את כל כתבי אביו, אבל המלחמה, שבה נאלץ לברוח, מנעה את הדפסתם. בימים אלה נדפס בווינה אוסף שהוא ערך של דרשות החתם סופר שעוד לא נדפסו.\n\nהבשורה עשתה רושם עצום בעיר. בזמן הלוויה נסגרו כל החנויות, ואלפים רבים ליוו אותו בדרכו האחרונה. הספדים לא נאמרו, בגלל חודש ניסן ולפי צוואתו. עם המשפחה מתאבלת עליו היהדות שומרת התורה: אשתו הנאמנה, שלושה בנים בעלי תורה ויראה, בת אחת וחתן, הרב יוסף שטרן.\"\n\nמערכת העיתון הוסיפה שאיבדה בו את אחד הידידים והתומכים הנלהבים ביותר שלה, שעד יומו האחרון המליץ עליה לאחרים."]]}, "g": [{"f": "g234", "c": "בית העלמין היהודי בסירט: שורת המצבות של משפחת סופר-שרייבר ליד החומה, אחרי השיקום ב-2009"}, {"f": "g235", "c": "שורת המצבות בסירט. משמאל מצבה כפולה, כנראה של ר' שלמה אלכסנדר סופר ושל הינדה (בהשערה ברורה); במרכז המצבה של מרים שטרן; מימין המצבה של לאה"}, {"f": "g236", "c": "ראש המצבה הכפולה בסירט. אפשר לקרוא \"...שלמה אלכסנדר סופר ז\"ל\"; שאר הכתובת לא קריא"}, {"f": "g117", "c": "ר' שלמה אלכסנדרי סופר (שרייבר)"}, {"f": "g118", "c": "החותמת של ר' שלמה אלכסנדרי סופר"}, {"f": "g120", "c": "מצבת ר' שלמה אלכסנדרי סופר · בית הקברות היהודי בסירט"}, {"f": "g397", "c": "הספד ב-Jüdische Presse, וינה, 23.5.1924, עמוד 140"}, {"f": "g398", "c": "הספד ב-Der Israelit, 15.5.1924, עמודים 9–10, עם דיוקן מודפס שלו"}]}, {"n": "הינדה סופר-שרייבר", "y": "–1929", "s": [{"k": "siret", "r": "ld", "t": ["סירט (Siret), בוקובינה", "י\"ד בכסלו תר\"ץ (1929), סירט"], "u": 0}], "c": {"n": "הינדה סופר-שרייבר, לבית וקס", "rel": "אשתו של ר' שלמה אלכסנדרי · אמו של ר' עקיבא · סבתה של שרה", "b": "", "d": "י\"ד בכסלו תר\"ץ (1929), סירט", "place": "סירט (Siret), בוקובינה", "note": "בתם של ר' משה וקס, גביר מסירט, ושל שרה. ר' שלמה אלכסנדרי נשא אותה לאישה כשהיה בן 18. אמם של ר' עקיבא ושל ר' דב בנימין. נקברה בסירט, ליד בעלה.", "flag": "שנת הלידה לא ידועה.", "src": "המכלול (הערך רבי שלמה אלכסנדרי שרייבר) · יד ושם: דף עד על ר' דב בנימין (1487405)", "x": []}, "g": [{"f": "g121", "c": "מצבת הינדא שרייבר סופר, בת משה וקס · בית הקברות היהודי בסירט"}, {"f": "g123", "c": "מצבת מרים שטרן, בת רייזל ור' יוסף נפתלי שטרן · בית הקברות היהודי בסירט"}, {"f": "g112", "c": "מצבת מחלה גליקל, בת ר' שלמה אלכסנדר סופר · סירט, חלקה BB, קבר 12 · נפטרה 19.12.1895"}, {"f": "g113", "c": "מצבת גיטל זלאטא, בת ר' שלמה סופר · סירט, חלקה BB, קבר 13 · נפטרה 21.1.1895"}, {"f": "g234", "c": "בית העלמין היהודי בסירט: שורת המצבות של משפחת סופר-שרייבר ליד החומה, אחרי השיקום ב-2009"}, {"f": "g235", "c": "שורת המצבות בסירט. משמאל מצבה כפולה, כנראה של ר' שלמה אלכסנדר סופר ושל הינדה (בהשערה ברורה); במרכז המצבה של מרים שטרן; מימין המצבה של לאה"}, {"f": "g236", "c": "ראש המצבה הכפולה בסירט. אפשר לקרוא \"...שלמה אלכסנדר סופר ז\"ל\"; שאר הכתובת לא קריא"}]}, {"n": "ר' עקיבא סופר מפאפא", "y": "1839–1902", "s": [{"k": "papa", "r": "ld", "t": ["פאפא (Pápa), הונגריה", "ב' בטבת תרס\"ג (סוף 1902 או תחילת 1903), פאפא"], "u": 1}], "c": {"n": "ר' עקיבא סופר (שרייבר) מפאפא", "rel": "אביה של אסתר · חותנו של ר' עקיבא · סבה של שרה", "b": "1839", "d": "ב' בטבת תרס\"ג (סוף 1902 או תחילת 1903), פאפא", "place": "פאפא (Pápa), הונגריה", "note": "בנם של ר' שמעון סופר, רב קרקוב, ומרים, ונכדו של החתם סופר. גר בפאפא שבהונגריה, ולפי מקור אחד כיהן שם כרב. היה נשוי ארבעים שנה ללאה, בת חיים זאב הלוי, שנפטרה בתרס\"א (1900), ונולדו להם שש בנות ושלושה בנים. נפטר בב' בטבת תרס\"ג ונקבר בפאפא. מחבר הספר \"צוף דב\"ש\" על התורה, הנ\"ך וחידושי הלכה, שנדפס בירושלים בתשכ\"ו (1966). אשתו לאה. בתם אסתר נישאה לבן אחיו, ר' עקיבא סופר-שרייבר, והם הוריה של שרה. בנם בנימין (בנו) אברהם שמואל שרייבר-סופר נולד בפאפא ב-1873, גר בווינה ונספה בקיילצה ב-1941; בשני דפי עד ביד ושם שם אביו עקיבא. שמו ההונגרי: Jakab (ב-Geni: Jakob).", "flag": "שנת הלידה 1839 לפי עץ ב-Geni בלבד. הרבנות בפאפא מפורום בלבד. בצילום המצבה לא כתוב שם בית הקברות.", "src": "רישום הפטירה של בנו Schreiber Bernát (פאפא, 21.6.1933; FamilySearch 6JYP-71KG) · המכלול (הערך רבי שמעון סופר, קרקוב) · Geni (Rabbi Akiva Schreiber, ⁦1839–1902⁩, פאפא; אשתו לאה) · יד ושם 13461710 ו-13777386 (בנו בנימין) · צילום המצבה שמסרה המשפחה, 4.11.2026 · מסירת המשפחה, 3.11.2026 (שם האישה והבת אסתר) · לוח יארצייטים בפורום יידיש (yidtish.com) · פורום תורה (tora-forum.co.il) · ספר הזיכרון של קהילת פאפא (JewishGen, הפרק \"Rev Kive Schreiber\")", "x": [["🪦 המצבה", "צילום ישן בשחור-לבן של מצבה גבוהה, כנראה בבית הקברות היהודי בפאפא.\nבראש: \"פ\"נ · מו\"ה עקיבא סופר זצ\"ל\".\nאחר כך שיר הספד ארוך. האותיות הגדולות בתחילת השורות יוצרות כנראה אקרוסטיכון.\nהשורות הראשונות:\n\"עולם חשך הה! בעדינו,\nבא השמש בצהרים!\nקוננו תבל, הרבו מספד,\nהורד עדי צבי החיים!\"\nהשורה האחרונה: \"... ליל ב' טבת תרס\"ג\", ובסוף \"ת.נ.צ.ב.ה.\".\nהמצבה מאשרת את תאריך הפטירה, ב' בטבת תרס\"ג, שעד עכשיו היה ידוע רק מפורומים.\n🟠 את שאר שורות השיר לא העתקתי, כי חלק מהמילים בצילום לא ודאיות."], ["📖 \"רב קיווה\" בספר הזיכרון של פאפא", "בספר הזיכרון של קהילת פאפא יש פרק על ר' עקיבא, שבפאפא קראו לו \"רב קיווה שרייבר\". הספר מתאר אותו כתלמיד חכם יוצא דופן, בנו של רב קרקוב ונכדו של החתם סופר.\n\nהוא היה סוחר עורות, בלי חנות: המחסן היה בדירתו שברחוב Szent László. הוא היה מראה את החדרים ואומר בקצת מרירות: כאן אני ישן, כאן ישנה משפחתי, וכאן ישן העסק שלי. לימים היה בעל מפעל לכלי בישול.\n\nהוא קיבל נדוניה גדולה מאוד לזמנו, 5,000 זהובים, וביום חתונתו חילק עשירית ממנה לעניים. חותנו כעס, ודודו, הכתב סופר, הרגיע אותו ואמר שעקיבא ימות עשיר. כשהיו לו אחר כך קשיים בעסקים, אמר לחברו שהוא מאמין בדברי דודו. ואכן, הוא השאיר הון גדול לבנו מרדכי בערל, בתנאי שבמשך עשר שנים יעסוק רק בתורה.\n\nהוא חי ללימוד התורה. לפי הספר ידע את כ\"ד ספרי התנ\"ך בעל פה, ולמד במחסן כל השנה. בחורף לא חימם את החדר, כי הקפיד לא להוציא כסף על עצמו, ובנסיעות בענייני ציבור לא לקח הוצאות מקופת הקהילה.\n\nאחרי מות אביו הציעו לו את רבנות קרקוב, והוא סירב. הוא הסביר שראה עד כמה ענייני הציבור הפריעו לאביו ללמוד.\n\nהוא ניסח את תקנון הקהילה בפאפא כך שהנאולוגים לא יוכלו להשתלט עליה. הוא גם חיבר כתובות בעברית למצבות בבית הקברות. אמרות השנינות שלו נאספו בספר \"Reb Kive Pope\" של אלברט נוימן, מנהל בית ספר בניירעדיהאזה."]]}, "g": [{"f": "g090", "c": "מצבת מו\"ה עקיבא סופר - ליל ב' טבת תרס\"ג"}]}, {"n": "לאה הלוי סופר", "y": "–1900", "s": [{"k": "papa", "r": "l", "t": ["פאפא (Pápa), הונגריה"], "u": 0}], "c": {"n": "לאה סופר, בת חיים זאב הלוי", "rel": "אמה של אסתר · סבתה של שרה", "b": "", "d": "א' דראש חודש מרחשוון תרס\"א (23.10.1900)", "place": "פאפא (Pápa), הונגריה", "note": "בתו של חיים זאב הלוי. אשתו של ר' עקיבא סופר מפאפא, בנו של ר' שמעון סופר, רב קרקוב, והייתה נשואה לו ארבעים שנה. ילדה שש בנות ושלושה בנים, ובהם אסתר, אשתו של ר' עקיבא סופר-שרייבר, ובנימין שרייבר-סופר. נפטרה ביום ג', א' דראש חודש מרחשוון תרס\"א, ובעלה כתב שיר לזכרה על מצבתה.", "flag": "שנת הלידה ומקום הקבורה לא ידועים. שם המשפחה של אביה בצילום קשה לקריאה.", "src": "מסירת המשפחה, 3.11.2026 · השיר \"על מצבת אשתי היקרה\" שכתב ר' עקיבא (צילום שמסרה המשפחה, 4.11.2026)", "x": [["🪦 השיר שכתב בעלה על מצבתה", "על מצבת אשתי היקרה מפז, שמתה א' דר\"ח מרחשון ביום ג' שנת תרס\"א\n\nלך אשתי חדרי, לך תבכה נפשי,\nאת ענק צוארי, את עטרת ראשי.\nזה ארבעים שנה, את ימין בעלך,\nהמעט אשר קנה, הכל רק בגללך.\nשש בנות ילדת, גם בנים שלשה,\nכלם טוב למדת, לכת דרך קדושה.\nשער ראש כסית, בצפת עד המצח,\nרבת טוב עשית, יעמד לך לנצח.\nבל אשכחך תמה, ואם אחיה מאה,\nלבי חלל, ושמה, קברתי את לאה\nבת חיים זאב הלוי ווענטל ז\"ל, תשרי תרס\"א.\n\n🟠 הקריאה של כמה מילים בצילום לא ודאית, בעיקר שם המשפחה \"ווענטל\" ו\"בצפת עד המצח\"."]]}, "g": [{"f": "g088", "c": "השיר שכתב ר' עקיבא מפאפא על מצבת אשתו לאה, בת חיים זאב הלוי - תשרי תרס\"א"}]}, {"n": "ר' שמעון סופר, רב ערלוי", "y": "10.5.1850–12.6.1944", "s": [{"k": "pressburg", "r": "bl", "t": ["כ\"ח באייר תר\"י (10.5.1850), פרשבורג"], "u": 0}, {"k": "kisvarda", "r": "l", "t": [], "u": 0}, {"k": "uman", "r": "l", "t": ["אומן וקייב"], "u": 0}, {"k": "kyiv", "r": "l", "t": ["אומן וקייב"], "u": 0}, {"k": "krakow", "r": "l", "t": [], "u": 0}, {"k": "eger", "r": "l", "t": ["אגר (רב העיר ⁦1881–1944⁩)"], "u": 0}, {"k": "auschwitz", "r": "d", "t": ["כ\"א בסיון תש\"ד (12.6.1944), אושוויץ"], "u": 0}], "c": {"n": "רבי שמעון סופר, רב ערלוי (אגר), בעל \"התעוררות תשובה\"", "rel": "אביו של ר' אברהם · סבא-רבא של אסתי", "b": "כ\"ח באייר תר\"י (10.5.1850), פרשבורג", "d": "כ\"א בסיון תש\"ד (12.6.1944), אושוויץ", "place": "פרשבורג ← קליינווארדיין ← אומן וקייב ← קרקוב ← אגר (רב העיר ⁦1881–1944⁩) ← אושוויץ", "note": "בנו של הכתב סופר ונכדו של החתם סופר. רב ערלוי (אגר) שבהונגריה יותר מ-60 שנה, וראש ישיבה גדולה. מחבר שו\"ת \"התעוררות תשובה\". נרצח באושוויץ בכ\"א בסיון תש\"ד (12.6.1944), בגיל 94, יחד עם בנו ר' משה, בעל \"יד סופר\".", "flag": "במאמר של פודברשיץ' כתוב שנולד באגר; בשאר המקורות — בפרשבורג. בוויקיפדיה האנגלית תאריך המוות הוא 2.6.1944, אבל כ\"א בסיון תש\"ד הוא 12.6.1944. במכלול כתוב גם \"בן תשעים וחמש\"; לפי תאריך הלידה היה בן 94. בכתבה של BoroPark24 כתוב שהיו לו 14 ילדים; בשאר המקורות 15. לפי מקור אחד (Project MUSE) כיהן באגר כבר מ-1879; ברוב המקורות מ-1881. לפי המכלול כיהן בערלוי 64 שנה; לפי התאריכים שבכרטיס, 1881–1944, יוצאות 63.", "src": "ויקיפדיה העברית · המכלול (רבי שמעון סופר (ערלוי)) · Wikipedia: Shimon Sofer (Hungarian rabbi) · Yehuda Alter, \"Living Legacy: Rav Shimon Sofer of Erlau\", BoroPark24, 8.6.2023 · Jewish Virtual Library: Eger · Renato Podbersič, \"Rabin Abraham (Sofer) Schreiber – med Sočo in Kvarnerjem\", Edinost in dialog 80 (2025) 2: 55–73 · עבודת השורשים של נעמה טויביס (2007), עדות סבתא רות · לקריאה נוספת: אהרן סורסקי, \"רבי שמעון חסידא\" (ירושלים, תשנ\"ט) · המכלול, ערך \"רבי שמעון סופר (ערלוי)\"; נבדק 19.11.2026", "x": [["📖 מפרשבורג לאגר", "נולד בפרשבורג בכ\"ח באייר תר\"י (10.5.1850), הבן הצעיר של הכתב סופר ושל חוה לאה. כבר בצעירותו כינה אותו אביו \"חסיד\".\n\nב-1870 נשא את אסתר פריד מקליינווארדיין (Kisvárda), ולמד שם תורה בתמיכת חותנו. אסתר נפטרה כעבור כשנתיים, ונשארה להם בת אחת, גיטל.\n\nאחר כך גר באומן ובקייב. הקהילה בקייב ביקשה שיהיה הרב שלה, והוא סירב. משם עבר לקרקוב, ולמד בה כשנתיים אצל דודו, ר' שמעון סופר, בעל \"מכתב סופר\".\n\nב-1881 התמנה לרב ערלוי (אגר) שבהונגריה. תלמידים מכל הונגריה ומחוצה לה התאספו סביבו, והוא הקים בעיר ישיבה גדולה.\n\nהיו לו ארבע נשים ו-15 ילדים. הפרטים בכרטיס \"ילדי ר' שמעון סופר מערלוי\"."], ["🙏 האיש", "רב גדול וצנוע. לפי נכדתו רות, יהודים מהקהילות הסמוכות נסעו אליו פעמיים בשנה.\n\nהיה רודף מצוות. כדי לקיים את מצוות המעקה בנה סוכה עם גג שטוח וחזק, השעין עליה סולם, ובנה לגג מעקה.\n\nלאחיו היה חוש הומור. פעם אמר לו שיש מצווה אחת שעוד לא קיים: \"להחזיר גרושתו\", כלומר להתגרש מאשתו ולהתחתן איתה שוב. הרב שמעון כעס עליו מאוד.\n\nכמו אביו וסבו, התנגד לחידושים ביהדות. הוא התנגד לציונות, לדיבור בעברית ולאגודת ישראל. הוא גם קנה חלקת אדמה בארץ ישראל וקיווה לעלות אליה, אבל לא עלה.\n\nב-1939 יעץ לבנו אברהם: \"לא לחזור להונגריה, אלא לעבור לארץ הקודש\". העצה הזאת הצילה את המשפחה.\n\nמה שכתב בהקדמה לתורת משה. בהקדמה שכתב לספר \"תורת משה\" של סבו, החתם סופר, הוא כתב ששכלו של אדם והחינוך שקיבל הם שמעצבים את שיקול דעתו. לכן הרמב\"ם והראב\"ד יכולים לחלוק זה על זה, ושניהם מכוונים אל האמת. את אותו רעיון הוא מיישם על פרעה ומשה, ועל שאול ודוד."], ["📚 הספרים שלו", "שו\"ת \"התעוררות תשובה\", בארבעה חלקים. החלק הראשון נדפס בבודפשט בתרפ\"ג (1923). הספר יצא בלי שם המחבר, ובכל עמוד נכתב: \"אין לסמוך על הוראה זו כלל\".\n\n\"שיר מעון\", על התורה.\n\n\"מוסרי הרמב\"ם\", אוסף של דברי מוסר מתוך הרמב\"ם.\n\nהוא גם הוציא לאור את כתבי אביו ואת כתבי סבו, החתם סופר."], ["🕯 1944: הגירוש והרצח", "במאי 1944 הוכנסו יהודי אגר לגטו. לפי נכדתו רות, הבישוף של אגר רצה לעזור לו, אבל הוא סירב. הוא הלך עם הקהילה שלו, עם ילדיו ועם נכדיו.\n\nב-8 ביוני 1944 הוצעדו יהודי אגר ברגל לבית הלבנים בקרשנד (⁦Kerecsend⁩), כ-16 ק\"מ מהעיר. משם הוסעו מתחנת הרכבת מקלאר (⁦Maklár⁩) לאושוויץ, בקרונות בהמות.\n\nעל הרמפה באושוויץ התמוטט, בן 94. יהודי שהכיר אותו ושרד סיפר שרץ אליו וקרא: \"רבי, רבי, מה אתה עושה פה?\". הוא עוד היה חי, ופתח וסגר את עיניו. בסלקציה, מי שלא יכלו ללכת הועמסו על משאית, חיים ומתים, ונשלחו לבורות.\n\nהוא נרצח בכ\"א בסיון תש\"ד (12.6.1944), יחד עם בנו ר' משה, בעל \"יד סופר\"."], ["🌱 אחריו", "נכדו, ר' יוחנן סופר, בנו של ר' משה, שרד את השואה והקים מחדש את קהילת ערלוי בירושלים. ישיבת \"אהל שמעון-ערלוי\" בקטמון קרויה על שמו של ר' שמעון."]]}, "g": [{"f": "g101", "c": "דף עד - ר' שמעון סופר - מילאה מרים אברהמי, לבית שרייבר, שעלבים 7.4.2010"}, {"f": "g102", "c": "רבי שמעון סופר, אגר (ערלוי), הונגריה"}, {"f": "g103", "c": "רבי שמעון סופר, אגר (ערלוי), הונגריה"}, {"f": "g141", "c": "רבי שמעון סופר, רב ערלוי (אגר)"}]}, {"n": "מלכה אסתר שפיצר סופר", "y": "1859–1931", "s": [{"k": "wien", "r": "bl", "t": ["1859, וינה"], "u": 0}, {"k": "pressburg", "r": "l", "t": [], "u": 0}, {"k": "eger", "r": "ld", "t": ["ה' באדר תרצ\"א (22.2.1931), אגר (ערלוי)"], "u": 0}], "c": {"n": "מלכה אסתר שפיצר סופר", "rel": "אמו של ר' אברהם", "b": "1859, וינה", "d": "ה' באדר תרצ\"א (22.2.1931), אגר (ערלוי)", "place": "וינה ← פרשבורג ← אגר", "note": "בתם של ר' שלמה זלמן שפיצר וגיטל בת החתם סופר. אשתו השלישית של ר' שמעון סופר, רב ערלוי.", "flag": "", "src": "\"משפחות סופרים\", בתוך \"מהר\"ז סופר\" ו\"שערי סופר\" (ירושלים, תשכ\"ט), עמוד ריב · Renato Podbersič, \"Rabin Abraham (Sofer) Schreiber – med Sočo in Kvarnerjem\", Edinost in dialog 80 (2025) 2: 55–73 · ויקיפדיה העברית · עבודת השורשים של נעמה טויביס (2007), עדות סבתא רות · המצבה ותאריך הפטירה: KehilaLinks Eger (JewishGen), צילום Ágnes Orbán, 2010", "x": [["📖 איך נפטרה", "רות מספרת: סבתא אסתר שברה את היד. באותם ימים האמינו שמי ששבר יד צריך לשכב, ולא נתנו לה לקום מהמיטה. היא קיבלה דלקת ריאות ונפטרה, שנה לפני שרות נולדה."], ["🪦 נוסח המצבה בערלוי", "פ\"נ\nהרבנית הצדקת צנועה בדרכי' ובכשרון מעשי'\nמרת מלכה אסתר ע\"ה\nבת הגאון ר' זלמן שפיטצער זצ\"ל, רב\"ד וויען\nובת בתו של רבינו מרן חתם סופר ומרן ר' עקיבא איגר ולמעלה בקודש\nאשת רבינו הגאון מו\"ה שמעון סופר שליט\"א, בן מרן כתב סופר זצ\"ל, אב\"ד ערלוי\nנפטרה כמעט במיתת נשיקה ונקברה בכבוד גדול\nיום ה' לחודש אדר תרצ\"א לפ\"ק\n\nמ — מי יספר גודל צדקתה\nל — לאבינו שבשמים שמה בטחונה\nכ — כל בניה גדולים בתורה\nה — הן בחכמה וביראה טהורה\n\nא — אם הבנים יקרה מפנינים\nס — ספרים להדפיס מגאוני משפחתה\nת — תורת משה וכתב סופר\nר — רבים לזכות באמרי שפר\n\nב — בעלה ובניה צוחו מר\nת — תאני' על ערי ערים הוסר\n\nג — געו בבכי קינה ורנה\nי — ישבי העיר כעשיר כעני\nט — טוב לבה וזכיותי' המרובים\nל — לנצח יזכרו לרחוקים ולקרובים\n\nתנוח ותעמוד בתחיית המתים. ת.נ.צ.ב.ה.\n\nראשי השורות של השיר יוצרים את השם \"מלכה אסתר בת גיטל\". את נוסח המצבה העתיק נכדה מבית הקברות בערלוי, והוא נדפס ב\"משפחות סופרים\"."], ["💍 תמיכתה בר' שמעון", "לפי \"משפחות סופרים\", מלכה אסתר הציעה למשכן את תכשיטיה היקרים, כדי שבעלה, ר' שמעון, יוכל להגשים את רצונו ולהדפיס את ספרי החתם סופר. היא חלתה ונפטרה כמעט באופן בלתי צפוי. ר' שמעון הספיד אותה ליד מיטתה, ואמר שאילו ידע כמה קשה מצבה, היה עושה הכול כדי למנוע את פטירתה. באותו מעמד הבטיח לה חלק מתורתו."]]}, "g": [{"f": "g116", "c": "מצבת מלכה אסתר סופר, אשת ר' שמעון · בית הקברות היהודי באגר · נפטרה בה' באדר תרצ\"א (22.2.1931)"}]}, {"n": "ר' עקיבא סופר-שרייבר", "y": "1876–14.1.1945", "s": [{"k": "siret", "r": "bl", "t": ["21.11.1876, סירט (Siret), בוקובינה"], "u": 0}, {"k": "wien", "r": "l", "t": ["וינה (Krummbaumgasse 1, רובע 2; בערך ⁦1915–1937⁩)"], "u": 0}, {"k": "budapest", "r": "ld", "t": ["14.1.1945 (29 בטבת תש\"ה), בודפשט — נרצח בסנטוריום היהודי"], "u": 0}], "c": {"n": "", "rel": "אביה של שרה · חותנו של ר' אברהם", "b": "21.11.1876, סירט (Siret), בוקובינה", "d": "14.1.1945 (29 בטבת תש\"ה), בודפשט — נרצח בסנטוריום היהודי", "place": "סירט ← וינה (Krummbaumgasse 1, רובע 2; בערך ⁦1915–1937⁩) ← בוקובינה ← רומניה (1939) ← טרנסילבניה ← בודפשט", "note": "רב וסוחר עצים, בעל יערות ומנסרות בבוקובינה. בנו של ר' שלמה אלכסנדר והינדה לבית וקס. במלחמת העולם הראשונה ברחו מבוקובינה מפני הרוסים לווינה, ושם גרו שנים. נתינותו: רומניה. בזמן המלחמה היה ברומניה ובבודפשט; נרצח ב-14.1.1945 כשהנאצים ההונגרים פרצו לסנטוריום היהודי בבודפשט וירו בכל המאושפזים והצוות. שמו רשום על האנדרטה לנספי סירט: \"עקיבא בן אלכסנדר שלמה\".", "flag": "מתוך המקורות על בית החרושת בזבלוטוב אומתו בעיניים ארבעה: הודעת הרישום בגזטה לבובסקה מ-13.4.1912, רישומי המדריכים מ-1913 ומ-1922, וספר הזיכרון של זבלוטוב. את ספר הזיכרון קראתי בתרגום לאנגלית שבאתר JewishGen; את המקור העברי המודפס מ-1949 לא ראיתי. תיק הרישום מ-1910 בקולומיאה לא נראה. בספר הזיכרון לא נאמר באיזו שנה נסגר המפעל, אלא רק שהשותפים קיימו אותו כמה שנים.", "src": "הודעת הפטירה של הינדה שרייבר: Czernowitzer Morgenblatt, 12.1.1930, ו-Ostjüdische Zeitung, 19.1.1930 (DIFMOE) · Skorowidz gminny Galicyi (וינה 1907, מפקד 1900), עמ' 414–415 · Najnowszy skorowidz wszystkich miejscowości (1904), עמ' 68 · אחוזת פיטקוב, תוספות: Rzeczpospolita 30.11.1921 · Chwila 1.12.1921 ו-20.9.1938 · Kurjer Polski 3.12.1921 · Nowa Reforma 4.12.1921 · Skorowidz dóbr tabularnych (1905), עמ' 41 · מפתחות המקומות של גליציה 1909 ו-1918 · מפת WIG 1:100,000, פס 54 טור 39 \"Nadwórna\" (1935), סריקת הספרייה היגלונית · נבדק 23.11.2026 · מפת המסלול: גבולות ונהרות לפי Natural Earth (נחלת הכלל); המקומות והשנים לפי המקורות שבכרטיס · שווי המרק הפולני: Federal Reserve Bulletin, יולי 1922, עמ' 896 (השער הממוצע במאי 1922) · מדד המחירים לצרכן בארה\"ב (BLS, דרך הבנק הפדרלי של מיניאפוליס): 1922 = 16.8, 2025 = 321.9 · אחוזת פיטקוב: Słownik geograficzny Królestwa Polskiego, כרך ב' (1881), עמ' 393 · Gazeta Lwowska: 1901 גיליון 164, 1908 גיליון 7, 1909 גיליון 100, 1912 גיליונות 42 ו-143, 1913 גיליון 107, 30.11.1921 גיליון 268 עמ' 2, 1935 גיליון 264 (הספרייה הדיגיטלית של אוניברסיטת יגלוניה) · Skorowidz przemysłowo-handlowy Królestwa Galicyi (1913) · Księga adresowa Polski 1926/27, 1928, 1929, 1930 · בוריסלב: Gazeta Lwowska, 21.4. בבודפשט\", הילדים Sari 14, Moses 12, Lea 9"}, {"f": "g485", "c": "כרטיס הרישום של אסתר (Ernestine) שרייבר במשטרת וינה, 17.2.1917: נולדה בפאפא, הונגריה, 21.2.1878; בעלה עקיבא בביסטריץ, טרנסילבניה"}]}, {"n": "אסתר סופר", "y": "1873–1937", "s": [{"k": "papa", "r": "l", "t": [], "u": 0}, {"k": "siret", "r": "l", "t": [], "u": 0}, {"k": "lviv", "r": "ld", "t": ["25 באדר תרצ\"ז (8.3.1937), לבוב"], "u": 0}], "c": {"n": "אסתר, לבית שרייבר-סופר", "rel": "אמה של שרה · בתם של ר' עקיבא סופר מפאפא ולאה", "b": "1873/4", "d": "25 באדר תרצ\"ז (8.3.1937), לבוב", "place": "פאפא ← סירט ← לבוב", "note": "בתם של ר' עקיבא סופר מפאפא ולאה, ונינתו של החתם סופר. במלחמת העולם הראשונה ברחה עם בעלה ועם שלושת הילדים מבוקובינה לווינה. נפטרה בלבוב ב-25 באדר תרצ\"ז (8.3.1937), לפני מלחמת העולם השנייה.", "flag": "", "src": "רשימת הנפטרים: Chwila, 13.3.1937, גיליון 6459, עמ' 13 (Polona) · בית העלמין היהודי החדש בלבוב: Forgotten Galicia · נבדק 23.11.2026 · תאריך ומקום הפטירה: ספר \"מכתב סופר\" (ר' שמעון סופר, מהדורת ר' יוסף נפתלי שטרן, ירושלים תשי\"ב 1952), פרק \"יקרא דחיי\", הקדשת שרה סופר לזכר הוריה (יד ושם, O.41.3, תיק 13379560) · כרטיס הרישום של בנימין בווינה: Wien, Meldezettel 1850–1928, FamilySearch, סרט 004756876, תמונה 2781, נבדק 21.11.2026 · כרטיס הרישום של וינה: Wien, Meldezettel 1850–1928, FamilySearch, סרט 004763761, תמונה 1124, נבדק 21.11.2026 · דף העד של רות עובדיה על ר' עקיבא (יד ושם 8784162) · מסירת המשפחה, 3.11.2026 (הוריה, שנות חייה) · יד ושם 13461710 ו-13777386 (אחיה בנימין) · עבודת השורשים של נעמה (2007) · עבודת השורשים של נעמה טויביס (2007), עדות סבתא רות · הודעת החתונה: Bukowinaer Rundschau, 29.5.1898, עמ' 3 (ANNO, הספרייה הלאומית האוסטרית), נבדק 21.11.2026 · כרטיס הרישום מ-17.2.1917: Wien, Meldezettel, FamilySearch, סרט 004763761, תמונה 1125, נבדק 24.11.2026", "x": [["👨‍🦱 בעלה", "ר' עקיבא סופר-שרייבר, בן דודה: אביו, ר' שלמה אלכסנדרי, ואביה היו אחים, בניו של ר' שמעון סופר, רב קרקוב. מופיע בכרטיס נפרד"], ["💍 החתונה", "נישאה לר' עקיבא שרייבר מסירט, בנו של ר' שלמה אלכסנדר, ביום רביעי, 1.6.1898, בשעה 1 בצהריים, בזאוארברון (Sauerbrunn) שבהונגריה. בהודעה על החתונה בעיתון \"Bukowinaer Rundschau\" מ-29.5.1898 היא נקראת \"העלמה אסתי שרייבר\"."], ["👨‍👩‍👧 ילדיה", "שרה. מופיעה בכרטיס נפרד\nמשה. מת צעיר. מופיע בכרטיס נפרד\nלאה. מתה צעירה. מופיעה בכרטיס נפרד"], ["📖 הסיפור שלה", "שתי הסבתות של רות נקראו אסתר. כשרות נולדה, סבתא אסתר הזאת עוד הייתה בחיים, ולפי המנהג האשכנזי אי אפשר היה לקרוא לתינוקת על שמה.\nרות מספרת שמותה נשמע היום משונה: היא טחנה בשר במטחנת יד ונפצעה. לפני שהפצע נסגר טחנה שוב בשר, המקום הזדהם, היא קיבלה הרעלת דם ונפטרה.\nאצל רות שמור עד היום בקבוקון הבשמים שלה.\n🟠 השערה: בספר הכתובות של וינה מ-1931 רשומה \"Schreiber Ernestine\" ב-Krummbaumgasse 1, אותו בניין של עקיבא. ארנסטינה היא הצורה הגרמנית של השם אסתר."], ["🏛 כרטיס הרישום במשטרת וינה (Meldezettel)", "• 24.2.1915 – כרטיס של ארנסטינה (אסתר) שרייבר: נולדה ב-21.7.1878 במרושלודאש (Marosludas), טרנסילבניה; יהודייה, נשואה. כתובת: וינה II, Taborstraße 46. בעלה: עקיבא שרייבר, \"כעת בבודפשט\", בן 39. ילדים: שרי 14, משה 12, לאה 9. מגורים קודמים: מרושלודאש. עזבה ביולי 1915 חזרה למרושלודאש. (FamilySearch, סרט 004763761, תמונה 1124)\n• 17.2.1917 – כרטיס של \"Ernestine Schreiber, Gattin des Akiba Schreiber\" (אשתו של עקיבא שרייבר): וינה II, Krummbaumgasse 1, קומה 1, דירה 19. נולדה בפאפא (Pápa), הונגריה, ב-21 בפברואר 1878. מקום ההשתייכות (Heimat): סירט, בוקובינה. יהודייה, נשואה. ילדים: שרי 16, לאה, משה 14. בעלה: \"Akiba Schreiber, Besztercze, Siebenbürgen\", כלומר ביסטריץ שבטרנסילבניה. הדירה הקודמת: Krummbaumgasse 1. בעמודת העזיבה כתוב תאריך חלש, אולי 21.9.1921 (לא ודאי). (FamilySearch, סרט 004763761, תמונה 1125)"], ["🪦 פטירתה וקבורתה", "בעיתון \"Chwila\" מלבוב מ-13.3.1937, עמ' 13, בטור \"Zmarli we Lwowie\" (\"נפטרו בלבוב\"), רשום: \"Ester Schreiber l. 63\", כלומר אסתר שרייבר, בת 63. ברשימה אין פרטים נוספים: לא שם בעל ולא כתובת.\n\nב-1937 נקברו יהודי לבוב בבית העלמין היהודי החדש, ליד רחוב ינובסקה. בית העלמין נהרס בזמן הכיבוש הגרמני. ב-1962 צורף לבית הקברות הנוצרי ינובסקי, ורוב שטחו קברים נוצריים. מצבה שלה לא נמצאה. גם רישומי הפטירה של הקהילה היהודית בלבוב למרץ 1937 לא שרדו.\n\nשנת הלידה. לפי הגיל ברשימת הנפטרים (63 במרץ 1937) נולדה ב-1873 או ב-1874. המשפחה מסרה 1872, ובכרטיס הרישום בווינה רשום 21.7.1878. בכרטיס הרישום מ-1917 רשומים תאריך הלידה 21.2.1878 ומקום הלידה פאפא, כמו שמסרה המשפחה."], ["👨‍🦱 אחיה, בנימין שרייבר-סופר", "בנימין (בנו) אברהם שמואל שרייבר-סופר. נולד בפאפא ב-1873. הוא נקרא כנראה על שם הכתב סופר, ר' אברהם שמואל בנימין, שנפטר שנתיים קודם.\nגר בווינה באותו בניין כמו אסתר ור' עקיבא, ב-Krummbaumgasse 1, והיה סוחר בכלי כסף. כך יצא ששרה גדלה בווינה בבית אחד עם הדוד שלה, אח של אמה.\nאשתו הני, לבית שלזינגר, ילידת וינה 1878 או 1879. ילדיהם: הוגו (1913) ואדית (1915), שלמדו באוניברסיטת וינה וגורשו ממנה ב-1938, ופליקס שמעון.\nב-19.2.1941 גורשו בנימין והני מווינה לקיילצה שבפולין, ושם נספו.\nכרטיס הרישום שלו במשטרת וינה, 21.11.1904: \"Benjamin Schreiber\", סוחר (Kaufmann), נולד בפאפא, הונגריה, בן 31, דת משה, נשוי. אשתו: Henny לבית Schlesinger, בת 25. כתובת: רובע 2, Krummbaumgasse 2. הדירה הקודמת: Kleine Schiffgasse 25. בשוליים נוסף מאוחר יותר הבן Hugo, 1913. ב-1914 עבר ל-Krummbaumgasse 1. (FamilySearch, סרט 004756876, תמונה 2781)\nהמקורות: שני דפי עד ביד ושם. הראשון מילא בנו, פליקס שמעון (13461710), והשני מרים אברהמי, בתה של שרה (13777386). בשני הדפים אביו עקיבא ומקום הלידה פאפא. נוסף על כך מאגר DÖW, וספר הזיכרון של אוניברסיטת וינה (על הוגו).\n🟠 זיהוי סביר מאוד, אבל אין רשומה שמזכירה את אסתר בשמה. שם האם: \"לאה\" אצל מרים, \"שרה\" אצל הבן."]]}, "g": [{"f": "g448", "c": "כרטיס הרישום של ארנסטינה (אסתר) שרייבר במשטרת וינה, 24.2.1915: Taborstraße 46, בעלה עקיבא \"כעת בבודפשט\", הילדים Sari 14, Moses 12, Lea 9"}, {"f": "g449", "c": "כרטיס הרישום של בנימין שרייבר, אחיה של אסתר, במשטרת וינה, 21.11.1904: סוחר מפאפא, אשתו Henny לבית Schlesinger"}, {"f": "g485", "c": "כרטיס הרישום של אסתר (Ernestine) שרייבר במשטרת וינה, 17.2.1917: נולדה בפאפא, הונגריה, 21.2.1878; בעלה עקיבא בביסטריץ, טרנסילבניה"}, {"f": "g472", "c": "רשימת הנפטרים בלבוב: \"Ester Schreiber l. 63\""}, {"f": "g443", "c": "הודעה על חתונת ר' עקיבא שרייבר ואסתי שרייבר, Bukowinaer Rundschau, צ'רנוביץ, 29.5.1898, עמ' 3"}, {"f": "g463", "c": "ההקדשה של שרה סופר לזכר הוריה, ר' עקיבא ואסתר, בספר \"מכתב סופר\" (ירושלים, תשי\"ב 1952)"}, {"f": "g484", "c": "כרטיס הרישום של ר' עקיבא שרייבר במשטרת וינה, 16.6.1916: Krummbaumgasse 1, בעל מפעל (Fabrikant), הדירה הקודמת Fitków בגליציה"}]}, {"n": "הרב אברהם סופר-שרייבר", "y": "9.10.1897–10.4.1982", "s": [{"k": "eger", "r": "bl", "t": ["9.10.1897, אגר (ערלוי), הונגריה"], "u": 0}, {"k": "pressburg", "r": "l", "t": [], "u": 0}, {"k": "wien", "r": "l", "t": [], "u": 0}, {"k": "corfu", "r": "l", "t": [], "u": 0}, {"k": "gorizia", "r": "l", "t": [], "u": 0}, {"k": "fiume", "r": "l", "t": [], "u": 0}, {"k": "jerusalem", "r": "ld", "t": ["10.4.1982, ירושלים"], "u": 0}], "c": {"n": "הרב פרופ' אברהם (Adolf / Abramo) סופר-שרייבר", "rel": "סבא של אסתי", "b": "9.10.1897, אגר (ערלוי), הונגריה", "d": "10.4.1982, ירושלים", "place": "אגר ← פרשבורג ← וינה ← קורפו ← גוריציה ← פיומה ← ירושלים", "note": "בנם של ר' שמעון סופר, רב ערלוי, ומלכה אסתר לבית שפיצר — נין של החתם סופר משני צדדיו. הוסמך לרבנות בפרשבורג. רב הראשי של קורפו, הרב האחרון של גוריציה, ורב אבאציה ופיומה. ב-1939 ברח עם משפחתו מאיטליה הפשיסטית לירושלים. המהדיר הגדול של כתבי המאירי. חתן פרס ישראל, 1981. שישה ילדים. חמישה נולדו באירופה — רייזל, בנימין שמואל, מרים, שלמה ורות — ודוד, הבן הצעיר, נולד בארץ. קבור בהר הזיתים.", "flag": "", "src": "תאריך החתונה: ספר הלידות של הקהילה היהודית בווינה (Geburtsbuch der israelitischen Kultusgemeinde in Wien), FamilySearch, Matrikel 1826–1943, סרט 7990781, תמונות 134 ו-496 (הערה ברישומי הלידה של רייזל ומרים); אינדקס הרישומים היהודיים של וינה (GenTeam): נישואין 1921, שיפשול, מס' 64, נבדק 21.11.2026 · Renato Podbersič, \"Rabin Abraham (Sofer) Schreiber – med Sočo in Kvarnerjem\", Edinost in dialog 80 (2025) 2: 55–73 · ויקיפדיה העברית · Bon 2004 · ספריית הקונגרס nr94038537 · עבודת השורשים של נעמה טויביס (2007), עדות סבתא רות · מקום הקבורה: מסירת המשפחה, 4.11.2026 · המכתב מקורפו משנת 1925: המאגר הדיגיטלי של הקהילות היהודיות ביוון (repository.jct.gr), קובץ 01_6_00_00753_112_0151721 · המאמר של פודברשיץ' נקרא במלואו ב-16.11.2026; הוא מבוסס על ארכיון איחוד הקהילות היהודיות באיטליה ברומא (AUCEI) · Angelo Mordechai Piattelli, Repertorio Biografico dei Rabbini Italiani dal 1861 al 2015 (ירושלים 2017) · קורפו: המוזיאון היהודי של יוון · עדות ברנרד נתן, 1963, לפי Simper 2015 · המכתב מקורפו מ-1921: המאגר הדיגיטלי של הקהילות היהודיות ביוון, קובץ 01_6_00_00753_112_0151714 · זיכרונותיו של ברנרד נתן, נשיא הקהילה היהודית של אבאציה, שנכתבו בגרמנית ב-1963 ונמסרו לאיחוד הקהילות היהודיות של יוגוסלביה; המקור במוזיאון ההיסטורי היהודי בבלגרד, והטקסט המלא בתרגום קרואטי באתר makabijada.com, נקרא ב-16.11.2026 · התצלום מפרשבורג, 1913: הספרייה הלאומית, מזהה 003564349, דרך ויקישיתוף, נחלת הכלל · אגרות קודש של הרבי מלובביץ': כרך י\"ח, אגרת ו'תשסא; כרך כ\"ה, אגרות ט'תכב ו-ט'תלד (ספריית חב\"ד ליובאוויטש, chabadlibrary.org, נקראו ב-17.11.2026) · הרב מרדכי מנשה לאופר, \"משנתו של המאירי בתורת הרבי\", אתר חב\"ד בישראל · \"האוהל\", ישיבת ערלוי, כסלו–אדר תש\"ך, עמודים יד–טו, לפי ציטוטו בחב\"דפדיה ואצל לאופר · חב\"דפדיה, הערך \"אברהם סופר\" · ספרי הכתובות של וינה (Lehmann), 1919–1923 (נמסר על ידי אסתי, 19.11.2026) · המאגר הדיגיטלי של הקהילות היהודיות ביוון (repository.jct.gr), חיפוש \"Schreiber\", 44 תוצאות; נבדק 19.11.2026 · הקהילה היהודית של קורפו, דף ההיסטוריה (דרך esefarad.com ודרך searchculture.gr); נבדק 19.11.2026 · כרטיסי הרישום של \"Adolf Schreiber\", 1921: Wien, Meldezettel, FamilySearch, סרט 004756876, תמונות 2481–2482, נבדק 24.11.2026", "x": [["📜 הסיפור שלו לפי הסדר", "• 9.10.1897 — נולד באגר (ערלוי), הונגריה.\n• ⁦1914–1918⁩ — בית המדרש לרבנים בפרשבורג; קיבל הסמכה.\n• שנה אחת — מורה לדת באגר.\n• 6.7.1921 — נשא לאישה את שרה סופר מסירט, בווינה (בית הכנסת \"שיפשול\").\n• ⁦1921–1924⁩ — וינה: עבד ארבע שנים בקהילה, תחת הרב הראשי צבי פרץ חיות.\n• ⁦1924–1928⁩ — הרב הראשי של קורפו (יוון). מכאן כנראה הסיפור במשפחה על \"קורפו\".\n• 3.1928–7.1936 — רב גוריציה (איטליה), הרב האחרון של הקהילה. שם התחיל להכין הוצאות של כתבי המאירי, מכתב היד היחיד של \"בית הבחירה\" שבפרמה.\n• 8.1936–12.1939 — רב אבאציה והקהילה האורתודוקסית בפיומה (רייקה). גרו ב-Via Petrarca 12.\n• 12.1939 — בגלל חוקי הגזע באיטליה הפליגו מטריאסטה באונייה Galileo Galilei לארץ ישראל.\n• 1941 — ר\"מ בישיבת שערי ציון בירושלים.\n• 1946 — ראש בית מדרש לרבנים בצרפת.\n• ⁦1947–1950⁩ — יוון. באוקטובר 1947 הגיע מארץ ישראל לאתונה, בהזמנת המועצה המרכזית היהודית של יוון, כדי לארגן מחדש את החיים הדתיים של הקהילות אחרי השואה. במשפחה נמסר שנשלח על ידי הרב הרצוג. המסמכים בכרטיסייה שבאילן עובדיה · קוסטיס.\n• ⁦1948–1966⁩ — מרצה בסמינר התאולוגי היהודי (JTS) בניו יורק, חצי שנה בכל שנה.\n• 1958 — פגישה ראשונה עם הרבי מלובביץ'.\n• 1981 — פרס ישראל.\n• 10.4.1982 — נפטר בירושלים."], ["👑 פרשבורג, 1913 · בן הדוד שקיבל את פני הקיסר", "שנה לפני שהגיע ללמוד בפרשבורג התרחש בעיר מעמד שנשמר בתצלום.\nבקיץ 1913 בא הקיסר פרנץ יוזף לביקור רשמי בעיר. יהודי פרשבורג יצאו לקדם את פניו, ובראשם הרב הראשי שלהם. בתצלום נראית המרכבה, ובתוכה יושב הקיסר. הגבר העומד לצדה, בגבו למצלמה, במעיל ארוך ובמגבעת, הוא הרב הראשי של פרשבורג — ר' עקיבא סופר.\nומי היה ר' עקיבא סופר? בן דודו של אברהם.\nהשושלת פשוטה. לחתם סופר היה בן, הכתב סופר. ולכתב סופר היו שני בנים שחשובים לסיפור הזה: ר' שמחה בונם, ה\"שבט סופר\", שהיה רב פרשבורג, ור' שמעון, שהיה רב ערלוי. ר' שמחה בונם הוא אביו של עקיבא, ור' שמעון הוא אביו של אברהם. האבות היו אחים, והבנים בני דודים, בהפרש של תשע-עשרה שנה.\nוכאן הדברים מתחברים. בשנים 1914 עד 1918 למד אברהם בישיבת פרשבורג והוסמך שם לרבנות. ראש הישיבה שהסמיך אותו היה אותו עקיבא סופר שבתצלום. בוויקיפדיה העברית הוא מופיע עד היום ברשימת תלמידיו.\nוהסוף קרוב עוד יותר. ב-1939 נמלט אברהם מאיטליה והתיישב בירושלים. שנה אחריו, ב-1940, עלה גם עקיבא סופר, הקים מחדש את ישיבת פרשבורג בירושלים וניהל אותה עד מותו ב-1959. שני בני הדודים, שנפגשו בבית מדרש בפרשבורג לפני המלחמה, סיימו את חייהם באותה עיר.\nהערה: ר' עקיבא סופר מפרשבורג אינו כרטיס באילן. יש באילן שני אנשים אחרים בשם הזה — ר' עקיבא סופר מסירט ור' עקיבא סופר מפאפא, ואין לבלבל ביניהם."], ["🏠 וינה, 1919–1923 · הכתובות", "בשנים האלה הוא גר ברובע השני של וינה, לאופולדשטאט. הכתובות, לפי ספרי הכתובות של וינה:\n\n⁦1919 · II. Kleine Schiffgasse 4 → II. Hammer-Purgstall-Gasse 4⁩\n⁦1920 · II. Hammer-Purgstall-Gasse 4 → II. Franz Hochedlinger Gasse 4⁩\n⁦1921/22 · II. Franz Hochedlinger Gasse 4 → II. Fugbachgasse 5⁩\n⁦1923 · II. Franz Hochedlinger Gasse 4⁩"], ["🏛 כרטיסי הרישום במשטרת וינה, 1921", "נמצאו שני כרטיסי רישום על שם \"Adolf Schreiber\" (FamilySearch, Wien, Meldezettel, סרט 004756876). בשניהם כתוב שנולד באגר (Eger), הונגריה, ב-9 באוקטובר 1897, וזה התאריך והמקום של הרב אברהם:\n\n• וינה II, Kleine Schiffgasse 10, קומה 1 (1921): \"Adolf Schreiber\", פקיד (Angestellter). נולד באגר ב-9.10.1897, רווק, דת משה. מקום ההשתייכות: פרשבורג. אזרח צ'כוסלובקיה. הדירה הקודמת: Kleine Sperlgasse 4. עזב ב-18.4.1921 ועבר לרובע 4, Schelleingasse 12. חתום המשכיר Adolf Felsenburg. (תמונה 2482)\n\n• 14.4.1921 – וינה IV, Schelleingasse 12, קומה 2, דירה 17: \"Adolf Schreiber\", פקיד פרטי (Privatbeamter). נולד באגר, הונגריה, ב-9.10.1897, רווק, דת משה. מקום ההשתייכות: ברטיסלבה, צ'כוסלובקיה. אזרח צ'כוסלובקיה. הדירה הקודמת: וינה II, Kleine Schiffgasse 10. עזב ב-22.7.1921, וליד \"לאן?\" כתוב \"unbekannt\" (לא ידוע). (תמונה 2481)\n\nהוא עזב את הדירה ביולי 1921, בחודש החתונה עם שרה."], ["🇬🇷 קורפו, 1924–1928", "כשהגיע, קורפו הייתה בלי רב ראשי. במכתב של הקהילה היהודית של קורפו מ-22 בינואר 1921 חותמת ההנהלה בצרפתית \"בתוקף היותנו ממלאי מקומו של הרב הראשי\".\nהקרע בקהילה. בקורפו היו שתי קהילות יהודיות נפרדות שלא הסתדרו: הגרֵקוֹי, יוצאי יוון, והפּוּלְיֵזוֹי, יוצאי אפוליה שבאיטליה. אפילו מוסדות הצדקה שלהן היו נפרדים. לפי המוזיאון היהודי של יוון, הסכסוך המסורתי ביניהן נחלש אך המשיך לרחוש מתחת לפני השטח, \"למרות מאמציהם המיוחדים של הרב שרייבר ושל יורשו, הרב יעקב נחמה\".\nבית הספר לעניים. הוא ייסד יחד עם המורה מואיסיס חאיְמיס בית ספר ערב לתלמידים חסרי אמצעים.\nהישיבה. ב-1925 נוסדה בקורפו ישיבה, ביוונית Ιερατική Σχολή.\nהשרפה, 1926. בית הכנסת Vecchia, שנקרא גם \"מידרש\", ברחוב פלאיולוגו, נשרף ב-1926 ונבנה מחדש באותה שנה. הוא עמד במקום בית הכנסת הספרדי הראשון של העיר, שנחרב ב-1537. ב-12 בספטמבר 1943 נהרס סופית בהפצצה גרמנית, ומה שנשאר ממנו הוא קטע קיר אחד בין בנייני מגורים, שהוכרז אתר לשימור.\nהשכונה. השכונה היהודית, אוברְיוֹבוּני, תחומה ברחובות ולִיסאריוּ, אגיאס סופיאס ופלאיולוגו. בית הכנסת היחיד ששרד בעיר הוא Nuova, ברחוב ולִיסאריוּ 4. בית האבות של הקהילה עמד ברחוב סכולמבורגו.\nהסתייגות: במאגר הדיגיטלי של הקהילות היהודיות ביוון אין אף מסמך החתום בידו משנות קורפו. חיפשתי בכל כתיבי שמו. המכתב מ-1925 שבסקציה למטה הוא היחיד מאותן שנים שבו הוא מוזכר. גם על משכורתו, על מקום מגוריו ועל הסיבה שעזב לא נמצא דבר. המקורות על שרפת בית הכנסת אינם אומרים מה גרם לה, ואינם מקשרים אותה אליו; הם רק מתארכים אותה ל-1926, בתוך שנות כהונתו."], ["📄 המכתב מקורפו, 1925", "מכתב של הקהילה היהודית של קורפו אל הקהילה היהודית של סלוניקי, 23 בספטמבר 1925, בתקופה שבה היה הרב הראשי של קורפו. כתוב בו: \"לבקשת הרב הראשי שלנו, המלומד אברהם, נכדו של הנערץ חתם סופר, אנו מבקשים שתשיבו לו בעברית, כדי שיבין את העניין לאשורו\". בתחתית הדף טיוטת תשובה בכתב יד עברי. חתום סבאטוס מינרבוס, נשיא הקהילה היהודית של קורפו.\nמה שהמכתב מגלה: שהוא העדיף לקרוא ולכתוב בעברית, ושהקהילה שלו ביקשה מקהילה אחרת לכתוב אליו כך. וגם שכבר אז, ב-1925, הוא היה מוכר כצאצא של החתם סופר.\nהסתייגות: ביוונית כתוב ΕΓΓΟΝΟΣ, נכד. למעשה הוא נין של החתם סופר, דרך אמו מלכה אסתר שפיצר, בתו של ר' שלמה זלמן שפיצר ונכדתה של גיטל, בתו של החתם סופר. כך כתוב במקור, ולא מעבר לזה."], ["🇮🇹 גוריציה, 1928–1936", "הגיע באמצע מרץ 1928. הוצעו לו 25,000 לירות לשנה, בלי תוספת דיור. הקהילה הייתה קטנה וענייה: ב-1926 חיו בגוריציה כ-220 יהודים, ורק 35 מהם שילמו מסי קהילה.\nאיפה גרו. המשפחה עברה דירה שלוש פעמים, תמיד ליד בית הכנסת והגטו הישן: תחילה בגטו עצמו (Via Ascoli), אחר כך ברחוב הסמינר (Via Seminario), ולבסוף ב-Via Carducci.\nשם התחיל מפעל חייו. בגוריציה החל להעתיק ולהדפיס את כתבי היד של פירושי המאירי לתלמוד, שמצא בספריית הפלטינה בפרמה.\nהתלמידים. סביבו התקבצו תלמידים, ואחדים עברו לגור בגוריציה רק כדי ללמוד אצלו. את הישיבה דחפו בעיקר יהודים שהיגרו מפולין. ההיסטוריון רנאטו פודברשיץ' כותב: \"לזמן קצר שבה גוריציה וקיבלה את זוהר הלימוד היהודי\".\nבאפריל 1931 המליצו עליו כמועמד לפרופסור במכללה הרבנית בפירנצה.\nבספטמבר 1932 נפתח ליד בית הכנסת אולם בית ספר משופץ ומורחב, על שם הרב אברם ו. רג'ו, והוא הפך למרכז החיים התרבותיים של יהודי גוריציה. תנועת התרבות Pro Cultura הגיעה לשיאה בתחילת שנות השלושים בזכותו.\nמה שכתבו עליו. הנציב הממשלתי קרלו מורפורגו תיאר אותו ב-1932 כ\"אדם בעל לב גדול ונכונות מצוינת, ותלמודאי ממדרגה ראשונה\", ובאותה נשימה התלונן שהרב מלומד מדי והעם אינו מצליח לעקוב אחריו. באותה שנה היו הכנסות הקהילה 37,000 לירות, ומהן קיבל הרב 23,000. מורפורגו ביקש לקצץ בשכרו.\nהעניין עם אודינה. יהודי אודינה סירבו להתאחד עם קהילת גוריציה, בין היתר מפני ששרייבר היה אורתודוקסי וזה הפריע להם; הם העדיפו את טריאסטה. לרב הכבוד שלהם מינו את הרב ישראל אנטון צולר מטריאסטה, \"מפני ששרייבר לא קיבל הכרה משפטית מהממשלה\". האיחוד נכפה בצו מלכותי ב-24 בספטמבר 1931.\nהוא מעולם לא נרשם למפלגה הפשיסטית. מתוך יותר מחמישים רבנים בממלכת איטליה נרשמו שבעה.\nהעזיבה. באוקטובר 1936 כתב נשיא הקהילה אטיליו מורפורגו לרומא בצער שד\"ר שרייבר חייב לעזוב בגלל \"מצבה הכלכלי העצוב מאוד של קהילת גוריציה. איטליה תאבד כך את המורה המלומד והמוכשר ביותר, ובוודאי לא באשמתה\". הוא היה הרב האחרון שמונה אי פעם בגוריציה; אחריו לא היה לעיר רב משלה."], ["⚓ פיומה ואבאציה, 1936–1939", "איך זה הוסדר. לקהילת פיומה כבר היה רב ראשי, ולכן אפשר היה למנות רק רב מדרגה שנייה. הפתרון: מינו אותו רב ראשי של אבאציה, ובמקביל רב הקהילה האורתודוקסית של פיומה.\nלמה המשרה באבאציה התפנתה. רבה, אלכסנדר שטרן, סירב להחזיר כספים לקהילה. חבר קהילה בשם דוד פנה לאיחוד הקהילות היהודיות ברומא, ונשיא הקהילה ברנרד נתן נשאל ואישר את התלונות. קולגיום הרבנים של רומא, פירנצה וליוורנו פסק ששטרן אינו ראוי להיות מנהיג רוחני באבאציה, והאיחוד הורה לפטרו מיד. הציעו לו 10,000 לירות כדי שיוכל לעבור דירה. שטרן נלחם בבתי משפט ובעורכי דין, ואף הלשין על נתן למזכיר המפלגה הפשיסטית וקרא לו אנטי-פשיסט, מפני שנתן אסר הרצאות פוליטיות בבית הכנסת.\nולמה הוא עצמו רצה לעבור. נתן כותב: \"הרבינו קאפו אברהם שרייבר מקהילת גרץ רצה להחליף את מקומו, מכיוון שכבר היה שם זמן רב\". גרץ הוא שמה הגרמני של גוריציה.\nשכרו חולק בין השתיים: שני שלישים שילמה פיומה, שליש אבאציה. זה היה נוח להן כלכלית.\nאת התפילות הוביל באבאציה בכל שבת, ובחגים הגדולים לסירוגין באבאציה ובפיומה.\nבית הכנסת ששרד. בית הכנסת האורתודוקסי של פיומה, שנבנה ב-1930 ברחוב Via Galvani, שרד את השואה מפני שהנאצים השתמשו בו כמחסן תחמושת. יוגוסלביה הלאימה אותו, ב-1996 שופץ והוחזר לקהילה היהודית של רייקה, והיא משתמשת בו עד היום. את בית הכנסת הגדול, שבנה ליפוט באומהורן ב-1903, הרסו הנאצים בינואר 1944.\nהעדות של ברנרד נתן. נשיאה האחרון של קהילת אבאציה כתב ב-1963 דוח בגרמנית, השמור היום במוזיאון ההיסטורי היהודי בבלגרד. הוא כתב שהרב שרייבר היה תלמודאי מוכר, מכובד מאוד באיטליה, ושדיבר איטלקית, גרמנית, הונגרית ועברית מודרנית. הוא הוסיף שהרב \"עבד בקורפו ובגרץ שנים אחדות\" — אזכור עצמאי של קורפו, שאינו תלוי במקורות היווניים. ואז: \"כך השגנו שבראש הקהילה הדתית יעמוד רב ראוי, מה שלא היה לנו קודם. מכיוון שהרב שרייבר היה מודע למצב הכספי, הוא סירב לקבל כל הכנסה נוספת. על חשבונו שלו הוא נסע ברחבי איטליה כדי לאסוף כסף עבור קהילתו. איתו ועם המזכיר סֶגֶה, שגם הוא ראוי לשבח רב, הייתה לי תמיכה אמיתית, ולכן הבטתי בתקווה אל עתיד הקהילה\".\nמי היה נתן. בקונגרס איחוד הקהילות היהודיות ברומא, ב-21 במרץ 1938, היה נתן היחיד מבין כל המשתתפים שלא היה חבר במפלגה הפשיסטית, והוכיחו אותו על כך. גם שרייבר, כזכור, מעולם לא נרשם.\nאחרי שעזב. נתן כותב: \"הרב שרייבר קיבל אישור לצאת לישראל, והשוחט הוס הועבר לארצות הברית. כך נשארה הקהילה בשנת 1939 בלי הנהגה רוחנית\". באבאציה לא היה עוד רב. בפיומה דאג ליהודים האורתודוקסים הרב דוד ואקסברגר, עד שהוכנס למחנה ביולי 1940.\nועוד דבר אחד. במסמך שנכתב ברומא במאי 1946, שמונה את משרות הרבנות הריקות באיטליה, מופיעה לצד שמו הערה שהוא \"צריך היה לחזור\" (dovrebbe tornare) לאבאציה. באותה שנה הוא היה בצרפת, ושנה אחריה נסע ליוון."], ["🇬🇷 יוון, 1947–1950 · לבנות מחדש", "באוקטובר 1947 הגיע מארץ ישראל לאתונה, בהזמנת המועצה המרכזית היהודית של יוון, כדי לארגן מחדש את החיים הדתיים של הקהילות אחרי השואה.\n\nבמאגר הדיגיטלי של הקהילות היהודיות ביוון יש 44 מסמכים שמזכירים אותו. כולם ביוונית, מאוקטובר 1947 ואילך, ועוד תיק אחד שמשתרע על השנים 1946–1952.\nמאיפה נשלחו: אתונה 32, סלוניקי 10, ורויה 1, קורפו 1.\nמי יצר אותם: המועצה המרכזית היהודית של יוון 27, קהילת סלוניקי 10, קהילת ורויה 1.\nלמי נשלחו: קהילת סלוניקי 15, קהילות ישראל ביוון 10, כל הקהילות היהודיות של יוון 2, המועצה המרכזית 2.\nאיזה סוג: 11 מכתבים, 11 חוזרים ותקנות, 9 מכתבים רשמיים, 4 תזכירים, וכן קבלות ורשימות.\n\nהסתייגות: נקראו נתוני המסמכים — מי כתב, למי, מאיפה, מתי ומאיזה סוג — ולא גוף המסמכים עצמם. האתר לא אפשר לפתוח את הרשומות."], ["🕯️ הקשר עם הרבי מלובביץ'", "הפגישה הראשונה. באייר תשי\"ח (1958) נכנס ר' אברהם ליחידות אצל הרבי מלובביץ', ר' מנחם מענדל שניאורסון, כנראה בפעם הראשונה. הוא הביא לרבי במתנה כמה מספרי המאירי שההדיר. על \"בית הבחירה\" למסכת בבא בתרא כתב הקדשה: \"דורון להאדמו\"ר הגאון הצדיק מנהיג ישראל... ניו יורק אייר תשי\"ח, בהערצה רבה מנאי, אברהם\".\nהמכתב הראשון, י\"ב באדר שני תשי\"ט (22.3.1959). הרבי פותח במילים \"בהמשך לשיחתנו\". הוא עבר על הספר שקיבל ועל ספרו הקודם של ר' אברהם, \"בית הבחירה\" על מסכת מקוואות, שכבר היה בספרייתו, ושלח לו הערות לימוד מפורטות על שניהם. הוא גם העיר שחסרים בספרים תיאור של כתב היד שממנו נדפסו, השוואה לכתבי יד אחרים (למשל זה שבוותיקן), תצלום של עמוד אחד לפחות, ופרקים על חיי המאירי ועל רבותיו. למכתב צירף ספר התניא וספר המצוות של הצמח צדק, \"אודותם נדבר בשיחתנו\".\n\"האוהל\", תש\"ך. ר' אברהם פרסם את הערות הרבי בגיליון כסלו–אדר תש\"ך של \"האוהל\", כתב העת של ישיבת ערלוי בירושלים (עמודים יד–טו). בדברים שכתב לפניהן, בירושלים באלול תשי\"ט, כתב שהרבי \"בענוותנותו הרבה הראה לי חיבה יתירה וכבוד רב\".\nחנוכה תשכ\"ח (סוף דצמבר 1967). הרבי כותב ששמח לשמוע ש\"כבר חזר לביתו והולך ומתרפא\", ומעיר שלא התראו ולא התכתבו \"במשך החדשים הרבים\". עוד הוא מזכיר שיחה שהייתה ביניהם על \"אביו זקנו... החתם סופר\", שעסק גם בפנימיות התורה.\nהתניא באיטלקית, ט\"ו בטבת תשכ\"ח (16.1.1968). הרבי מודה לו על השתדלותו בהוצאת ספר התניא בתרגום לאיטלקית, שיצא לאור במילאנו. לפי ההערות למכתב, את התרגום וההגהה עשה פרופסור קולומבו. הרבי מזכיר גם את \"מה שדברנו בהיותו כאן\" על השתתפותו בהוצאות הדפסת ספרי הראשונים.\nמה שנמסר בשמו. לפי הרב מרדכי מנשה לאופר, ר' אברהם פעל בשליחות הרבי גם בהקמת מקוואות ובהפצת תורה. בחב\"דפדיה מובאים שני סיפורים מפי הרב משה וובר מירושלים, שאינם מתוארכים. באחד התווכח ר' אברהם עם הרבי על נוסח בדברי החתם סופר, עד שהרבי הוציא את הספר מהארון. בשני נכנס ליחידות מיד אחרי שמנחם בגין יצא מחדרו של הרבי. לפי \"ימי תמימים\", לקראת ערב חב\"ד בבנייני האומה בז' ניסן תש\"ל (13.4.1970) נשלחו אליו ולמשפחתו כרטיסי כבוד."]]}, "g": [{"f": "g228", "c": "הרב פרופ' אברהם סופר-שרייבר, הסבא של אסתי"}, {"f": "g114", "c": "ר' אברהם סופר-שרייבר, הסבא של אסתי"}, {"f": "g376", "c": "ר' אברהם סופר-שרייבר · דיוקן חזיתי"}, {"f": "g377", "c": "פרשבורג, 1913 · הרב עקיבא סופר מקבל את פני הקיסר פרנץ יוזף"}, {"f": "g229", "c": "החתימה של הרב אברהם סופר-שרייבר, בכתב ידו (בדיו ירוקה)"}, {"f": "g362", "c": "המכתב מקורפו, 23.9.1925"}, {"f": "g486", "c": "כרטיס הרישום של הרב אברהם (\"Adolf\") שרייבר במשטרת וינה, 1921: Kleine Schiffgasse 10; נולד באגר 9.10.1897, מקום ההשתייכות פרשבורג"}, {"f": "g487", "c": "כרטיס הרישום של הרב אברהם (\"Adolf\") שרייבר במשטרת וינה, 14.4.1921: Schelleingasse 12, פקיד פרטי; עזב ב-22.7.1921"}, {"f": "g450", "c": "רישום הלידה של רייזל (Rosa), ספר הלידות של הקהילה היהודית בווינה, 17.11.1922, מס' 2609 (השורה הראשונה)"}, {"f": "g453", "c": "אינדקס הלידות של הקהילה היהודית בווינה: Schreiber, Benjamin, Adolf, 2667 (מסומן במלבן תכלת)"}, {"f": "g451", "c": "רישום הלידה של מרים (Mirjam), ספר הלידות של הקהילה היהודית בווינה, 26.12.1924, מס' 2502 (השורה השישית)"}]}, {"n": "שרה סופר-שרייבר", "y": "19.6.1900–16.11.1988", "s": [{"k": "siret", "r": "bl", "t": ["19.6.1900, סירט (Siret), בוקובינה"], "u": 0}, {"k": "wien", "r": "l", "t": [], "u": 0}, {"k": "corfu", "r": "l", "t": [], "u": 0}, {"k": "gorizia", "r": "l", "t": [], "u": 0}, {"k": "fiume", "r": "l", "t": [], "u": 0}, {"k": "jerusalem", "r": "ld", "t": ["16.11.1988 (ז' בכסלו תשמ\"ט), ירושלים"], "u": 0}], "c": {"n": "שרה סופר-שר function home(){
  const byName = DATA.slice().sort((a, b) => a.he.localeCompare(b.he, 'he'));
  document.getElementById('panel').innerHTML = '<p class="hint">לחצו על נקודה במפה, או על שם עיר כאן:</p><div class="clist">' +
    byName.map(c => '<button data-k="' + c.k + '">' + esc(c.he) + '</button>').join('') + '</div>';
  document.querySelectorAll('.clist button').forEach(b => b.onclick = () => pick(b.dataset.k, true));
}
function pick(key, center){
  sel = key; const c = DATA.find(d => d.k === key);
  document.getElementById('panel').innerHTML = '<button class="closebtn" id="cls">כל הערים</button><h2>' + esc(c.he) + '</h2><p class="en">' + esc(c.en) + '</p>' +
    merged(c);
  document.getElementById('cls').onclick = () => { sel = null; draw(); home(); };
  draw();
  if (center){ const [x, y] = pt(c), kk = Math.max(k, 3); svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(W/2 - kk*x, H/2 - kk*y).scale(kk)); }
}
d3.select('#zin').on('click', () => svg.transition().call(zoom.scaleBy, 1.6));
d3.select('#zout').on('click', () => svg.transition().call(zoom.scaleBy, 1/1.6));
function fitView(lon0, lat0, lon1, lat1){
  const a = proj([lon0, lat1]), b = proj([lon1, lat0]);
  const x0 = Math.min(a[0], b[0]), x1 = Math.max(a[0], b[0]), y0 = Math.min(a[1], b[1]), y1 = Math.max(a[1], b[1]);
  const kk = Math.min((W - 60) / (x1 - x0), (H - 70) / (y1 - y0));
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(W/2 - kk*(x0+x1)/2, H/2 - kk*(y0+y1)/2).scale(kk));
}
d3.select('#zall').on('click', () => { const [[x0, y0], [x1, y1]] = limRect, kk = zoom.scaleExtent()[0];
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(W/2 - kk*(x0+x1)/2, H/2 - kk*(y0+y1)/2).scale(kk)); });
d3.select('#zeu').on('click', () => svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity));
/* person search: draws the person's cities in order, from the cards' birth, residence and death */
const CBY = Object.fromEntries(DATA.map(c => [c.k, c]));
PEOPLE.forEach(p => { p.label = p.n + (p.y ? ' (' + p.y + ')' : ''); });
document.getElementById('pl').innerHTML = PEOPLE.map(p => '<option value="' + esc(p.label) + '">').join('');
const ROLE = {b:'לידה', l:'מגורים', d:'פטירה'};
function clearRoute(){ gRoute.selectAll('*').remove(); gStops.selectAll('*').remove(); }
function route(p){
  clearRoute(); sel = null; draw();
  const stops = p.s.filter(s => CBY[s.k]); const pts = stops.map(s => pt(CBY[s.k]));
  if (pts.length > 1) gRoute.append('path').attr('class', 'rt').attr('d', d3.line()(pts));
  const st = gStops.selectAll('g').data(stops).join('g').attr('transform', (d, i) => 'translate(' + pts[i][0] + ',' + pts[i][1] + ')');
  st.append('circle').attr('class', 'stc');
  st.append('text').attr('class', 'stn').text((d, i) => i + 1);
  restyle();
  const c = p.c || {}, br = s => esc(s).split(String.fromCharCode(10)).join('<br>');
  const row = (k, v) => v ? '<dt>' + k + '</dt><dd>' + br(v) + '</dd>' : '';
  document.getElementById('panel').innerHTML = '<div class="pc"><button class="closebtn" id="cls">כל הערים</button><h2>' + esc(c.n || p.n) + '</h2>' +
    (c.rel ? '<p class="rel">' + br(c.rel) + '</p>' : '') +
    '<dl>' + row('נולד', c.b) + row('נפטר', c.d) + row('מקום', c.place) + '</dl>' +
    (c.note ? '<p class="note">' + br(c.note) + '</p>' : '') +
    (c.flag ? '<div class="flag">' + br(c.flag) + '</div>' : '') +
    (c.x || []).map(x => '<h3>' + esc(x[0]) + '</h3><div class="ch">' + br(x[1]) + '</div>').join('') +
    ((p.g || []).length ? '<h3>תמונות ומסמכים</h3><div class="gal">' + p.g.map(i => '<a href="../gallery/' + i.f + '.jpg" target="_blank" rel="noopener"><img src="../gallery/' + i.f + 't.jpg" alt="' + esc(i.c) + '" title="' + esc(i.c) + '" loading="lazy"></a>').join('') + '</div>' : '') +
    (c.src ? '<h3>מקורות</h3><div class="src">' + br(c.src) + '</div>' : '') + '</div>';
  document.getElementById('cls').onclick = () => { clearRoute(); sel = null; draw(); home(); };
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  let kk = Math.min((W - 190) / Math.max(x1 - x0, 1), (H - 120) / Math.max(y1 - y0, 1), 6);
  kk = Math.max(kk, zoom.scaleExtent()[0]);
  svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity.translate(W/2 + 45 - kk*(x0+x1)/2, H/2 - kk*(y0+y1)/2).scale(kk));
}
function findPerson(){
  const v = document.getElementById('ps').value.trim(), err = document.getElementById('pserr');
  if (!v){ err.textContent = 'הקלידו שם קודם'; return; }
  const p = PEOPLE.find(x => x.label === v) || PEOPLE.find(x => x.n === v) || PEOPLE.find(x => x.label.includes(v));
  if (!p){ err.textContent = 'לא נמצא אדם בשם הזה במפה'; return; }
  err.textContent = ''; route(p);
}
document.getElementById('psgo').onclick = findPerson;
document.getElementById('ps').addEventListener('keydown', e => { if (e.key === 'Enter') findPerson(); });
document.getElementById('ps').addEventListener('input', () => { document.getElementById('pserr').textContent = ''; const v = document.getElementById('ps').value; const p = PEOPLE.find(x => x.label === v); if (p) route(p); });
document.getElementById('psx').onclick = () => { document.getElementById('ps').value = ''; document.getElementById('pserr').textContent = ''; clearRoute(); sel = null; draw(); home(); };
draw(); home();
gLand.selectAll('path').data(LAND.features).join('path').attr('class', 'land').attr('d', path);
window.addEventListener('resize', () => { size(); limits(); });
</script>
</body>
