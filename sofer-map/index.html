<style>
:root{
  --paper:#eef1f4; --land:#f6f1e6; --land-line:#a9b2bd; --sea:#cfe0ee;
  --ink:#1d2533; --muted:#5b6574; --rule:#d5dbe2; --card:#ffffff;
  --dot:#1F3A8A; --dot-ring:#ffffff; --sel:#B8860B;
  --display:"Frank Ruhl Libre","David",Georgia,serif;
  --body:"Assistant","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161e; --land:#2b3544; --land-line:#566377; --sea:#0b1a2b;
    --ink:#e6eaf0; --muted:#9aa5b4; --rule:#2a3340; --card:#161c25;
    --dot:#7fa2e8; --dot-ring:#11161e; --sel:#e8a33c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161e; --land:#2b3544; --land-line:#566377; --sea:#0b1a2b;
  --ink:#e6eaf0; --muted:#9aa5b4; --rule:#2a3340; --card:#161c25;
  --dot:#7fa2e8; --dot-ring:#11161e; --sel:#e8a33c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1360px;margin:0 auto;padding:22px 16px 36px}
header{display:grid;gap:4px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0}
.sub{color:var(--muted);margin:0;max-width:75ch}
.back{font-size:14px;color:var(--muted)}
.back a{color:inherit}
.grid{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}.mapbox{order:-1}}
.mapbox{position:relative;background:var(--sea);border:1px solid var(--rule);border-radius:10px;overflow:hidden;height:min(78vh,760px)}
@media (max-width:860px){.mapbox{height:62vh}}
#map{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:.6;vector-effect:non-scaling-stroke}
.dot{fill:var(--dot);stroke:var(--dot-ring);stroke-width:1.5;cursor:pointer;vector-effect:non-scaling-stroke}
.dot:hover{fill:var(--sel)}
.dot.on{fill:var(--sel)}
.lbl{font-family:var(--body);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round;cursor:pointer}
.lbl:hover{fill:var(--sel)}
.ctrl{position:absolute;top:10px;left:10px;display:grid;gap:6px}
.ctrl button{font:600 15px var(--body);min-width:36px;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.ctrl button:focus-visible{outline:2px solid var(--dot);outline-offset:2px}
.note{position:absolute;bottom:0;left:0;right:0;font-size:12px;color:var(--muted);padding:6px 10px;background:color-mix(in srgb,var(--sea) 85%,transparent)}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
@media (min-width:861px){.panel{max-height:min(78vh,760px);overflow:auto}}
.panel h2{font-family:var(--display);font-size:26px;margin:0}
.panel .en{color:var(--muted);font-size:14px;margin:0 0 8px}
.panel h3{font-size:15px;margin:14px 0 6px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--rule);padding-bottom:3px}
.panel ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.panel li{display:flex;justify-content:space-between;gap:10px}
.panel li .yr{color:var(--muted);font-size:14px;white-space:nowrap;direction:ltr}
.panel .unc{color:var(--muted);font-size:13px}
.hint{color:var(--muted);margin:0 0 10px}
.clist{display:flex;flex-wrap:wrap;gap:6px}
.clist button{font:14px var(--body);border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.clist button:hover{border-color:var(--dot)}
.closebtn{float:left;font:14px var(--body);border:1px solid var(--rule);background:transparent;color:var(--muted);border-radius:8px;padding:2px 10px;cursor:pointer}
.tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-inline-start:6px;vertical-align:middle}
.tg{font-size:11.5px;line-height:1;padding:3px 8px;border-radius:999px;font-weight:600}
.tb{background:#d6ecfa;color:#0f4c75}
.tl{background:#ece4f7;color:#5b3f86}
.td{background:#e4e6e9;color:#454b54}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tb{background:#1d3e55;color:#bfe3fa}:root:not([data-theme="light"]) .tl{background:#3a2f4e;color:#e2d4f5}:root:not([data-theme="light"]) .td{background:#33373e;color:#d4d8de}}
.panel li{align-items:center}
.psearch{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.psearch input{flex:1;min-width:220px;font:16px var(--body);padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
.psearch button{font:600 15px var(--body);height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.psearch .err{font-size:14px;color:#b3261e;width:100%}
.rt{fill:none;stroke:var(--sel);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.stc{fill:var(--sel);stroke:var(--dot-ring);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}
.stn{fill:#fff;font-family:var(--body);font-weight:700;text-anchor:middle;pointer-events:none}
.pc .rel{color:var(--sel);font-weight:600;font-size:14.5px;margin:2px 0 10px}
.pc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px}
.pc dt{color:var(--muted);font-size:14px;font-weight:700}
.pc dd{margin:0;font-size:15px}
.pc .note{position:static;background:none;padding:0;font-size:15px;color:var(--ink);white-space:pre-line;margin:0 0 10px}
.pc .flag{border:1px dashed var(--rule);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--muted);margin:0 0 10px;white-space:pre-line}
.pc .ch{white-space:pre-line;font-size:14.5px;margin:0 0 8px}
.pc .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin:6px 0 10px}
.pc .gal img{width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);display:block}
.pc .src{font-size:12.5px;color:var(--muted);white-space:pre-line}
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;counter-reset:st}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:2px 8px;align-items:start}
.steps .num{grid-row:span 2;width:24px;height:24px;border-radius:50%;background:var(--sel);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.steps .city{font-weight:600;cursor:pointer;color:var(--ink)}
.steps .city:hover{text-decoration:underline}
.steps .what{font-size:13.5px;color:var(--muted)}
</style>

ראה על שמו. לפי מנהג אשכנז נותנים שם של קרוב שנפטר, ולכן ייתכן שרבי יואל כבר לא היה בחיים כשהנכד נולד."], ["🔎 מה לא נמצא", "• שנות חייו, שם אשתו ושמות הוריו.\n• מצבה. בית הקברות היהודי של נירנברג נהרס אחרי גירוש 1499."]]}, "g": []}, {"n": "ר' שמעון ז\"ק", "y": "~1405–~1445", "s": [{"k": "nurnberg", "r": "ld", "t": ["בסביבות 1445, נירנברג"], "u": 0}], "c": {"n": "רבי שמעון ז\"ק, רבה של נירנברג", "rel": "אביו של ר' זעליגמן ז\"ק", "b": "בערך 1400–1410 (הערכה)", "d": "בסביבות 1445, נירנברג", "place": "נירנברג", "note": "רבה של נירנברג וראש הישיבה בעיר. היה תלמיד של רבי זלמן כ\"ץ ושל מהר\"י וייל. אשתו הייתה בעסליין, בת רבי יואל מנירנברג. נפטר בסביבות 1445.", "flag": "שנת הלידה היא הערכה. שנת הפטירה לא בטוחה: לפי נירנברג עד 1445, לפי ההספד ר\"ז (1446/1447). אביו, רבי יצחק, מופיע בכרטיס נפרד. לא בטוח שכרטיס הרישום \"המאסטר שמעון מנירנברג\" מדבר עליו; ייתכן שהוא מערבב אותו עם רב אחר בשם שמעון.", "src": "המכלול, ערך \"רבי שמעון ז\"ק\" (נבדק 13.11.2026), ושם: הרב ישראל פלס, \"מהר\"ר שמעון ז\"ק וקובץ מכתיבת ידו\", מוריה שנה יד; הרב משה פוליטנסקי, \"אלה תולדות - תולדות משפחת פוזן\", עמ' כה · כרטיס הרישום \"Meister Simon aus Nürnberg, um 1444\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1400–1499, עמ' 64–65 · כרטיס הרישום של בנו \"Zeligman Zak zu Nürnberg, 1497\": שם, עמ' 156 · Treviso-Katalog, מס' 194, \"Simon von Nürnberg/Frankfurt/Köln/R. Simlin Segal/Lewi, Sohn des Jacob\", אוניברסיטת טריר (dhtrier.quarto.pub), על פי Germania Judaica III/2, עמ' 366, 388 · המכלול, ערכים \"רבי זלמן כ\"ץ\" ו\"ישיבת נירנברג\" (נבדק 13.11.2026)", "x": [["📅 חייו בקצרה", "• אביו: רבי יצחק. כך כתב בנו, רבי יואל, בהספד עליו: \"מהר\"ר שמעון ז\"ק ב\"ר יצחק\".\n• השם \"ז\"ק\": לפי הרב פלס זה קיצור של \"איזק\", כלומר יצחק, על שם אביו.\n• נולד כנראה בין 1400 ל-1410. ההערכה היא של \"המכלול\", כי היה תלמיד צעיר של מהר\"י וייל, שגר בנירנברג בשנים 1427–1429.\n• למד בישיבת נירנברג אצל רבי זלמן כ\"ץ ומהר\"י וייל.\n• התחתן עם בעסליין, בת רבי יואל מנירנברג.\n• 1429–1433: הוא ואשתו גרו מחוץ לנירנברג, וקיבלו כל שנה אישור לבקר את קרוביהם בעיר. בספר המס כתוב: \"שמעון, חתנו של יואל, עם אשתו פעסליין\".\n• שימש דיין בבית הדין של רבי זלמן כ\"ץ.\n• סוף 1444: רבי זלמן כ\"ץ נפטר. ב-4 בנובמבר 1444 העיר כבר קיבלה את אלמנתו. רק אז מונה רבי שמעון לרב העיר ולראש הישיבה, כך שכיהן זמן קצר מאוד.\n• נפטר בנירנברג בסביבות 1445 (ראו בפרק \"מתי נפטר?\").\n• שרדו 84 דפים בכתב ידו, עם פסקים וחידושים מרבותיו. כתב היד נמצא היום בספריית אוקספורד."], ["📅 מתי נפטר?", "יש שני מקורות, והם לא מסכימים לגמרי:\n• ספר המס של נירנברג: ב-1445 קלטה העיר מחדש את \"פעסל, אלמנת המאסטר שמעון\". כלומר, הוא נפטר עד 1445.\n• ההספד של בנו רבי יואל: נפטר בשנת ר\"ז (1446/1447), ביום שישי בצהריים.\nלכן נפטר כנראה בסביבות 1445. אולי השנה בהספד הועתקה עם טעות."], ["👩‍🦱 אשתו", "בעסליין (פעסליין), בת רבי יואל מנירנברג. מופיעה בכרטיס נפרד."], ["👨‍👦‍👦 ילדיו", "• ר' זעליגמן ז\"ק. נפטר בנירנברג ב-1497. מופיע בכרטיס נפרד.\n• רבי יואל ז\"ק, גם הוא מרבני נירנברג. הוא שכתב את ההספד על אביו. לא נוסף לעץ.\n• מנדל, באינגולשטאט ואחר כך בנירנברג. כך לפי כרטיס הרישום. לא נוסף לעץ.\n\nחתן אפשרי (בהשערה ברורה): רבי דוד טבלי שפרינץ, שהיה רב נירנברג אחרי רבי שמעון, מ-1449. לפי כרטיס הרישום מפרנקפורט הוא היה נשוי לרייני, בתו של \"המאסטר שמעון\". אבל לא בטוח שהכרטיס הזה מדבר על ר' שמעון שלנו (ראו בפרק הבא)."], ["❓ האם כרטיס הרישום מפרנקפורט מדבר עליו?", "בכרטיסי הרישום מפרנקפורט יש כרטיס בשם \"המאסטר שמעון מנירנברג\". לא בטוח שהכרטיס הזה מדבר על ר' שמעון שלנו.\n\nהסיבה: באותה תקופה חי עוד רב בשם שמעון. הוא גר בקלן ובפרנקפורט, ונפטר באיטליה בסביבות 1440. ייתכן שעורך הכרטיס חשב בטעות ששניהם אותו אדם, וכתב את שניהם בכרטיס אחד.\n\nבכרטיס הזה כתוב שלשמעון היו עוד חמישה ילדים: משה, יעקב, ליברמן, קופמן ורייני. אבל אם העורך טעה, הילדים האלה הם בכלל של השמעון השני. לכן לא הוספנו אותם לעץ.\nבעץ מופיע רק בנו זעליגמן, כי גם מקורות אחרים אומרים שהוא בנו של ר' שמעון ז\"ק."]]}, "g": []}, {"n": "בעסליין ז\"ק", "y": "~1410–>1445", "s": [{"k": "nurnberg", "r": "l", "t": [], "u": 0}], "c": {"n" מעסלינגן", "rel": "אביה של מיירע · חמיו של ר' איציק עסלינגן", "b": "בערך 1420–1435 (בהשערה ברורה)", "d": "1496", "place": "עסלינגן (Esslingen) ← פרנקפורט, בית השער (Zur Pforte)", "note": "לפי דף השושלת נפטר בשנת רנ\"ו (בערך 1496), וכך גם לפי כרטיס הרישום שלו מפרנקפורט (\"בסביבות 1496\"). מקורו בעסלינגן (Esslingen). כבר ב-1472 נרשם בפרנקפורט כחותנו של משה מלודן, ובשנים 1482–1486 גר בעיר עם אמו. מ-1487 גר בבית השער (Zur Pforte), שבו גרו קודם בתו פריידלין ובעלה, ובשנים 1488–1493 נרשם שם עם ילדיו. לפי דף השושלת היה חותנו של הרב משה מלודן, רב בפרנקפורט, וכרטיסי הרישום מאשרים זאת.", "flag": "שנת הלידה המשוערת (1420–1435) מחושבת מכך שבתו נישאה כבר בסביבות 1472. שמות הוריו ושם אשתו לא ידועים. נבדק ב-11.11.2026: בספר הורוביץ לא נמצאה מצבה שלו או אזכור שלו, בעמודים 10–20 (כתובות 103–231, השנים 1466–1570) ובמפתח השמות. מהשנים האלה שרדו רק כ-90 מצבות, ובכמה שנים אין אף אחת.", "src": "כרטיס הרישום \"Majer aus Esslingen, um 1496\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1400–1499, עמ' 152 · דף השושלת ששלחה המשפחה, 9.11.2026 · כרטיס הרישום של בתו \"Frojdlin zur Pforte, um 1498\": קובץ 1400–1499, עמ' 160", "x": [["📜 מה כתוב עליו בכרטיס הרישום מפרנקפורט", "שלמה אטלינגר אסף את כל הרשומות על יהודי פרנקפורט בכרטיסים, כרטיס לכל אדם (\"אלה תולדות\"). הכרטיס של ר' מאיר נקרא \"Majer aus Esslingen\", כלומר מאיר מעסלינגן, ולפיו נפטר בסביבות 1496.\n\nאלה הרשומות עליו, לפי הסדר:\n• בסביבות 1480: רשום עם אשתו וילדיו. השנה לא בטוחה.\n• 1482–1486: רשום בכל שנה \"מאיר מעסלינגן עם אמו\".\n• 1487: עבר לבית השער (Zur Pforte), הבית שבו גר קודם חתנו משה מלודן.\n• 1488–1493: רשום בבית השער עם ילדיו.\n• 1496: הרשומה האחרונה עליו. בסביבות השנה הזאת נפטר.\n\nמה לא רשום בכרטיס: שמות הוריו ושם אשתו. אין בכרטיס גם מספר מצבה, כלומר המצבה שלו לא נמצאה.\n\nהמקורות של הכרטיס: רשימות המס והמגורים של עיריית פרנקפורט, ותולדות חייו בקיצור בכתב העת \"Vorfahren\" (חוברת S, עמ' 33879)."], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nפריידלין (Frojdlin), אשת משה מלודן (Luden) מבית השער (Zur Pforte). נפטרה בסביבות 1498. לה כרטיס רישום משלה, ראו בסעיף \"בתו פריידלין\"\nמיידה (מיירע), אשת יצחק מבאפפינגן, מבית הוורד הלבן (Zur weissen Rose) ואחר כך מבית השער (Zur Pforte). נפטרה בסביבות 1514. מופיעה בכרטיס נפרד"], ["📜 בתו פריידלין ובית השער", "בכרטיס הרישום של בתו, \"Frojdlin zur Pforte, um 1498\":\n• 1472: בספרי החשבונות של העירייה כתוב: \"משה מלודן הוא חתנו של מאיר מעסלינגן\". זו הרשומה המוקדמת ביותר על ר' מאיר בפרנקפורט.\n• בסביבות 1475: \"פרוידלין, אשת משה מלודן\".\n• פריידלין ומשה היו בין הדיירים הראשונים של בית השער (Zur Pforte), שנבנה מחדש ב-1472–1474. מכאן מובן למה ר' מאיר עבר לבית הזה ב-1487.\n• הנישואים היו כנראה בסביבות 1472. משה מלודן נפטר בסביבות 1482.\n• בשורת האב: \"מאיר מעסלינגן מבית השער, נפטר בסביבות 1496\". בשורת האם: לא נרשם."], ["🔎 חיפוש", "שמות ההורים של ר' מאיר ושם אשתו לא רשומים באף כרטיס רישום, וגם לא שם אמו, שגרה איתו בפרנקפורט. לא נמצאה מצבה שלו בספר הורוביץ. גם ברשת לא נמצא מידע עליו מעסלינגן.\nנבדק ונפסל: בכרטיסי הרישום יש \"יעקב, בנו של מאיר\", שנפטר ב-1489, ועל מצבתו \"יעקב בן מאיר הלוי\". העורך כתב שלא הצליח לזהות את האב, ור' מאיר מעסלינגן לא ידוע כלוי, ולכן זה כנראה לא בנו.\nמקור שעוד לא נבדק: הספר של יואכים האן, \"Jüdisches Leben in Esslingen\" (1994), שיש בו רשימה של יהודי העיר. הוא לא סרוק ברשת."]]}, "g": [{"f": "g298", "c": "כרטיס הרישום של ר' מאיר מעסלינגן (Majer aus Esslingen), נפטר בסביבות 1496"}]}, {"n": "ר' זעליגמן ז\"ק", "y": "<1425–1497", "s": [{"k": "nurnberg", "r": "ld", "t": ["1497, נירנברג"], "u": 0}], "c": {"n": "ר' זעליגמן ז\"ק, אב\"ד נירנברג", "rel": "אביה של בריינלין ווירשלר · אב\"ד נירנברג", "b": "", "d": "1497, נירנברג", "place": "נירנברג", "note": "בנו של רבי שמעון ז\"ק, רבה של נירנברג, ושל בעסליין בת רבי יואל. גר בנירנברג כל חייו ונפטר שם ב-1497, שנה לפני גירוש היהודים מהעיר. רוב ילדיו ונכדיו עברו לפרנקפורט.", "flag": "שנת הלידה לא ידועה. ב-1445 כבר נקלט כתושב בנירנברג, ולכן נולד כנראה לפני 1425 (בהשערה ברורה). שם אשתו לא ידוע. התואר \"אב\"ד נירנברג\" בא מספרי יוחסין מאוחרים, ולא נמצא במקורות מהתקופה.", "src": "ג'ני (נמסר על ידי המשפחה), 9.11.2026 · הספר \"הישיבה הרמה בפיורדא\", עמ' 70 · כרטיס הרישום \"Zeligman Zak zu Nürnberg, 1497\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1400–1499, עמ' 156 · כרטיס בנו \"Zalman Zak, der Ältere, im Löwen, um 1496\": שם, עמ' 153 · כרטיסי נכדיו \"Zalman Zak aus Nürnberg, um 1508\" ו-\"Wajfes Zak aus Nürnberg, um 1508\": קובץ 1500–1599, עמ' 29 ו-28 · כרטיס חתנו \"ab\"d Jisrael Rheinbach, 20.4.1505\": שם, עמ' 17 · המכלול, ערך \"רבי שמעון ז\"ק\" (נבדק 13.11.2026), ושם: הרב ישראל פלס, \"מהר\"ר שמעון ז\"ק וקובץ מכתיבת ידו\", מוריה שנה יד; הרב משה פוליטנסקי, \"אלה תולדות - תולדות משפחת פוזן\", עמ' כה", "x": [["📅 חייו בקצרה", "• הוריו: רבי שמעון ז\"ק, רבה של נירנברג, ובעסליין בת רבי יואל.\n• 1445: העיר נירנברג קיבלה אותו כתושב. כתוב שם: \"זליגמן היהודי, בנו של המאסטר שמעון\".\n• 1489: רשום ברשימת יהודי נירנברג, \"Selikman Sack\".\n• 1497: נפטר בנירנברג. זכות המגורים שלו בעיר עברה לחתנו שלמה מוורמס, לנכדו פייבש ולחתנו מאיר פירשטלין.\n• 1498–1499: יהודי נירנברג גורשו מהעיר, ורוב משפחתו עברה לפרנקפורט."], ["👩‍🦱 אשתו", "שמה לא ידוע. לא רשום באף מקור."], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום שלו:\n1. בן שנפטר צעיר, ששמו לא ידוע. בנו: זלמן ז\"ק \"הצעיר\", שעבר לפרנקפורט ונפטר בסביבות 1508.\n2. ר' זלמן ז\"ק, \"זלמן מהסן\". גר לסירוגין בפרנקפורט, בבית האריה (Zum Löwen), ובנירנברג. נפטר בסביבות 1496. כנראה זה הדיין ר' זלמן ז\"ק מנירנברג.\n3. בן נוסף שנפטר צעיר, ששמו לא ידוע. בנו: פייבש ז\"ק, שנפטר בסביבות 1508.\n4. בריינלין, אשת מאיר פירשטלין (וירשלר). מופיעה בכרטיס נפרד.\n5. בת ששמה לא ידוע. נישאה קודם לשלמה מוורמס, ואחרי מותו (1497) לרב ישראל ריינבך, אב\"ד בפרנקפורט, שנפטר ב-1505."], ["🤔 האם היה אב\"ד נירנברג?", "בספרי היוחסין המאוחרים ובג'ני הוא נקרא \"אב\"ד נירנברג\". אבל בספרי המחקר על רבני נירנברג הוא לא מופיע ברשימת רבני העיר. מ-1449 היה רב העיר רבי דוד טבלי שפרינץ. לכן כנראה היה תלמיד חכם חשוב בקהילה, אבל לא בטוח שהיה הרב הראשי שלה."], ["🔎 מה לא נמצא", "• שם אשתו.\n• מצבה. בית הקברות היהודי של נירנברג נהרס אחרי הגירוש, ומצבות מהתקופה לא נשמרו."], ["📚 מאיפה המידע", "• כרטיס הרישום שלו מפרנקפורט (\"Zeligman Zak zu Nürnberg, 1497\"). העורך אסף בו רשומות מספרי המס של נירנברג.\n• כרטיסי הרישום של בנו זלמן, של נכדיו זלמן ופייבש ושל חתנו ישראל ריינבך.\n• הערך על אביו באנציקלופדיה \"המכלול\".\n• הספר \"הישיבה הרמה בפיורדא\" וג'ני."]]}, "g": [{"f": "g408", "c": "כרטיס הרישום של ר' זעליגמן ז\"ק בנירנברג, נפטר 1497 — בו כתוב על חתנו שלמה מוורמס"}]}, {"n": "משה הכהן מקוודלינבורג", "y": "–>1477", "s": [{"k": "quedlinburg", "r": "l", "t": ["קוודלינבורג (Quedlinburg)"], "u": 0}, {"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית הקלחת (Zum Kessel)"], "u": 0}, {"k": "mainz", "r": "l", "t": ["מיינץ (1475)"], "u": 0}], "c": {"n": "משה הכהן (Moses Cayn) מקוודלינבורג, מבית הקלחת (Zum Kessel)", "rel": "אביו של נתן הכהן מבית הקלחת (בהשערה)", "b": "", "d": "לא ידוע (אחרי 1477)", "place": "קוודלינבורג (Quedlinburg) ← פרנקפורט, בית הקלחת (Zum Kessel) ← מיינץ (1475)", "note": "כהן מהעיר קוודלינבורג שבצפון גרמניה. גר בפרנקפורט בבית הקלחת (Zum Kessel) בשנים 1466–1477, ואחר כך במיינץ. לפי עורך כרטיסי הרישום, הוא כנראה אבי משפחת הכהנים שגרה בבית הקלחת, וייתכן שהיה אביו של נתן הכהן.", "flag": "שנות חייו לא ידועות. הקשר לנתן הכהן הוא השערה. נבדק ב-13.11.2026: שמות הוריו לא נמצאו, ולכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום \"Mose aus Quedlinburg, um 1490\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1400–1499, עמ' 142 · A. Dietz, \"Stammbuch der Frankfurter Juden\" (1907), ערך \"Cahn\" (מס' 83)", "x": [["📅 חייו בקצרה", "• בסביבות 1463 עזב את קוודלינבורג. לא הייתה לו שם זכות מגורים קבועה.\n• 1466: הגיע לפרנקפורט, ונרשם כ\"משה כהן\", נשוי, בבית הקלחת (Zum Kessel). רשום שם עד 1477.\n• 1468: גרה איתו חמותו, בלה.\n• 1469: נזכר שיש לו אח בשם יואל.\n• 1474: קרובים שלו שהתנצרו תבעו ממנו כסף.\n• 1475: העיר מיינץ קיבלה אותו כתושב.\n• שנת הפטירה לא ידועה. עורך כרטיס הרישום כתב \"בסביבות 1490\", אבל ציין שבחר את השנה בלי מקור."], ["👨‍👩‍👧 משפחתו", "• אחיו: יואל.\n• נשותיו:\n   – הראשונה: בת של דוד מגרונינגן.\n   – השנייה, בסביבות 1466: בת של יוסלין אפשטיין סג\"ל, שנפטר ב-1502.\n• ילדיו: \"(? נטע מבית הקלחת, נפטר בסביבות 1512)\". כך כתוב בכרטיס, עם סימן שאלה. העורך משער גם שחיים מבופרד, שנפטר בסביבות 1518, היה בנו או חתנו.\n• הוריו: לא נרשמו."], ["❓ האם הוא אביו של נתן?", "זו השערה של עורך כרטיסי הרישום, והיא מסומנת אצלו בסימן שאלה. בספר של דיץ (1907) הוא מוזכר כ\"משה כהן\" שגר בפרנקפורט בשנות ה-1460 וה-1470, אבל דיץ לא כותב שנתן היה בנו."]]}, "g": []}, {"n": "יואל מוורמס", "y": "", "s": [{"k": "worms", "r": "l", "t": ["וורמס (Worms)"], "u": 0}], "c": {"n": "יואל מוורמס (Worms), אביה של אשת בייפס", "rel": "אביה של אשת בייפס מוורמס · סבה של עדל אייסלשטיין", "b": "", "d": "לא ידוע", "place": "וורמס (Worms)", "note": "אביה של אשת בייפס מוורמס, מבית הדוב בפרנקפורט. ידוע עליו רק מה שכתוב בכרטיסי הרישום של חתנו בייפס ושל נכדתו עדל.", "flag": "שנות חייו לא ידועות. נבדק ב-19.11.2026: אין לו כרטיס רישום, ושמות הוריו לא נמצאו, ולכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום של חתנו \"Wifes von Worms, um 1501\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1559, עמ' 7 · כרטיס הרישום של נכדתו \"Adel Ysselstejn, um 1562\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 14 · נבדקו גם: כרטיסי אלה תולדות משנים 1438–1505 (קובץ 1400–1499, וקובץ 1500–1559 עמ' 1–20)", "x": [["📜 מה ידוע עליו בוודאות", "• שמו: יואל, מוורמס (Worms).\n• בכרטיס הרישום של חתנו, בייפס מוורמס: \"נשא בת של יואל מוורמס, שנפטרה בסביבות 1496\". שם גם כתוב שב-1503 בייפס נרשם בספר המס של פרנקפורט כ\"חתנו של יואל מוורמס\".\n• בכרטיס הרישום של נכדתו עדל אייסלשטיין: \"אמה: בת יואל מוורמס\"."], ["🔎 מה לא נמצא", "• כרטיס רישום משלו בכרטיסי אלה תולדות. נבדקו כל הכרטיסים משנים 1438–1505.\n• מצבה בספר הורוביץ, שבו רק מצבות מבית הקברות בפרנקפורט.\n• שנות חייו, שם אשתו ושמות הוריו."]]}, "g": [{"f": "g425", "c": "כרטיס הרישום של עדל (אדל) אייסלשטיין, בת בייפס מוורמס, נפטרה בסביבות 1562"}, {"f": "g426", "c": "כרטיס הרישום של בייפס מוורמס, מבית הדוב, נפטר בסביבות 1501"}]}, {"n": "רבי מאיר וירשלר-פירשטלין", "y": "~1465–<1540", "s": [{"k": "nurnberg", "r": "l", "t": ["נירנברג, ואחר כך פרנקפורט"], "u": 0}, {"k": "frankfurt", "r": "ld", "t": ["נירנברג, ואחר כך פרנקפורט", "לפני 1540, כנראה בפרנקפורט"], "u": 1}], "c": {"n": "רבי מאיר וירשלר-פירשטלין (מהר\"ם וירשלר)", "rel": "אביה של פריידל בינגן · חתנו של ר' זעליגמן ז\"ק · תלמיד חכם בנירנברג ובפרנקפורט", "b": "בערך 1460–1470 (בהשערה ברורה)", "d": "לפני 1540, כנראה בפרנקפורט", "place": "נירנברג, ואחר כך פרנקפורט", "note": "רב ותלמיד חכם. גר קודם בנירנברג, ואחרי גירוש היהודים משם עבר לפרנקפורט. היה תלמיד של רבי יעקב מרגליות, וחכמי פרנקפורט מצטטים את דבריו בהגהות על ספר המרדכי. אשתו הייתה בריינלין, בת ר' זעליגמן ז\"ק מנירנברג.", "flag": "שנת הלידה (1460–1470) והפטירה (לפני 1540) הן הערכות. שמות הוריו לא ידועים; השמות בג'ני לא אומתו. נבדק ב-13.11.2026, ולכן סומן \"נחקר · הורים לא ידועים\". התפקיד \"ראש קהילת נירנברג מ-1491\" בא מג'ני ומ\"הישיבה הרמה בפיורדא\", ולא נמצא במסמכים מהתקופה; ב-1489 הוא עוד רשום כאורח.", "src": "ג'ני (נמסר על ידי המשפחה), 9.11.2026 · הספר \"הישיבה הרמה בפיורדא\", עמ' 70 · כרטיס הרישום של נכדתו \"Judde Bingen, 12.9.1581\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 163 · כרטיס הרישום של חותנו \"Zeligman Zak zu Nürnberg, 1497\": קובץ 1400–1499, עמ' 156 · המכלול, ערך \"רבי נפתלי הירץ טריוויש\" (נבדק 13.11.2026), ושם הציטוט מהגהות הרמ\"א למרדכי · פורום אוצר החכמה, \"רבי מאיר וירשליר מפרנקפורט והגהות רמ\"א למרדכי\" (forum.otzar.org, t=64833) · מצבת נכדתו יוטא בינג, בית הקברות היהודי העתיק בפרנקפורט (Steinheim-Institut, ffb0906)", "x": [["📅 חייו בקצרה", "• נולד כנראה בין 1460 ל-1470 (בהשערה ברורה). ב-1489 כבר היה נשוי.\n• בנירנברג קראו לו \"מאיר פירשטליין\" או \"מאיר מהסן\".\n• התחתן עם בריינלין, בת ר' זעליגמן ז\"ק. העיר נירנברג התירה לחותנו לקלוט אותו ואת אשתו.\n• 1489: ברשימת יהודי נירנברג הוא רשום כ\"אורח\", כלומר עוד בלי זכות מגורים קבועה.\n• 1497: חותנו נפטר, וחלק מזכות המגורים שלו בעיר עברה אליו.\n• 1498–1499: יהודי נירנברג גורשו, והוא עבר לפרנקפורט.\n• בפרנקפורט היה תלמיד חכם מוכר. לפי \"הישיבה הרמה בפיורדא\" כיהן שם כדיין.\n• נפטר כנראה לפני 1540, כי רבי נפתלי הירץ טריוויש, שנפטר ב-1540, כבר כותב עליו \"ז\"ל\"."], ["📖 התורה שלו", "• היה תלמיד של רבי יעקב מרגליות, ראש ישיבת נירנברג.\n• דבריו מצוטטים בהגהות על ספר המרדכי. למשל: \"ראיתי הלכה למעשה מאלופי החסיד מהרר\"ם וירשליר ז\"ל, והוא קיבל מרבו...\".\n• את הדברים האלה העתיק רבי נפתלי הירץ טריוויש, רבה של פרנקפורט, בעותק המרדכי שלו.\n• לפי דיון בפורום \"אוצר החכמה\", הוא היה מרבותיו של רבי נפתלי הירץ טריוויש. ב\"המכלול\" הוא רשום כבן דורו."], ["👨‍👩‍👧 משפחתו", "• הוריו: לא ידועים. בג'ני כתוב \"יצחק ובריינלין ווירשלער\", אבל לא נמצא לזה שום מקור אחר. גם יש סיבה לספק: לפי ג'ני אמו נקראה בריינלין, בדיוק כמו אשתו, ואולי שם התבלבלו ביניהן. לכן ההורים לא נוספו לעץ.\n• אשתו: בריינלין, בת ר' זעליגמן ז\"ק מנירנברג. מופיעה בכרטיס נפרד.\n• גיסו: הרב ישראל ריינבך, אב\"ד פרנקפורט, שהיה נשוי לאחות של אשתו.\n• בתו: פריידל, אשת הר\"ר משה בינגן. מופיעה בכרטיס נפרד.\n• נכדתו: יוטא בינג, שנפטרה בפרנקפורט בסוכות שמ\"ב (1581). על המצבה שלה כתוב: \"ואבי אמה היה מהרר\"ם וירשלר\". מופיעה בכרטיס נפרד."], ["📜 איפה הוא מוזכר", "• כרטיס הרישום של חותנו, \"Zeligman Zak zu Nürnberg, 1497\": \"מאיר פירשטליין, חתנו\", \"מאיר מהסן\" (1489), ו\"פירשטליין\" (1497).\n• כרטיס הרישום של נכדתו, \"Judde Bingen, 12.9.1581\": \"בת מאיר (המהר\"ם) וירשלר\".\n• מצבת נכדתו יוטא בינג בבית הקברות היהודי העתיק בפרנקפורט.\n• הגהות הרמ\"א על ספר המרדכי.\n• הספר \"הישיבה הרמה בפיורדא\", עמ' 70."], ["🔎 מה לא נמצא", "• כרטיס רישום משלו בפרנקפורט. בדקתי את כל הכרטיסים של אנשים בשם מאיר בשנים 1500–1559.\n• שנות חייו המדויקות ומצבה שלו.\n• מקור לשמות הוריו מלבד ג'ני.\n• לא בדקתי: הספר \"חצי גבורים\", שמזכיר אותו בשם \"ורשלר\", ונמצא רק למנויים באתר אוצר החכמה."]]}, "g": [{"f": "g263", "c": "כרטיס הרישום של יוטא בת משה בינגן, נפטרה 12.9.1581"}, {"f": "g214", "c": "ספר הורוביץ, עמ' 26: כתובת 284, מצבת יוטא בת ר' משה בינגן"}]}, {"n": "מיירע עסלינגן", "y": "–~1514", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית השער (Zur Pforte) ובית הוורד הלבן (Zur weissen Rose)"], "u": 0}], "c": {"n": "מרת מיירע, אשת ר' איציק עסלינגן", "rel": "אשתו של ר' איציק עסלינגן · בתו של ר' מאיר מעסלינגן", "b": "", "d": "בסביבות 1514", "place": "פרנקפורט, בית השער (Zur Pforte) ובית הוורד הלבן (Zur weissen Rose)", "note": "בתו של ר' מאיר מעסלינגן, ואשתו של הפרנס ר' איציק מבאפפינגן. בכרטיסי הרישום היא נקראת מיידה (Majde, Meida). נישאו עוד לפני שהגיעו לפרנקפורט: בתם שרה נישאה כבר בסביבות 1496. בפרנקפורט נרשמה עם בעלה בשנים 1496–1508 (\"איצינג ומיידה\"), בבית השער (Zur Pforte) ואחר כך בבית הוורד הלבן (Zur weissen Rose). מ-1510 רשום רק בעלה. נפטרה בסביבות 1514. אחותה: פריידלין, אשת משה מלודן (Luden) מבית השער (Zur Pforte).", "flag": "שנת הלידה לא ידועה. שנת הפטירה \"בסביבות 1514\" היא הערכה של עורך כרטיסי הרישום. בדף השושלת שמה \"מיירע\", ובכרטיסי הרישום \"Majde\" או \"Meida\". נבדק ב-11.11.2026: בספר הורוביץ לא נמצאה מצבה שלה או אזכור שלה, בעמודים 10–20 (כתובות 103–231, השנים 1466–1570) ובמפתח השמות. מהשנים האלה שרדו רק כ-90 מצבות, ובכמה שנים אין אף אחת.", "src": "כרטיס הרישום של אביה \"Majer aus Esslingen, um 1496\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1400–1499, עמ' 152 · כרטיס הרישום של בעלה \"Itsek aus Bopfingen, um 1525\": קובץ 1500–1599, עמ' 82 · מסירת המשפחה ודף השושלת, 9.11.2026 · כרטיס הרישום של בתה \"Sorchen, Frau des Koppelman, um 1540\": קובץ 1500–1599, עמ' 121", "x": [["אזכורה בכרטיסי הרישום של אביה ובעלה (אלה תולדות)", "אין לה כרטיס רישום משלה.\nבכרטיס של אביה, \"Majer aus Esslingen, um 1496\", ברשימת הילדים: \"Majde, אשת יצחק מבאפפינגן, מבית הוורד הלבן (Zur weissen Rose) ואחר כך מבית השער (Zur Pforte), נפטרה בסביבות 1514\".\nבכרטיס של בעלה, \"Itsek aus Bopfingen, um 1525\": \"נשא בסביבות 1494 את מיידה בת מאיר, שנפטרה בסביבות 1514\". (זו הערכה של העורך. הנישואים היו מוקדמים יותר, כי בתם שרה נישאה כבר בסביבות 1496.) ב-1496: \"בני הזוג איצינג ומיידה\"; כך גם ב-1499, 1502, 1505 ו-1508."], ["👨‍🦱 בעלה", "הפרנס ר' איציק (יצחק) מבאפפינגן, מבית השער (Zur Pforte) ומבית הוורד הלבן (Zur weissen Rose). עבר למיינץ ב-1515. מופיע בכרטיס נפרד"], ["👨‍👩‍👧 ילדיה", "ב-1506 היו לבעלה שבעה ילדים. לפי כרטיס הרישום שלו:\nשרה (שרכן), אשת קופלמן כ\"ץ. נישאה בסביבות 1496, ונפטרה בסביבות 1540. בכרטיס הרישום שלה: אביה ר' איציק מבאפפינגן, ואמה מיידה בת מאיר\nבת ששמה לא נרשם, אשת משה מבית השער (Zur Pforte)\nלפי כרטיס הרישום של הרב קלמן נתן הכהן, גם שינליין, אשתו של קלמן, הייתה בתה. מופיעה בכרטיס נפרד"]]}, "g": [{"f": "g297", "c": "כרטיס הרישום של ר' איציק מבאפפינגן (Itsek aus Bopfingen), \"נפטר בסביבות 1525\""}, {"f": "g298", "c": "כרטיס הרישום של ר' מאיר מעסלינגן (Majer aus Esslingen), נפטר בסביבות 1496"}]}, {"n": "ר' איציק עסלינגן", "y": "–~1525", "s": [{"k": "bopfingen", "r": "l", "t": ["באפפינגן (Bopfingen)"], "u": 0}, {"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית השער (Zur Pforte) ובית הוורד הלבן (Zur weissen Rose)"], "u": 0}, {"k": "mainz", "r": "ld", "t": ["מיינץ, וילצבאך (1515–1519)", "אחרי 1519, כנראה במיינץ"], "u": 1}], "c": {"n": "הפרנס ר' איציק עסלינגן, מבאפפינגן", "rel": "אביה של שינליין, אשת הרב קלמן נתן הכהן (בהשערה ברורה) · חתנו של ר' מאיר מעסלינגן", "b": "", "d": "אחרי 1519, כנראה במיינץ", "place": "באפפינגן (Bopfingen) ← פרנקפורט, בית השער (Zur Pforte) ובית הוורד הלבן (Zur weissen Rose) ← מיינץ, וילצבאך (1515–1519)", "note": "פרנס, ואחד העשירים בקהילת פרנקפורט. בא מהעיר באפפינגן (Bopfingen) שבדרום גרמניה. היה חתנו של ר' מאיר מעסלינגן, ולכן נקרא לפעמים גם \"איציק מעסלינגן\". גר בפרנקפורט כ-23 שנה, ובסוף ימיו עבר למיינץ, ושם כנראה נפטר.", "flag": "שנת הלידה לא ידועה. שנת הפטירה לא ידועה: עורך כרטיס הרישום העריך \"בסביבות 1525\", ולפי האוסמן עוד חי במיינץ ב-1519. האשה השנייה, הקשר לשינליין והקרובים האפשריים הם השערות. מצבה: נבדק ב-11.11.2026 בספר הורוביץ (פרנקפורט), בלי תוצאה. ב-13.11.2026 נבדק גם בית הקברות של מיינץ: מצבות מתחילת המאה ה-16 לא נשמרו שם.", "src": "כרטיס הרישום \"Itsek aus Bopfingen, um 1525\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599, עמ' 82 · כרטיס הרישום של חותנו \"Majer aus Esslingen, um 1496\" (קובץ 1400–1499, עמ' 152) · דף השושלת ששלחה המשפחה, 9.11.2026 · Dietz, \"Stammbuch der Frankfurter Juden\" (1907), עמ' 77–78 (ערך \"Esslingen\", מס' 156), ערך \"Bielefeld\" (מס' 45), עמ' 110 ורשימת משלמי המסים הגדולים · Ulrich Hausmann, \"Wohnen und Wirtschaften\", פרק II: \"Transitorische Existenz & reglementiertes Wohnen (1470–1591)\", regionalgeschichte.net, הערות 191–194, על פי BStAWü MIB 52 ו-Andernacht, Regesten, מס' 2616, 3999, 4091, 4227 · Alemannia Judaica, \"Jüdische Geschichte in Bopfingen\" · כרטיס הרישום של בתו \"Sorchen, Frau des Koppelman, um 1540\": קובץ 1500–1599, עמ' 121 · I. Kracauer, \"Geschichte der Juden in Frankfurt a. M.\", כרך 1 (1925), עמ' 279 (\"Jakob von Eßlingen\", 1516)", "x": [["📅 חייו בקצרה", "• מוצאו: העיר באפפינגן (Bopfingen) בדרום גרמניה.\n• התחתן עם מיידה, בת ר' מאיר מעסלינגן, עוד לפני שהגיעו לפרנקפורט.\n• 1492: מופיע לראשונה בפרנקפורט.\n• 1494–1495: עבר לגור בבית השער (Zur Pforte), הבית הראשון מימין בכניסה לרחוב היהודים.\n• 1506: עבר עם שבעת ילדיו לבית הוורד הלבן (Zur weissen Rose).\n• 1509–1513: היה מהעשירים בקהילה. שילם 80 גולדן מס, ואחר כך 96.\n• בסביבות 1514: אשתו מיידה נפטרה.\n• 1515: עבר למיינץ, לפרבר וילצבאך (Vilzbach) על הריין, עם אשתו (כנראה אשה שנייה), בנו ישראל וחתנו דוד.\n• 1517: נעצר בפרנקפורט, כי אמר במיינץ שאזרחי פרנקפורט מלווים כסף דרך יהודים. שוחרר בערבות. היה כבר זקן וחולה.\n• 1519: עוד חי במיינץ, והעיד שם במשפט.\n• נפטר כנראה במיינץ, אחרי 1519. מצבה שלו לא נמצאה."], ["👩‍🦱 נשותיו", "1. מיידה (מיירע), בת ר' מאיר מעסלינגן. נפטרה בסביבות 1514. מופיעה בכרטיס נפרד.\n2. אשה שנייה, ששמה לא ידוע (בהשערה ברורה). ב-1515 רשומה איתו \"אשתו\", אבל מיידה כבר נפטרה, ולכן כנראה התחתן שוב."], ["👨‍👩‍👧 ילדיו", "ב-1506 היו לו שבעה ילדים. אלה הידועים:\n• שרה (שרכן). נישאה בסביבות 1496 לקופלמן כ\"ץ, בן קלמן. גרו בכמה בתים ברחוב היהודים, ובסוף בבית הפיל (Zum Elefanten). נפטרה בסביבות 1540.\n• שינליין, אשת הרב קלמן נתן הכהן (בהשערה ברורה, ההסבר בפרק הבא). מופיעה בכרטיס נפרד.\n• בת ששמה לא ידוע, אשת משה מבית השער ומבית הוורד הלבן. היא נפטרה לפני 1508.\n• ישראל, בנו. נזכר איתו במיינץ ב-1515.\n• דוד, \"חתן חורג\" שלו, כלומר כנראה בעלה של בת אשתו השנייה. נזכר איתו במיינץ ב-1515."], ["🤔 למה שינליין נחשבת לבתו?", "אין מסמך שאומר זאת במפורש, אבל יש כמה רמזים:\n• בכרטיס של בעלה, הרב קלמן, כתוב שאשתו ואשת משה, חתנו של ר' איציק, היו אחיות.\n• אחרי שר' איציק עזב ב-1515, שינליין וילדיה עברו לגור בביתו, בית השער.\n• בנה מאיר נקרא לפעמים \"עסלינגן\", כמו המשפחה של ר' איציק.\n• ב-1519 העיד ר' איציק במשפט נגד אישה בשם \"שנלין\". ייתכן שזו שינליין.\n• בדף השושלת של המשפחה כתוב שבת של ר' איציק נישאה למשפחת הכהנים מבית הקלחת (Zum Kessel). כנראה הכוונה לקלמן.\nלכן בעץ שינליין מופיעה כבתם של ר' איציק ומיידה."], ["👥 קרובים אפשריים (השערה)", "• יעקב מעסלינגן: היה ממנהיגי יהודי פרנקפורט ב-1516. אולי בנו של ר' מאיר מעסלינגן, ואז הוא אחיה של מיידה. לא מוכח.\n• \"משה איציג מבאפפינגן\" (1506): ההיסטוריון דיץ חשב שהוא בנו של ר' איציק. ייתכן שזה דווקא חתנו משה."], ["🔎 מה עוד לא נמצא", "• שמות הוריו. הם חסרים גם בכרטיס הרישום של בתו שרה.\n• המצבה שלו. בפרנקפורט אין, ובמיינץ לא נשמרו מצבות מהתקופה שלו.\n• עוד מידע יכול להיות בשלושה ספרים שאינם סרוקים ברשת, ונמצאים רק בספריות: הספר של אנדרנאכט על יהודי פרנקפורט (1996), הספר של לאנג על יהודי שוואביה (2008), והספר של מילר על יהודי האזור של באפפינגן (1900)."], ["📚 מאיפה המידע", "• כרטיס הרישום שלו מפרנקפורט (\"Itsek aus Bopfingen\"): השנים בפרנקפורט, הבתים, אשתו מיידה ושתי בנות.\n• כרטיס הרישום של בתו שרה: שם אביה ואמה, והנישואים ב-1496.\n• הספר של דיץ על משפחות פרנקפורט (1907): העושר והמסים, ובתו שרה.\n• המאמר של האוסמן על יהודי מיינץ: המעבר למיינץ, המאסר ב-1517 והעדות ב-1519.\n• הספר של קרקאואר על יהודי פרנקפורט (1925): יעקב מעסלינגן.\n• כרטיס הרישום של הרב קלמן נתן הכהן: הקשר לשינליין."]]}, "g": [{"f": "g297", "c": "כרטיס הרישום של ר' איציק מבאפפינגן (Itsek aus Bopfingen), \"נפטר בסביבות 1525\""}]}, {"n": "אשת נתן · הקלחת (Zum Kessel)", "y": "~1458–", "s": [{"k": "frankfurt", "r": "l", "t": [], "u": 0}], "c": {"n": "אשתו של נתן הכהן מבית הקלחת (Zum Kessel)", "rel": "אשתו של נתן הכהן מבית הקלחת (Zum Kessel) · אמו של הרב קלמן נתן הכהן", "b": "בערך 1450–1465 (בהשערה ברורה)", "d": "", "place": "פרנקפורט", "note": "אשתו של נתן הכהן, ואמם של קלמן, זלמן וביילה. שמה ושמות הוריה לא ידועים.", "flag": "שמה, הוריה ושנות חייה לא ידועים. שנת הלידה מחושבת לפי נישואי בתה. נבדק ב-13.11.2026, ולכן סומנה \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום של בעלה \"Nāte zum Kessel, um 1512\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599, עמ' 39 · כרטיס הרישום של בנה \"Kalman z. Kessel, dann z. Pforte, um 1516\" · כרטיס הרישום של בתה \"Bejle zum Rad, dann zum gld. Schwan, um 1540\": שם, עמ' 120 · דף השושלת ששלחה המשפחה, 9.11.2026", "x": [["📜 מה ידוע עליה", "• היא אשתו של נתן הכהן מבית הקלחת (Zum Kessel).\n• ילדיה: הרב קלמן נתן הכהן, זלמן וביילה.\n• שמה לא כתוב באף מסמך. נבדקו שלושה כרטיסי רישום, ובכולם המקום של השם שלה ריק:\n   – בכרטיס של בעלה נתן.\n   – בכרטיס של בנה קלמן.\n   – בכרטיס של בתה ביילה."], ["📅 מתי חיה? (הערכה)", "• בתה ביילה התחתנה כבר בסביבות 1500.\n• לכן האם נולדה כנראה בין 1450 ל-1465.\nזו הערכה בלבד (בהשערה ברורה)."], ["❓ האם היא הבת של ר' איציק עסלינגן?", "לא.\n\nבדף השושלת של המשפחה כתוב שהבת של ר' איציק התחתנה עם נתן.\n\nאבל לפי המסמכים מפרנקפורט, הבת של ר' איציק התחתנה עם קלמן, הבן של נתן. שמה היה שינליין.\n\nלכן בעץ שינליין מופיעה כבת של ר' איציק, ולא האישה הזאת."], ["🔎 מה לא נמצא", "• שמה.\n• שמות הוריה.\n• שנת פטירתה והמצבה שלה."]]}, "g": []}, {"n": "הרב נתן (נטע) הכהן, מבית הקלחת (Zum Kessel)", "y": "–~1512", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט: בית הפיל (Zum Elefant), ואחר כך בית הקלחת (Zum Kessel)"], "u": 0}], "c": {"n": "הרב נתן (נטע) הכהן, מבית הקלחת (Zum Kessel)", "rel": "אביו של הרב קלמן נתן הכהן", "b": "", "d": "בסביבות 1512", "place": "פרנקפורט: בית הפיל (Zum Elefant), ואחר כך בית הקלחת (Zum Kessel)", "note": "כהן, ואבי משפחת הכהנים (Cahn) של פרנקפורט. גר ברחוב היהודים בפרנקפורט, ומ-1505 בערך בבית הקלחת (Zum Kessel). נפטר בסביבות 1512. אביו היה כנראה משה הכהן מקוודלינבורג, אבל זו השערה.", "flag": "שנת הלידה לא ידועה; שנת הפטירה משוערת. אביו משה מקוודלינבורג הוא השערה: בכרטיס הרישום של משה הוא מסומן בסימן שאלה, ודיץ לא מקשר ביניהם. גם שנת ההגעה לפרנקפורט שונה: לפי כרטיסי הרישום 1487, לפי דיץ 1505.", "src": "כרטיס הרישום \"Nāte zum Kessel, um 1512\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599, עמ' 39 · כרטיס הרישום \"Mose aus Quedlinburg, um 1490\": קובץ 1400–1499, עמ' 142 · A. Dietz, \"Stammbuch der Frankfurter Juden\" (1907), ערך \"Cahn\" (מס' 83) · כרטיס הרישום מפרנקפורט, מסירת המשפחה, 9.11.2026 · Alexander Dietz, Stammbuch der Frankfurter Juden (1907), משפחה 85 \"Cahn\", עמ' 86 ואילך", "x": [["📅 חייו בקצרה", "• 1487: ראשון האזכורים שלו בפרנקפורט. \"נתן כהן\" נענש בעיר בגלל יחסים עם אישה נוצרייה.\n• 1497 ותחילת המאה ה-16: מוזכר במסמכים על החרמת ספרים. פרטי המקרה לא ידועים.\n• 1502–1508: שויך לבית הפיל (Zum Elefant), ונדרש להחזיק אצלו את רבי ליבמן מבית הפיל.\n• בערך 1505: לפי דיץ, \"הרב נתן כהן\", בנו קלמן ואשת קלמן שינה התקבלו בפרנקפורט וקיבלו את בית הקלחת (Zum Kessel). הבית התפנה כשמת יוסלין מקלן.\n• 1510–1512: רשום בבית הקלחת (Zum Kessel).\n• בסביבות 1512: נפטר."], ["👨‍👩‍👧 משפחתו", "• אביו: כנראה משה הכהן מקוודלינבורג (בהשערה, ראו בפרק הבא). מופיע בכרטיס נפרד.\n• אשתו: שמה לא ידוע. מופיעה בכרטיס נפרד.\n• ילדיו, לפי כרטיס הרישום:\n   – הרב קלמן נתן הכהן, מבית הקלחת (Zum Kessel) ואחר כך מבית השער (Zur Pforte). נפטר בסביבות 1516. מופיע בכרטיס נפרד.\n   – זלמן, מבית הקלחת (Zum Kessel). נזכר בשנים 1509–1515 בערך.\n   – ביילה, מבית הגלגל (Zum Rad) ואחר כך מבית הברבור המוזהב (Zum goldenen Schwan). אשת גומפל, ואחר כך אשת משה סג\"ל. נפטרה בסביבות 1540."], ["❓ מי היה אביו? שני מקורות לא מסכימים", "• כרטיסי הרישום: בכרטיס של משה מקוודלינבורג, שגר בבית הקלחת משנת 1466, כתוב בשורת הילדים \"(? נטע מבית הקלחת, נפטר בסביבות 1512)\". כלומר, העורך חשב שנתן הוא כנראה בנו, אבל לא היה בטוח. זה גם מתאים לכך שנתן כבר היה בפרנקפורט ב-1487.\n• דיץ (1907): לפי דיץ, נתן הגיע לפרנקפורט רק ב-1505, וכנראה בא מנירנברג אחרי הגירוש משם. את משה מקוודלינבורג הוא מזכיר כאדם נפרד, ולא כאביו.\nלכן בעץ משה מופיע כאביו של נתן בהשערה בלבד."], ["🔎 מה לא נמצא", "• שנת הלידה שלו ושם אשתו.\n• המצבה שלו. בספר הורוביץ לא נמצאה מצבה שלו (נבדק ב-11.11.2026, בעמודים 10–20 ובמפתח השמות). מהשנים האלה שרדו רק כ-90 מצבות."], ["📖 מה כותב דיץ על משפחת הכהנים", "אלכסנדר דיץ, בספר השושלות של יהודי פרנקפורט (1907), מקדיש למשפחה ערך משלה: משפחה מספר 85, \"Cahn\". מה שהוא כותב:\n• זו משפחת הכהנים הוותיקה ביותר ברחוב היהודים, ובמאה ה-16 גם החשובה שבהן.\n• אפשר לעקוב אחריה ברצף עד ימיו של דיץ. זה נדיר, והסיבה היא שהמשפחה נשארה דורות רבים באותם בתי אב.\n• השם נכתב בדרכים שונות: Cahn, Cahen, Katz, ובעבר גם Cayn ו-Kayn. הכול אותו דבר: כהן.\n• בתי המשפחה: בית השער, ולידו הבתים שנחתכו ממנו או נבנו לצדו, בית המניפה (Zum Wedel) ובית הדלת הירוקה (Zur grünen Tür) משנת 1570, בית הדלת האדומה (Zur roten Tür) משנת 1600, ובית המלקחיים המוזהבים (Zur goldenen Zange) משנת 1601.\n• בשנת 1575 נכתב על שלושת בתי המשפחה שליד השער שיש להם מגרש גדול ושהם בנויים למופת.\n• בתחריט שמתאר את ביזת רחוב היהודים בשנת 1614 אפשר לראות בבירור את בית הפינה שליד השער.\nשושלת הדורות אצל דיץ זהה לזו שבאילן: נתן, בנו קלמן ואלמנתו שינלין, ואחריהם שני האחים מאיר וקלמן \"הזקן\"."]]}, "g": [{"f": "g191", "c": "כרטיס הרישום של נתן הכהן מבית הקלחת (Zum Kessel) · פרנקפורט"}]}, {"n": "רוזלין", "y": "~1482–>1555", "s": [{"k": "bingen", "r": "l", "t": ["כנראה בינגן"], "u": 1}, {"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית הקנקן (Zur Kanne)"], "u": 0}], "c": {"n": "רוזלין (Rejzlin, Röslin), אמו של שאול בינג", "rel": "אמו של הפרנס שאול בינג", "b": "בערך 1475–1490 (בהשערה ברורה)", "d": "אחרי 1555", "place": "כנראה בינגן ← פרנקפורט, בית הקנקן (Zur Kanne)", "note": "אמו של הפרנס שאול בינג. אחרי מות בעלה הראשון, כנראה מבינגן, נישאה ליעקב מהיילברון מבית הקנקן (Zur Kanne) בפרנקפורט. חיה בפרנקפורט לפחות מ-1530 עד 1555.", "flag": "שנת הלידה (1475–1490) היא הערכה; נפטרה אחרי 1555. שם בעלה הראשון ושמות הוריה לא ידועים. נבדק ב-13.11.2026: אין לה כרטיס רישום משלה (גם לא בקובץ 1560–1599), ולכן סומנה \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום של בעלה \"Jakow aus Heilbronn\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599, עמ' 135 · כרטיס הרישום של בנה \"Ša'ūl zum Fisch\" · מסירת המשפחה, 9.11.2026", "x": [["📜 מה ידוע עליה", "• היא אמו של הפרנס שאול בינג.\n• שמה כתוב במסמכים בשתי צורות: רייזלין (Rejzlin) ורוזלין (Röslin). זה אותו שם, ופירושו \"ורד קטן\".\n• אין לה כרטיס רישום משלה. מה שידוע עליה בא מכרטיס הרישום של בעלה השני, יעקב מהיילברון, ומהכרטיס של בנה שאול."], ["👨‍🦱 בעליה", "1. בעלה הראשון: שמו לא ידוע. בנה שאול נקרא \"בינגן\", ולכן בעלה הראשון היה כנראה מהעיר בינגן (Bingen). הוא אביו של שאול.\n2. בעלה השני: יעקב מהיילברון, מבית הקנקן (Zur Kanne) בפרנקפורט. נפטר לפני 1549. רוזלין הייתה אשתו השנייה. אשתו הראשונה, מסביבות 1513, הייתה גוטה, בתו של הרב זלמן מנירנברג מבית הקנקן."], ["📅 חייה בקצרה", "• נולדה כנראה בין 1475 ל-1490 (בהשערה ברורה), כי בנה שאול כבר היה נשוי ואב לילדים ב-1530.\n• 1530: גרה עם בעלה יעקב בבית הקנקן (Zur Kanne). גם בנה שאול, אשתו צירלין וילדיהם הקטנים גרו איתם.\n• 1530–1533: רשומה בפרנקפורט עם זכות מגורים בעיר. אחר כך שאול ומשפחתו עברו לבית הדג (Zum Fisch).\n• בסביבות 1538: בנה שאול נפטר.\n• 1542, 1545, 1548: רשומה בתיקי העירייה.\n• 1549, 1552, 1555: רשומה כאלמנה, כלומר יעקב כבר נפטר.\n• ייתכן שהיא רשומה גם ב-1567 (הכתב בכרטיס לא ברור).\n• נפטרה אחרי 1555."], ["🔎 מה לא נמצא", "• שמות הוריה.\n• שם בעלה הראשון.\n• שנת פטירתה המדויקת והמצבה שלה. בספר הורוביץ לא נמצאה מצבה שלה (נבדק ב-11.11.2026)."]]}, "g": [{"f": "g267", "c": "כרטיס הרישום של יעקב מהיילברון, מבית הקנקן (Zur Kanne), בעלה השני של רייזלין"}]}, {"n": "בת יואל מוורמס", "y": "–~1496", "s": [{"k": "frankfurt", "r": "ld", "t": ["בסביבות 1496, פרנקפורט"], "u": 0}], "c": {"n": "בת יואל מוורמס, אשת בייפס מבית הדוב", "rel": "אמה של עדל אייסלשטיין · סבתה של שינלה", "b": "", "d": "בסביבות 1496, פרנקפורט", "place": "פרנקפורט", "note": "שמה הפרטי לא ידוע. בתו של יואל מוורמס (Worms), ואשתו של בייפס מוורמס, מבית הדוב (Zum Bär) בפרנקפורט. נפטרה בסביבות 1496.", "flag": "שמה ושנת הלידה לא ידועים.", "src": "כרטיס הרישום של בעלה \"Wifes von Worms, um 1501\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1559, עמ' 7 · כרטיס הרישום של בתה \"Adel Ysselstejn, um 1562\", קובץ 1560–1599, עמ' 14", "x": [["📜 מה ידוע עליה בוודאות", "• בכרטיס הרישום של בעלה: \"נשא בת של יואל מוורמס, שנפטרה בסביבות 1496\".\n• בכרטיס הרישום של בתה עדל: \"אמה: בת יואל מוורמס\".\n• ב-1496 בעלה רשום כאלמן, וב-1503 הוא נרשם כ\"חתנו של יואל מוורמס\"."], ["🔎 מה לא נמצא", "• שמה הפרטי.\n• כרטיס רישום משלה, ומצבה בספר הורוביץ."]]}, "g": [{"f": "g425", "c": "כרטיס הרישום של עדל (אדל) אייסלשטיין, בת בייפס מוורמס, נפטרה בסביבות 1562"}, {"f": "g426", "c": "כרטיס הרישום של בייפס מוורמס, מבית הדוב, נפטר בסביבות 1501"}]}, {"n": "בייפס מוורמס", "y": "–~1501", "s": [{"k": "frankfurt", "r": "ld", "t": ["בסביבות 1501, פרנקפורט"], "u": 0}], "c": {"n": "בייפס (וייפס, ביפוס) מוורמס, מבית הדוב (Zum Bär)", "rel": "אביה של עדל אייסלשטיין · סבה של שינלה", "b": "", "d": "בסביבות 1501, פרנקפורט", "place": "פרנקפורט", "note": "בא מוורמס (Worms), וגר בפרנקפורט בבית הדוב (Zum Bär). יש עליו מסמכים מ-1486 עד 1501. ב-1490 וב-1492 היה \"בוימייסטר\" (Baumeister) של הקהילה. אשתו, בת יואל מוורמס, נפטרה בסביבות 1496. ב-1502 הוא כבר לא היה בחיים.", "flag": "שנת הלידה ושמות הוריו לא ידועים. אין לו מצבה בספר הורוביץ. נבדק ב-19.11.2026: שמות הוריו לא נמצאו, ולכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום \"Wifes von Worms, um 1501\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1559, עמ' 7", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Wifes von Worms\n📅 נפטר: בסביבות 1501\n📖 יש עליו תיאור חיים במקור נוסף (Vorf. R.17, עמ' 395).\n📜 רשומות:\n• 1486–1501: מסמכים רבים בבית הדוב\n• 1490: \"ביפוס מוורמס\"\n• 1490 ו-1492: בוימייסטר (Baumeister)\n• 1491–1502: בבית הדוב\n• 1496: אלמן\n• 1498: כלתו גרה בהאם (Hamm)\n• 1499 ו-1502: כבר נפטר\n• 1503: \"חתנו של יואל מוורמס\"\n🏠 בתים: בוורמס, ואחר כך בפרנקפורט, בבית הדוב\n👨 אביו ואמו: לא רשומים.\n💍 אשתו: בת יואל מוורמס. נפטרה בסביבות 1496."], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום של בייפס:\nגומפרכט, מבית הדוב (Zum Bär). נפטר בסביבות 1501\nבן שגר בהאם (Hamm), 1498\nרכלה, אשת יואל ממילהאוזן (Mühlhausen). ב-1502 וב-1503 רשומים בפרנקפורט, ושם ויתרו על זכות המגורים\nעדל, אשת יצחק מאייסלשטיין, מבית הדוב ואחר כך מבית הוורד הלבן (Zur weissen Rose). נפטרה בסביבות 1562. מופיעה בכרטיס נפרד\nאנדה, אשת חיים כ\"ץ מפרידברג, מבית הדוב. נפטרה בסביבות 1509\nגוטלין, אשת חיים כ\"ץ מפרידברג, מבית הדוב. נפטרה בסביבות 1552\nבת ששמה לא נקרא, אשת שמואל מבית הדוב, ואחר כך מבית הקלחת (Zum Kessel). הוא נפטר בסביבות 1508\nבת ששמה לא נקרא, אשת מור (אולי מרדכי)"]]}, "g": [{"f": "g426", "c": "כרטיס הרישום של בייפס מוורמס, מבית הדוב, נפטר בסביבות 1501"}, {"f": "g425", "c": "כרטיס הרישום של עדל (אדל) אייסלשטיין, בת בייפס מוורמס, נפטרה בסביבות 1562"}]}, {"n": "ר' אשר (אמשל) מנירנברג", "y": "", "s": [{"k": "nurnberg", "r": "l", "t": [], "u": 0}], "c": {"n": "ר' אשר (אמשל), מנירנברג", "rel": "אביו של הרב ישראל ריינבך", "b": "", "d": "לא ידוע. נפטר לפני בנו, שנפטר ב-1505", "place": "נירנברג", "note": "אביו של הרב ישראל ריינבך, אב\"ד פרנקפורט. שמו העברי: אשר. השם של יום-יום: אמשל. גר בנירנברג. לא ידוע עליו דבר נוסף, ולא נמצאו תאריכי חייו.", "flag": "שנות חייו לא ידועות. לא נמצא עליו שום מקור עצמאי, רק אזכורים כאביו של ישראל.", "src": "כרטיס הרישום של בנו \"ab\"d Jisrael Rheinbach, 20.4.1505\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ ⁦1500–1559⁩, עמ' 17 · נוסח המצבה של בנו: M. Horovitz (1901), עמ' 13, כתובת 142 · Alexander Dietz, Stammbuch der Frankfurter Juden (1907), משפחה 167 \"Fritzlar\" (עמ' 95), ורשימת השמות לפי מקומות, ערך \"Rheinbach\"", "x": [["📜 מה ידוע עליו", "כל מה שידוע עליו בא משני מקורות, ושניהם מזכירים אותו רק כאביו של ישראל:\n• המצבה של בנו (הורוביץ, כתובת 142): \"מה\"ר ישראל בן הה\"ר אשר\". \"הה\"ר\" הוא קיצור של \"הרב רבי\", ולכן גם הוא נשא תואר של רב.\n• כרטיס הרישום של בנו: \"אביו: אמשל, מנירנברג\".\n• דיץ, בספר השושלות של יהודי פרנקפורט, כותב גם הוא: \"ישראל המכונה שטרלה, בן אשר\". זה מקור שלישי לשם אשר.\nאשר ואמשל הם אותו אדם: אשר הוא השם העברי, ואמשל הוא השם של יום-יום."], ["❓ מי היה אביו", "חיפשנו, ולא מצאנו. אלה הממצאים:\n• בכרטיס הרישום של בנו כתוב, עם סימן שאלה של העורך עצמו: \"אמשל בן (? זלמן שטרליין) מנירנברג\". כלומר גם העורך רק שיער שאביו היה זלמן שטרליין.\n• חיפשנו את זלמן שטרליין בספר ההיסטוריה של יהודי נירנברג ופירת (ברבק), ולא נמצא.\n• חיפשנו בספר המחקר של קספר-הולטקוטה. ברשימת קבלת התושבים שלה (עמ' 578) מופיע ישראל ריינבך, אבל שם אביו לא נרשם כלל.\n• חיפשנו ברשת בכל צורות הכתיב. לא נמצא שום יהודי בשם הזה בנירנברג.\nהמקור היחיד שעוד יכול לעזור הוא פנקס מס היהודים של נירנברג, שממנו ציטט העורך. הוא נמצא בארכיון ולא סרוק."], ["🏙️ נירנברג באותן שנים", "המשפחה חיה בנירנברג, שהייתה אז אחת הקהילות החשובות באשכנז.\nב-⁦1498–1499⁩ גורשו היהודים מנירנברג, ורוב הקהילה עברה לפרנקפורט. בנו ישראל כבר היה אז בפרנקפורט."]]}, "g": [{"f": "g327", "c": "כרטיס הרישום של הרב ישראל ריינבך, אב\"ד, נפטר 20.4.1505"}]}, {"n": "קופ מגלנהויזן", "y": "–~1555", "s": [{"k": "gelnhausen", "r": "ld", "t": ["בסביבות 1555, גלנהויזן"], "u": 0}], "c": {"n": "קופ מגלנהויזן סג\"ל", "rel": "אביו של שמואל גלנהויזן · סבו של זליגמן גלנהויזן", "b": "", "d": "בסביבות 1555, גלנהויזן", "place": "גלנהויזן", "note": "גר בעיר גלנהויזן (Gelnhausen), ולא בפרנקפורט. כל מה שידוע עליו בא ממסמך הירושה שלו מ-13.4.1556, שבו רשומים כל ילדיו.", "flag": "שנת הלידה ושמות הוריו לא ידועים. אין לו מצבה בספר הורוביץ. נבדק ב-19.11.2026: שמות הוריו לא נמצאו, ולכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום \"Kopp zu Gelnhausen, um 1555\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1559, עמ' 172", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Kopp zu Gelnhausen\n📅 נפטר: בסביבות 1555\n📜 13.4.1556: מסמך ירושה, שבו כל היורשים שלו\n🏠 בית: בגלנהויזן\n👨 אביו: השם לא נרשם, רק \"סג\"ל\".\n👨‍👩‍👧 ילדיו:\n• שמואל גלנהויזן, מבית המנורה ואחר כך מבית הוורד הלבן. נפטר בסביבות 1572\n• דוד מגלנהויזן\n• משה מקרויצנך (Kreuznach)\n• אברהם מדורטמונד. נפטר לפני אביו, והשאיר ילדים: דוד מדורטמונד, שמול, גוטשלק, הירץ וגודה\n• שרה, אשת יצחק מלאובנהיים. הייתה לה בת ששילמה מס בפרנקפורט ב-1556\n• גוטלין, אשת משה מבית הטבעת השחורה, ואחר כך מבית הטבעת הלבנה. נפטרה בסביבות 1599\n• מינדלה, אשת גוטשלק סג\"ל מבית הטבעת השחורה. נפטרה בסביבות 1555\n• דולצה, מנישואים אחרים של קופ"]]}, "g": [{"f": "g428", "c": "כרטיס הרישום של קופ מגלנהויזן סג\"ל, נפטר בסביבות 1555"}, {"f": "g427", "c": "כרטיס הרישום של שמואל גלנהויזן מבית המנורה ומבית הוורד הלבן, נפטר בסביבות 1572"}]}, {"n": "מאיר מגלנהויזן", "y": "–~1568", "s": [{"k": "frankfurt", "r": "ld", "t": ["בסביבות 1568, פרנקפורט"], "u": 0}], "c": {"n": "מאיר מגלנהויזן, הבוימייסטר (פרנס), מבית השושנה ומבית המנורה", "rel": "כנראה אביה של גולדה · כנראה סבו של זליגמן גלנהויזן", "b": "", "d": "בסביבות 1568, פרנקפורט", "place": "פרנקפורט", "note": "גר בבית השושנה (Zur Lilie), ואחר כך בבית המנורה (Zur Leuchte). ב-1560 היה בוימייסטר, כלומר פרנס של הקהילה. לפי עורך כרטיסי הרישום, גולדה, אשת שמואל גלנהויזן, הייתה כנראה בתו.", "flag": "שנת הלידה לא ידועה. אין לו מצבה בספר הורוביץ. הקשר לגולדה הוא \"כנראה\" אצל העורך, ולכן הקו באילן מקווקו. בכרטיס של אטלינגר הנישואים למרלין מחוקים, אבל אצל דיץ היא אשתו. נבדק ב-19.11.2026: לפי כרטיסי הרישום, שמות הוריו לא ידועים, ולכן סומן \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום \"Majer aus Gelnhausen, um 1568\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 48 · A. Dietz, \"Stammbuch der Frankfurter Juden\" (1907), ערך 185 (Gelhäuser IV zur weissen Rose) וערך 183 (Gelhäuser II zur Leuchte) · כרטיס הרישום \"Zalman von Kronberg (von Eppstein), um 1541\": כרטיסי הרישום \"אלה תולדות\", קובץ 1500–1559, עמ' 124", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Majer aus Gelnhausen\n📅 נפטר: בסביבות 1568\n📖 תיאור חייו מופיע ב-Vorfahren, חוברת N.1, עמ' 347.\n📜 רשומות (בתיקי הבתים, השושנה, הוורד הלבן והמנורה, מהשנים 1530–1566):\n• 1530–1533: בני הזוג מאיר מגלנהויזן ומרלין, עם בתם וחתנם, קיבלו זכות ישיבה בבית השושנה\n• 1537–1540: בבית השושנה\n• 1551–1554: מאיר ובונה, בני זוג, בבית הוורד הלבן. לפי העורך כנראה טעות של סופר העירייה, כי שם גרו בני גלנהויזן האחרים\n• 1552–1566: בבית המנורה\n• 1560: בוימייסטר (פרנס)\n🏠 בתים: השושנה (Zur Lilie), ואחר כך המנורה (Zur Leuchte), שהופרד ממנה\n👨 אביו: לא נרשם.\n👩 אמו: לא נרשמה.\n💍 נשותיו:\n• מרלין בת אברלין. בכרטיס השורה הזאת מחוקה\n• בונה. נזכרת לאחרונה ב-1567\n👨‍👩‍👧 ילדיו:\n• זלמן גלנהויזן, מבית הוורד הלבן ואחר כך מבית המנורה. נפטר 24.3.1605\n• נטע גלנהויזן, מבית המנורה. ב-1568 היה תחת אפוטרופסות של בייפס מבית השער\n• בלום, אשת זיסליין מבית השושנה. נפטרה בסביבות 1596\n• הינדלן, אשת וייבס כ\"ץ מבית השער. נפטרה 17.4.1601\n📝 הערת העורך: גולדה, אשת שמואל מגלנהויזן, מבית המנורה ואחר כך מבית הוורד הלבן, הייתה כנראה בתו."], ["📖 מהספר של דיץ", "מאיר מגלנהויזן, \"הבוימייסטר העשיר\", בנם של שלמה (זלמלין) מגלנהויזן ושל פורלינה. נשוי למרלין, בת אברלין נוימרקט. ב-1530 בבית השושנה, מ-1552 בבית המנורה, ועדיין נזכר ב-1565."], ["🔎 מי היו הוריו?", "• בכרטיס הרישום של מאיר (אטלינגר) לא כתוב מי היו הוריו. כתוב רק שהוא לוי (סג\"ל).\n• בספר של דיץ (1907) כתוב שהוריו היו שלמה (זלמלין) מגלנהויזן, שנקרא גם \"מקרונברג\", ופורלינה.\n• אצל אטלינגר יש כרטיס רישום של \"זלמן מקרונברג\", מבית הכתר (Zur Krone), שנפטר בסביבות 1541. בכרטיס הזה אשתו היא צרלין בת יוסל אפשטיין, ולא פורלינה. מאיר לא רשום שם בין ילדיו.\n• לכן הקשר שדיץ כותב עליו לא מאושר בכרטיסי הרישום."]]}, "g": [{"f": "g429", "c": "כרטיס הרישום של מאיר מגלנהויזן, הבוימייסטר, נפטר בסביבות 1568"}]}, {"n": "הר\"ר משה בינגן ממיינץ", "y": "–<1530", "s": [{"k": "bingen", "r": "l", "t": [], "u": 0}, {"k": "mainz", "r": "ld", "t": ["וילצבאך, ליד מיינץ (1517)", "מיינץ, בית הבלוט (Zur Eichel)", "לפני סתיו 1530, כנראה במיינץ"], "u": 1}], "c": {"n": "הר\"ר משה בינגן ממיינץ", "rel": "אביו של הר\"ר מאיר בינגן · בעלה של פריידל בינגן", "b": "", "d": "לפני סתיו 1530, כנראה במיינץ", "place": "בינגן ← וילצבאך, ליד מיינץ (1517) ← מיינץ, בית הבלוט (Zur Eichel)", "note": "יהודי מבינגן שעל הריין. אחרי שיהודי בינגן גורשו, עבר לאזור מיינץ: קודם לפרבר וילצבאך, ואחר כך לבית הבלוט (Zur Eichel) ברחוב היהודים של מיינץ. אשתו הייתה פריידל, בת רבי מאיר וירשלר. נפטר לפני סתיו 1530, ובניו הקטנים עברו לפרנקפורט.", "flag": "שנת הלידה לא ידועה. הפטירה \"לפני סתיו 1530\" מחושבת מכך שבניו הקטנים התקבלו אז בפרנקפורט. הזיהוי עם \"משה מבינגן\" מ-1517 סביר מאוד (גם האוסמן כותב כך), אבל לא מוכח לגמרי. תאריך כתב החסות: 3.2.1517 לפי המסמך המקורי; בספר של שאב כתוב פעם 3 ביולי ופעם 3 בפברואר. שם אשתו פריידל ומה שמעליה נשענים על מסורת המשפחה, ומאושרים בחלקם במצבת בתו יוטא.", "src": "כרטיסי הרישום של בניו: כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599 (\"der lange Jitshak Bingen\", עמ' 178, וכרטיס הר\"ר מאיר בינגן) · Ulrich Hausmann, \"Wohnen und Wirtschaften\", פרק II, regionalgeschichte.net, הערות 197, 220–222, על פי BStAWü MIB 52, fol. 53r–54r (3.2.1517), Battenberg, Quellen, מס' 1190, Andernacht, Regesten II, מס' 325 (1533), StadtAMz 13/122 (1534), ו-Dietz, Stammbuch, עמ' 31 · K. A. Schaab, \"Diplomatische Geschichte der Juden zu Mainz\" (1855), עמ' 164–166 · R. Grünfeld, \"Zur Geschichte der Juden in Bingen a. Rhein\" (1905), עמ' 14–15 · מצבת בתו יוטא בינג, בית הקברות היהודי העתיק בפרנקפורט (Steinheim-Institut, ffb0906) · שם אשתו ומוצאה: מסירת המשפחה, 9.11.2026", "x": [["📅 חייו בקצרה", "• מוצאו מהעיר בינגן (Bingen) שעל הריין.\n• בערך 1507: יהודי בינגן גורשו מהעיר.\n• 3 בפברואר 1517: הארכיבישוף אלברכט ממיינץ נתן לו אישור לגור שבע שנים בווילצבאך, פרבר של מיינץ, עם אשתו, ילדיו, משרת ומשרתת. הוא שילם 12 גולדן בשנה, והותר לו להלוות כסף ולסחור. הוריו קיבלו רשות לבקר אצלו, כלומר הם עוד היו בחיים.\n• בערך 1524–1525: עבר כנראה לגור ברחוב היהודים של מיינץ, בבית הבלוט (Zur Eichel). זה היה בית גדול ומטופח, כי שכר הדירה שלו היה גבוה מהרגיל. ממול היה בית התפילה של הקהילה.\n• לפני סתיו 1530: נפטר, כנראה במיינץ.\n• סתיו 1530: פרנקפורט קיבלה את בניו הקטנים, מאיר ויצחק, תמורת 6 גולדן.\n• אוקטובר 1533: האפוטרופסים של הבנים, יצחק מאיסלשטיין ומשה מווייסנברג, העבירו אותם לבית חדש שנבנה בשבילם בפרנקפורט, בית הסולם (Zur Leiter).\n• 1534: \"ילדי משה היהודי\" עוד שילמו 27 שילינג על בית הבלוט במיינץ."], ["👨‍👩‍👧 משפחתו", "• אשתו: פריידל, בת רבי מאיר וירשלר-פירשטלין. מופיעה בכרטיס נפרד.\n• ילדיו:\n   – הר\"ר מאיר בינגן, מבית הסולם (Zur Leiter) בפרנקפורט. מופיע בכרטיס נפרד.\n   – יצחק בינגן, \"יצחק הגבוה\". מופיע בכרטיס נפרד.\n   – יוטא בינג, שנפטרה בפרנקפורט בסוכות שמ\"ב (1581). על המצבה שלה כתוב: \"יוטא בת ר' משה ז\"ל מילדי בינגוא, ואבי אמה היה מהרר\"ם וירשלר\". מופיעה בכרטיס נפרד.\n• הוריו: לא ידועים. ב-1517 הם עוד היו בחיים, אבל שמותיהם לא נכתבו."], ["📜 איפה הוא מוזכר", "• כרטיסי הרישום של בניו בפרנקפורט: \"בני משה מבינגן, לשעבר מבית הבלוט (Zur Eichel) במיינץ\", ו\"משה בינגן במיינץ, או בווילצבאך\".\n• כתב החסות מ-1517, בארכיון בווירצבורג. נדפס גם בספר של שאב (1855).\n• ספרי המס של מנזרי מיינץ, 1534: \"ילדי משה היהודי\" ובית הבלוט.\n• המאמר של אולריך האוסמן על יהודי מיינץ. הוא כותב שמשה מבית הבלוט הוא כנראה אותו \"משה מבינגן\" מ-1517.\n• מצבת בתו יוטא בפרנקפורט."], ["🔎 מה לא נמצא", "• שנת הלידה שלו.\n• שמות הוריו.\n• המצבה שלו. בספר המצבות של פרנקפורט (הורוביץ) אין מצבה שלו, ולכן כנראה נקבר במיינץ. מצבות מיינץ מהתקופה הזאת לא נשמרו."]]}, "g": [{"f": "g266", "c": "כרטיס הרישום של יצחק בינגן \"הארוך\", מבית הסולם (Zur Leiter) ומבית הכוכב (Zum Stern), נפטר 1555 או 1556"}]}, {"n": "ר' אורי", "y": "–<1596", "s": [{"k": "frankfurt", "r": "l", "t": ["כנראה פרנקפורט"], "u": 1}], "c": {"n": "ר' אורי, אביה של רייזלן הכהן", "rel": "אביה של רייזלן הכהן", "b": "", "d": "לפני 1596", "place": "כנראה פרנקפורט", "note": "אביה של רייזלן, אשת ר' קלמן הכהן. ידוע עליו רק מה שכתוב על בתו.", "flag": "שנות חייו לא ידועות; נפטר לפני 1596. נבדק ב-13.11.2026: אין לו כרטיס רישום, ושמות הוריו לא נמצאו, ולכן סומן \"נחקר · הורים לא ידועים\".", "src": "נוסח מצבת בתו: M. Horovitz (1901), עמ' 33, כתובת 348 (אבן 2008) · כרטיס הרישום של בתו \"Rözlen zur grünen Tür, 17.12.1596\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1560–1599, עמ' 297", "x": [["📜 מה ידוע עליו בוודאות", "• שמו: אורי. כך כתוב על המצבה של בתו: \"מרת רויזלן בת ר' אורי ז\"ל\", וגם בכרטיס הרישום שלה: \"אביה: אורי\".\n• הוא נפטר לפני בתו, כלומר לפני דצמבר 1596. על המצבה שלה כתוב אחרי שמו \"ז\"ל\".\n• היה לו גם בן, ששמו לא ידוע. בתו של הבן הזה הייתה אשתו של נתן מבית התאשור (Zum Buchsbaum) ב-1570."], ["🤔 למה קשה למצוא אותו במסמכים", "\"אורי\" היה השם העברי שלו, שבו קראו לו בבית הכנסת וכתבו על המצבות. במסמכים של העירייה הוא כנראה רשום בשם גרמני, למשל פייבוש, פייס או וייס, ושם הבית שבו גר. בכרטיסי הרישום יש כמה אנשים בשמות כאלה, אבל אין מסמך שמקשר אחד מהם לרייזלן. לכן לא ידוע מי מהם הוא."], ["🔎 מה לא נמצא", "• כרטיס רישום משלו.\n• שנות חייו, הבית שבו גר, שם אשתו ושמות הוריו.\n• שם בנו."]]}, "g": []}, {"n": "הפרנס שאול בינג", "y": "–~1538", "s": [{"k": "bingen", "r": "l", "t": ["בינגן (Bingen), ואחר כך פרנקפורט, הבתים Fisch ו-Kanne"], "u": 0}, {"k": "frankfurt", "r": "l", "t": ["בינגן (Bingen), ואחר כך פרנקפורט, הבתים Fisch ו-Kanne"], "u": 0}], "c": {"n": "הפרנס שאול בינג, מבינגן (Sa'ul zum Fisch)", "rel": "אביה של גוטלין הכהן · בעלה של צרלין בינגן", "b": "", "d": "בערך 1538", "place": "בינגן (Bingen), ואחר כך פרנקפורט, הבתים Fisch ו-Kanne", "note": "ב-1530 נרשם בפרנקפורט בבית הקנקן (Zur Kanne) כבן חורגו של יעקב. ב-1535 נרשם בבית הדג (Zum Fisch) במקום זליגמן, ובשנים 1536 עד 1538 שילם עליו. מ-1539 משלמת במקומו אלמנתו צרלין.", "flag": "שנת הפטירה משוערת. שנת הלידה לא ידועה. שנת הנישואין מסומנת בכרטיס הרישום בסימן שאלה. לפי כרטיס הרישום אין לבלבל בינו לבין שאול בינגן הצעיר מבית הגשרון (Zur Stege), שנפטר בערך ב-1582. נבדק ב-11.11.2026: בספר הורוביץ לא נמצאה מצבה שלו או אזכור שלו, בעמודים 10–20 (כתובות 103–231, השנים 1466–1570) ובמפתח השמות. מהשנים האלה שרדו רק כ-90 מצבות, ובכמה שנים אין אף אחת.", "src": "כרטיס הרישום מפרנקפורט, מסירת המשפחה, 9.11.2026 · כרטיס הרישום \"Ša'ūl zum Fisch, um 1538\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599, עמ' 114", "x": [["כרטיס הרישום מפרנקפורט (אלה תולדות)", "📇 Ša'ūl zum Fisch (מעל השם הוקלד \"Kanne\")\n📅 נפטר: בסביבות 1538\n🪦 המצבה: בכרטיס אין מספר הורוביץ.\n📜 רשומות:\n• 1530: שאול, בנו החורג של יעקב, וצירלין בבית הקנקן (Zur Kanne)\n• 1530–1533: שאול וצירלין רשומים כבעלי זכות ישיבה\n• 1533: שוב בבית הקנקן, עם ילדיהם הקטינים\n• 1535 (תוספת): שאול נרשם כתושב בבית הדג (Zum Fisch), במקומו של זליגמן\n• 1536–1538: שילם בבית הדג. מ-1539 שילמה אלמנתו צירלין\n• 1540: גומפרכט מבית הדוב (Zum Bären) הוא בנם של שאול מבינגן ושל צירלין\n🏠 בית: נרשם בבית הדג (Zum Fisch), וגר בבית הקנקן (Zur Kanne)\n👨 אביו: כנראה מבינגן.\n👩 אמו: לא נרשמה.\n💍 אשתו: כנראה בסביבות 1510, צרלין.\n📝 הערות העורך:\n• אין לבלבל בינו לבין שאול בינגן הצעיר מבית הגשרון (Zur Stege), שנפטר בסביבות 1582.\n• הוא היה ככל הנראה ילד שרייזלין הביאה לנישואיה, כאשתו השנייה של יעקב מהיילברון מבית הקנקן (נפטר בסביבות 1545), כי לפי רשימת 1530 יעקב היה אביו החורג.\n• כנראה נקרא שאול גם \"היילברון\" על שם אביו החורג, כי כך נקרא גם בנו אמשל."], ["👩‍🦱 אשתו", "צרלין. נישאו כנראה בערך ב-1510. מ-1539 שילמה כאלמנה את שכר הבית. מופיעה בכרטיס נפרד"], ["👨‍👩‍👧 ילדיו", "לפי כרטיס הרישום:\nאמשל היילברון, מבית הדג (Zum Fisch), ואחר כך מבית הכוכב (Zum Stern). נפטר בערך ב-1584\nאברהם, מבית הדג (Zum Fisch), ואחר כך מבית היונה (Zur Taube)\nגוטשלק, מבית הדוב (Zum Bären), ואחר כך מבית היונה (Zur Taube). נפטר בערך ב-1565\nגוטלין, אשת מאיר כ\"ץ מבית השער (Zur Pforte). מופיעה בכרטיס נפרד"]]}, "g": [{"f": "g193", "c": "כרטיס הרישום של שאול בינג, Sa'ul zum Fisch · פרנקפורט"}]}, {"n": "צרלין בינגן", "y": "~1492–", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית הקנקן (Zur Kanne) ובית הדג (Zum Fisch)"], "u": 0}], "c": {"n": "צֶרלין בִּינגֶן (Tserlin, Zirlin)", "rel": "אשתו של הפרנס שאול בינג · אמה של גוטלין הכהן", "b": "בערך 1490–1495 (בהשערה ברורה)", "d": "", "place": "פרנקפורט, בית הקנקן (Zur Kanne) ובית הדג (Zum Fisch)", "note": "אשתו של הפרנס שאול בינג, ואמם של גוטלין, אמשל, אברהם וגוטשלק. התחתנה בסביבות 1510, ומ-1539 הייתה אלמנה. גרה בפרנקפורט, בבית הקנקן (Zur Kanne) ואחר כך בבית הדג (Zum Fisch).", "flag": "שנת הלידה (1490–1495) היא הערכה, לפי נישואיה בסביבות 1510 ולפי ילדיה הקטינים ב-1554. שנת הפטירה לא ידועה. נבדק ב-13.11.2026: אין לה כרטיס רישום משלה ושמות הוריה לא נמצאו, ולכן סומנה \"נחקר · הורים לא ידועים\".", "src": "כרטיס הרישום של בעלה \"Saul zum Fisch, um 1538\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599, עמ' 114 · כרטיס הרישום של בתה \"Gutlin zur Pforte\": קובץ 1560–1599, עמ' 156 · כרטיס הרישום של בנה \"Awraham zum Fisch, dann z. Taube, um 1569\": קובץ 1560–1599, עמ' 55 · מסירת המשפחה, 9.11.2026", "x": [["📜 מה ידוע עליה", "• היא אשתו של הפרנס שאול בינג מבינגן.\n• שמה כתוב במסמכים צרלין (Tserlin), צירלין (Zirlin) או טרלין (Terlin).\n• אין לה כרטיס רישום משלה. מה שידוע עליה בא מכרטיסי הרישום של בעלה ושל ילדיה, גוטלין ואברהם."], ["📅 חייה בקצרה", "• נולדה כנראה בסביבות 1490–1495 (בהשערה ברורה).\n• בסביבות 1510: התחתנה עם שאול בינג.\n• 1530: גרה עם שאול וילדיהם בבית הקנקן (Zur Kanne), אצל אמו של שאול, רוזלין, ובעלה יעקב.\n• 1530–1533: היא ושאול רשומים עם זכות מגורים בפרנקפורט. אחר כך עברו לבית הדג (Zum Fisch).\n• בסביבות 1538: שאול נפטר.\n• מ-1539: רשומה כאלמנה, ומשלמת על בית הדג.\n• 1554: בנה אברהם רשום כ\"בנה של צירלין\", וכאחד האפוטרופסים של אחיו ואחיותיו הקטינים.\n• שנת פטירתה לא ידועה."], ["👨‍👩‍👧 ילדיה", "לפי כרטיסי הרישום של בעלה ושל ילדיה:\n• גוטלין, אשת ר' מאיר הכהן (בן קלמן כ\"ץ) מבית השער (Zur Pforte). נישאה בסביבות 1529, ונפטרה בסביבות 1580. מופיעה בכרטיס נפרד.\n• אמשל היילברון, מבית הדג (Zum Fisch), ואחר כך מבית הכוכב (Zum Stern). נפטר בסביבות 1584.\n• רבי אברהם, מבית הדג (Zum Fisch), ואחר כך מבית היונה (Zur Taube). אשתו יחנט. נפטר בסביבות 1569.\n• גוטשלק (גומפרכט), מבית הדוב (Zum Bären), ואחר כך מבית היונה (Zur Taube). נפטר בסביבות 1565.\n• ב-1554 היו לה עוד ילדים קטינים, ששמותיהם לא נרשמו. לכן היא ילדה ילדים לאורך שנים רבות, מסביבות 1510 עד סביבות 1538."], ["🔎 מה לא נמצא", "• שמות הוריה.\n• שנת הלידה המדויקת ושנת הפטירה.\n• המצבה שלה. בספר הורוביץ לא נמצאה מצבה שלה (נבדק ב-11.11.2026).\n• הערה: בכרטיסי הרישום יש גם \"צרלין מבית הכתר (Zur Krone)\", אבל זו אישה אחרת: אשתו של זלמן מאפשטיין, בתו של יוסלין אפשטיין."]]}, "g": [{"f": "g282", "c": "כרטיס הרישום של גוטלין מבית השער (Zur Pforte), בת שאול מבינגן, נפטרה בסביבות 1580"}, {"f": "g193", "c": "כרטיס הרישום של שאול בינג, Sa'ul zum Fisch · פרנקפורט"}]}, {"n": "שינליין", "y": "–~1534", "s": [{"k": "frankfurt", "r": "l", "t": [], "u": 0}], "c": {"n": "שינליין (Sejnlajn, Schönlein), אשת הרב קלמן נתן הכהן", "rel": "אשתו של הרב קלמן נתן הכהן · אמו של ר' קלמן הכהן", "b": "", "d": "בערך 1534", "place": "פרנקפורט", "note": "אשתו של הרב קלמן נתן הכהן, נישאו בערך ב-1504. אחרי מותו נרשמה כאלמנה, ובמסמכים מ-1517 עד 1534 היא משלמת את המס על הבית. נפטרה בערך ב-1534. ב-1530 קיבלה, היא וילדיה הקטינים, זכות ישיבה בעיר.", "flag": "שנת הלידה לא ידועה. שם אביה חסר בכרטיס הרישום של בעלה; ההורים בעץ, ר' איציק ומיידה, הם השערה לפי אותו כרטיס.", "src": "כרטיס הרישום של בעלה \"Kalman z. Kessel, dann z. Pforte, um 1516\": כרטיסי הרישום \"אלה תולדות\" (Ele Toldot) של שלמה אטלינגר, Leo Baeck Institute AR 5241, דרך digipres.cjh.org, קובץ 1500–1599, עמ' 59 · מסירת המשפחה, 9.11.2026", "x": [["🔎 מי היה אביה?", "בכרטיס הרישום של בעלה שם אביה חסר. אבל באותו כרטיס כתוב שב-1508 ערב קלמן לדמי היציאה של משה, \"חתנו של היצינג\", ו\"נשותיהם של שניהם היו אחיות\". היצינג הוא הפרנס ר' איציק מבאפפינגן, חתנו של ר' מאיר מעסלינגן. לכן, בהשערה ברורה, שינליין הייתה בתם של ר' איציק ומיידה, ובעץ הם מופיעים כהוריה (מ-11.11.2026). גם המעבר של קלמן ב-1516 לבית השער (Zur Pforte), שבו גר ר' איציק, מתאים לכך.\nלפי דף השושלת, בת של ר' איציק נישאה לנתן הכהן מבית הקלחת (Zum Kessel), אבי קלמן. בהשערה ברורה, דף השושלת הקדים את הקשר בדור אחד."], ["אזכורה בכרטיס הרישום של בעלה (אלה תולדות)", "לא נמצא לה כרטיס רישום משלה. היא מופיעה בכרטיס הרישום של בעלה, \"Kalman z. Kessel, dann z. Pforte, um 1516\" (הרב קלמן נתן הכהן):\nנשא בסביבות 1504 את שינליין (Sejnlajn), בת ___ (שם האב חסר בכרטיס), שנפטרה בסביבות 1534.\nב-1505 נרשמו בני הזוג קלמן כהן ושינה בבית הקלחת (Zum Kessel). אחרי מותו נרשמה ב-1530 כ\"שינליין, אלמנת קלמן כהן, עם ילדיה הקטינים\", וקיבלה עמם זכות ישיבה. בשנים 1517–1534 שילמה את המס על הבית בבית השער (Zur Pforte). ב-1517 משכנה בגד גנוב."], ["👨‍🦱 בעלה", "הרב קלמן נתן הכהן, מבית הקלחת (Zum Kessel), ואחר כך מבית השער (Zur Pforte). נפטר בסביבות 1516. מופיע בכרטיס נפרד"], ["👨‍👩‍👧 ילדיה", "לפי כרטיס הרישום של בעלה. היא אשתו היחידה הידועה:\nמאיר, מבית השער (Zur Pforte). נפטר בסביבות 1557. מופיע בכרטיס נפרד\nר' קלמן הכהן, מבית השער (Zur Pforte), ואחר כך מבית הדלת הירוקה (Zur grünen Tür). נפטר בסביבות 1583. מופיע בכרטיס נפרד\nזלמן, כנראה מבית השער (Zur Pforte). נפטר בסביבות 1594\nיעקב\nבת, אשת הרץ מבית השמש (Zur Sonne)"]]}, "g": [{"f": "g190", "c": "כרטיס הרישום של הרב קלמן נתן הכהן · פרנקפורט"}]}, {"n": "הרב קלמן נתן הכהן", "y": "–~1516", "s": [{"k": "frankfurt", "r": "l", "t": ["פרנקפורט, בית הקלחת (Zum Kessel), ואחר כך בית השער (Zur Pforte)"], "u": 0}], "c": {"n": "הרב קלמן נתן הכהן (Kalman Cayn), מבית הקלחת (Zum Kessel), ואחר כך מבית השער (Zur Pforte)", "rel": "אבי
